<style>
/* Atlas Plate: the term as a political map you colour in.
   Sea-grey ground, paper land panels, ink type, flat course tints, frontier red for exam marks.
   Rank comes from weight, case and rule, not size inflation. No gradients, no glow, no glass. */
:root{
  --sea:#dfe8ea; --land:#fbfaf6; --land-2:#eef2ef; --ink:#1d2430; --muted:#4f5b69; --line:#c3cfd3; --line-2:#dde4e6;
  --frontier:#c8102e; --good:#17703f; --bad:#b3261e; --good-soft:#e2f0e6; --bad-soft:#f8e5e3;
  --focus:#1d2430;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:14px; --r-s:10px;
  --bar-h:64px; --nav-h:64px;
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0e151a; --land:#172029; --land-2:#1e2933; --ink:#e7edf2; --muted:#a3b2bf; --line:#30404d; --line-2:#24313c;
  --frontier:#ff7083; --good:#62d394; --bad:#ff8a80; --good-soft:#163326; --bad-soft:#3a1d1d; --focus:#e7edf2; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0e151a; --land:#172029; --land-2:#1e2933; --ink:#e7edf2; --muted:#a3b2bf; --line:#30404d; --line-2:#24313c;
  --frontier:#ff7083; --good:#62d394; --bad:#ff8a80; --good-soft:#163326; --bad-soft:#3a1d1d; --focus:#e7edf2; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 12px);scroll-padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 88px)}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
::selection{background:color-mix(in srgb,var(--c,var(--ink)) 28%,transparent)}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
/* cartographic label: spaced caps, carried by weight and case */
.cap{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.code{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- app bar: solid land, hairline only once content scrolls under it ---- */
.appbar{position:sticky;top:0;z-index:30;background:var(--sea);padding-top:env(safe-area-inset-top,0px);transition:box-shadow .2s}
.appbar.edge{box-shadow:0 1px 0 var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:8px;min-height:var(--bar-h)}
.iconbtn{display:inline-flex;align-items:center;gap:4px;min-width:44px;min-height:44px;padding:0 10px 0 6px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:700;font-size:16px}
.iconbtn:active{background:var(--line-2)}
.appbar .ttl{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.appbar.edge .ttl{opacity:1;transform:none}

/* ---- panels: land on sea, one elevation (hairline) ---- */
.panel{background:var(--land);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:10px 0 2px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .12s var(--ease),background-color .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--c-ink,var(--ink));color:var(--on-c,var(--land))}
.btn.ghost{background:var(--land);border:1px solid var(--line);color:var(--ink)}
.btn.quiet{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 6px}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn .ico{width:18px;height:18px}

/* ---- step marks (Oku / Kartlar / Test) ---- */
.marks{display:inline-flex;gap:3px;flex:0 0 auto}
.marks i{width:14px;height:6px;border-radius:2px;border:1.5px solid var(--c-ink,var(--ink));opacity:.55}
.marks i.on{background:var(--c-ink,var(--ink));opacity:1}

/* ---- course swatch: flat country colour with its short code ---- */
.sw{width:40px;height:40px;border-radius:9px;background:var(--c-sw,var(--c));color:var(--on-swatch,#fff);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.02em;flex:0 0 auto}

/* ---- rows ---- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px;border-top:1px solid var(--line-2);text-decoration:none;color:inherit}
.rows > .row:first-child{border-top:0}
a.row:active,button.row:active{background:var(--land-2)}
button.row{width:100%;text-align:left}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .tx b{font-weight:700;line-height:1.3}
.row .tx span{color:var(--muted);font-size:15px;line-height:1.35}
.row .go{color:var(--muted)}

/* ---- the map scale bar: countdown to the exam, one tick per week ---- */
.scale{margin-top:4px}
.scale .track{position:relative;height:12px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.scale .track{background:var(--land)}
.scale .track::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:var(--ink)}
.scale .track span{position:relative;border-left:1.5px solid var(--ink)}
.scale .track span.past{border-left-color:var(--land)}
.scale .track span:first-child{border-left:0}
.scale{position:relative}
.scale .now{position:absolute;top:-5px;height:22px;width:3px;margin-left:-1.5px;background:var(--frontier);border-radius:1px}
.scale .ticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.scale .ticks span:last-child{text-align:right;color:var(--frontier)}
.flapnum{display:inline-block}
.flapnum.flip{animation:flap .5s var(--ease)}
@keyframes flap{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}

/* ---- the term plate: countries with provinces that fill in ---- */
.plate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.country{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);background:var(--land);border:1px solid var(--line);text-decoration:none;color:inherit;min-height:44px;transition:transform .12s var(--ease)}
.country:active{transform:scale(.98)}
.country .nm{font-weight:700;font-size:15px;line-height:1.25}
.provinces{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px}
.prov{position:relative;aspect-ratio:1.25;border:1.5px solid var(--c-ink);border-radius:4px;overflow:hidden;background:var(--land)}
.prov::before{content:"";position:absolute;inset:0;background:var(--c);transform-origin:left;transform:scaleX(var(--f,0));transition:transform .4s var(--ease)}
.prov[data-s="1"]{--f:.34}.prov[data-s="2"]{--f:.67}.prov[data-s="3"]{--f:1}
.prov[data-s="1"]::before,.prov[data-s="2"]::before{opacity:.55}
.prov b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--c-ink)}
.prov[data-s="3"] b{color:var(--on-swatch,#fff)}
.prov.fresh::before{animation:fillin .4s var(--ease) both}
@keyframes fillin{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:11px;border:1.5px solid var(--ink);border-radius:3px;background:linear-gradient(90deg,var(--ink) var(--f),transparent var(--f))}

/* ---- bottom tab bar (course pages) ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--land);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;min-width:44px}
.tabbar a .ico{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--c-ink)}
.tabbar a[aria-current="page"] .ico{stroke-width:2.4}
.tabbar a:active{background:var(--land-2)}

/* sticky action bar above the tab bar (Next question, session steps) */
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:35;padding:10px 0;background:color-mix(in srgb,var(--sea) 94%,transparent);border-top:1px solid var(--line)}
.actionbar .wrap{display:flex;gap:10px}
.actionbar .btn{flex:1}
.actionbar .btn.ghost:first-child:not(:last-child){flex:0 0 52px;padding:0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .prov::before{transition:opacity .2s}
  .btn:active,.country:active{transform:none}
}
@media (prefers-reduced-transparency:reduce){.actionbar{background:var(--sea)}}

}
/* ---------- course page ---------- */
:root{--ex:#a3207f;--mark:#fbe7a1;--mark-ink:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ex:#ff9be8;--mark:#5a4a10;--mark-ink:#fff6cc}}
:root[data-theme="dark"]{--ex:#ff9be8;--mark:#5a4a10;--mark-ink:#fff6cc}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px)}
body.has-action{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 110px)}
main{padding-block:4px 8px}
main:focus{outline:none}
ex{color:var(--ex)}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* country header: flat course tint, large title, the one next action */
.country-head{background:var(--c-tint);border:1px solid var(--c-line);border-radius:var(--r);padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px}
.country-head h1{font-size:clamp(30px,8.4vw,42px);letter-spacing:-.03em}
.country-head .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:15px}
.country-head .meta b{color:var(--ink)}
.prow .st .code{color:var(--c-ink)}
.face.front .code{margin-top:6px}
.country-head .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.country-head .cta .btn{flex:1 1 auto}
.view-h{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.view-h h1{font-size:clamp(28px,7.6vw,36px);letter-spacing:-.03em}
.view-h p{color:var(--muted)}
.view-h:focus,h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,.q[tabindex="-1"]:focus{outline:none}

/* provinces list on course home / units */
.prow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-2);text-decoration:none;color:inherit;min-height:64px}
.rows > .prow:first-child{border-top:0}
.prow:active{background:var(--land-2)}
.prow .prov{width:46px;flex:0 0 auto}
.prow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .tx b{font-weight:700;line-height:1.3}
.prow .tx .sub{color:var(--muted);font-size:15px;line-height:1.35}
.prow .st{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:13px;color:var(--muted);font-weight:700}

/* reading */
.legendx{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legendx span{display:inline-flex;align-items:center;gap:6px}
.legendx i{width:9px;height:9px;border-radius:2px;display:inline-block}
.bigidea{background:var(--c-tint);border:1px solid var(--c-line);border-radius:var(--r);padding:18px}
.bigidea p{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.4;margin-top:6px;letter-spacing:-.01em}
.note{border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;background:var(--land);border:1px solid var(--line)}
.note .ic{flex:0 0 auto;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--land)}
.note h2{font-size:17px;margin-bottom:4px;letter-spacing:-.01em}
.note.why .ic{background:none;color:var(--c-ink);width:auto} .note.why h2{color:var(--c-ink)}
.note.tip .ic{background:var(--good)} .note.tip h2{color:var(--good)}
.note.trap{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))} .note.trap .ic{background:var(--bad)} .note.trap h2{color:var(--bad)}
.sec h2{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;font-size:19px}
.sec h2 .k{flex:0 0 auto;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--c-ink);font-family:var(--body)}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pts li{position:relative;padding-left:18px;min-width:0}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:1.5px;background:var(--c)}
.diagram{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.5;background:var(--land-2);border-radius:var(--r-s);padding:14px;overflow-x:auto;margin:0 0 12px;color:var(--ink)}
.enp{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--land-2);font-size:15.5px;line-height:1.55}
.arp{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--land-2);font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.8;text-align:right}
.arp::before{content:"بالعربية";display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.terms summary{cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:800;font-size:19px}
.terms summary::-webkit-details-marker{display:none}
.terms summary .ico{transition:transform .2s var(--ease);color:var(--muted)}
.terms[open] summary .ico{transform:rotate(90deg)}
.terms dl{margin:6px 0 0;display:flex;flex-direction:column}
.terms .t{padding:10px 0;border-top:1px solid var(--line-2)}
.terms dt{font-weight:700}
.terms dd{margin:2px 0 0;color:var(--muted)}
.terms dd.ar{color:var(--ink);font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic",system-ui,sans-serif;text-align:right;font-size:16px;line-height:1.7}
.chain{list-style:none;margin:14px 0 0;padding:12px 14px;border:1.5px dashed var(--c-line);border-radius:var(--r-s);display:flex;flex-direction:column;gap:6px}
.chain::before{content:"Neden → Sonuç";font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink)}
.chain li{position:relative;padding-left:22px}
.chain li::before{content:"→";position:absolute;left:0;color:var(--c-ink);font-weight:700}
.chain li:first-child::before{content:"•"}
.face .ar{font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic",system-ui,sans-serif;font-size:17px;line-height:1.7;color:var(--muted)}
.enp::before{content:"In English";display:block;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.readrow{display:flex;flex-direction:column;gap:10px}
.readbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:12px;border:1.5px dashed var(--c-ink);font-weight:700;width:100%;color:var(--c-ink)}
.readbtn[aria-pressed="true"]{border-style:solid;background:var(--c-ink);color:var(--on-c)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager a{min-height:64px;border-radius:12px;background:var(--land);border:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;text-decoration:none}
.pager a.nx{text-align:right;align-items:flex-end}
.pager small{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pager b{font-size:15px;line-height:1.3}

/* session stepper */
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stepper span{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.stepper span::before{content:"";height:5px;border-radius:2px;background:var(--line)}
.stepper span.on{color:var(--ink)} .stepper span.on::before{background:var(--c-ink)}
.stepper span.done::before{background:var(--c)}

/* scope chips: a scrollable segmented control with an edge fade hint */
.scopes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent)}
.scopes::-webkit-scrollbar{display:none}
.scopes button{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--land);font-weight:700;font-size:15px;white-space:nowrap}
.scopes button[aria-pressed="true"]{background:var(--ink);color:var(--land);border-color:var(--ink)}
.scopes button:last-child{margin-right:16px}

.meter{display:flex;flex-direction:column;gap:6px}
.meter .bar{height:6px;border-radius:2px;background:var(--line-2);overflow:hidden}
.meter .bar i{display:block;height:100%;width:100%;background:var(--c-ink);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .35s var(--ease)}
.meter p{font-size:14px;color:var(--muted)}

/* flash cards */
.stage{position:relative;touch-action:pan-y}
.fc{position:relative;display:grid;width:100%;min-height:clamp(300px,48vh,440px);text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;will-change:transform}
.face{grid-area:1/1;border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--land);border:1px solid var(--line);transition:opacity .22s var(--ease),filter .22s var(--ease),transform .22s var(--ease)}
.face .term{font-family:var(--display);font-weight:800;font-size:clamp(26px,6.6vw,38px);line-height:1.15;text-wrap:balance;letter-spacing:-.02em}
.face .tr{font-size:20px;line-height:1.45;font-weight:700;text-wrap:pretty}
.face .en{font-size:15.5px;color:var(--muted)}
.face .echo{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.face .hint{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.face.rear{background:var(--c-tint);border-color:var(--c-line)}
.fc .rear{opacity:0;filter:blur(4px);transform:scale(.98)}
.fc.flipped .front{opacity:0;filter:blur(4px);transform:scale(.98)}
.fc.flipped .rear{opacity:1;filter:none;transform:none}
.fc .stamp{position:absolute;top:16px;padding:4px 10px;border-radius:6px;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:0;border:2px solid currentColor;pointer-events:none}
.fc .stamp.l{left:16px;color:var(--bad)} .fc .stamp.r{right:16px;color:var(--good)}
.fc.in-l{animation:inl .26s var(--ease)} .fc.in-r{animation:inr .26s var(--ease)}
@keyframes inl{from{opacity:0;transform:translateX(-18px)}} @keyframes inr{from{opacity:0;transform:translateX(18px)}}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.again{background:var(--bad-soft);color:var(--bad)}
.btn.know{background:var(--good-soft);color:var(--good)}
.kbd{display:none;font-size:13px;color:var(--muted);text-align:center}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}

/* test */
.q{font-size:19px;font-weight:700;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--land);min-height:56px;width:100%;transition:border-color .15s,background-color .15s}
.opt:active{background:var(--land-2)}
.opt .L{flex:0 0 auto;width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .L{background:var(--good);border-color:var(--good);color:var(--land)}

<script>
const COURSE={"code": "TAR119U", "name": "Siyasi Tarih I", "unitWord": "Ünite", "lede": "Ünite 1–4: Orta Çağ Avrupası’ndan Westphalia’ya, büyük güçlerin rekabet çağı, Fransız Devrimi ve Napoleon.", "about": "Siyasi Tarih bir hikâyedir ve hikâye bir tarih listesinden daha kolay akılda kalır. Ünite 1–4’ün tek ana ipliği şudur: Avrupa, feodal beyler ve Kilise’den oluşan yamalı bir yapıdan, birbirinin gücünü dengeleyen egemen devletlere nasıl geçti? Her üniteyi bir sebep zinciri olarak öğren: bu oldu, o yüzden şu oldu. Sonra tarihleri zincire iliştirmek için Tarihler sekmesini kullan. Kitaptaki her tarihe ihtiyacın yok; zaman çizelgesindekiler bilmeye değer olanlardır. Sınav en çok tarih, antlaşma, kişi ve sebep–sonuç sorar; “hangisi değildir” sorularına hazır ol.", "aboutAr": "التاريخ السياسي قصة، والقصة تُحفظ أسهل من قائمة تواريخ. الخيط الواحد في الوحدات 1–4: كيف انتقلت أوروبا من خليط من الإقطاعيين والكنيسة إلى دول ذات سيادة يوازن بعضها بعضًا (güç dengesi)؟ تعلّم كل وحدة كسلسلة سبب ونتيجة: حدث هذا فحدث ذاك، ثم استخدم تبويب «التواريخ» (Tarihler) لتعلّق السنوات على السلسلة. أسئلة الامتحان تحبّ التواريخ والمعاهدات والأشخاص والأسباب والنتائج وصيغة «أيّها ليس…».", "listShort": "Tarihler", "listName": "Zaman çizelgesi", "listCols": ["Yıl", "Olay"], "listIntro": "Önemli tarihler, sırasıyla. Yukarıdan aşağı bir hikâye gibi oku. Her biri için sor: bu, sonra neye yol açtı?", "list": [["395", "Roma İmparatorluğu ikiye ayrılır → Orta Çağ başlar (kitap)", "Ü1"], ["476", "Batı Roma yıkılır", "Ü1"], ["687", "Heristalli Pepin tüm Frankları birleştirir", "Ü1"], ["732", "Puvatya (Tours): Charles Martel Müslüman ordusunu durdurur", "Ü1"], ["768–814", "Charlemagne; 800’de Papa tarafından imparator taç giyer; adem-i merkeziyetçi yönetim → feodalizm", "Ü1"], ["962", "Kutsal Roma İmparatorluğu", "Ü1"], ["987", "Hugh Capet “Frankların Kralı” → Fransa’da ulusal monarşi", "Ü1"], ["1054", "Kiliseler ayrılır: Katolik / Ortodoks", "Ü1"], ["1066", "Normandiya Dükü William İngiltere’yi alır", "Ü1"], ["1071", "Malazgirt", "Ü1"], ["1095–1291", "Haçlı Seferleri (1099 Kudüs alınır, 1187 Selahaddin geri alır)", "Ü1"], ["1204", "IV. Haçlı Seferi: İstanbul yağmalanır", "Ü1"], ["1215", "Magna Carta: İngiltere’de kralın yetkileri sınırlanır", "Ü1"], ["1337–1453", "Yüz Yıl Savaşları (İngiltere–Fransa)", "Ü1"], ["~1450", "Gutenberg matbaası", "Ü1"], ["1453", "İstanbul’un fethi", "Ü1"], ["1485", "Tudorlar: VII. Henry; Güller Savaşı biter", "Ü1"], ["1488", "Bartolomeu Diaz Ümit Burnu’nu dolaşır", "Ü1"], ["1492", "Granada düşer; Kolomb Amerika’ya ulaşır", "Ü1"], ["1494", "Tordesillas: dünya İspanya–Portekiz arasında bölünür", "Ü1"], ["1498", "Vasco da Gama Hindistan’a ulaşır", "Ü1"], ["1504", "Vespucci: Mundus Novus", "Ü1"], ["1517", "Luther’in 95 Tezi → Reform", "Ü1"], ["1519–1522", "Magellan ekibi dünyayı dolaşır", "Ü1"], ["1529", "Zaragoza: İspanya–Portekiz paylaşımı tamamlanır", "Ü1"], ["1534", "VIII. Henry Anglikan Kilisesi’ni kurar", "Ü1"], ["1540", "Kalvin, Cenevre’de Kalvinist Kilise", "Ü1"], ["1525–1526", "Pavia: I. François esir; Madrid Antlaşması", "Ü2"], ["1535", "Fransa’ya ticari kapitülasyonlar (Osmanlı–Fransa yakınlaşması)", "Ü2"], ["1542", "V. Charles’ın Yeni Yasaları (encomienda kalkar)", "Ü2"], ["1555", "Augsburg Barışı: Luteryenler tanınır; V. Charles tahttan çekilir", "Ü2"], ["1569", "Lublin: Polonya–Litvanya birleşir", "Ü2"], ["1571", "İnebahtı", "Ü2"], ["1572", "St. Bartholeme katliamı (Fransa)", "Ü2"], ["1579", "Utrecht Birliği (Hollanda)", "Ü2"], ["1588", "İspanyol Armadası İngiltere’ye yenilir", "Ü2"], ["1598", "Nantes Fermanı: Fransız Protestanlarına haklar", "Ü2"], ["1613", "Romanovlar Rusya’da", "Ü2"], ["1618–1648", "Otuz Yıl Savaşları", "Ü2"], ["1648", "Westphalia (Münster + Osnabrück): egemen eşitlik; Hollanda ve İsviçre bağımsız; Kalvinistler tanınır", "Ü2"], ["1659", "Pireneler Barışı (Fransa–İspanya)", "Ü2"], ["1628", "Hak Dilekçesi (Petition of Right)", "Ü3"], ["1649", "I. Charles idam edilir; Cumhuriyet (Commonwealth)", "Ü3"], ["1661", "XIV. Louis yönetimi tek başına alır", "Ü3"], ["1683", "II. Viyana Kuşatması başarısız", "Ü3"], ["1685", "Fontainebleau: Protestan hakları kaldırılır", "Ü3"], ["1688–1689", "Şanlı Devrim; Haklar Yasası (Bill of Rights)", "Ü3"], ["1699", "Karlofça: Osmanlı’nın ilk büyük toprak kaybı", "Ü3"], ["1700", "İstanbul Antlaşması: Azak Rusya’ya", "Ü3"], ["1701–1713", "İspanya Veraset Savaşları → 1713 Utrecht", "Ü3"], ["1711", "Prut: Azak geri alınır", "Ü3"], ["1718", "Pasarofça → Lale Devri", "Ü3"], ["1720", "Nystad: Büyük Kuzey Savaşı biter (kitap)", "Ü3"], ["1740–1748", "Avusturya Veraset Savaşları (Prusya yükselir)", "Ü3"], ["1748", "Aix-la-Chapelle: Avusturya Veraset Savaşları biter", "Ü3"], ["1756", "Diplomatik Devrim (ittifaklar ters döner)", "Ü3"], ["1756–1763", "Yedi Yıl Savaşları → Paris Ant.: Fransa Kuzey Amerika’yı kaybeder", "Ü3"], ["1772–1795", "Polonya’nın üç kez paylaşılması", "Ü3"], ["1773", "Boston Çay Partisi", "Ü3"], ["1774", "Küçük Kaynarca: Kırım Rusya’ya bırakılır (kitap; 1783 ilhak) → Gerileme Dönemi", "Ü3"], ["1776", "4 Temmuz: ABD bağımsızlık bildirgesi", "Ü3"], ["1778", "Fransa ABD’yi tanıyan ilk devlet olur", "Ü3"], ["1783", "Paris: İngiltere ABD’yi tanır; Rusya Kırım’ı ilhak eder", "Ü3"], ["1789", "14 Temmuz: Fransız Devrimi", "Ü4"], ["1791", "İlk anayasa: anayasal monarşi", "Ü4"], ["1792", "Avusturya’ya savaş; Cumhuriyet ilanı", "Ü4"], ["1793–1794", "Terör dönemi (Robespierre, Kamu Güvenliği Komitesi)", "Ü4"], ["1795–1799", "Direktuvar", "Ü4"], ["1797", "Campo Formio: Birinci Koalisyon biter", "Ü4"], ["1798", "Mısır Seferi; Piramitler; Abukir", "Ü4"], ["1799", "18 Brumaire darbesi: Napoleon konsül", "Ü4"], ["1801–1802", "Concordat; Amiens Barışı", "Ü4"], ["1804", "Napoleon imparator", "Ü4"], ["1805", "Trafalgar (deniz yenilgisi) ve Austerlitz (kara zaferi)", "Ü4"], ["1806", "Kutsal Roma İmparatorluğu sona erer; Kıta Ablukası", "Ü4"], ["1807", "Tilsit (Napoleon–Çar I. Alexander)", "Ü4"], ["1812", "Rusya seferi felaketle biter", "Ü4"], ["1813", "Leipzig (Milletler Savaşı)", "Ü4"], ["1814", "Chaumont ittifakı; Napoleon Elba’ya sürgün", "Ü4"], ["1814–1815", "Viyana Kongresi; Haziran 1815 Waterloo", "Ü4"], ["1815 (Eylül)", "Kutsal İttifak (Avusturya, Prusya, Rusya)", "Ü4"]], "units": [{"title": "Modern Avrupa’nın Doğuşu", "sub": "Orta Çağ Avrupası, feodalizm, Haçlı Seferleri ve modern Avrupa’yı yaratan dört güç", "big": "Orta Çağ Avrupası’nı <mark>feodal beyler<\/mark> ve <mark>Kilise<\/mark> yönetiyordu. Bu düzeni dört güç yıktı: <b>ulusal monarşiler, coğrafi keşifler, Rönesans ve Reform<\/b>.", "bigAr": "كانت أوروبا في العصور الوسطى مقسّمة بين الإقطاعيين (feodal beyler) والكنيسة (Kilise). ثم جاءت أربع قوى هدمت هذا النظام: الممالك القومية (ulusal monarşiler)، والكشوف الجغرافية (coğrafi keşifler)، والنهضة (Rönesans)، والإصلاح الديني (Reform). كل واحدة منها سحبت جزءًا من السلطة من يد السيد الإقطاعي أو البابا.", "why": "Parayı ve gücü takip et. Charlemagne gücü yerel kontlara dağıttı → feodalizm (güç beyler arasında bölündü). Yüz Yıl Savaşları para istedi → krallar vergileri artırdı → meclisler büyüdü; yeni silahlar şövalyeleri işe yaramaz hâle getirdi → krallar ulusal ordular kurdu. 1453’ten sonra Doğu ticaret yollarını Osmanlı kontrol ediyordu → Avrupalılar deniz yolu aradı → keşifler → Avrupa’ya altın aktı → tüccarlar (burjuvazi) zenginleşti. Matbaa Rönesans fikirlerini yaydı; keşifler Kilise’nin bazı öğretilerinin yanlış olduğunu gösterdi → insanlar Kilise’yi sorguladı → Reform → din savaşları.", "whyAr": "تتبّع المال والسلطة: شارلمان وزّع الحكم على الكونتات (kont) فوُلد الإقطاع. حروب المئة عام احتاجت مالًا فزادت الضرائب وكبرت المجالس (parlamento). بعد فتح إسطنبول 1453 سيطر العثمانيون على طرق التجارة، فبحث الأوروبيون عن طريق بحري، فجاءت الكشوف والذهب، فاغتنى التجار (burjuvazi). والطباعة نشرت الأفكار فسُئلت الكنيسة، فجاء الإصلاح ثم الحروب الدينية.", "sections": [{"h": "Orta Çağ ve Franklar", "pts": ["<mark>Orta Çağ<\/mark>: kitaba göre Roma İmparatorluğu’nun ikiye ayrılmasından (<b>395<\/b>) II. Mehmet’in İstanbul’u fethine (<b>1453<\/b>) kadar. Bazı Batı kaynakları <b>1492<\/b>’de (Kolomb) bitirir. İlk beş yüzyıla <b>“karanlık çağlar”<\/b>, son beş yüzyıla <b>“yüksek orta çağlar”<\/b> denir.", "<b>Clovis<\/b> 500 civarında Frankları birleştirdi ve Hıristiyan oldu; böylece Papa’nın desteğini kazandı.", "<mark>Charles Martel<\/mark>, Müslüman ordusunu <b>Puvatya (Tours), 732<\/b>’de yendi.", "<mark>Charlemagne<\/mark> (768–814): <b>800<\/b> yılı Noel’inde Papa tarafından <b>“Kutsal Roma İmparatoru”<\/b> ilan edildi; “<b>Avrupa’nın Babası<\/b>” (Rex Pater Europae). Yerel <b>kontlar<\/b> aracılığıyla yönetti; bu <b>adem-i merkeziyetçi<\/b> sistem ölümünden sonra krallığı böldü ve <b>feodalizme<\/b> yol açtı.", "<b>1054<\/b>: Roma ve İstanbul kiliseleri ayrıldı → <b>Katolik ve Ortodoks<\/b>.", "<b>962<\/b>: Papa, Alman kralı <b>I. Otto<\/b>’yu Kutsal Roma İmparatoru ilan etti. Düzen: İmparator Kilise’yi korur, Kilise İmparator’a kutsal meşruiyet verir.", "<b>Karanlık çağlar<\/b> neden bu adı aldı? Frank kabileleri arasındaki kavgada ticaret durdu, kentler yok oldu, tarım alanı daraldı, okuma yazma neredeyse sıfıra indi, kanunsuzluk her yerdeydi. Güçlü bir merkezi yönetim <b>yoktu<\/b>.", "<b>Papa I. Gregory<\/b> (590): Roma mirasını Hıristiyanlık içinde yeniden biçimlendirdi, <b>Benediktenler<\/b> ile dini yaydı, Franklarla iş birliği yaptı; Britanya’da Hıristiyanlık onun zamanında yayıldı.", "<b>Heristalli Pepin<\/b> <b>687<\/b>’de tüm Frankları birleştirdi. Oğlu <b>Charles Martel<\/b> 732 zaferinden sonra Papa’dan “<mark>Hıristiyanlığın Koruyucusu<\/mark>” unvanını aldı. Onun oğlu <b>Kısa Pepin<\/b> 751’de kral oldu → <b>Karolenj Dönemi<\/b>.", "Charlemagne okulları yaydı, Karolenj alfabesini geliştirdi → “erken Rönesans”. Doğu Roma’ya son <b>vermedi<\/b>; yönetimi merkeziyetçi değil, adem-i merkeziyetçiydi."], "chain": ["Batı Roma yıkıldı, Frank kabileleri birbiriyle savaştı", "Ticaret, kent ve okuma yazma çöktü → “karanlık çağlar”", "Charlemagne gücü kontlara dağıttı (adem-i merkeziyet)", "Ölümünden sonra krallık bölündü → feodalizm doğdu"], "ar": "العصور الوسطى حسب الكتاب تمتد من 395 (انقسام روما) إلى 1453 (فتح إسطنبول). القرون الخمسة الأولى تُسمّى «العصور المظلمة» (karanlık çağlar) لأن التجارة والمدن والقراءة انهارت بسبب صراع قبائل الفرنجة. شارلمان أعاد شيئًا من النظام ولُقّب «أبا أوروبا»، لكنه حكم عبر الكونتات (kont) أي بلا مركزية (adem-i merkeziyet)، فلما مات تفكّك ملكه ونشأ الإقطاع. انتبه: الذي هزم المسلمين في بواتييه 732 هو جدّه شارل مارتل."}, {"h": "Feodalizm", "pts": ["<mark>Feodalizm<\/mark>: Orta Çağ Batı Avrupası’nın temel yönetim biçimi. Toprak ve güç, karşılıklı hak ve ödevlerle beyler ile vassallar arasında paylaşılır.", "Anahtar kelimeler: <b>malikane, şövalye, vassal, serf<\/b>. <b>Burjuvazi<\/b> (kentli, tüccar) feodal bir kavram DEĞİLDİR; feodalizm gerilerken büyüdü.", "Feodalizm güvenlik, daha çok nüfus ve daha iyi hasat getirdi; adem-i merkeziyetçiliği güçlendirdi. Serfliği <b>bitirmedi<\/b>.", "Tarihe paylaşılan güç, karşılıklı haklar ve temsil konusunda erken örnekler verdi.", "<ex>Örnek: Feodal düzeni bir apartman gibi düşün: kral bina sahibi, beyler kat malikleri, serfler ise binadan hiç çıkamayan kiracılar. Her kat kendi içinde neredeyse bağımsızdır.<\/ex>", "Hiyerarşi: güçlü kont = <b>lord (süzeren)<\/b>; ona bağlı kontlar = <b>vassal<\/b>. Lord vassalın toprağını ve mirasını güvenceye alır. Vassal savaşta asker verir, lordun çocukları evlenince vergi, lord esir düşerse fidye öder. <b>Serf<\/b> = toprağa bağlı köle.", "Nüfus neden arttı? En önemli sebep <mark>tarımsal üretimin gelişmesi<\/mark>: kuzey istilaları bitti, <b>ağır saban<\/b>, yel değirmeni, su kanalları ve <b>üçlü tarla sistemi<\/b> (bir bölüm nadasa bırakılır). Göç, ithalat ya da keşifler sebep değildir.", "Kaleler (burg) büyüdükçe kentler yeniden ortaya çıktı. Feodalizm siyaset bilimine üç kavram verdi: <b>siyasal gücün paylaşılması, karşılıklı hak ve yükümlülük, yönetimde temsil<\/b>."], "chain": ["İstilalar bitti; ağır saban ve üçlü tarla sistemi geldi", "Tarımsal üretim arttı, açlıktan ölümler azaldı", "Nüfus arttı (500’de 27,5 → 1000’de 38,5 milyon)", "Zenginleşen lordlar şövalye tuttu; klasik kölelik serfliğe dönüştü"], "ar": "الإقطاع (feodalizm) علاقة بين صاحب الأرض ومن يزرعها تحوّلت إلى علاقة سياسية: السيد (lord) يحمي التابع (vassal)، والتابع يعطيه جنودًا ومالًا، والقنّ (serf) عبد مربوط بالأرض. أهم سبب لزيادة السكان في عهد الإقطاع هو تطوّر الإنتاج الزراعي (tarımsal üretim) بفضل المحراث الثقيل ونظام الحقول الثلاثة. البرجوازية ليست من مفردات الإقطاع، والإقطاع لم يُلغِ القنانة بل رسّخها."}, {"h": "İngiltere, Fransa ve Haçlı Seferleri", "pts": ["<b>1066<\/b>: Normandiya Dükü William İngiltere’yi fetheder.", "<mark>Magna Carta<\/mark> (<b>1215<\/b>, İngiltere): Kral John bazı yetkilerinden soylular ve din adamları lehine vazgeçer. Kralın gücünün sınırlı olduğu geleneğinin başlangıcı.", "<mark>Haçlı Seferleri<\/mark> (1095–1291): Türklerin ilerleyişinden (Malazgirt 1071) sonra Papa II. Urbanus kutsal savaş çağrısı yaptı. Sonuçları (kitap): <b>Papaların Avrupa hükümdarları üzerindeki siyasi gücü arttı<\/b> (bazı krallar Papalarla çatışsa da); Doğu’nun zenginliği, kültürü ve bilimi Avrupa’ya ulaştı ve Rönesans’ı besledi; <b>şövalyelik bir meslek hâline geldi<\/b>; 4. Haçlı Seferi’nin İstanbul’u yağmalaması (1204) uzun bir Katolik–Ortodoks güvensizliği başlattı.", "<b>987<\/b>: Hugh Capet “Frankların Kralı” ilan edildi → Fransa’da tahtın babadan oğula geçtiği <b>ulusal monarşi<\/b> kök saldı.", "Magna Carta (Büyük Özgürlükler Sözleşmesi): <b>keyfi tutuklama, yargısız ceza ve kanunsuz el koyma<\/b> yasaklandı; Avrupa hukukunun <mark>ilk insan hakları metinlerinden<\/mark>. Haklardan sadece <b>özgür insanlar<\/b> (serf olmayanlar) yararlandı. Kral–yönetilen krizlerini bitirmedi.", "Yüksek Orta Çağlar: ticaret canlandı, kentler yeniden kuruldu (Alman kentlerinin <b>Hansa Birliği<\/b>, meslek birlikleri <b>loncalar<\/b>). Her yerde <b>parlamentolar<\/b> yayıldı (“konuşulan yer”): ruhban, aristokrasi ve burjuvazi ayrı kamaralarda.", "Haçlı tarihleri: <b>1095<\/b> çağrı, <b>1099<\/b> Kudüs alındı, <b>1187<\/b> Selahaddin geri aldı, <b>1204<\/b> IV. Haçlı Seferi İstanbul’u yağmaladı, <b>1291<\/b> seferler bitti."], "chain": ["Selçuklular Malazgirt’te (1071) Doğu Roma’yı yendi", "Hac yolu zorlaştı; Papa II. Urban 1095’te “kutsal savaş” çağrısı yaptı", "Seferler kalıcı başarı getirmedi; 1204’te İstanbul yağmalandı", "Sonuç: Papaların gücü arttı, şövalyelik meslek oldu, Doğu kültürü Rönesans’ı besledi"], "ar": "الماغنا كارتا (Magna Carta) سنة 1215 في إنجلترا: أجبر النبلاء ورجال الدين الملك جون على التنازل عن بعض صلاحياته، فمُنع الاعتقال التعسفي والعقاب بلا محاكمة. هي بداية فكرة «سلطة الملك محدودة». أما الحروب الصليبية (Haçlı Seferleri) فبدأت بدعوة البابا أوربان الثاني 1095 بعد ملاذكرد، ومن نتائجها زيادة نفوذ البابوات، وصيرورة الفروسية مهنة، وانتقال علوم الشرق إلى أوروبا. الحملة الرابعة (1204) نهبت إسطنبول فزرعت عداوة طويلة بين الكاثوليك والأرثوذكس."}, {"h": "Yeni Çağ’ın başında Avrupa", "pts": ["<mark>Yüz Yıl Savaşları<\/mark> (1337–1453, İngiltere–Fransa): feodal savaşın sonu; ağır zırhlı şövalyeler önemini yitirdi; Fransa feodal yapıdan <b>ulusal monarşiye<\/b> geçti.", "Savaş masrafları → yeni vergiler → meclisler büyüdü: İngiltere’de <b>Parlamento<\/b>, Fransa’da aristokrasi, ruhban ve burjuvaziden oluşan <b>Etats Généraux<\/b>.", "Ardından İngiltere’de <b>Güller Savaşı<\/b> yaşandı; 1485’te <b>Tudorlar<\/b> iktidara geldi.", "<mark>Reconquista<\/mark> (“yeniden fetih”): İspanya’nın İber Yarımadası’nı geri alması. 1469’da Isabella ve Ferdinand’ın evliliği Kastilya ile Aragon’u birleştirdi; <b>1492<\/b>’de Granada düştü; Yahudiler sürüldü; Engizisyon kuruldu.", "Yüz Yıl Savaşları’nın kökü: <b>1066 Hastings<\/b>; Fransa kralının vassalı William İngiltere kralı oldu. Savaşın ünlü ismi <b>Jeanne d’Arc<\/b>. Sonunda İngiltere <b>Calais<\/b> dışındaki kıta topraklarını kaybetti.", "Güller Savaşı: Plantagenet’in iki kolu <b>York ve Lancaster<\/b> arasında; 1485’te Tudor ailesinden <b>VII. Henry<\/b> ile bitti.", "<mark>Kayzer-i Rum<\/mark> (Roma Sezarı): 1453’ten sonra <b>II. Mehmet (Fatih)<\/b> bu unvanı aldı ve Osmanlı’yı imparatorluğa dönüştürdü.", "İspanya’nın birliği “İspanyolluk” değil <b>Katoliklik<\/b> temelindeydi. <b>Engizisyon<\/b> 1478’de Kastilya’da kuruldu. <b>31 Mart 1492 Kovma Fermanı (Elhamra Kararnamesi)<\/b>: Yahudiler ya Katolik olacak ya ülkeyi terk edecek; bir bölümünü II. Bayezid’in gemileri Osmanlı’ya getirdi."], "chain": ["Yüz Yıl Savaşları uzun sürdü, krallar paraya muhtaç oldu", "Sık sık yeni vergi toplamak zorunda kaldılar", "Vergi için meclislere başvurdular → Parlamento ve Etats Généraux güçlendi", "Ağır zırhlı şövalye önemini yitirdi → feodal monarşiden ulusal monarşiye"], "ar": "حروب المئة عام (1337–1453) بين إنجلترا وفرنسا أنهت أسلوب الحرب الإقطاعي: فقد الفارس المدرّع قيمته، وبدأت فرنسا تتحوّل من ملكية إقطاعية إلى ملكية قومية (ulusal monarşi). ولأن الملوك احتاجوا ضرائب كثيرة كبرت المجالس: البرلمان في إنجلترا ومجلس الطبقات العامة (Etats Généraux) في فرنسا. وفي إسبانيا اكتمل الاسترداد (Reconquista) بسقوط غرناطة 1492، ثم طُرد اليهود بمرسوم الحمراء."}, {"h": "Coğrafi keşifler", "pts": ["Osmanlı’nın İstanbul’u almasından (1453) sonra, Avrupa Asya’ya yeni yollar ararken hızlandı.", "<b>1488<\/b> Bartolomeu Diaz Ümit Burnu’nu dolaşır. <b>1492<\/b> Kolomb <b>İspanya adına<\/b> Amerika’ya ulaşır. Bunun yeni bir kıta olduğunu ilk kez <b>Amerigo Vespucci<\/b> 1504’te “<b>Mundus Novus<\/b>” (Yeni Dünya) kitabında yazdı. <b>1498<\/b> Vasco da Gama deniz yoluyla Hindistan’a ulaşan ilk Avrupalı. <b>1519–1522<\/b> Magellan’ın ekibi dünyayı dolaşır. Cortez Aztekleri, Pizarro İnkaları yıkar.", "<b>1494 Tordesillas<\/b>: İspanya ve Portekiz yeni toprakları paylaşır.", "Sonuçlar: deniz aşırı <b>sömürge imparatorlukları<\/b>, ticaretin artması, <b>burjuvazinin<\/b> güçlenmesi, bir “<b>Ticaret Devrimi<\/b>” ve Avrupa’da yüksek <b>enflasyon<\/b> (1550–1600 arasında fiyatlar iki katına çıktı). Rönesans ve Reform’u da beslediler.", "<ex>Örnek: Bir ülkeye aniden çok fazla altın girerse, her şeyin fiyatı artar; çünkü aynı mallar için daha çok para vardır. Keşiflerden sonra Avrupa’daki enflasyon böyle oldu.<\/ex>", "Doğrudan sonucu <b>olmayan<\/b>: Sanayi Devrimi (çok daha sonra). <b>Machiavelli<\/b> bir kaşif değil, siyaset düşünürüdür.", "Temel fark: Yunanlı, Fenikeli, Çinli ve Müslüman kâşifler de keşif yaptı; ama XV. yüzyıldan itibaren Batı Avrupa keşifleri ilk kez <mark>deniz aşırı sömürge imparatorlukları<\/mark> kurdu → “<b>Birinci Küreselleşme<\/b>”.", "İlk keşifler <b>Portekiz<\/b>’den: <b>Denizci Henry<\/b>. Diaz’ın Ümit Burnu’nu dolaşması, Osmanlı topraklarından geçmeden Asya’ya gidilebileceğini gösterdi.", "<b>1529 Zaragoza<\/b>: İspanya ve Portekiz sınırın öbür hattını çizdi → dünya ilk kez (kâğıt üzerinde) iki devlet arasında taksim edildi.", "Yerlilerin büyük kayıplarının en büyük sebebi: bağışık olmadıkları <b>salgın hastalıklar<\/b> (çiçek, kızamık, tifüs). İspanyol fatihlere <b>conquistadores<\/b> denir. Fransa: <b>Jacques Cartier<\/b> 1534 Kanada; İngiltere: 1607 <b>Jamestown<\/b>.", "Diğer sonuçlar: Avrupa yeni kültür, bitki ve hayvan türlerini tanıdı; Kilise dogmalarının yanlışlığı ortaya çıktı → Reform hızlandı. <b>Fiyat Devrimi<\/b>: değerli maden akışı → para değer kaybetti. Siyasi sonucu: <mark>mali bunalım → yönetim bunalımı<\/mark>; hükümdarı kısıtlayan anayasa hareketleri doğdu.", "<b>Merkantilizm<\/b>: ithalatı kısıp ihracatı artırarak değerli maden biriktirmek. Herkes uygulayınca başarısı az oldu ve devletleri çatışmaya itti.", "Osmanlı’ya etkisi: enflasyon → devalüasyon → Yeniçeri isyanları; İpek ve Baharat yollarının önemini yitirmesi Celali isyanlarının iktisadi sebepleri arasında."], "chain": ["1453’ten sonra İpek ve Baharat yolları Osmanlı denetiminde", "Avrupalılar Asya’ya deniz yolu aradı", "Amerika’dan altın ve gümüş aktı", "Fiyatlar 1550–1600’de yaklaşık iki katına çıktı (Fiyat Devrimi)", "Vergi artışı → halk tepkisi → hükümdarı sınırlayan hareketler"], "ar": "الفرق الجوهري بين كشوف القرن الخامس عشر وكشوف الإغريق والصينيين والمسلمين قبلها: الأوروبيون أسّسوا هذه المرة إمبراطوريات استعمارية وراء البحار (deniz aşırı sömürge imparatorlukları). تدفّق الذهب والفضة من أمريكا فارتفعت الأسعار (Fiyat Devrimi)، كما يحدث اليوم حين تطبع دولة نقودًا كثيرة. والنتيجة السياسية: أزمة مالية تحوّلت إلى أزمة حكم، فظهرت حركات تقييد سلطة الملوك. انتبه: الثورة الصناعية ليست نتيجة مباشرة للكشوف."}, {"h": "Rönesans ve Reform", "pts": ["<mark>Rönesans<\/mark>: insanı merkeze alan antik Yunan ve Roma düşüncesine yeniden ilgi. <b>İtalyan kent devletlerinde<\/b> doğdu. <b>Gutenberg’in matbaasıyla<\/b> (~1450) yayıldı. <mark>Hümanizme<\/mark> yol açtı.", "<mark>Reform<\/mark>: <b>Martin Luther’in 95 Tezi (1517)<\/b> ile başladı. Luther İncil’i Almancaya çevirdi ve ibadette Latincenin tek dil olmasına son verdi → <b>Luteryen Kilisesi<\/b>.", "<b>Kalvin<\/b> Cenevre’de Kalvinist Kilise’yi kurdu (1540). <b>VIII. Henry<\/b>, Papa boşanmasına izin vermeyince <b>Anglikan Kilisesi<\/b>’ni kurdu (1534).", "<mark>Protestan<\/mark> = “Katolik Kilisesi’ni protesto edenler.” Yayılmaları din savaşlarına yol açtı; bunlar aslında siyasi güç kavgasıydı.", "<ex>Örnek: Matbaadan önce bir kitap elle aylarca kopyalanırdı; matbaadan sonra aynı fikir birkaç haftada binlerce kişiye ulaştı. Bugün sosyal medyanın haberi yayması gibi düşün.<\/ex>", "<b>Machiavelli<\/b>, “<mark>Hükümdar (Prens)<\/mark>” kitabıyla Rönesans’ın siyaset bilimine en önemli katkısını yaptı. Diğer isimler: Leonardo da Vinci, Rafael, Michelangelo, Erasmus (“Deliliğe Methiye”), Thomas More (“Ütopya”), Shakespeare.", "Rönesans tamamen din karşıtı bir başkaldırı <b>değildi<\/b>; ama Kilise’yi sorguladı ve Reform’u kolaylaştırdı. Kavramı XIX. yüzyıl tarihçileri koydu. İtalyan kent devletleri arasında bir <b>güç dengesi<\/b> vardı (1454–1479 kesintisiz barış; Floransa dengeleyici).", "<b>Endülüjans<\/b>: Kilise’ye para ödeyenlerin günahlarının Papa tarafından affedildiğini gösteren belge. Luther’in <b>en temel eleştirisi<\/b> buydu. Aforoz edilen Luther’i <b>Saksonya Dükü III. Frederick<\/b> korudu.", "Kalvinizme <b>Presbiteryenlik<\/b> de denir. Anglikan Kilisesi’nin başı bugün de İngiltere hükümdarıdır."], "chain": ["Kilise endülüjans sattı", "Luther 1517’de 95 Tez’i ilan etti", "Alman prensleri Luther’i korudu; İncil Almancaya çevrildi", "Protestan kiliseler yayıldı", "Mezhep ayrılığı siyasi güç kavgasına dönüştü → din savaşları"], "ar": "النهضة (Rönesans) عودة إلى الفكر الإغريقي والروماني الذي يجعل الإنسان في المركز، وُلدت في المدن الإيطالية ونشرتها مطبعة غوتنبرغ، وأشهر مساهمة لها في علم السياسة كتاب «الأمير» لمكيافيلي. أما الإصلاح الديني (Reform) فبدأ حين انتقد لوثر سنة 1517 بيع صكوك الغفران (endülüjans). من هنا وُلد البروتستانت أي «المحتجّون على الكنيسة الكاثوليكية»، ثم تحوّل الخلاف المذهبي إلى صراع على السلطة."}], "tip": "Dört gücü <b>K-K-R-R<\/b> olarak hatırla: Krallar (ulusal monarşiler), Keşifler, Rönesans, Reform. Dördü de Orta Çağ’ın iki gücünü zayıflattı: <b>beyleri<\/b> ve <b>Kilise’yi<\/b>.", "tipAr": "احفظ القوى الأربع بالرمز K-K-R-R: Krallar (الملوك)، Keşifler (الكشوف)، Rönesans، Reform. كلها أضعفت قوّتي العصور الوسطى: الإقطاعيين والكنيسة. وفي الامتحان اسأل نفسك دائمًا: هل هذا سبب أم نتيجة؟", "trap": "Puvatya’da (732) kazanan <b>Charles Martel<\/b>’dir, Charlemagne (torunu) değil. <b>Burjuvazi<\/b> feodal bir terim değildir. Rönesans <b>İtalya<\/b>’da başladı, Almanya’da değil. Kitapta Orta Çağ <b>395<\/b>’te başlar (476 değil). Machiavelli kâşif değildir.", "trapAr": "المنتصر في بواتييه 732 هو شارل مارتل (Charles Martel) لا حفيده شارلمان. البرجوازية (burjuvazi) ليست مصطلحًا إقطاعيًا. النهضة بدأت في المدن الإيطالية لا في ألمانيا. وحسب الكتاب تبدأ العصور الوسطى سنة 395 (انقسام روما) لا 476. ومكيافيلي مفكّر سياسي لا مستكشف.", "terms": [["Orta Çağ", "395’ten 1453’e kadar süren dönem", "العصور الوسطى: من انقسام روما 395 إلى فتح إسطنبول 1453"], ["Karanlık çağlar", "Orta Çağ’ın ilk beş yüzyılı; ticaret ve kentler çöktü", "العصور المظلمة: القرون الخمسة الأولى من العصور الوسطى"], ["Yüksek Orta Çağlar", "Orta Çağ’ın son beş yüzyılı; ticaret, kent ve meclisler canlandı", "العصور الوسطى العليا: آخر خمسة قرون وعودة التجارة والمدن"], ["Feodalizm", "Toprak ve gücün lord ile vassallar arasında paylaşıldığı düzen", "الإقطاع: تقاسم الأرض والسلطة بين السادة والأتباع"], ["Adem-i merkeziyet", "Gücün merkezde değil yerel yöneticilerde olması", "اللامركزية: توزيع السلطة على الحكّام المحليين"], ["Kont", "Charlemagne’ın yerel yönetici olarak görevlendirdiği kişi", "الكونت: حاكم محلي في عهد شارلمان"], ["Lord (süzeren)", "Başka kontları kendine bağlayan güçlü feodal bey", "السيّد الإقطاعي الأعلى الذي يتبعه كونتات آخرون"], ["Vassal", "Bir lorda bağlı, ona asker ve vergi veren bey", "التابع: نبيل خاضع لسيّد ويقدّم له الجنود"], ["Serf", "Toprağa bağlı köle; toprağı bırakamaz", "القنّ: عبد مربوط بالأرض"], ["Malikâne", "Kontun denetlediği tarım bölgesi", "الضيعة الإقطاعية التي يسيطر عليها الكونت"], ["Burjuvazi", "Kentte yaşayan, ticaretle zenginleşen sınıf", "البرجوازية: طبقة التجار الأثرياء في المدن"], ["Magna Carta", "1215’te İngiliz kralının yetkisini sınırlayan belge", "الماغنا كارتا: وثيقة 1215 التي قيّدت ملك إنجلترا"], ["Parlamento", "“Konuşulan yer”; ülke işlerinin görüşüldüğü meclis", "البرلمان: «مكان الكلام» حيث تُبحث شؤون الدولة"], ["Etats Généraux (Genel Meclis)", "Fransa’da ruhban, soylu ve burjuvadan oluşan meclis", "مجلس الطبقات العامة في فرنسا"], ["Reconquista", "İber Yarımadası’nın Müslümanlardan geri alınması", "الاسترداد: استعادة الأندلس من المسلمين"], ["Kayzer-i Rum", "“Roma Sezarı”; Fatih’in 1453’ten sonra aldığı unvan", "قيصر الروم: لقب اتخذه محمد الفاتح بعد 1453"], ["Conquistadores (fatihler)", "Amerika’yı istila eden İspanyol komutanlar", "الفاتحون الإسبان الذين غزوا أمريكا"], ["Ticaret Devrimi", "Keşiflerden sonra ticaretin okyanus ötesine taşınması", "الثورة التجارية بعد الكشوف"], ["Fiyat Devrimi", "Değerli maden akışıyla fiyatların hızla artması", "ثورة الأسعار: تضخّم بسبب تدفّق الذهب والفضة"], ["Merkantilizm", "İthalatı kısıp ihracatı artırmaya dayalı ticaret politikası", "المركنتيلية: تقليل الواردات وزيادة الصادرات"], ["Rönesans", "“Yeniden doğuş”; insanı merkeze alan antik düşünceye dönüş", "النهضة: «الولادة من جديد» والعودة إلى الفكر القديم"], ["Hümanizm", "Konusu insan olan bilimlere ilgi akımı", "النزعة الإنسانية: الاهتمام بعلوم الإنسان"], ["Endülüjans", "Para karşılığı günah affı belgesi", "صكّ الغفران: غفران الذنوب مقابل المال"], ["Reform", "Kilise’yi yeniden biçimlendirme hareketi; Luther ile başladı", "الإصلاح الديني الذي بدأ بلوثر"], ["Protestan", "Katolik Kilisesi’ni protesto eden", "البروتستانتي: المحتجّ على الكنيسة الكاثوليكية"]]}, {"title": "Avrupa’da Güç Mücadelesi ve Westphalia Düzeni", "sub": "16.–17. yüzyıl güç mücadelesi, din savaşları ve Westphalia Barışı", "big": "Din yüzünden başlayan savaşlar <b>ulusal çıkar<\/b> savaşları olarak bitti. <mark>Westphalia Barışı (1648)<\/mark>, modern <mark>egemen ve eşit devletler<\/mark> sistemini yarattı.", "bigAr": "حروب بدأت باسم الدين وانتهت كحروب مصالح قومية (ulusal çıkar). وفي النهاية وضع صلح وستفاليا 1648 قاعدة جديدة لأوروبا: دول ذات سيادة ومتساوية فيما بينها (egemen eşitlik). هذا هو أساس النظام الدولي الذي نعرفه اليوم.", "why": "Şu kalıba dikkat et: ülkeler taraflarını <b>inanca göre değil çıkara göre<\/b> seçti. Katolik Fransa, Katolik Habsburglara karşı Müslüman Osmanlı ile ittifak yaptı, çünkü Habsburglar Fransa’yı çevreliyordu. Otuz Yıl Savaşları’nda Katolik Fransa Katolik Avusturya’ya karşı savaştı. Din ittifakları belirlemeyi bırakınca Avrupa’nın yeni bir kurala ihtiyacı oldu: her devlet kendi toprağında egemendir ve kimse herkesi kontrol edemez (güç dengesi). O kural Westphalia’dır.", "whyAr": "لاحظ القاعدة: الدول اختارت حلفاءها حسب المصلحة لا حسب العقيدة. فرنسا الكاثوليكية تحالفت مع العثمانيين ضد هابسبورغ الكاثوليك لأنهم كانوا يطوّقونها من الجانبين. وحين توقّف الدين عن تحديد التحالفات احتاجت أوروبا قاعدة جديدة: كل دولة سيّدة في أرضها، ولا يُسمح لدولة واحدة بالسيطرة على الجميع، أي ميزان القوى (güç dengesi).", "sections": [{"h": "Fransa ve İngiltere farklı yollara giriyor", "pts": ["<mark>Fransa<\/mark>: <b>XI. Louis<\/b>’den (1461’de kral) itibaren krallar yerel beyleri zayıflattı ve güçlü bir merkez kurdu → <b>mutlakiyetçilik<\/b>; 17. yüzyılda tamamlandı. I. François Fransızcayı resmî dil yaptı (1530).", "<mark>İngiltere<\/mark>: 1485’ten itibaren Tudorlar. <b>VIII. Henry<\/b> (1509) donanma kurdu ve vergileri artırdı; ama <b>1215<\/b>’ten beri süren “kralın gücü sınırlıdır” geleneği yüzünden direnişle karşılaştı. Papa ile çatıştı ve Anglikan Kilisesi’ni kurdu.", "Neden farklılaştılar: farklı <b>tarihsel, ekonomik ve toplumsal süreçler<\/b> yüzünden; iklim, etnik köken veya din yüzünden değil.", "<b>I. Elizabeth<\/b> (1558–1603): İngiltere birinci sınıf güç olur; İspanyol <b>Armadası<\/b> <b>1588<\/b>’de yenilir; Doğu Hindistan Şirketi kurulur (1599).", "<b>XII. Louis<\/b> (1498–1515): mutlakiyetçi uygulamaları sürdürdü, maliye ve hukuk reformu yaptı, Milano ve İtalyan kent devletlerine yöneldi.", "<b>I. François<\/b>: <b>Pavia (1525)<\/b>’da V. Charles’a esir düştü; <b>Madrid Antlaşması (1526)<\/b> ile serbest kaldı ama sözünden döndü; <b>Cognac Birliği<\/b>’ni kurdu; Latinceyi yasaklayıp Fransızcayı milli dil yaptı (1530); 1540 <b>Fontainebleau Fermanı<\/b> ile Protestanlara sert baskı. (<b>Nantes Fermanı<\/b> onun değil, IV. Henry’nindir.)", "<b>St. Bartholeme katliamı (1572)<\/b>: Paris’te 25.000, tüm Fransa’da 100.000 Protestan (<b>Huguenot<\/b>) öldürüldü.", "<b>VII. Henry<\/b>: aristokratlara yüksek vergi; ilk hükümet deneyimi sayılan <b>Kraliyet Konseyi<\/b>; <b>Huzur Yargıçları<\/b>’nı güçlendirdi; 1489 Medina del Campo ile İspanya’yı tanıdı. İngiltere’yi Avrupa güç dengesinin <b>dışında tutmadı<\/b>.", "1496 <b>Intercursus Magnus<\/b> (Büyük Anlaşma) İngiltere lehine sonuçlandı; zarar eden Hollandalılar ona “<mark>Kötülük Anlaşması<\/mark>” (Intercursus Malus) dedi. Hollandalı tüccara limanları kapatmak merkantilizmin ilk örneklerindendir.", "VIII. Henry döneminde başbakana benzer <b>Lord Şansölye<\/b> güçlendi (Kardinal <b>Wolsey<\/b>). Anglikan Kilisesi’ni kabul etmeyen Thomas More idam edildi. Kızı <b>Mary<\/b> (“Kanlı Mary”) reformu geri çevirmeye çalıştı. Çoğu tarihçi I. Elizabeth dönemini İngiltere’nin “<b>Altın Çağı<\/b>” sayar."], "chain": ["Fransa’da XI. Louis yerel dükleri etkisizleştirdi", "Merkez güçlendi → mutlakiyetçilik (XVII. yüzyılda tamamlandı)", "İngiltere’de 1215’ten beri “kralın yetkisi sınırlı” geleneği vardı", "Kralın vergi ve merkezileşme adımları direnişle karşılaştı → parlamentarizm"], "ar": "فرنسا وإنجلترا جارتان، لكن نظاميهما افترقا: في فرنسا قوّى الملوك المركز منذ لويس الحادي عشر حتى صار الحكم مطلقًا (mutlakiyetçilik)، وفي إنجلترا بقي تقليد «سلطة الملك محدودة» منذ 1215 فتطوّرت البرلمانية. السبب حسب الكتاب اختلاف المسارات التاريخية والاقتصادية والاجتماعية، لا المناخ ولا العِرق ولا الدين. احفظ أيضًا: فرانسوا الأول أُسر في بافيا 1525، وهنري السابع أنشأ المجلس الملكي (Kraliyet Konseyi)."}, {"h": "V. Charles, İspanya ve Osmanlı", "pts": ["<mark>V. Charles (Şarlken)<\/mark> döneminde Kutsal Roma İmparatorluğu, Amerika’dan Uzak Doğu’ya sömürgeleriyle dünyanın en büyük devleti ve <b>Akdeniz<\/b>’de Osmanlı’nın tek rakibi oldu.", "İtalya Savaşları’nda V. Charles Fransa’ya karşı. Fransa Osmanlı ile ittifak yaptı (<b>1535’te Fransa’ya ticari kapitülasyonlar<\/b>); V. Charles <b>Safevilerle<\/b> ittifak yaptı → Osmanlı iki cepheli savaşla karşılaştı.", "Kanuni: Belgrad 1521, Rodos 1522, Mohaç 1526, Viyana kuşatması 1529 (başarısız). Osmanlı deniz gücü Preveze’den (1538) sonra zirvedeydi; 1571’de İnebahtı yenilgisi.", "<b>1555 Augsburg<\/b>: V. Charles Luteryenleri kabul etmek zorunda kaldı. İlke: “<mark>Cuius regio, eius religio<\/mark>” (prens hangi dindense halkı da o dindendir). Kutsal Roma İmparatorluğu’nun <b>hukuken bölünmüşlüğü<\/b> kabul edildi. <b>Kalvinistler ve Anabaptistler tanınmadı<\/b>.", "1555’te V. Charles tahttan çekildi ve topraklarını böldü: <b>İspanya<\/b>, Belçika–Hollanda, Napoli, Sicilya ve Amerika oğlu <b>II. Philip<\/b>’e; tarihsel Habsburg toprakları (<b>Avusturya<\/b>) ve imparatorluk unvanı kardeşi <b>Ferdinand<\/b>’a.", "<ex>Örnek: Satrançta rakibin seni iki taraftan sıkıştırırsa en iyi hamle onun arkasındaki taşla anlaşmaktır. Fransa’nın Osmanlı’yla, Şarlken’in Safevilerle anlaşması bu mantıktır.<\/ex>", "V. Charles = <b>Charles Quint / Şarlken / V. Karl<\/b>; 1519’da imparator. Avrupa’da Orta Çağ tipi bir imparatorluk kurmaya çalışan <b>son<\/b> hükümdar.", "Katolik Fransa Protestan Alman prensleri ve Müslüman Osmanlı ile, Katolik KRİ ise İngiltere ile iş birliği yaptı → <mark>“din kardeşliği” değil “ulusal çıkar”<\/mark> geçerli olmaya başladı.", "1533 İstanbul Antlaşması: Ferdinand Kanuni’yi “baba” tanıdı, kendini sadrazamla eşit kabul etti. Osmanlı–Fransız ittifakının sonucu: Fransa’nın KRİ tarafından yutulması engellendi, Almanya’da Protestanlık daha kolay yayıldı.", "<b>Encomienda<\/b>: yerlileri korumak, İspanyolca ve Katoliklik öğretmek şartıyla komutanlara yerli verilmesi → fiilen köleleştirme. V. Charles <b>1542 Yeni Yasalar<\/b> ile bu sistemi kademeli kaldırmaya başladı; <b>1550 Valladolid<\/b> münazarasında yerlilerin köleleştirilmesi tartışıldı (Bartoleme de las Casas)."], "chain": ["V. Charles’ın toprakları Fransa’yı çevreliyordu", "Fransa Osmanlı ile, V. Charles Safevilerle ittifak aradı", "Osmanlı “iki cepheli savaş” tehlikesiyle karşılaştı", "Sonuç: ittifaklar dine göre değil, çıkara göre kuruldu"], "ar": "شارلكان (V. Charles) حكم من إسبانيا إلى أمريكا فصارت إمبراطوريته أكبر دولة في العالم والمنافس الوحيد للعثمانيين في البحر المتوسط. فرنسا الكاثوليكية تحالفت مع العثمانيين المسلمين، وشارلكان تحالف مع الصفويين ليجعل العثمانيين يقاتلون على جبهتين (iki cepheli savaş). هذا هو الدرس الكبير: المصلحة القومية (ulusal çıkar) حلّت محلّ «أخوّة الدين». وفي صلح أوغسبورغ 1555 اعتُرف باللوثريين فقط وفق مبدأ «دين الأمير دين رعيته»."}, {"h": "Din savaşları ve Hollanda’nın bağımsızlığı", "pts": ["Protestanlığın Almanya ve Hollanda’da yayılması Papa’yı, İspanya’yı ve Avusturya’yı kaygılandırdı. Protestan devletler Katolik krallara vergi ödemeyi de reddetti; yani mesele siyasiydi de.", "Fransa: 36 yıl süren din savaşları, Protestanlara haklar veren <b>Nantes Fermanı (1598)<\/b> ile bitti.", "Hollanda: “Onyedi Bölge”de Kalvinizm yayıldı; II. Philip karşı reform, merkezileşme ve ağır vergi uyguladı → 1572’den Orange ailesinden <b>I. William<\/b> önderliğinde isyan. <mark>Utrecht Birliği (1579)<\/mark>: yedi bölge birleşti; <b>1581<\/b> bağımsızlık ilanı; Elizabeth’in himayesi; <b>1588<\/b> cumhuriyet. İspanya Hollanda Cumhuriyeti’ni <b>1609 ateşkesiyle<\/b> tanıdı; <b>Seksen Yıl Savaşları<\/b> 1648 Münster Barışı ile resmen bitti.", "Hollanda’nın <b>Altın Çağı<\/b> (XVII. yüzyıl): Doğu ve Batı Hindistan şirketleri, New York’tan Cape Town’a ticaret kolonileri, bankalar, <b>1602 Rotterdam<\/b>’da Avrupa’nın ilk menkul kıymetler borsası. (Kıbrıs’ta koloni: yok.) Düşüşün sebepleri: iç karışıklık, Fransa–İngiltere savaşları, merkantilizm."], "chain": ["Kalvinizm Hollanda’da yayıldı", "II. Philip Katolikliği ve merkezi yönetimi dayattı, vergiyi artırdı", "Yedi bölge Utrecht Birliği’ni kurdu (1579), 1581’de bağımsızlık ilan etti", "Uzun savaş → 1648 Westphalia’da kesin bağımsızlık"], "ar": "انتشار البروتستانتية لم يكن مسألة إيمان فقط: الدول التي صارت بروتستانتية أرادت أيضًا التحرّر من سيطرة الكنيسة ومن دفع الضرائب للملوك الكاثوليك. في هولندا اتحدت سبع مقاطعات كالفينية في اتحاد أوترخت (Utrecht Birliği) سنة 1579 ضد إسبانيا، ثم عاشت «عصرها الذهبي»: شركات الهند الشرقية والغربية والبنوك وأول بورصة في أوروبا. وفي فرنسا انتهت الحروب الدينية بمرسوم نانت (Nantes Fermanı) سنة 1598."}, {"h": "Otuz Yıl Savaşları (1618–1648)", "pts": ["Çoğunlukla <b>Almanya<\/b>’da, Katolik ve Protestan devletler arasında geçti; büyük güçler farklı zamanlarda katıldı.", "<b>Kardinal Richelieu<\/b> yönetimindeki Katolik Fransa 1635’te İspanya’ya, 1636’da Katolik Habsburglara savaş açtı: ittifaklar dine göre değil, <mark>ulusal çıkar<\/mark> ve <b>güç dengesine<\/b> göre kuruldu.", "Avrupa’nın ekonomisini ve nüfusunu harap etti; Alman devletleri nüfuslarının yaklaşık <b>%40<\/b>’ını kaybetti. Güney Amerika sömürgelerinde <b>geçmedi<\/b>.", "Başlangıç: <b>Bohemya isyanı<\/b> (Prag sarayında iki Katolik danışmanın pencereden atılması). Karşı bloklar: <b>Protestan Birliği<\/b> (1608) – <b>Katolik Ligi<\/b> (1609). İlk evre “Palatinat Savaşı”; 1620 Beyaz Dağlar’da Bohemya ezildi.", "Katılanlar: İspanya, İsveç, Danimarka, İngiltere, Osmanlı (kısa süre, II. Osman), Polonya, Rusya, Hollanda → “<b>Büyük Avrupa Savaşı<\/b>”. Danimarka 1629’da çekildi; İsveç Kralı <b>II. Gustav<\/b> 1632’de Lützen’de öldü."], "chain": ["Augsburg (1555) Kalvinistleri tanımadı", "Kalvinizm Almanya’da üçüncü büyük din oldu, gerilim arttı", "1618 Bohemya isyanı → savaş bütün Avrupa’ya yayıldı", "Katolik Fransa Habsburglara karşı girdi → çıkar ve güç dengesi öne çıktı"], "ar": "بدأت حرب الثلاثين عامًا (1618–1648) في ألمانيا كحرب بين الكاثوليك والبروتستانت، لأن صلح أوغسبورغ لم يعترف بالكالفينيين. لكنها تحوّلت إلى صراع على الهيمنة بين آل هابسبورغ وفرنسا، ودخلتها السويد والدنمارك وإسبانيا وغيرها. أوضح دليل: فرنسا الكاثوليكية بقيادة الكاردينال ريشيليو حاربت هابسبورغ الكاثوليك. أي أن ميزان القوى (güç dengesi) غلب على الدين."}, {"h": "Westphalia Barışı (1648)", "pts": ["<b>Münster<\/b> ve <b>Osnabrück<\/b>’te imzalandı; o güne kadarki en büyük uluslararası konferanstı. Hem <b>Otuz Yıl<\/b> hem <b>Seksen Yıl<\/b> savaşlarını bitirdi.", "Sonuçlar: <b>Kalvinistler<\/b> (Luteryenlerle birlikte) tanındı, Almanya’nın bölünmüşlüğü onaylandı, <b>Hollanda ve İsviçre<\/b> bağımsız oldu.", "Büyük anlamı: her devletin kendi toprağı ve halkı üzerinde <b>egemenliği<\/b> ve devletler arasında <mark>egemen eşitlik<\/mark>. Modern uluslararası ilişkilerin kurucu belgesi.", "<ex>Örnek: Bugün BM Genel Kurulu’nda küçük bir ada devletinin de büyük bir ülkenin de birer oyu vardır. Bu “egemen eşitlik” fikrinin kökü Westphalia’ya gider.<\/ex>", "Fransa–İspanya çatışması Pireneler Barışı’na (1659) kadar sürdü.", "Üç antlaşma: <b>30 Ocak 1648 Münster Barışı<\/b> (İspanya–Hollanda, Seksen Yıl bitti); <b>24 Ekim 1648<\/b> Münster (KRİ–Fransa) ve <b>Osnabrück<\/b> (KRİ–İsveç–Alman prenslikleri). 109 diplomatik heyet.", "İngiltere, Polonya, Osmanlı ve Rusya temsil edilmedi. <mark>Papa’nın temsilcisi yoktu<\/mark> → Westphalia <b>ilk seküler antlaşma<\/b> sayılır.", "İsveç Batı Pomeranya ve Wismar’ı aldı, İmparatorluk Diet’inde oy hakkı kazandı; <b>Brandenburg Prusyası<\/b> güçlendi; Ren’de seyrüsefer serbestisi; Bavyera ve Palatinat Elektörler Konseyi’ne girdi.", "“Güç dengesi” uluslararası ilişkilerin standart kuralı oldu; <b>içişlerine karışmama<\/b> ilkesi. (Papa’nın gücünü artırmadı, Almanya’yı birleştirmedi, devletler arasında hiyerarşi kurmadı.)", "Westphalia ilkeleri bugün <b>BM Antlaşması<\/b>’nın 2. maddesinde yaşar; ama Güvenlik Konseyi’ndeki veto bu eşitliğe aykırıdır."], "chain": ["Otuz Yıl ve Seksen Yıl savaşları Avrupa’yı yıktı", "1648’de Münster ve Osnabrück’te o güne kadarki en kalabalık konferans toplandı", "Her devletin kendi ülkesi ve halkı üzerindeki egemenliği güvenceye alındı", "“Egemen devletlerin eşitliği” ilk kez benimsendi → Westphalia Düzeni"], "ar": "صلح وستفاليا 1648 هو «شهادة ميلاد» العلاقات الدولية الحديثة: كل دولة صاحبة سيادة كاملة على أرضها وشعبها، والدول متساوية في السيادة (egemen devletlerin eşitliği)، ولا يتدخل أحد في شؤون غيره. غاب ممثل البابا عنه فصار أول معاهدة علمانية (seküler). من نتائجه الاعتراف بالكالفينيين، واستقلال هولندا وسويسرا، وبقاء ألمانيا مجزأة. تمامًا كما في الأمم المتحدة اليوم: لكل دولة صوت واحد مهما كان حجمها."}, {"h": "Asya: Çin, Japonya, Hindistan, İran", "pts": ["Medeniyet Asya’da başladı ama <b>Çin ve Japonya<\/b> içe kapandı ve kalıcı birlik kuramadı; <b>Hindistan<\/b> ile birlikte 16. yüzyıldan itibaren Avrupa’nın ticaret limanlarına ve sömürgeciliğine direnemediler.", "<b>Çin<\/b>: Song döneminde bürokrasi <b>Konfüçyüs<\/b> ilkelerine göre, ilk kâğıt para. 1279 Kubilay Han → <b>Yuan<\/b>. 1368 <b>Ming<\/b>: Moğol bürokratlar tasfiye edildi, <b>kölelik kaldırıldı<\/b>, toprak ve vergi reformu, tarım patlaması; porselen, çay, ipek üretimi arttı. Zheng He’nin seferlerine rağmen koloni <b>kurulmadı<\/b>.", "Çin XV. yüzyılda dünyanın en büyük ordusuna ve donanmasına sahipti; yine de içe kapanık politikası yüzünden küresel güç olamadı ve XVI–XX. yüzyıllarda <mark>Avrupalıların sömürge alanına<\/mark> dönüştü.", "<b>Japonya<\/b>: <b>Nara<\/b> dönemi (710) = Japonya’nın “Altın Çağı”. 1185–1868 bölgesel aileler (<b>daimyo<\/b>) ve generaller (<b>şogun<\/b>) yönetti; askerleri <b>samuray<\/b>. 1603 <b>Tokugava<\/b>: <b>dışa kapalı<\/b> politika (1637 Şimabara isyanı). 1853’te ABD limanları zorla açtırdı; 1868 <b>Meiji<\/b> siyasi birliği sağladı.", "<b>Hindistan<\/b>: 1206’da <b>Delhi Sultanlığı<\/b>nı <b>Türkler<\/b> kurdu; <b>Urdu<\/b> (ordu) dili Türkçeden türedi. 1526 <b>Babür Şah<\/b>. 1599 İngiliz, 1602 Hollanda Doğu Hindistan Kumpanyası.", "<b>Moğollar<\/b> Çin, Hindistan ve İran tarihinde önemli bir yer tuttu.", "<b>İran<\/b>: Gazneliler, Selçuklular (Melikşah; Nizamülmülk’ün <b>Siyasetname<\/b>’si), İlhanlılar (Hülagü), Timur, <b>Safeviler<\/b> (Şah İsmail 1501, Şiilik resmi mezhep). Osmanlı–Safevi sınırı <b>1639 Kasr-ı Şirin<\/b>. İran 1925’e kadar Türk hanedanlarınca yönetildi; keşiflerden sonra İpek ve Baharat yolları değer kaybetti, Osmanlı ile rekabet ikisini de yıprattı."], "chain": ["Çin ve Japonya içe kapandı; siyasi birlik kalıcı olmadı", "Keşiflerden sonra limanları Avrupalıların denetimine geçti", "Ticaret imkânları başkalarının eline geçti", "Küresel güç olamadılar; sömürge alanına dönüştüler"], "ar": "الحضارة وُلدت في آسيا، لكن الصين واليابان انغلقتا على نفسيهما ولم تدم وحدتهما السياسية، فسيطر الأوروبيون على موانئهما بعد الكشوف. الصين امتلكت في القرن الخامس عشر أكبر جيش وأسطول في العالم، ومع ذلك صارت ساحة استعمار لأنها لم تؤسّس قواعد تجارية. وفي الهند أسّس الأتراك سلطنة دلهي (Delhi Sultanlığı) سنة 1206، ومن لغتهم وُلدت الأردية (Urdu = ordu). وإيران حكمتها سلالات تركية حتى 1925."}, {"h": "Doğu Avrupa: Polonya ve Rusya", "pts": ["<b>Polonya<\/b>: Yagelonya döneminde (1572’ye kadar) Avrupa’nın en büyük devletlerinden. <b>1569 Lublin<\/b> ile Litvanya ile birleşti; kralı soylular seçtiği için “<b>Lehistan Cumhuriyeti<\/b>” de denir. Otuz Yıl Savaşları’nın dışında kaldı.", "Polonya Kralı <b>Jan Sobieski<\/b> 1683’te Viyana’yı kurtardı ve Osmanlı’nın Avrupa’daki ilerleyişinin durdurulmasında önemli rol oynadı; ama XVII. yüzyıldan itibaren geriledi ve paylaşıldı.", "<b>Rusya<\/b>: 1283 <b>Moskova Büyük Knezliği<\/b>. <b>III. İvan<\/b> son Bizans imparatorunun yeğeniyle evlendi, “<mark>Üçüncü Roma<\/mark>” iddiasında bulundu ve <b>Çar<\/b> (Latince “Sezar”dan) unvanını kullandı. Çarlar <b>Doğu Roma (Bizans)<\/b> mirasçısı olduklarını iddia etti.", "<b>IV. İvan (Korkunç)<\/b>: büyük toprak sahibi <b>boyarları<\/b> sindirdi, merkezileşmeyi sağladı, Avrupa ile ticareti güçlendirdi, Tatarlarla uzun süre savaştı; <mark>Kazan, Astrahan ve Sibirya ile Orta Asya’ya ilk yayılma<\/mark>. (Federal yönetim kurmadı.) Osmanlı–Rus anlaşmazlıkları bu dönemde başladı.", "<b>1613<\/b>: Mikail Romanov çar → Romanovlar 1917’ye kadar yönetti; Rusya Avrupa güç dengesinin parçası oldu."], "chain": ["III. İvan Bizans hanedanından biriyle evlendi", "“Üçüncü Roma” iddiası ve “Çar” unvanı", "IV. İvan boyarları sindirip merkezileşti", "Kazan, Astrahan, Sibirya alındı → Rusya büyük güç yolunda"], "ar": "روسيا ادّعت وراثة بيزنطة (Doğu Roma) لا الإمبراطورية الرومانية المقدسة: إيفان الثالث تزوّج ابنة أخ آخر إمبراطور بيزنطي وأعلن «روما الثالثة» واتخذ لقب «القيصر» (Çar، من Sezar). ثم جاء إيفان الرابع «الرهيب» فسحق كبار الملاك (boyar) وركّز السلطة، وبدأ أول توسّع نحو آسيا الوسطى بأخذ قازان وأستراخان وسيبيريا. أما بولندا فتوحّدت مع ليتوانيا باتحاد لوبلين 1569، ثم ضعفت وتقاسمها جيرانها."}], "tip": "Üç kelimede Westphalia: <b>Egemenlik, Eşitlik, Denge<\/b>. Augsburg 1555 = sadece Luteryenler. Westphalia 1648 = Kalvinistler de.", "tipAr": "وستفاليا في ثلاث كلمات: السيادة، المساواة، التوازن. وفرّق بين الصلحين: أوغسبورغ 1555 = اللوثريون فقط؛ وستفاليا 1648 = الكالفينيون أيضًا، أي كل الكنائس البروتستانتية.", "trap": "Augsburg <b>Luteryenleri<\/b> tanıdı, Kalvinistleri değil. V. Charles topraklarını <b>İspanya ve Avusturya<\/b> olarak böldü, ikisi de Habsburg. Rusya <b>Bizans<\/b> mirasını iddia eder, Kutsal Roma’yı değil. <b>Nantes Fermanı<\/b> IV. Henry’nindir (1598), I. François’nın değil. Westphalia Fransa–İspanya savaşını bitirmedi (1659 Pireneler).", "trapAr": "أوغسبورغ اعترف باللوثريين لا بالكالفينيين. شارلكان قسّم أملاكه إلى إسبانيا (لابنه فيليب الثاني) والنمسا (لأخيه فرديناند)، وكلاهما من هابسبورغ. روسيا ادّعت إرث بيزنطة لا الإمبراطورية الرومانية المقدسة. ومرسوم نانت لهنري الرابع لا لفرانسوا الأول.", "terms": [["Mutlakiyetçilik", "Kralın bütün gücü tek başına elinde tuttuğu yönetim", "الحكم المطلق: انفراد الملك بكل السلطة"], ["Parlamentarizm", "Kralın yetkisinin meclisle paylaşıldığı, sınırlandığı yönetim", "البرلمانية: تقييد الملك بالبرلمان"], ["Huguenot", "Fransız Protestanı", "الهوغونوت: البروتستانت الفرنسيون"], ["Nantes Fermanı", "1598’de Fransız Protestanlarına hak veren belge", "مرسوم نانت 1598 لحقوق البروتستانت"], ["Fontainebleau Fermanı", "1540’ta Protestanları kâfir sayan ferman (I. François)", "مرسوم فونتينبلو 1540 ضد البروتستانت"], ["Kraliyet Konseyi", "VII. Henry’nin kurduğu, bakanlar kurulu benzeri organ", "المجلس الملكي: أول تجربة حكومة في إنجلترا"], ["Huzur Yargıçları", "İngiltere’de yerel yöneticileri denetleyen yargıçlar", "قضاة الصلح في إنجلترا"], ["Lord Şansölye", "VIII. Henry döneminde başbakana benzer makam", "اللورد المستشار: منصب يشبه رئيس الوزراء"], ["Intercursus Malus", "Hollandalıların 1496 anlaşmasına verdiği “Kötülük Anlaşması” adı", "«اتفاقية الشر»: اسم هولندي لمعاهدة 1496"], ["İki cepheli savaş", "Bir devletin aynı anda iki yönden saldırıya uğraması", "الحرب على جبهتين"], ["Ulusal çıkar", "Devletin dinden bağımsız kendi yararı", "المصلحة القومية للدولة لا دينها"], ["Kapitülasyon", "Yabancı devlete verilen ticari ayrıcalık", "الامتيازات الأجنبية التجارية"], ["Cuius regio, eius religio", "Prens hangi dindense halkı da o dindendir", "«دين الأمير دين رعيته» (مبدأ أوغسبورغ)"], ["Luteryanizm", "Luther’in görüşleri etrafında kurulan Protestan kilise", "اللوثرية: كنيسة لوثر البروتستانتية"], ["Kalvinizm", "Calvin’in Cenevre’de kurduğu katı Protestan kilise; Presbiteryenlik", "الكالفينية: كنيسة كالفن الصارمة"], ["Encomienda", "Yerlilerin İspanyol komutanlara verildiği, köleleşmeye yol açan sistem", "نظام الإنكوميندا لاستغلال السكان الأصليين"], ["Utrecht Birliği", "1579’da yedi Hollanda bölgesinin İspanya’ya karşı birliği", "اتحاد أوترخت 1579 ضد إسبانيا"], ["Westphalia Düzeni", "Eşit ve egemen devletler, içişlerine karışmama düzeni", "نظام وستفاليا: دول متساوية ذات سيادة"], ["Egemen devletlerin eşitliği", "Büyük-küçük her devletin hukuken eşit sayılması", "المساواة في السيادة بين الدول"], ["Güç dengesi", "Bir devlet çok güçlenince diğerlerinin ona karşı birleşmesi", "ميزان القوى: التحالف ضد من يزداد قوة"], ["Seküler antlaşma", "Din otoritesi (Papa) olmadan yapılan antlaşma", "معاهدة علمانية بلا سلطة دينية"], ["Daimyo / Şogun", "Japonya’da bölgesel aileler / askeri generaller", "الدايميو والشوغون في اليابان"], ["Üçüncü Roma", "Moskova’nın Bizans’ın mirasçısı olduğu iddiası", "روما الثالثة: ادّعاء موسكو وراثة بيزنطة"], ["Çar", "Latince “Sezar”dan gelen Rus hükümdar unvanı", "القيصر: لقب حاكم روسيا من كلمة «سيزر»"], ["Boyar", "Rusya’da büyük toprak sahibi aristokrat", "البويار: كبار ملّاك الأراضي في روسيا"]]}, {"title": "XVII. ve XVIII. Yüzyıllarda Büyük Güçlerin Küresel Rekabeti", "sub": "Meclis ve mutlakiyet, Fransa’yı dengelemek, veraset savaşları ve Amerikan bağımsızlığı", "big": "17. yüzyılda İngiltere <mark>kralını sınırlarken<\/mark> Fransa <mark>mutlak monarşi<\/mark> kurdu. Fransa fazla güçlenince diğerleri onu dengelemek için birleşti; bu rekabet dünyaya yayıldı ve <b>Amerikan bağımsızlığıyla<\/b> sonuçlandı.", "bigAr": "في القرن السابع عشر قيّدت إنجلترا ملكها بالبرلمان، بينما بنت فرنسا ملكية مطلقة (mutlak monarşi). ولما صارت فرنسا أقوى من اللازم اتحد الآخرون لموازنتها، وامتدّ التنافس إلى أمريكا والهند، وانتهى باستقلال الولايات المتحدة.", "why": "Bu ünitenin tamamını <b>güç dengesi<\/b> açıklar: bir devlet çok güçlendiğinde diğerleri ona karşı birleşir ve ittifaklar rahatça taraf değiştirir. “Ebedi dost yoktur, çıkar vardır.” 1789’a giden zinciri de açıklar: İngiltere Yedi Yıl Savaşları’nda Fransa’yı yendi → masrafı ödemek için kolonilerini vergilendirdi → koloniler isyan etti → Fransa İngiltere’ye zarar vermek için onlara yardım etti → Fransa iflas etti → Fransız Devrimi (Ünite 4).", "whyAr": "مفتاح هذه الوحدة كلها ميزان القوى (güç dengesi): إذا قويت دولة أكثر من اللازم اتحد الآخرون ضدها، والتحالفات تتبدّل بسهولة. ثم سلسلة الوصول إلى 1789: إنجلترا هزمت فرنسا في حرب السنوات السبع، ففرضت ضرائب على مستعمراتها، فثارت المستعمرات، فساعدتها فرنسا نكاية بإنجلترا، فأفلست فرنسا، فقامت الثورة الفرنسية.", "sections": [{"h": "İngiltere: kral ve Parlamento", "pts": ["<b>7 Haziran 1628 Hak Dilekçesi<\/b> (Petition of Right), I. Charles’a kabul ettirildi: Parlamento onayı olmadan <mark>yeni vergi yok<\/mark>, <b>keyfi tutuklama yok<\/b>, sivil evlerin askerlerce zorla kullanılması yok, olağanüstü hale kısıtlama. (Gümrük vergisini krala ömür boyu verme, kadın oy hakkı, askerliğin kısaltılması: yok.) Bugün de İngiltere hukukunda geçerli.", "I. Charles 1629’da Parlamento’yu kapattı (1640’a kadar Parlamentosuz dönem). İç savaş → Parlamento <b>I. Charles<\/b>’ı yargıladı ve <b>1649<\/b>’da idam etti → <b>Cumhuriyet (Commonwealth)<\/b>; Lordlar Kamarası kaldırıldı. Cromwell 1653’te darbeyle Parlamento’yu dağıttı, <b>Lord Protektör<\/b> oldu. 1660’ta II. Charles tahta dönünce 11 yıllık cumhuriyet bitti.", "<b>1688 Şanlı Devrim<\/b>: Katolik <b>II. James<\/b> tahttan indirildi; Anglikan din adamları ve soylular Hollanda’dan <b>Orange Prensi William<\/b>’i davet etti. <b>1689 Haklar Yasası (Bill of Rights)<\/b>: hükümdarın yetkisi ilahi haktan değil <mark>milletin iradesinden<\/mark> gelir.", "Sonuç: Parlamento tarafından sınırlanan bir monarşi. Yönetimde söz sahibi olmak isteyenler için bir model.", "<b>Stuartlar<\/b>: I. Elizabeth varissiz ölünce İskoçya Kralı <b>I. James<\/b> (1603) geldi. Kralın “<b>ilahi hakkı<\/b>” olduğuna inandı, Parlamento’yu defalarca kapattı, Püritenlere ve Presbiteryenlere baskı yaptı.", "İlk siyasi partiler: <b>Whig<\/b>’ler (Liberal Parti’nin atası; Katolik krala ve mutlakiyete karşı) ve <b>Tory<\/b>’ler (Muhafazakâr Parti’nin atası)."], "chain": ["Stuart kralları “ilahi hak” iddia etti, Parlamento’yu kapattı", "Savaş için para gerekti → 1628 Hak Dilekçesi", "Kral sözünü tutmadı → iç savaş, 1649 idam ve Cumhuriyet", "1688 Şanlı Devrim, 1689 Haklar Yasası → Parlamento’nun kesin üstünlüğü"], "ar": "في إنجلترا كان الصراع بين الملك والبرلمان صراعًا على المال: الملك يحتاج ضرائب للحرب، والبرلمان لا يعطيها إلا بشروط. لذلك فرض البرلمان «عريضة الحقوق» (Hak Dilekçesi) سنة 1628: لا ضريبة بلا موافقة البرلمان ولا اعتقال تعسفي. نكث تشارلز الأول بوعده فقامت حرب أهلية وأُعدم 1649 وأُعلنت الجمهورية، ثم جاءت «الثورة المجيدة» (Şanlı Devrim) 1688 بخلع جيمس الثاني الكاثوليكي، و«قانون الحقوق» (Haklar Yasası) 1689 الذي جعل مصدر سلطة الملك إرادة الأمة."}, {"h": "Fransa: mutlakiyet ve Güneş Kral", "pts": ["Kardinaller <b>Richelieu<\/b> (1624’ten itibaren, XIII. Louis döneminde) ve <b>Mazarin<\/b> merkezî gücü kurdu.", "<mark>XIV. Louis<\/mark>, “<b>Güneş Kral<\/b>”, 1661’den itibaren tek başına yönetti: sürekli ordu ve yeniden düzenlenen dışişleri; maliye bakanı Colbert modern bir hazine kurdu. Ayrıca Fransa’nın <b>ilk kapsamlı hukuk kodifikasyonunu<\/b> yaptı; Napoleon daha sonra bunun üzerine inşa etti. <b>1685<\/b>’te (Fontainebleau Fermanı) 1598’de Protestanlara verilen hakları kaldırdı ve <b>Protestanları<\/b> din değiştirmeye zorladı.", "Fransa baskın güç oldu ve ana rakibi Kutsal Roma İmparatorluğu’nu zayıflatmaya çalıştı; bunun bir yolu Osmanlı’yı onunla savaşmaya teşvik etmekti.", "Richelieu içeride Huguenotlara baskı yaptı, aristokrasinin gücünü kırdı, feodal kaleleri yıktı, casusluk ağı kurdu; dışarıda Habsburgları dengelemek için Protestanlarla ittifak yaptı.", "Mazarin: ağır vergiler → 1648 Paris Parlamentosu direnişi ve isyanlar, 1650–1653 iç savaş. 1657 Cromwell ile ittifak. <b>1659 Pireneler Barışı<\/b>: sınır Pireneler; XIV. Louis İspanya Kralı’nın kızı <b>Marie Theresa<\/b> ile evlendi; 500.000 altın drahoma hiç ödenmedi.", "XIV. Louis ayrıca: Colbert’in <b>merkantilist<\/b> politikası (ithalatı kıstı), <b>Louisiana<\/b>, Hindistan’da limanlar, <b>Fransız Akademisi<\/b>, Barok yapılar, <mark>Versailles Sarayı<\/mark> (güçlü monarşinin simgesi), barış zamanında da süren <b>sürekli ordu<\/b>. 72 yıl tahtta kaldı.", "<b>İntikal Savaşı<\/b> (1667): drahoma ödenmeyince İspanyol Hollandası’nı istedi → <b>1668 Aix-la-Chapelle<\/b>. Fransa–Hollanda savaşı (1672–1678) → <b>1678 Nijmegen<\/b>. Bu savaş Orange Prensi William’ın Fransa düşmanlığını artırdı."], "chain": ["Richelieu ve Mazarin aristokrasiyi ve Protestanları bastırdı", "Merkez güçlendi; XIV. Louis 1661’de yönetimi tek başına aldı", "Sürekli ordu, modern maliye, dışişleri reformu → Fransa başat güç", "Diğer devletler Fransa’yı dengelemek için birleşti"], "ar": "في فرنسا حدث العكس تمامًا: الكاردينالان ريشيليو ومازاران سحقا النبلاء والبروتستانت فصار الملك مطلقًا. لويس الرابع عشر «الملك الشمس» (Güneş Kral) بنى جيشًا دائمًا حتى في وقت السلم، ونظّم المالية عبر كولبير، وأعاد تنظيم وزارة الخارجية، وقام بأول تقنين شامل للقانون، وبنى قصر فرساي رمزًا للملكية المطلقة. لكنه في 1685 ألغى حقوق البروتستانت وأجبرهم (لا الكاثوليك) على تغيير دينهم."}, {"h": "Osmanlı toprak kaybediyor", "pts": ["<b>1683<\/b>: II. Viyana Kuşatması başarısız olur (Leh Kralı Jan Sobieski yardıma gelir). Fransa yalnız kalır.", "<b>26 Ocak 1699 Karlofça<\/b>: Osmanlı’nın kuruluşundan beri en büyük toprak kaybı: <b>Macaristan ve Erdel<\/b> Avusturya’ya, <b>Mora ve Dalmaçya<\/b> Venedik’e, <b>Ukrayna ve Podolya<\/b> Polonya’ya; <b>Banat ve Temeşvar Osmanlı’da kalır<\/b>.", "<b>1700 İstanbul Antlaşması<\/b>: Azak Rusya’ya; Rusya İstanbul’da elçi bulundurabilir. <b>1711 Prut<\/b>: Azak geri alındı, Rusya <b>Polonya’nın içişlerine karışmayacak<\/b>. <b>1718 Pasarofça<\/b>: Belgrat, Temeşvar, Banat Avusturya’ya; Mora Osmanlı’da → <b>Lale Devri<\/b> (1730’a kadar).", "<b>1774 Küçük Kaynarca<\/b> (Rusya ile): kitaba göre <b>Kırım Rusya’ya bırakıldı<\/b> (1783’te resmen ilhak); Rus ticaret gemilerine Karadeniz’de serbest ticaret; Rusya istediği yerde konsolosluk açabilir; Rusya’ya <b>ticari kapitülasyonlar<\/b>; İstanbul’daki Rus elçiliği <b>sürekli<\/b>; <mark>Eflak ve Boğdan’daki Ortodokslar Rusya’nın “koruması”na<\/mark> girdi. Birçok tarihçiye göre Osmanlı’nın <b>Gerileme Dönemi<\/b>’nin başlangıcı. (Polonya ile ilgisi yok.)", "Viyana kuşatmasının arka planı: XIV. Louis Osmanlı’yı Habsburglara karşı <b>cesaretlendirdi<\/b>, sonra 1684 Regensburg ateşkesiyle Osmanlı’yı yalnız bıraktı. Papa’nın çağrısıyla <b>Kutsal İttifak<\/b> (1684 Linz: KRİ, Polonya, Venedik; 1686 Rusya) Osmanlı’ya karşı kuruldu.", "Fransa’ya karşı: 1686 <b>Ausburg Birliği<\/b>; 1689’da İngiltere katılınca adı <b>Büyük İttifak<\/b> (Fransa içinde yok). 1697 <b>Ryswick<\/b>: XIV. Louis III. William’ı İngiltere kralı olarak tanıdı.", "<b>I. Petro (Büyük Petro)<\/b>: Rus-Ortodoks Kilisesi’ni dönüştürdü, vergi düzenini iyileştirdi, eğitimi yaydı, <b>boyarların<\/b> etkisini azalttı, ordu ve donanmayı Batı tekniğiyle kurdu; St. Petersburg’u kurup başkent yaptı (1713). Büyük Kuzey Savaşı kitaba göre <b>1720 Nystad<\/b> ile bitti: Estonya ve Livonya Rusya’ya. (Küçük Kaynarca onun değil, II. Katerina döneminindir.)", "<b>Polonya<\/b> 1772, 1793 ve 1795’te Rusya, Prusya ve Avusturya arasında paylaşıldı; 1918’e kadar egemenliğini yitirdi. <b>1792 Yaş<\/b>: III. Selim Kırım’ın Rusya’ya ait olduğunu kabul etti, sınır Dinyester (Avusturya ile 1791 Ziştovi)."], "chain": ["1683 Viyana bozgunu (Jan Sobieski)", "Fransa Osmanlı’yı yalnız bıraktı, Kutsal İttifak saldırdı", "1699 Karlofça: kuruluştan beri en büyük toprak kaybı", "Rusya güneye indi → 1774 Küçük Kaynarca → Gerileme Dönemi"], "ar": "العثمانيون كانوا جزءًا من لعبة التوازن الأوروبية: لويس الرابع عشر شجّعهم على حصار فيينا 1683 ليشغل آل هابسبورغ، ثم تخلّى عنهم بعد الهزيمة. فتشكّل «التحالف المقدس» (Kutsal İttifak) ضدهم، وانتهت الحرب بمعاهدة كارلوفجة (Karlofça) 1699، أكبر خسارة أرض منذ تأسيس الدولة. ثم صعدت روسيا: في معاهدة كوتشوك كاينارجة (Küçük Kaynarca) 1774 حصلت حسب الكتاب على القرم، وحرية التجارة في البحر الأسود، وحق «حماية» الأرثوذكس في الأفلاق والبغدان، ولذلك يعدّها كثير من المؤرخين بداية عصر التراجع."}, {"h": "Veraset savaşları", "pts": ["<mark>İspanya Veraset Savaşları<\/mark> (1701–1713): varissiz II. Carlos ölünce XIV. Louis torununu <b>V. Philip<\/b> adıyla İspanya kralı ilan etti → diğerleri Fransa’nın İspanya’yı ve sömürgelerini de kontrol edeceğinden korktu → koalisyon. <b>1713 Utrecht<\/b>: V. Philip kral kaldı ama İspanya ve Fransa tacı asla birleşmeyecek; Fransa İspanya toprakları üzerindeki iddiasından vazgeçti; <b>Cebelitarık ve Minorka İngiltere’ye<\/b>; Newfoundland, Acadia, St. Kitts İngiltere’ye; İngiltere’ye 30 yıllık köle taşıma tekeli (<b>asiento<\/b>). Avusturya ile savaş 1714 Rastad ve Baden ile bitti.", "<mark>Avusturya Veraset Savaşları<\/mark> (1740–1748): temel sebep <b>Avusturya ile Prusya’nın Alman devletleri üzerindeki nüfuz mücadelesiydi<\/b>. VI. Karl’ın 1713 fermanıyla tahta kızı <b>Maria Theresa<\/b> çıktı; Prusya (<b>II. Frederick<\/b>) 1740’ta Silezya’yı işgal etti. Savaş “büyük”tü: Kuzey Amerika, Hindistan, Akdeniz ve Batı Hint adalarına taştı. <b>1748 Aix-la-Chapelle (Aachen)<\/b>: savaş öncesi duruma dönüş (<b>status quo ante bellum<\/b>), Silezya Prusya’da → “<b>Alman İkiliği<\/b>” keskinleşti.", "<b>1756 Diplomatik Devrim<\/b>: Fransa eski düşmanı Avusturya ile, Prusya eski düşmanı İngiltere ile ittifak yaptı → ittifaklar tamamen tersine döndü: <mark>ebed
