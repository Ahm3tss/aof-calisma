i dostluk yok, çıkar var<\/mark>.", "<mark>Yedi Yıl Savaşları<\/mark> (1756–1763): Avrupa’da, Akdeniz’de, Hindistan’da, Kuzey Amerika’da ve Karayipler’de yapıldı. <b>1763 Paris<\/b>: Fransa Kuzey Amerika’yı kaybetti (Mississippi’nin batısı İspanya’ya, doğusu ve Kanada İngiltere’ye). Avrupa’da <b>Hubertusburg<\/b>: Silezya Prusya’da kaldı. İngiltere Hindistan’da güçlendi.", "18. yüzyıl: <b>Prusya ve Rusya<\/b> yükselir; <b>Avusturya, İspanya ve Osmanlı<\/b> zayıflar.", "<ex>Örnek: Okul bahçesinde bir çocuk herkesi ezmeye başlarsa, dün birbirine küs olan çocuklar bile ona karşı birleşir. 18. yüzyıl Avrupası’nda güç dengesi tam olarak böyle işledi.<\/ex>", "Prusya’nın yükselişi: 1701’de Elektör III. Frederick kendini <b>I. Frederick<\/b> adıyla kral ilan etti; I. Frederick Wilhelm iyi eğitimli sürekli ordu kurdu; <b>II. Frederick (Büyük Frederick)<\/b> dağınık Prusya topraklarını bütünleştirmek istedi."], "chain": ["İspanya’nın varissiz kralı öldü, tahta XIV. Louis’nin torunu geçti", "Fransa ile İspanya birleşirse bir süper güç doğacaktı", "Güç dengesi işledi: Büyük İttifak Fransa’ya karşı savaştı", "1713 Utrecht: Fransa İspanya iddiasından vazgeçti; İngiltere kazançlı çıktı"], "ar": "حروب الوراثة كلها تطبيق لقاعدة ميزان القوى (güç dengesi): عندما ورث حفيد لويس الرابع عشر عرش إسبانيا خافت أوروبا من قوة عظمى واحدة، فتحالفت ضد فرنسا حتى صلح أوترخت 1713. وفي حرب الوراثة النمساوية كان السبب الحقيقي صراع النمسا وبروسيا على النفوذ في ألمانيا، أي «الثنائية الألمانية» (Alman İkiliği)، وانتهت بصلح إكس لا شابيل 1748. ثم في 1756 انقلبت التحالفات تمامًا (الثورة الدبلوماسية)، دليلًا على أنه لا صداقات دائمة بل مصالح دائمة."}, {"h": "Amerikan bağımsızlığı", "pts": ["Yedi Yıl Savaşları’ndan sonra Amerika’daki Fransız tehdidi kalmadı; kolonicilerin İngiltere’ye ihtiyacı azaldı.", "İngiltere savaş borçlarını ödemek için kolonileri vergilendirdi: <b>Damga Vergisi (1765)<\/b>. Kolonilerin sloganı: “<b>Temsil yoksa vergi de yok<\/b>”. <b>Çay Yasası (1773)<\/b> → <mark>Boston Çay Partisi<\/mark>: İngiltere’ye karşı <b>ilk organize tepki<\/b>. Thomas Paine “<b>Sağduyu<\/b>” (Common Sense) → ABD’nin <b>yalnızcılık<\/b> politikasının kökü.", "<b>4 Temmuz 1776<\/b>: 13 koloni <b>Kıtasal Kongre<\/b>’de bağımsızlık ilan eder. Bağımsızlık Savaşı 1776–1783, <b>Fransa ve İspanya<\/b>’nın yardımıyla (barutun %90’ı onlardan). “Düşmanımın düşmanı dostumdur”: Fransa 1777 Saratoga zaferinden sonra <b>Şubat 1778<\/b>’de <mark>ABD’yi resmen tanıyan ilk devlet<\/mark> oldu; 1782 Hollanda ikinci. 1780’de Rusya, Avusturya, Prusya vb. <b>tarafsızlık<\/b> ilan etti. <b>1783 Paris<\/b>: İngiltere ABD’yi tanıdı.", "19. yüzyıla verdiği fikirler: <b>anayasacılık, cumhuriyetçilik, temel haklar, vergilendirme ve temsilde adalet<\/b>. (<b>Ulusalcılık<\/b> bu listede yok.) ABD’nin bağımsızlığı Güney Amerika’daki İspanyol sömürgelerine örnek oldu.", "Amerika’ya yardım Fransa’yı ekonomik krize soktu; bu Fransız Devrimi’nin sebeplerinden biridir.", "İlk koloniler: 1607 <b>Jamestown<\/b> (Virginia), 1620 <b>Mayflower<\/b> ile Püritenler, 1643 New England Konfederasyonu, 1686 New England Dominyonu. Göçün sebepleri: dinsel baskı, kıtlık, fiyat artışı.", "Avrupa savaşları kolonilere yansıdı (Kral William, Kraliçe Anne, Kral George savaşları). 1748’de İngiltere Louisburg kalesini Fransa’ya geri verince kolonilerde “<b>Amerikalılık<\/b>” bilinci güçlendi."], "chain": ["Yedi Yıl Savaşları’nda Fransız tehdidi bitti; kolonilerin İngiltere’ye ihtiyacı azaldı", "İngiltere savaş borcu için kolonileri vergilendirdi (1765, 1773)", "“Temsil yoksa vergi yok” → Boston Çay Partisi → 1776 bağımsızlık", "Fransa ve İspanya yardım etti → Fransa iflas etti → 1789 Devrimi"], "ar": "استقلال أمريكا نتيجة مباشرة لصراع إنجلترا وفرنسا: بعد حرب السنوات السبع زال الخطر الفرنسي فلم يعد المستعمرون يحتاجون حماية إنجلترا، ثم فرضت إنجلترا عليهم ضرائب لسداد ديون الحرب. شعارهم «لا ضرائب بلا تمثيل»، وأول ردّ منظم كان «حفلة شاي بوسطن» 1773. وفرنسا عملت بمنطق «عدوّ عدوّي صديقي» فكانت أول دولة تعترف رسميًا بالولايات المتحدة في فبراير 1778، لكن هذه المساعدة أفلستها فمهّدت لثورة 1789."}], "tip": "İngiltere’nin sınırlı monarşiye adımları: <b>1215 → 1628 → 1649 → 1688–89<\/b>: Magna Carta, Dilekçe, idam, Haklar Yasası. Her adım kraldan biraz daha güç alır.", "tipAr": "خطوات تقييد الملك في إنجلترا: 1215 الماغنا كارتا ← 1628 عريضة الحقوق ← 1649 إعدام الملك والجمهورية ← 1688–1689 الثورة المجيدة وقانون الحقوق. كل خطوة تأخذ من الملك قطعة إضافية من السلطة.", "trap": "<b>Avusturya<\/b> Veraset Savaşı aslında Almanya üzerinde <b>Avusturya–Prusya<\/b> mücadelesiydi. Karlofça’da <b>Banat–Temeşvar Osmanlı’da kaldı<\/b>. Küçük Kaynarca Rusya’ya Polonya’yı <b>vermedi<\/b> ve I. Petro değil II. Katerina dönemidir. ABD’yi ilk tanıyan <b>Fransa<\/b>’dır (1778), Hollanda değil.", "trapAr": "حرب الوراثة النمساوية كانت في جوهرها صراعًا نمساويًا بروسيًا على ألمانيا. في كارلوفجة بقي البنات وتمشفار للعثمانيين. كوتشوك كاينارجة لم تعطِ روسيا بولندا، وهي من عهد كاترين الثانية لا بطرس الأكبر. وأول من اعترف بأمريكا فرنسا لا هولندا.", "terms": [["Stuart Hanedanı", "1603’ten itibaren İngiltere’yi yöneten İskoç kökenli hanedan", "سلالة ستيوارت الحاكمة في إنجلترا منذ 1603"], ["İlahi hak", "Kralın yetkisini Tanrı’dan aldığı inancı", "الحق الإلهي: سلطة الملك من الله"], ["Hak Dilekçesi (Petition of Right)", "1628’de vergi ve tutuklamada kralı sınırlayan belge", "عريضة الحقوق 1628"], ["Avam Kamarası / Lordlar Kamarası", "İngiliz Parlamentosu’nun iki meclisi", "مجلس العموم ومجلس اللوردات"], ["Püriten", "Kalvinizmi benimseyen İngiliz Protestanı", "البيوريتاني: بروتستانتي إنجليزي كالفيني"], ["Commonwealth", "1649–1660 İngiliz Cumhuriyeti", "الكومنولث: الجمهورية الإنجليزية 1649–1660"], ["Lord Protektör", "Cromwell’in diktatörce kullandığı “Koruyucu Lord” unvanı", "اللورد الحامي: لقب كرومويل"], ["Whig / Tory", "İngiltere’nin ilk partileri; Liberal ve Muhafazakâr partilerin ataları", "الويغ والتوري: أول حزبين في إنجلترا"], ["Şanlı Devrim", "1688’de Katolik II. James’in tahttan indirilmesi", "الثورة المجيدة 1688"], ["Haklar Yasası (Bill of Rights)", "1689; kralın yetkisi milletin iradesinden gelir", "قانون الحقوق 1689"], ["Güneş Kral", "XIV. Louis’ye verilen unvan (Roi Soleil)", "الملك الشمس: لويس الرابع عشر"], ["Sürekli ordu", "Barış zamanında da görev yapan ordu", "الجيش الدائم حتى في السلم"], ["Kodifikasyon", "Dağınık yasaları tek ve düzenli bir metinde toplama", "التقنين: جمع القوانين في مدوّنة واحدة"], ["İntikal Savaşı", "XIV. Louis’nin miras iddiasıyla İspanya’ya açtığı savaş (1667)", "حرب الأيلولة: حرب لويس على إسبانيا 1667"], ["Kutsal İttifak (1684)", "Papa’nın çağrısıyla Osmanlı’ya karşı kurulan ittifak", "التحالف المقدس ضد العثمانيين 1684"], ["Büyük İttifak", "Fransa’ya karşı Ausburg Birliği ve İngiltere (1689)", "التحالف الكبير ضد فرنسا"], ["Asiento", "İspanyol sömürgelerine köle taşıma tekeli", "احتكار نقل العبيد إلى المستعمرات الإسبانية"], ["Status quo ante bellum", "Savaştan önceki duruma dönüş", "العودة إلى الوضع السابق للحرب"], ["Alman İkiliği (düalizm)", "Almanya üzerinde Avusturya–Prusya rekabeti", "الثنائية الألمانية: تنافس النمسا وبروسيا"], ["Diplomatik Devrim", "1756’da ittifakların tamamen tersine dönmesi", "الثورة الدبلوماسية: انقلاب التحالفات 1756"], ["Başat güç", "Sistemde öne çıkan en güçlü devlet", "القوة المهيمنة في النظام"], ["Tarafsızlık", "Savaşta hiçbir tarafı tutmama durumu", "الحياد في الحرب"], ["Temsil yoksa vergi yok", "Amerikan kolonilerinin İngiltere’ye karşı sloganı", "«لا ضرائب بلا تمثيل»"], ["Yalnızcılık", "ABD’nin Avrupa işlerine karışmama politikası", "الانعزالية الأمريكية"], ["Kıtasal Kongre", "13 koloninin bağımsızlığı ilan ettiği toplantı", "المؤتمر القاري للمستعمرات الثلاث عشرة"]]}, {"title": "Fransız Devrimi", "sub": "Devrim neden oldu, yeni rejim, Napoleon ve Viyana Kongresi", "big": "Fransa’nın borçları ve adaletsiz ayrıcalıklar <mark>1789 Devrimi<\/mark>’ne yol açtı. İçeride kaos ve dışarıda savaş <mark>Napoleon<\/mark>’u getirdi; onun egemenliğine bir koalisyon son verdi ve yerine güç dengesine dayanan <mark>Viyana sistemi<\/mark> kuruldu.", "bigAr": "ديون فرنسا والامتيازات الظالمة أشعلت ثورة 1789. ثم جلبت الفوضى في الداخل والحرب في الخارج نابليون إلى الحكم، وحين صار أقوى من اللازم اتحدت أوروبا ضده، ثم أقامت في فيينا نظامًا جديدًا قائمًا على ميزان القوى (Viyana sistemi).", "why": "Bu bir sarkaçtır. Aşırı kraliyet gücü ve ayrıcalık → devrim. Devrim gruplara bölünür ve yabancı krallarla savaşır → terör. İnsanlar terörden bıkar → zayıf beş kişilik bir yönetim (Direktuvar). Zayıflık → güçlü bir general yönetimi alır (Napoleon). Napoleon fazla güçlenir → güç dengesi: herkes ona karşı birleşir. Ondan sonra kazananlar kimsenin bir daha baskın olamayacağı bir sistem tasarlar (Viyana).", "whyAr": "فكّر في الثورة كبندول الساعة: سلطة ملكية وامتيازات مفرطة ← ثورة. الثورة تنقسم وتحارب ملوك أوروبا ← إرهاب. الناس تتعب من الإرهاب ← حكومة مديرين ضعيفة. الضعف ← جنرال قوي يستولي على الحكم (نابليون). نابليون يتضخّم ← الجميع يتحالف ضده. وبعده يصمّم المنتصرون نظامًا يمنع أي دولة من الهيمنة (فيينا).", "sections": [{"h": "Devrimin sebepleri", "pts": ["İngiltere ile savaşlar (Avusturya Veraset, Yedi Yıl, Amerikan Bağımsızlığı) hazineyi boşalttı → yeni vergiler → enflasyon; fiyatlar ücretlerden hızlı arttı.", "<b>Aristokrasi vergi muafiyetlerini korudu<\/b>, ruhban da vergi vermemekte direndi → bütün yük burjuvaziye ve halka bindi. Vergi artışları en çok <b>burjuvaziyi<\/b> rahatsız etti; zengin burjuvazinin buna uygun siyasi hakları yoktu.", "<b>Aydınlanma<\/b> düşünürleri, “<b>Ansiklopedistler<\/b>” (Diderot, Voltaire, Montesquieu, Rousseau), keyfi otoriteye karşı anayasacılık, haklar ve özgürlük fikirlerini yaydı. (<b>Hobbes<\/b> ve antik Yunanlı <b>Ksenofon<\/b> bu grupta değil.)", "Ayrışma: bir yanda <mark>Kral, soylular (aristokrasi) ve Kilise (ruhban)<\/mark>; öbür yanda <b>burjuvazi ve geniş halk kitleleri<\/b>. Kilise halkın yanında değildi.", "Mayıs <b>1789<\/b>: XVI. Louis <b>yeni vergi alabilmek için<\/b> Meclis’i (Etats Généraux) topladı. Üç alt meclis: 1. ve 2.’ye aristokrasi ve ruhban egemen; <b>3. alt meclis<\/b>: bankacıların başını çektiği burjuvazi, köylüler, işçiler. 17 Haziran: 3. alt meclis kendini “<b>Milli Meclis<\/b>” ilan etti; kral salonu kapattı → <b>14 Temmuz 1789<\/b>: halk Bastille’i aldı.", "<ex>Örnek: Bir apartmanda en zengin daireler aidat ödemezken bütün masrafı orta kattakilere yüklerseniz, orta kattakiler bir gün yönetimi devirmek ister. 1789’daki öfke buna benziyordu.<\/ex>", "1776 Amerikan bağımsızlığının başarısı, 3. alt meclistekilere Fransa’da da <b>milli egemenliği<\/b> kurma kararlılığı verdi."], "chain": ["İngiltere ile savaşlar Fransa hazinesini iflas ettirdi", "Yeni vergi lazım; soylular ve ruhban vergi vermiyor", "Kral 1789’da Meclis’i topladı; 3. alt meclis Milli Meclis oldu", "Kral meclisi kapattı → 14 Temmuz Bastille → Devrim"], "ar": "الثورة الفرنسية بدأت من الخزينة: حروب فرنسا الطويلة مع إنجلترا (ومنها مساعدة أمريكا) أفلست الدولة، فاحتاج الملك لويس السادس عشر ضرائب جديدة فدعا مجلس الطبقات العامة (Etats Généraux) في مايو 1789. النبلاء ورجال الدين معفيّون من الضرائب، فوقع العبء كله على البرجوازية والشعب. أعلنت الطبقة الثالثة نفسها «مجلسًا وطنيًا»، فأغلقه الملك، فاقتحم الشعب سجن الباستيل في 14 يوليو 1789. وأفكار التنوير (Aydınlanma) عند فولتير ومونتسكيو وروسو أعطت الثورة لغتها."}, {"h": "Yeni rejim", "pts": ["<b>4 Ağustos 1789<\/b>: feodalizm kaldırıldı, soylu ayrıcalıkları bitti. <b>26 Ağustos 1789<\/b>: <b>İnsan ve Vatandaş Hakları Beyannamesi<\/b> (doğuştan özgürlük, eşitlik). Slogan: <b>özgürlük, eşitlik, kardeşlik<\/b>.", "<b>1791 Anayasası<\/b> (Kurucu Meclis): <mark>tek meclisli anayasal monarşi<\/mark>; krala sadece <b>askıya alma (geciktirici) veto<\/b> → Radikallerin görüşü kazandı (Jakobenler veto ve çift meclis istemişti). Kanun önünde eşitlik, basın özgürlüğü, özel mülkiyet, adil vergi ve memuriyete girebilme güvence altına alındı. Ama vatandaşlar <b>aktif / pasif<\/b> diye ayrıldı: yalnız 25 yaş üstü ve belli vergiyi ödeyenler oy verdi → <b>seçme hakkı sınırlandı<\/b>. Kadınların oy ve eğitim hakkı yoktu.", "Kilise (toprakların ~%10’u) mallarına el konuldu → ruhbanın desteği bitti, köy papazları tepki gösterdi, Papa Devrim’i kınadı. Din sorunu Napoleon’un <b>1801<\/b>’de Kilise ile barışmasına kadar sürdü.", "XVI. Louis Temmuz 1791’de kaçmaya çalıştı, yakalandı; kayınbiraderi Avusturya hükümdarı <b>II. Leopold<\/b>’den yardım istedi. Kaçan soylular ve İsveç, Rusya, Avusturya eski rejimi geri istedi. Fransa önce davrandı: <b>20 Nisan 1792<\/b>’de Avusturya’ya savaş açtı.", "Yeni yönetim ekonomide <b>liberalizmi<\/b> benimsedi → Devrim daha çok <b>burjuvazinin<\/b> (orta sınıfın) taleplerine göre biçimlendi."], "chain": ["Milli Meclis feodalizmi kaldırdı, haklar beyannamesini yayınladı", "1791 Anayasası: tek meclisli anayasal monarşi, kral yalnız askıya alabilir", "Kilise mallarına el konuldu → Papa ve köylüler tepki gösterdi", "Kaçan soylular ve Avrupa kralları eski rejimi istedi → 1792 savaş"], "ar": "دستور 1791 أنشأ ملكية دستورية بمجلس واحد، وترك للملك حق «التعليق» فقط (askıya alma) لا حق النقض الكامل. وكفل المساواة أمام القانون وحرية الصحافة والملكية الخاصة، لكنه قسّم المواطنين إلى «فاعلين» و«سلبيين»، فلم يصوّت إلا من تجاوز 25 عامًا ودفع ضريبة معيّنة، ولم تنل المرأة حق التصويت. ومصادرة أملاك الكنيسة أغضبت البابا والقساوسة، فازداد أعداء الثورة في الداخل والخارج."}, {"h": "Cumhuriyet, Terör, Direktuvar", "pts": ["<b>10 Ağustos 1792<\/b>: Paris ayaklanması. <mark>Ulusal Konvansiyon<\/mark> (Kurultay) <b>22 Eylül 1792<\/b>’de monarşiye son verip <b>Cumhuriyet<\/b> ilan etti. <b>1792–1795<\/b> = Konvansiyon dönemi. <b>XVI. Louis<\/b> vatana ihanetten Ocak 1793’te bir oy farkla idam edildi; Marie Antoinette de giyotinle idam edildi.", "Konvansiyon, Montesquieu’nün <b>güçler ayrılığı<\/b> ilkesinin aksine <b>yasama ve yürütmeyi<\/b> tek organda topladı (olağanüstü dönem meclisi). Fransa’ya karşı <b>Birinci Koalisyon<\/b> Savaşları başladı (1815’e kadar yedi koalisyon).", "<b>Jakobenler<\/b> Nisan 1793’te <mark>Kamu Güvenliği Komitesi<\/mark>’ni kurdu. En etkili üye <b>Robespierre<\/b>: <b>Terör Dönemi<\/b> (1793–Temmuz 1794), 16.594 kişi giyotinle idam edildi. Robespierre <b>28 Temmuz 1794<\/b>’te idam edildi, terör bitti.", "<b>1795 Anayasası<\/b>: siyasi haklar genişletildi; iki meclis: <b>Beşyüzler Meclisi<\/b> (asıl yasama) ve <b>Yaşlılar Meclisi<\/b> (askıya alma). Erkler yeniden ayrıldı. Yaşlılar Meclisi’nin seçtiği <b>beş Direktör<\/b> yürütmeyi yönetti → <mark>Direktuvar<\/mark> (1795–1799).", "Direktuvar kralcılara karşı Napoleon’dan yardım aldı (1797 <b>Fructidor Darbesi<\/b>). <b>17 Ekim 1797 Campo Formio<\/b> (Fransa–Avusturya): Avusturya Hollandası (Belçika) ve Korfu dâhil Adriyatik adaları Fransa’ya; Venedik paylaşıldı; Fransa Kuzey İtalya ve Ren’de denetim kurdu; <b>Birinci Koalisyon Savaşları bitti<\/b> (İngiltere ile savaş sürdü)."], "chain": ["Savaş kötü gitti, Paris ayaklandı (Ağustos 1792)", "Konvansiyon cumhuriyeti ilan etti, yasama ve yürütmeyi birleştirdi", "Kamu Güvenliği Komitesi ve Robespierre → Terör", "Halk terörden bıktı → 1795’te erkler ayrıldı, Direktuvar"], "ar": "بعد إعلان الجمهورية في سبتمبر 1792 جمع «المؤتمر الوطني» (Ulusal Konvansiyon) السلطتين التشريعية والتنفيذية في يد واحدة، أي ألغى فصل السلطات الذي نادى به مونتسكيو. ومن هنا جاء «عهد الإرهاب» (Terör) بقيادة روبسبيير ولجنة السلامة العامة (Kamu Güvenliği Komitesi)، وانتهى بإعدام روبسبيير نفسه في يوليو 1794. ثم أعاد دستور 1795 فصل السلطات بمجلسين (الخمسمئة والشيوخ) وخمسة مديرين، فسُمّي العهد «حكومة المديرين» (Direktuvar)."}, {"h": "Mısır Seferi (1798–1801)", "pts": ["Amaç: İngiltere’yi adasında vurmak donanması yüzünden imkânsızdı; Fransa ancak sömürgeler üzerinden zarar verebilirdi → <mark>İngiltere’nin sömürgelerine giden yolu kesmek<\/mark> için Mısır. Önce Malta alındı.", "<b>21 Temmuz 1798 Piramitler (Ehramlar) Muharebesi<\/b>: Fransa Osmanlı ordusunu yendi, Kahire düştü.", "<b>1 Ağustos 1798<\/b>: Amiral <b>Nelson<\/b> Abukir koyunda Fransız donanmasını yok etti → Fransız ordusunun Fransa ile bağlantısı kesildi.", "Osmanlı önce savaş ilan etmedi; sonra <b>İkinci Koalisyon<\/b>’a (1798–1802; İngiltere, Rusya, Avusturya) katıldı. Fransızlar <b>Akka<\/b>’yı alamadı; Napoleon Ağustos 1799’da Fransa’ya döndü; sonunda Fransızlar Mısır’ı boşalttı."], "chain": ["İngiltere denizde çok güçlüydü; doğrudan istila mümkün değildi", "Napoleon sömürge yolunu kesmek için Mısır’ı işgal etti (1798)", "Nelson Abukir’de Fransız donanmasını yok etti", "Osmanlı İkinci Koalisyon’a katıldı; Akka’da Fransızlar durduruldu"], "ar": "لم يستطع نابليون غزو بريطانيا لأن أسطولها يحكم البحار، فقرّر ضربها بطريق غير مباشر: احتلال مصر لقطع طريق بريطانيا إلى مستعمراتها. انتصر في معركة الأهرام 1798، لكن الأميرال نيلسون دمّر أسطوله في أبي قير فانقطع عن فرنسا. ودخل العثمانيون التحالف الثاني ضد فرنسا، وصمدت عكا (Akka) أمامه، فعاد نابليون إلى فرنسا سنة 1799."}, {"h": "Napoleon", "pts": ["<b>18 Brumaire 1799<\/b> darbesi (adı Devrim takviminden gelir): Direktuvar yıkıldı; üç kişilik <b>Konsüllük<\/b> (despotik cumhuriyet). 1800 plebisitiyle <b>Birinci Konsül<\/b>, 1802 halkoylamasıyla ömür boyu konsül, <b>1804<\/b> halkoylamasıyla yeni anayasa: <b>I. Napoleon, “Fransızların İmparatoru”<\/b>.", "Reformlar: <b>1802 Amiens Barışı<\/b> ile İkinci Koalisyon’u bitirdi; <b>1801 Concordat<\/b> ile Kilise’yle barıştı (Katoliklik “büyük çoğunluğun dini”; ona “Modern Çağın Charlemagne’ı” dendi); <b>Onur Madalyası<\/b>; <b>1804 Fransız Medeni Kanunu<\/b> (Code Napoleon); <b>Fransa Merkez Bankası<\/b>; liseler ve meslek okulları; liyakat. (İlk Fransız anayasası 1791’dir, onun değil.)", "<b>1805<\/b>: Nelson <b>Trafalgar<\/b>’da Fransız donanmasını yok etti → İngiltere istilası rafa kalktı. Karada <b>Ulm<\/b> ve <b>Austerlitz<\/b> (“<b>Üç İmparatorlar Muharebesi<\/b>”) zaferleri → Pressburg Barışı. <b>1806<\/b>: <mark>Kutsal Roma İmparatorluğu sona erdi<\/mark> (II. Franz yalnız Avusturya İmparatoru); Napoleon <b>Ren Konfederasyonu<\/b>’nu kurdu; Ekim 1806 <b>Jena<\/b>’da Prusya yenildi.", "<mark>Kıta Ablukası<\/mark> (Kıtasal Sistem, Kasım 1806): Trafalgar’dan sonra İngiltere’yi ekonomik savaşla çökertme planı; müttefiklerin ve işgal edilen yerlerin İngiltere ile ticareti yasaklandı. Deniz İngiltere’de olduğu için sadece karada uygulanabildi; ülkeler deldi, Fransa’nın kendi ticareti de zarar gördü → “bumerang”.", "<b>Temmuz 1807 Tilsit<\/b>: Napoleon ile Çar <b>I. Alexander<\/b> Avrupa’da nüfuz alanlarını paylaştı: Rusya’nın Finlandiya ve Balkanlar’daki hakları tanındı; Rusya Fransa’nın Avrupa’yı denetlemesini onayladı ve <b>ablukaya katıldı<\/b>. Prusya, Talleyrand’ın önerisiyle Rusya’ya karşı tampon olarak bırakıldı. Napoleon kardeşlerini Napoli, Hollanda ve İspanya tahtlarına oturttu.", "Neden düştü: Kıta Ablukası yüzünden burjuvazinin desteğini kaybetti, çevresi yeniden soylularla doldu; <mark>Napoleon’a karşı ilk büyük milli uyanış Almanya’da<\/mark> (Prusya merkezli, <b>romantizm<\/b> akımı); otoriterliğin simgesi oldu; Rusya Aralık 1810’da ablukadan çekildi ve <b>1812 Moskova Seferi<\/b> felakete döndü (650.000 kişilik ordudan 27.000 sağlam asker kaldı). (Feodalizmi geri getirmeye çalışmadı; tersine feodalizme karşı savaştığını söylüyordu.)", "<ex>Örnek: Bir ülkeyi cezalandırmak için ona ambargo koyarsan ama o ülkeyle ticaret yapan herkes de zarar görürse, ambargoya kimse uzun süre uymaz. Kıta Ablukası’nın çöküşü böyle oldu.<\/ex>", "Ekim 1813 <b>Leipzig<\/b> (“Milletler Savaşı”). <b>9 Mart 1814 Chaumont<\/b>: İngiltere, Rusya, Avusturya ve Prusya 20 yıllık <b>Dörtlü İttifak<\/b>’ı kurdu (Osmanlı yok) → 30 Mart 1814 Paris → Napoleon <b>Elba<\/b>’ya sürüldü. 1 Mart 1815’te kaçtı, Yedinci Koalisyon kuruldu; <b>18 Haziran 1815 Waterloo<\/b>: siyasi kariyerinin sonu → <b>St. Helena<\/b>.", "Napoleon’un <b>ulus-üstü<\/b> (kozmopolit) anlayışı: Avrupa uygarlığı tek bir olgudur, her yerde insanlar aynı değerdedir, milli kimlikler önemsizdir. Bu görüş, Alman romantizmiyle beslenen milliyetçilerin tepkisini doğurdu.", "1808 İspanya işgali (kardeşi Joseph kral); 1808 Erfurt; 1809 <b>Wagram<\/b>: Avusturya yine yenildi; Fransa kontrolünde Varşova Büyük Dükalığı → Rusya ile arası açıldı. 1810’da Metternich’in çabasıyla Avusturya prensesi Marie Louise ile evlendi."], "chain": ["Direktuvar zayıf ve yolsuzdu; Napoleon popülerdi", "1799 darbe → Konsüllük → 1804 İmparatorluk", "Avrupa’ya hâkim oldu, milli kimlikleri yok saydı", "Almanya’da milliyetçi uyanış; 1812 Rusya felaketi", "Dörtlü İttifak → Elba → Waterloo (1815)"], "ar": "جاء نابليون بانقلاب 18 برومير 1799 ثم صار إمبراطورًا سنة 1804 باستفتاء شعبي. لم يستطع غزو بريطانيا بعد هزيمة الطرف الأغر (Trafalgar)، فحاول خنقها اقتصاديًا بالحصار القاري (Kıta Ablukası)، لكن الحصار ارتدّ عليه لأن تجارة أوروبا نفسها تضرّرت. كان يرى أوروبا حضارة واحدة بلا هويات قومية، فكان ردّ الفعل يقظة قومية بدأت في ألمانيا (بروسيا)، ثم جاءت كارثة موسكو 1812، فاتحدت ضده بريطانيا وروسيا والنمسا وبروسيا حتى هُزم نهائيًا في واترلو 1815."}, {"h": "Viyana Kongresi (1814–1815)", "pts": ["Amaç: tek bir devletin kıtaya hâkim olamayacağı bir <b>güç dengesi<\/b>.", "Mimarları: Avusturya Başbakanı <b>Metternich<\/b> ve İngiltere Dışişleri Bakanı <b>Castlereagh<\/b>.", "Prusya Ren’in batısında toprak aldı (Castlereagh Prusya’yı hem Rusya’ya hem Fransa’ya karşı güçlendirdi). Ama <b>Alman İkiliği<\/b> (Prusya–Avusturya) sürdü; <mark>37 Alman devleti gevşek bir konfederasyon<\/mark> olarak kaldı, Prusya çatısı altında <b>birleştirilmedi<\/b>.", "Hollanda, Fransa’ya karşı bir set olarak <b>Belçika<\/b> ile büyütüldü. Prusya ve Rusya Polonya’nın diriltilmesine karşı iş birliği yaptı; 3 Ocak 1815’te İngiltere–Avusturya–Fransa gizli antlaşması → küçültülmüş <b>Polonya Krallığı<\/b> (“Kongre Polonyası”) kuruldu ama <b>Rus Çarı’nın himayesinde<\/b>; 1831’de Rusya kaldırdı.", "Waterloo’dan sonra <b>İkinci Paris Antlaşması<\/b>: sınır değişikliği, 700 milyon frank tazminat, işgal ordusu. Kasım 1815 Dörtlü İttifak yenilendi; barışı korumak ve liberal–milliyetçi isyanları önlemek için dönemsel kongreler → <mark>Avrupa Uyumu<\/mark> (Viyana Düzeni).", "Önce <b>Bourbonlar<\/b> geri döndü: <b>XVIII. Louis<\/b> (Talleyrand’ın önerisi); 1814 Anayasası (iki meclis, kanun önünde eşitlik, dar oy hakkı). <b>Birinci Paris Antlaşması (30 Mayıs 1814)<\/b>: Fransa 1792 sınırlarına döndü, tazminat yok.", "Kongre Eylül 1814’te toplandı; ipler dört galip devletteydi (İngiltere, Rusya, Avusturya, Prusya); Fransa’yı <b>Talleyrand<\/b> temsil etti.", "Uluslararası hukuk kararları: <b>korsanlığın ve köleliğin yasaklanması<\/b>, uluslararası nehirlerde <b>seyrüsefer<\/b> düzenlemesi. (Metternich görevden alınmadı.)", "<b>Kutsal İttifak (Eylül 1815)<\/b>: Avusturya, Prusya, Rusya; Çar I. Alexander önerdi. Görünürde Hıristiyanlığı korumak, gerçekte <b>liberal akımlara karşı set<\/b>. İngiltere içinde değildi.", "Önemi: büyük devletler arası savaşları uzun süre önledi (ana hatlarıyla 1914’e kadar işledi); İngiltere en güçlü devlet oldu; Fransa’ya “ağır cezalandırma” değil “dengeleme” uygulandı. Ama ulusları parçaladı → 1830 ve 1848’de liberal ve milliyetçi tepkiler."], "chain": ["Napoleon bütün kıtaya hâkim olmuştu", "Galipler hiçbir devletin tek başına hâkim olamayacağı bir denge istedi", "Fransa’nın çevresine set: Belçika’lı Hollanda, güçlü Prusya", "Düzenli kongreler (Avrupa Uyumu) → uzun barış ama milliyetçi-liberal tepkiler"], "ar": "مؤتمر فيينا (1814–1815) أعاد رسم أوروبا بعد نابليون على أساس ميزان القوى: لا يُسمح لدولة واحدة بالهيمنة على القارة. مهندساه مترنيخ (النمسا) وكاسلري (بريطانيا). أحاطوا فرنسا بسدّ: هولندا مع بلجيكا وبروسيا قوية على الراين، وتركوا ألمانيا اتحادًا رخوًا من 37 دولة، وأعادوا بولندا صغيرة تحت حماية القيصر. وقرّروا عقد مؤتمرات دورية لحفظ السلام فوُلد «الوفاق الأوروبي» (Avrupa Uyumu)، كما منعوا القرصنة والعبودية ونظّموا الملاحة في الأنهار الدولية."}], "tip": "Sarkaç olarak devrim zaman çizelgesi: <b>1789 isyan → 1791 anayasal kral → 1792 cumhuriyet → 1793–94 terör → 1795 Direktuvar → 1799 Napoleon → 1804 imparator → 1815 Viyana<\/b>.", "tipAr": "تسلسل البندول: 1789 الثورة ← 1791 ملك دستوري ← 1792 الجمهورية ← 1793–1794 الإرهاب ← 1795 المديرون ← 1799 نابليون قنصلًا iran 1815)", "Napoleon’un siyasi kariyerinin sonu; St. Helena’ya sürgün.", "نهاية نابليون السياسية"], [4, "Kutsal İttifak (1815)", "Avusturya, Prusya, Rusya; liberal akımlara karşı (İngiltere yok).", "تحالف الملوك ضد الليبرالية"]], "qs": [{"u": 1, "q": "732’de Puvatya (Tour) Savaşı’nda Müslüman ordularını yenen Frank hükümdarı kimdir?", "o": ["Clovis", "Charlemagne", "Charles Martel", "Kısa Pepin", "Hugh Capet"], "a": 2, "e": "Charles Martel; Charlemagne onun torunuydu.", "ar": "الجواب شارل مارتل، قائد الفرنجة الذي أوقف الجيش المسلم في بواتييه 732. الفخّ هو شارلمان، فهو حفيده وجاء بعده، وكلوفيس أقدم منه بكثير."}, {"u": 1, "q": "Aşağıdakilerden hangisi feodalizmle ilgili bir kavram değildir?", "o": ["Malikane", "Şövalye", "Vassal", "Burjuvazi", "Serf"], "a": 3, "e": "Burjuvazi, feodalizm gerilerken kentlerde büyüdü.", "ar": "البرجوازية (burjuvazi) طبقة التجار في المدن، وقد نمت حين بدأ الإقطاع يضعف، فليست من مفرداته. أما الضيعة والفارس والتابع والقنّ فكلها أركان النظام الإقطاعي."}, {"u": 1, "q": "Magna Carta Libertatum hangi ülkede imzalanmıştır?", "o": ["Fransa", "İngiltere", "Venedik", "Prusya", "İspanya"], "a": 1, "e": "İngiltere, 1215, Kral John.", "ar": "الماغنا كارتا وُقّعت في إنجلترا سنة 1215 حين أُجبر الملك جون على التنازل عن بعض صلاحياته. لا تخلط بينها وبين فرنسا التي سارت نحو الحكم المطلق."}, {"u": 1, "q": "Aşağıdakilerden hangisi Haçlı Seferlerinin sonuçlarından biridir?", "o": ["Doğu Roma’nın güçlenmesi", "Şövalyeliğin Avrupa’da yaygınlaşıp bir meslek hâline gelmesi", "Ortodoks ve Katolik dünyası arasında işbirliğinin artması", "Feodalizmin sona ermesi", "İslam dünyasının Avrupa’ya bağımlı hâle gelmesi"], "a": 1, "e": "Şövalyelik bir meslek hâline geldi. Bizans zayıfladı ve Katolik–Ortodoks güvensizliği arttı.", "ar": "حسب الكتاب صارت الفروسية مهنة أثناء الحروب الصليبية. الخيارات الأخرى معكوسة: بيزنطة ضعفت، والثقة بين الكاثوليك والأرثوذكس انهارت بعد 1204."}, {"u": 1, "q": "Aşağıdakilerden hangisi Coğrafi Keşiflerle ilgili kişilerden biri değildir?", "o": ["Magellan", "Bartolomeu Diaz", "Vasco da Gama", "Machiavelli", "Pizarro"], "a": 3, "e": "Machiavelli bir Rönesans siyaset düşünürüydü.", "ar": "مكيافيلي مفكّر سياسي من عصر النهضة وصاحب كتاب «الأمير»، لا علاقة له بالكشوف. ماجلان ودياز وفاسكو دا غاما وبيزارو كلهم مستكشفون أو فاتحون."}, {"u": 1, "q": "Aşağıdakilerden hangisi Coğrafi Keşiflerin doğrudan sonuçlarından biri değildir?", "o": ["Sömürge imparatorlukları", "Sanayi Devrimi’nin başlaması", "Ticaretin gelişmesi", "Burjuvazinin güçlenmesi", "Yüksek enflasyon"], "a": 1, "e": "Sanayi Devrimi yüzyıllar sonra geldi.", "ar": "الثورة الصناعية جاءت بعد الكشوف بقرون، فليست نتيجة مباشرة لها. أما المستعمرات والتجارة وقوة البرجوازية والتضخّم فنتائج مباشرة."}, {"u": 1, "q": "Rönesans hareketi nerede doğmuştur?", "o": ["İngiltere", "Alman devletleri", "İtalyan kent devletleri", "Endülüs", "Fransa"], "a": 2, "e": "İtalyan kent devletleri.", "ar": "النهضة وُلدت في المدن الإيطالية مثل فلورنسا والبندقية وميلانو ثم انتشرت شمالًا. الفخّ هو «الدول الألمانية» لأن الإصلاح الديني هو الذي بدأ هناك."}, {"u": 1, "q": "Reform hareketinin başlangıcı olarak kabul edilen olay hangisidir?", "o": ["Kalvin’in Cenevre’de kilise kurması", "Luther’in 95 Tezi’ni ilan etmesi", "VIII. Henry’nin Anglikan Kilisesi’ni kurması", "Augsburg Barışı", "1054 ayrılığı"], "a": 1, "e": "Luther, 1517.", "ar": "بداية الإصلاح هي إعلان لوثر أطروحاته الخمس والتسعين سنة 1517. كالفن وهنري الثامن جاءا بعده، وصلح أوغسبورغ نتيجة متأخرة للحركة."}, {"u": 1, "q": "Yüz Yıl Savaşları hangi iki devlet arasında olmuştur?", "o": ["İspanya–Portekiz", "İngiltere–Fransa", "Fransa–Kutsal Roma", "İngiltere–İspanya", "Venedik–Ceneviz"], "a": 1, "e": "İngiltere ve Fransa, 1337–1453.", "ar": "حروب المئة عام دارت بين إنجلترا وفرنسا (1337–1453). لا تخلطها بحرب الثلاثين عامًا التي دارت في ألمانيا."}, {"u": 1, "q": "1054’te ne olmuştur?", "o": ["Kutsal Roma İmparatorluğu kuruldu", "Hıristiyan dünyası Katolik ve Ortodoks olarak ayrıldı", "İngiltere Normanlarca işgal edildi", "Haçlılar Kudüs’ü aldı", "Magna Carta imzalandı"], "a": 1, "e": "Büyük ayrılık (Katolik–Ortodoks).", "ar": "في 1054 انقسمت الكنيسة إلى كاثوليكية (روما) وأرثوذكسية (إسطنبول). الإمبراطورية الرومانية المقدسة تعود إلى 962، وغزو النورمان لإنجلترا إلى 1066."}, {"u": 1, "q": "Protestan kelimesi ne anlama gelir?", "o": ["Yeniden doğuş", "Reform yanlısı", "Katolik Kilisesi’ni protesto edenler", "Luther’in takipçileri", "Bağışlananlar"], "a": 2, "e": "Katolik Kilisesi’ni protesto edenler.", "ar": "كلمة بروتستانت تعني «المحتجّون على الكنيسة الكاثوليكية» وتشمل كل الكنائس الجديدة لا أتباع لوثر وحدهم. أما «الولادة من جديد» فمعنى كلمة النهضة (Rönesans)."}, {"u": 1, "q": "Orta Çağ’ın ilk beş yüzyılına “karanlık çağlar” denmesinin sebepleri arasında aşağıdakilerden hangisi yer almaz?", "o": ["Ticaretin donma noktasına gelmesi", "Güçlü bir merkezi otoritenin kurulması", "Kanunsuzluğun her yerde hâkim olması", "Kentlerin büyük ölçüde yok olması", "Okuma yazma oranının çok düşmesi"], "a": 1, "e": "Karanlık çağlarda siyasi otorite ve düzenden söz etmek imkânsızdı; güçlü merkezi yönetim bunun tam tersidir. Diğer dört seçenek kitabın saydığı sebeplerdir.", "ar": "العصور المظلمة سُمّيت كذلك لأن التجارة والمدن والقراءة انهارت وعمّت الفوضى. وجود سلطة مركزية قوية هو عكس ما حدث تمامًا، فهو الخيار الذي لا ينتمي إلى القائمة."}, {"u": 1, "q": "Kitaba göre Orta Çağ hangi iki olay arasındaki dönemi kapsar?", "o": ["Charlemagne’ın taç giymesi – Westphalia Barışı", "Malazgirt Savaşı – Magna Carta", "Roma İmparatorluğu’nun ikiye ayrılması – İstanbul’un fethi", "Hun akınları – Reform hareketi", "Batı Roma’nın yıkılışı – Kolomb’un seferi"], "a": 2, "e": "Kitap Orta Çağ’ı 395’teki bölünmeden 1453’teki İstanbul’un fethine kadar sayar. 476 ve 1492 bazı kaynakların tercihidir; bu yüzden ilk seçenek çeldiricidir.", "ar": "حسب الكتاب تبدأ العصور الوسطى بانقسام روما سنة 395 وتنتهي بفتح إسطنبول 1453. الخيار الأول (476–1492) فخّ لأنه رأي بعض المصادر الغربية لا تعريف الكتاب."}, {"u": 1, "q": "Feodalizmin yaygınlaştığı dönemde Avrupa nüfusunun hızla artmasının en önemli sebebi ------- olmuştur.", "o": ["Haçlı Seferleri", "coğrafi keşifler", "ithalatın artması", "dış göçler", "tarımsal üretimin gelişmesi"], "a": 4, "e": "Ağır saban, yel değirmeni ve üçlü tarla sistemiyle tarımsal üretim arttı, açlıktan ölümler azaldı. Keşifler çok daha sonradır.", "ar": "الإنتاج الزراعي (tarımsal üretim) هو السبب الأهم: المحراث الثقيل ونظام الحقول الثلاثة قلّلا المجاعات فزاد السكان. الكشوف الجغرافية جاءت بعد قرون، فلا يمكن أن تكون السبب."}, {"u": 1, "q": "Magna Carta (1215) ile ilgili aşağıdaki ifadelerden hangileri doğrudur?<br>I. Kralın yetkileri soylular ve din adamları karşısında sınırlandı.<br>II. Keyfi tutuklama ve yargısız ceza yasaklandı.<br>III. Bu haklardan serfler de özgür insanlarla eşit biçimde yararlandı.", "o": ["Yalnız I", "Yalnız III", "I ve II", "II ve III", "I, II ve III"], "a": 2, "e": "Magna Carta kralı sınırladı ve keyfi tutuklamayı yasakladı. Ama feodal düzende haklardan sadece özgür insanlar (serf olmayanlar) yararlandı; III yanlıştır.", "ar": "العبارتان الأولى والثانية صحيحتان: الماغنا كارتا قيّدت الملك ومنعت الاعتقال التعسفي. أما الثالثة فخاطئة لأن الأقنان (serf) لم يستفيدوا من هذه الحقوق؛ كانت للأحرار فقط."}, {"u": 1, "q": "Katolikler ile Ortodokslar arasında yüzyıllar sürecek güven bunalımını başlatan olay aşağıdakilerden hangisidir?", "o": ["Haçlıların son kalelerini 1291’de kaybetmesi", "IV. Haçlı Seferi’nde İstanbul’un yağmalanması", "Kudüs’ün 1099’da alınması", "Malazgirt Savaşı", "Selahaddin’in Kudüs’ü geri alması"], "a": 1, "e": "1204’te IV. Haçlı Seferi’ndeki Latinler Filistin’e gitmek yerine Doğu Roma’nın başkentini yağmaladı. Bu, Katolik–Ortodoks güvensizliğinin başlangıcıdır.", "ar": "في 1204 نهب الصليبيون اللاتين (الكاثوليك) إسطنبول عاصمة بيزنطة الأرثوذكسية بدل الذهاب إلى فلسطين، فبدأت أزمة ثقة طويلة بين المذهبين. ملاذكرد معركة بين السلاجقة وبيزنطة لا بين الكاثوليك والأرثوذكس."}, {"u": 1, "q": "Aşağıdakilerden hangisi Yüz Yıl Savaşları’nın sonuçları arasında gösterilemez?", "o": ["Feodal savaş biçiminin güçlenmesi", "Fransa’nın ulusal monarşiye dönüşmeye başlaması", "İngiltere ve Fransa’da meclislerin öneminin artması", "Ağır zırhlı şövalyelerin önemini yitirmesi", "İngiltere’nin Calais dışındaki kıta topraklarını kaybetmesi"], "a": 0, "e": "Yüz Yıl Savaşları feodal savaş biçiminin sona erdiği dönemdir; güçlenmesi yanlıştır. Diğer seçenekler kitaptaki sonuçlardır.", "ar": "حروب المئة عام أنهت أسلوب الحرب الإقطاعي ولم تقوّه، لأن الأسلحة والتكتيكات الجديدة جعلت الفارس المدرّع بلا قيمة. بقية الخيارات نتائج حقيقية ذكرها الكتاب."}, {"u": 1, "q": "İngiltere’de York ve Lancaster aileleri arasındaki taht kavgası hangi adla bilinir ve kimin tahta çıkmasıyla sona ermiştir?", "o": ["Otuz Yıl Savaşları – VIII. Henry", "Yüz Yıl Savaşları – I. Elizabeth", "Hastings Savaşı – William", "Güller Savaşı – I. Charles", "Güller Savaşı – VII. Henry"], "a": 4, "e": "Güller Savaşı Plantagenet’in iki kolu arasında yaşandı ve 1485’te Tudor ailesinden VII. Henry’nin kral olmasıyla bitti.", "ar": "حرب الوردتين (Güller Savaşı) دارت بين أسرتي يورك ولانكستر بعد حروب المئة عام، وانتهت سنة 1485 بتولّي هنري السابع من أسرة تيودور. الخيار الأخير فخّ لأن تشارلز الأول من القرن السابع عشر."}, {"u": 1, "q": "Doğu Roma’nın mirasına sahip çıkmanın göstergesi olarak “Kayzer-i Rum” unvanını alan Osmanlı padişahı kimdir?", "o": ["Yavuz Selim", "I. Bayezid", "II. Mehmet", "Kanuni Süleyman", "II. Bayezid"], "a": 2, "e": "II. Mehmet (Fatih) 1453’te İstanbul’u alıp Doğu Roma’ya son verince “Roma Sezarı” anlamındaki bu unvanı ekledi ve devleti imparatorluğa dönüştürdü.", "ar": "«قيصر الروم» (Kayzer-i Rum) لقب اتخذه محمد الفاتح بعد فتح القسطنطينية 1453، لأنه صار وارث عاصمة الروم. سليمان القانوني كان قويًا جدًا لكنه ليس صاحب هذا اللقب."}, {"u": 1, "q": "1494 Tordesillas ve 1529 Zaragoza antlaşmalarının ortak özelliği aşağıdakilerden hangisidir?", "o": ["Kanada’nın Fransa’ya verilmesi", "Osmanlı’ya ticari ayrıcalık tanınması", "İngiltere’nin sömürge kurmasının yasaklanması", "Dünyanın kâğıt üzerinde İspanya ve Portekiz arasında paylaşılması", "Haçlı Seferleri’ni sona erdirmeleri"], "a": 3, "e": "Tordesillas batıdaki sınırı, Zaragoza öbür hattı çizdi; böylece dünya ilk kez iki devlet arasında taksim edildi. Diğer devletler bu “sözde sınırı” önemsemedi.", "ar": "معاهدة تورديسياس رسمت الخط الغربي ومعاهدة سرقسطة الخط الشرقي، فتقاسمت إسبانيا والبرتغال العالم على الورق لأول مرة. لم تمنع هاتان المعاهدتان إنجلترا رسميًا، لكن الدول الأخرى تجاهلتهما."}, {"u": 1, "q": "Kolomb’un ulaştığı toprakların yeni bir kıta olduğunu 1504’te yazdığı eserle ilk kez ortaya koyan İtalyan denizci ------- ’dir.", "o": ["Bartolomeu Diaz", "Vasco da Gama", "Amerigo Vespucci", "Hernando Cortez", "Jacques Cartier"], "a": 2, "e": "Amerigo Vespucci “Mundus Novus” (Yeni Dünya) adlı kitabında bu fikri ilk kez dile getirdi. Vasco da Gama Hindistan’a deniz yoluyla ulaşan ilk Avrupalıdır.", "ar": "أمريغو فسبوتشي هو من كتب سنة 1504 أن الأرض التي وصلها كولومبوس قارة جديدة، في كتابه «العالم الجديد» (Mundus Novus). فاسكو دا غاما وصل إلى الهند، وكارتييه إلى كندا."}, {"u": 1, "q": "Amerikan yerlilerinin Avrupalılar karşısında olağanüstü kayıplar vermesinin kitaba göre en büyük sebebi nedir?", "o": ["Yerliler arasındaki iç savaşlar", "Bağışık olmadıkları salgın hastalıklar", "Kıtlık", "Toplu göçler", "Ateşli silahlar"], "a": 1, "e": "İspanyolların silah üstünlüğü vardı ama en büyük sebep çiçek, kızamık, tifüs gibi yerlilerin bağışık olmadığı hastalıklardır. “Ateşli silahlar” en güçlü çeldiricidir.", "ar": "صحيح أن الإسبان امتلكوا أسلحة نارية، لكن الكتاب يقول إن السبب الأكبر لموت السكان الأصليين هو الأوبئة التي لم تكن لديهم مناعة ضدها كالجدري والحصبة. لذلك خيار الأسلحة هو الفخّ."}, {"u": 1, "q": "Bir ülkenin dışarıdan olabildiğince az mal alıp olabildiğince çok mal satarak değerli maden biriktirmeye çalışması hangi kavramla açıklanır?", "o": ["Feodalizm", "Merkantilizm", "Liberalizm", "Reconquista", "Hümanizm"], "a": 1, "e": "Bu tanım merkantilizmdir: ithalatı kısmak, ihracatı artırmak. Herkes uygulayınca başarısı azaldı ve devletler çatışmaya sürüklendi.", "ar": "هذه هي المركنتيلية (merkantilizm): تقليل الاستيراد وزيادة التصدير لجمع الذهب والفضة. الليبرالية الاقتصادية عكسها تمامًا لأنها تدعو إلى حرية التجارة."}, {"u": 1, "q": "Martin Luther’in Katolik Kilisesi’ne yönelttiği en temel eleştiri hangi uygulamaya karşıydı?", "o": ["Haçlı Seferleri", "Engizisyon", "Manastır vakıfları", "Papa seçimi", "Endülüjans"], "a": 4, "e": "Luther’in 95 Tez’deki en temel eleştirisi endülüjans, yani para karşılığı günah affı belgesi satışıydı.", "ar": "أهم ما انتقده لوثر في أطروحاته سنة 1517 هو بيع صكوك الغفران (endülüjans): أن تدفع مالًا فيُغفر ذنبك. هذا ما جعل الناس يشكّون في الكنيسة."}, {"u": 1, "q": "Rönesans ile ilgili aşağıdaki ifadelerden hangileri doğrudur?<br>I. İtalyan kent devletlerinde doğmuştur.<br>II. Baştan sona dine karşı bir başkaldırıdır.<br>III. Siyaset bilimine en önemli katkısı Machiavelli’nin “Hükümdar” adlı eseridir.", "o": ["Yalnız I", "Yalnız II", "Yalnız III", "I ve II", "I ve III"], "a": 4, "e": "I ve III doğrudur. Kitap Rönesans’ı baştan sona din karşıtı bir başkaldırı olarak yorumlamanın mümkün olmadığını vurgular; II yanlıştır.", "ar": "العبارتان الأولى والثالثة صحيحتان. أما الثانية فخاطئة: الكتاب يؤكّد أن النهضة سألت الكنيسة وتجاوزت حدودها، لكنها لم تكن ثورة ضد الدين من أولها إلى آخرها."}, {"u": 2, "q": "Augsburg Barışı (1555) ile hangi grubun hakları tanınmıştır?", "o": ["Kalvinistler", "Luteryenler", "Ortodokslar", "Anglikanlar", "Anabaptistler"], "a": 1, "e": "Luteryenler. Kalvinistler Westphalia’yı beklemek zorunda kaldı.", "ar": "صلح أوغسبورغ 1555 اعترف باللوثريين فقط. الكالفينيون انتظروا حتى صلح وستفاليا 1648، وهذا هو الفخّ المتكرّر."}, {"u": 2, "q": "Kanuni döneminde Osmanlı ile Kutsal Roma İmparatorluğu hangi alanda rekabet etmiştir?", "o": ["Doğu Anadolu", "Hicaz", "Akdeniz", "Karadeniz", "Kafkasya"], "a": 2, "e": "Akdeniz.", "ar": "في عهد سليمان القانوني تنافس العثمانيون وإمبراطورية شارلكان على البحر المتوسط، ومن معاركه بروزة 1538. الأماكن الأخرى لم تكن ساحة هذا التنافس."}, {"u": 2, "q": "V. Charles 1555’te topraklarını nasıl paylaştırdı?", "o": ["İspanya ve Avusturya", "İspanya ve Portekiz", "İspanya ve Fransa", "Avusturya ve Prusya", "Avusturya ve Osmanlı"], "a": 0, "e": "İspanya oğlu II. Philip’e, Avusturya kardeşi Ferdinand’a.", "ar": "قسّم شارلكان أملاكه بين ابنه فيليب الثاني (إسبانيا) وأخيه فرديناند (النمسا وأراضي هابسبورغ). كلا القسمين من أسرة هابسبورغ، ولا علاقة للبرتغال أو فرنسا بذلك."}, {"u": 2, "q": "Westphalia Barışı’ndan itibaren uluslararası ilişkilerin özünü oluşturan kavram hangisidir?", "o": ["Egemen devletlerin eşitliği", "İnsan hakları", "Hukukun üstünlüğü", "Azınlık hakları", "Serbest piyasa"], "a": 0, "e": "Egemen eşitlik.", "ar": "منذ وستفاليا صار جوهر العلاقات الدولية المساواة في السيادة بين الدول. حقوق الإنسان وحماية الأقليات مفاهيم جاءت لاحقًا بكثير."}, {"u": 2, "q": "Aşağıdakilerden hangisi Otuz Yıl Savaşları için söylenemez?", "o": ["Genelde Almanya’da geçti", "Büyük devletler dönem dönem katıldı", "Katolik–Protestan ayrımı önemli bir sebepti", "Bir bölümü Güney Amerika sömürgelerinde geçti", "Avrupa’yı ekonomik ve nüfus açısından harap etti"], "a": 3, "e": "Avrupa’da, çoğunlukla Almanya’da geçen bir savaştı.", "ar": "حرب الثلاثين عامًا دارت أساسًا في ألمانيا داخل أوروبا، ولم تجرِ في مستعمرات أمريكا الجنوبية. الخيارات الأخرى صحيحة حسب الكتاب."}, {"u": 2, "q": "Westphalia Barışı ile bağımsızlıkları onaylanan devletler hangileridir?", "o": ["Portekiz ve İsveç", "Hollanda ve İsviçre", "Belçika ve Danimarka", "Polonya ve Macaristan", "İskoçya ve İrlanda"], "a": 1, "e": "Hollanda ve İsviçre.", "ar": "صلح وستفاليا أكّد استقلال هولندا وسويسرا عن الإمبراطورية الرومانية المقدسة. بلجيكا لم تكن مستقلّة بعد، وألمانيا بقيت مجزّأة."}, {"u": 2, "q": "Katolik Fransa’nın Otuz Yıl Savaşları’na Katolik Habsburglara karşı girmesi neyi gösterir?", "o": ["Din birliğinin önemini", "İttifakların ulusal çıkara göre kurulduğunu", "Papanın gücünü", "Feodalizmin sürdüğünü", "Osmanlı baskısını"], "a": 1, "e": "İttifakları inanç değil, çıkar ve güç dengesi belirledi.", "ar": "دخول فرنسا الكاثوليكية الحرب ضد هابسبورغ الكاثوليك يبيّن أن التحالفات قامت على المصلحة القومية وميزان القوى لا على الدين."}, {"u": 2, "q": "Çin, Hindistan ve İran’ın siyasi tarihinde önemli yer tutan kavim hangisidir?", "o": ["Normanlar", "Anglo-Saksonlar", "Moğollar", "Vizigotlar", "Latinler"], "a": 2, "e": "Moğollar.", "ar": "المغول لعبوا دورًا كبيرًا في تاريخ الصين (أسرة يوان) والهند وإيران (الإلخانيون). النورمان والأنجلوساكسون والقوط الغربيون شعوب أوروبية."}, {"u": 2, "q": "Rus Çarları hangi imparatorluğun mirasçısı olduklarını iddia etmiştir?", "o": ["Doğu Roma", "Kutsal Roma", "Habsburg", "Moğol", "Frank"], "a": 0, "e": "Bizans (Doğu Roma).", "ar": "قياصرة روسيا ادّعوا وراثة الإمبراطورية الرومانية الشرقية (بيزنطة)، ولذلك قالوا «روما الثالثة». الفخّ هو «الإمبراطورية الرومانية المقدسة» وهي ألمانية كاثوليكية."}, {"u": 2, "q": "Fransız Protestanlarına bazı haklar tanıyan belge hangisidir?", "o": ["Augsburg Barışı", "Nantes Fermanı", "Magna Carta", "Utrecht Antlaşması", "Hak Dilekçesi"], "a": 1, "e": "Nantes Fermanı, 1598.", "ar": "مرسوم نانت 1598 الذي أصدره هنري الرابع منح البروتستانت الفرنسيين حقوقًا واسعة. أوغسبورغ يخصّ ألمانيا، وعريضة الحقوق تخصّ إنجلترا."}, {"u": 2, "q": "Yerel dükleri etkisizleştirip ticaret panayırları düzenleyerek Fransa’yı güçlü bir ulusal monarşiye dönüştürmeye çalışan ve 1461’de tahta çıkan kral kimdir?", "o": ["IV. Henry", "XI. Louis", "I. François", "XIII. Louis", "XII. Louis"], "a": 1, "e": "Fransa’da mutlakiyetçiliğe giden adımlar XI. Louis ile (XV. yüzyıl) başladı ve XVII. yüzyılda tamamlandı. XII. Louis bu politikayı sürdürdü.", "ar": "لويس الحادي عشر (تولّى 1461) هو من بدأ إضعاف الدوقات المحليين وتقوية المركز في فرنسا، فوضع أساس الحكم المطلق. لويس الثاني عشر جاء بعده وواصل السياسة نفسها، ولذلك هو الفخّ."}, {"u": 2, "q": "I. François ile ilgili aşağıdaki ifadelerden hangileri doğrudur?<br>I. Pavia Savaşı’nda V. Charles’a esir düştü.<br>II. Latinceyi yasaklayıp Fransızcayı milli dil yaptı.<br>III. Protestanlara geniş haklar tanıyan Nantes Fermanı’nı ilan etti.", "o": ["Yalnız I", "Yalnız III", "I ve II", "II ve III", "I, II ve III"], "a": 2, "e": "I ve II doğrudur. Nantes Fermanı 1598’de IV. Henry tarafından ilan edildi; I. François ise 1540 Fontainebleau Fermanı ile Protestanlara baskı yaptı.", "ar": "فرانسوا الأول أُسر في بافيا 1525 وجعل الفرنسية لغة رسمية 1530. أما مرسوم نانت فأصدره هنري الرابع سنة 1598، بينما فرانسوا الأول أصدر مرسوم فونتينبلو ضد البروتستانت."}, {"u": 2, "q": "VII. Henry dönemi İngiltere’si için aşağıdakilerden hangisi söylenemez?", "o": ["Aristokratlara yüksek vergiler konuldu", "Huzur Yargıçları güçlendirildi", "İspanya ile akrabalık bağı kuruldu", "Kraliyet Konseyi oluşturuldu", "İngiltere Avrupa güç dengesinin tamamen dışında tutuldu"], "a": 4, "e": "Kitap VII. Henry’nin İngiltere’yi Avrupa güç dengesinin dışında tutmadığını açıkça belirtir (Medina del Campo, Maximilian ile ittifak).", "ar": "هنري السابع لم يعزل إنجلترا عن توازن القوى الأوروبي، بل اعترف بإسبانيا وزوّج ابنه من ابنة فرديناند وإيزابيلا وتحالف مع الإمبراطور. الخيارات الأخرى من سياساته فعلًا."}, {"u": 2, "q": "Katolik Fransa’nın Kutsal Roma İmparatorluğu’na karşı Müslüman Osmanlı ve Protestan Alman prensleriyle iş birliği yapması hangi ilkenin örneğidir?", "o": ["Cuius regio, eius religio", "Ulusal çıkar", "Haçlı ideali", "Din kardeşliği", "Egemen eşitlik"], "a": 1, "e": "Kitaba göre bu iş birliği, XVI. yüzyılda devletler arasında artık “din kardeşliği”nin değil “ulusal çıkar”ın geçerli olduğunun çarpıcı göstergesidir.", "ar": "دولة كاثوليكية تتحالف مع مسلمين وبروتستانت ضد دولة كاثوليكية: هذا لا يفسّره الدين بل المصلحة القومية (ulusal çıkar). «أخوّة الدين» هو الفخّ لأنه عكس ما حدث."}, {"u": 2, "q": "V. Charles, Osmanlı ordusunu ikiye bölmek amacıyla ------- ile ittifak arayışına girmiştir.", "o": ["Babürler", "Safeviler", "Moskova Knezliği", "Fransa", "Memlükler"], "a": 1, "e": "V. Charles Şah İsmail ve Şah Tahmasb ile ilişki kurarak Osmanlı’yı iki cepheli savaşa sokmak istedi. Fransa ise Osmanlı’nın müttefikiydi.", "ar": "أراد شارلكان أن يحارب العثمانيون على جبهتين، فتواصل مع الصفويين (الشاه إسماعيل ثم طهماسب) في الشرق. فرنسا كانت حليفة العثمانيين لا حليفته، فهي الفخّ."}, {"u": 2, "q": "1555 Augsburg düzenlemeleriyle ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Otuz Yıl Savaşları sona erdi", "Hollanda bağımsız oldu", "Kutsal Roma İmparatorluğu’nun hukuken bölünmüşlüğü kabul edildi", "Kalvinistlerin hakları tanındı", "Papa’nın siyasi gücü arttı"], "a": 2, "e": "Augsburg ile Luteryen Kilise tanındı ve İmparatorluğun hukuken bölünmüşlüğü kabul edildi. Kalvinistler ancak 1648 Westphalia ile tanındı.", "ar": "صلح أوغسبورغ اعترف بأن الإمبراطورية الرومانية المقدسة منقسمة قانونيًا بين أمراء كاثوليك ولوثريين. الكالفينيون لم يُعترف بهم إلا في وستفاليا 1648، وحرب الثلاثين عامًا بدأت بعده أصلًا."}, {"u": 2, "q": "Amerika’daki “encomienda” sisteminin kademeli olarak kaldırılması hangi hükümdarın döneminde kararlaştırılmıştır?", "o": ["I. Elizabeth", "II. Philip", "Ferdinand ve Isabella", "IV. Henry", "V. Charles"], "a": 4, "e": "V. Charles 1542’de çıkardığı Yeni Yasalar ile encomiendayı kademeli kaldırmayı ve yerlilerin köleleştirilmesini yasaklamayı düzenledi.", "ar": "شارلكان أصدر «القوانين الجديدة» سنة 1542 لإلغاء نظام الإنكوميندا تدريجيًا ومنع استعباد السكان الأصليين، ثم نظّم مناظرة بلد الوليد 1550. فيليب الثاني ابنه جاء بعده."}, {"u": 2, "q": "Hollanda’da 1579’da yedi bölgenin İspanya’ya karşı güçlerini birleştirdiği oluşum hangisidir?", "o": ["Schmalkaldik Birliği", "Katolik Ligi", "Hansa Birliği", "Utrecht Birliği", "Cognac Birliği"], "a": 3, "e": "Kalvinist yedi Hollanda bölgesi 1579’da Utrecht Birliği’ni kurdu, 1581’de bağımsızlık ilan etti. Schmalkaldik Birliği Alman Protestan prenslerinindi.", "ar": "اتحاد أوترخت (Utrecht Birliği) سنة 1579 جمع سبع مقاطعات هولندية كالفينية ضد إسبانيا. اتحاد شمالكالدن كان للأمراء البروتستانت الألمان، واتحاد كونياك أنشأه فرانسوا الأول."}, {"u": 2, "q": "Westphalia Barışı’na “ilk seküler antlaşma” özelliği kazandıran durum aşağıdakilerden hangisidir?", "o": ["İsveç’in toprak kazanması", "Papa’nın temsilcisinin bulunmaması", "İngiltere’nin temsil edilmemesi", "Kalvinistlerin tanınması", "Osmanlı’nın katılmaması"], "a": 1, "e": "Protokolde hep en üstte olan Papa’nın temsilcisinin Westphalia’da bulunmaması, onu ilk seküler antlaşma yaptı. Osmanlı ve İngiltere’nin yokluğu sekülerlikle ilgili değildir.", "ar": "العلمانية (seküler) تعني غياب السلطة الدينية، وفي وستفاليا غاب ممثل البابا الذي كان دائمًا في رأس البروتوكول. غياب العثمانيين أو الإنجليز حقيقة أيضًا لكنه لا يجعل المعاهدة علمانية."}, {"u": 2, "q": "Aşağıdakilerden hangisi Westphalia Barışı’nın sonuçlarından biri değildir?", "o": ["Ren Nehri’nde seyrüsefer serbestisinin önünün açılması", "Fransa–İspanya savaşının sona ermesi", "Kalvinistlerin de haklarının tanınması", "Hollanda ve İsviçre’nin bağımsızlığının onaylanması", "Almanya’nın siyasal parçalanmışlığının sürmesi"], "a": 1, "e": "Fransa ile İspanya arasındaki savaş Westphalia’da değil, 1659 Pireneler Barışı ile sona erdi. Diğerleri Westphalia’nın sonuçlarıdır.", "ar": "حرب فرنسا وإسبانيا لم تنتهِ في وستفاليا بل استمرّت حتى صلح البرانس 1659. أما استقلال هولندا وسويسرا وبقاء ألمانيا مجزّأة والاعتراف بالكالفينيين وحرية الملاحة في الراين فمن نتائج وستفاليا."}, {"u": 2, "q": "Otuz Yıl Savaşları’nı başlatan olay aşağıdakilerden hangisidir?", "o": ["Bohemya’daki Protestan isyanı", "Pavia Savaşı", "İspanyol Armadası’nın yenilmesi", "St. Bartholeme katliamı", "Lützen Savaşı"], "a": 0, "e": "Katolik II. Ferdinand’ın veliaht seçilmesinden kaygılanan Bohemyalı Protestanlar 1618’de ayaklandı; savaş buradan bütün Avrupa’ya yayıldı.", "ar": "بدأت حرب الثلاثين عامًا بتمرّد البروتستانت في بوهيميا (براغ) سنة 1618 خوفًا من الإمبراطور الكاثوليكي فرديناند الثاني. مذبحة سان بارتيليمي حدثت في فرنسا سنة 1572، ومعركة لوتسن جاءت أثناء الحرب."}, {"u": 2, "q": "Zheng He’nin büyük deniz seferlerine rağmen ticari üs ya da koloni kurmayan ve sonraki yüzyıllarda Avrupalıların sömürge alanına dönüşen ülke hangisidir?", "o": ["Polonya", "Hindistan", "Japonya", "Çin", "İran"], "a": 3, "e": "Ming Çini Moğol tehlikesine karşı kaynakları korumak için koloni kurmadı ve içe kapandı. XV. yüzyılda en büyük ordu ve donanmaya sahip olsa da sömürge alanı oldu.", "ar": "الصين في عهد مينغ أرسلت أساطيل تشنغ خه إلى إفريقيا والهند لكنها لم تؤسّس مستعمرات، لأنها أرادت ادّخار مواردها ضد المغول، فانغلقت ثم صارت ساحة للاستعمار الأوروبي."}, {"u": 2, "q": "Ming Hanedanı dönemi Çin’i için aşağıdakilerden hangisi doğrudur?", "o": ["Tarım yerine ticarete öncelik verildi", "Tarımsal üretim azaldı", "Moğol bürokratlar yönetime getirildi", "Kölelik kaldırıldı", "Porselen üretimi durdu"], "a": 3, "e": "Ming döneminde Moğol bürokratlar tasfiye edildi, kölelik kaldırıldı, tarıma öncelik verildi ve porselen-çay-ipek üretimi arttı.", "ar": "سلالة مينغ ألغت العبودية، وأبعدت البيروقراطيين المغول، وفضّلت الزراعة على التجارة فحدث انفجار في الإنتاج الزراعي. أما تفضيل التجارة فكان من سمات عهد سونغ قبلها."}, {"u": 2, "q": "Hindistan’da konuşulan Urdu dilinin oluşumuna katkıda bulunan ve 1206’da Delhi Sultanlığı’nı kuran topluluk hangisidir?", "o": ["Türkler", "Portekizliler", "Persler", "Araplar", "Moğollar"], "a": 0, "e": "Delhi Sultanlığı’nı Türkler kurdu; yönetici sınıfın dili Türkçe yerel dillerle karışarak “Urdu” (ordu) oldu. Babür’ün 1526’daki imparatorluğu sonradır.", "ar": "الأتراك أسّسوا سلطنة دلهي سنة 1206، ولغة الطبقة الحاكمة التركية امتزجت باللغات المحلية فوُلدت «الأردية» (Urdu، من كلمة ordu أي الجيش). المغول بقيادة بابر جاؤوا لاحقًا سنة 1526."}, {"u": 2, "q": "Rusya’nın Orta Asya’ya doğru ilk yayılmasını başlatan ve boyarları sindirerek merkezileşmeyi sağlayan Çar kimdir?", "o": ["Mikail Romanov", "III. İvan", "IV. İvan", "I. Petro", "II. Katerina"], "a": 2, "e": "IV. İvan (Korkunç) boyarları sindirdi; Sibirya ile Kazan ve Astrahan hanlıklarını alarak Orta Asya’ya ilk yayılmayı başlattı.", "ar": "إيفان الرابع «الرهيب» سحق البويار (boyar) وركّز السلطة، وأخذ قازان وأستراخان وسيبيريا فبدأ أول توسّع روسي نحو آسيا الوسطى. إيفان الثالث سبقه وهو صاحب ادّعاء «روما الثالثة»."}, {"u": 2, "q": "Moskova’nın “Üçüncü Roma” olduğunu iddia eden ve “Çar” unvanını kullanmaya başlayan hükümdar kimdir?", "o": ["III. İvan", "IV. İvan", "Daniel Alexanderoviç", "Alexander Nevsky", "I. Petro"], "a": 0, "e": "III. İvan son Bizans imparatorunun yeğenlerinden biriyle evlenerek “Üçüncü Roma” iddiasında bulundu ve “Sezar”dan türeyen Çar unvanını kullandı.", "ar": "إيفان الثالث (الكبير) تزوّج من أسرة آخر إمبراطور بيزنطي، فأعلن أن موسكو «روما الثالثة» واتخذ لقب «القيصر» (Çar). الخلط الشائع مع إيفان الرابع الذي اشتهر بالتوسّع."}, {"u": 3, "q": "İngiltere’de Cumhuriyet (Commonwealth) hangi olay sonucunda ilan edilmiştir?", "o": ["Magna Carta’nın kabulü", "Hak Dilekçesi", "Parlamentonun I. Charles’ı idam ettirmesi", "Haklar Yasası", "Şanlı Devrim"], "a": 2, "e": "I. Charles 1649’da idam edildi, ardından cumhuriyet ilan edildi.", "ar": "أُعلنت الجمهورية (الكومنولث) سنة 1649 بعد أن حاكم البرلمان الملك تشارلز الأول وأعدمه. عريضة الحقوق وقانون الحقوق وثائق لتقييد الملك لا لإلغاء الملكية."}, {"u": 3, "q": "XVIII. yüzyılda Avrupa devletleri arasındaki ilişkiler için hangisi söylenebilir?", "o": ["Ebedi dostluklar değil çıkarlar geçerlidir", "Hıristiyanlık devletleri bir arada tutar", "Osmanlı ortak düşmandır", "En güçlünün yanında olunmalıdır", "Sınırlar etnik özelliklere göre çizilmelidir"], "a": 0, "e": "Güç dengesi: ittifaklar çıkarlara göre taraf değiştirir.", "ar": "في القرن الثامن عشر لم تكن هناك صداقات دائمة بل مصالح دائمة، والدليل الثورة الدبلوماسية 1756. الوقوف إلى جانب الأقوى عكس منطق ميزان القوى."}, {"u": 3, "q": "1699 Karlofça Antlaşması ile ilgili hangisi yanlıştır?", "o": ["Osmanlı’nın en büyük toprak kaybıdır", "Banat ve Temeşvar Osmanlı’da kaldı", "Macaristan ve Erdel Habsburglara verildi", "Kırım Rusya’ya verildi", "Mora ve Dalmaçya Venedik’e verildi"], "a": 3, "e": "Kırım meselesi Karlofça’da değil, 1774 Küçük Kaynarca’da ele alındı. Diğer dört seçenek Karlofça’nın gerçek sonuçlarıdır.", "ar": "القرم لم يُبحث في كارلوفجة 1699 بل في كوتشوك كاينارجة 1774. أما الخيارات الأخرى فهي فعلًا من نتائج كارلوفجة."}, {"u": 3, "q": "Fransa hangi antlaşmayla İspanya toprakları üzerindeki iddiasından vazgeçmiştir?", "o": ["Westphalia", "Utrecht", "Paris", "Karlofça", "Tilsit"], "a": 1, "e": "Utrecht, 1713.", "ar": "في صلح أوترخت 1713 تخلّت فرنسا عن مطالبها بأراضي إسبانيا، مع بقاء حفيد لويس ملكًا بشرط عدم توحيد التاجين. وستفاليا وباريس وتيلسيت أحداث أخرى."}, {"u": 3, "q": "Avusturya Veraset Savaşları’nın en temel nedeni nedir?", "o": ["Fransa’nın Avusturya tahtına sahip çıkması", "İngiltere–Avusturya rekabeti", "Avusturya ve Prusya’nın Alman devletleri üzerindeki nüfuz mücadelesi", "Rusya–Prusya rekabeti", "İspanya’daki veraset sorunu"], "a": 2, "e": "Almanya üzerinde Avusturya–Prusya mücadelesi: “Alman İkiliği.”", "ar": "السبب الأعمق لحرب الوراثة النمساوية هو صراع النمسا وبروسيا على النفوذ في الدول الألمانية (الثنائية الألمانية). مسألة الوراثة كانت الذريعة فقط."}, {"u": 3, "q": "Fransa Kuzey Amerika’daki topraklarını hangi savaşlar sonucunda İngiltere’ye kaptırmıştır?", "o": ["İspanya Veraset Savaşları", "Avusturya Veraset Savaşları", "Yedi Yıl Savaşları", "Otuz Yıl Savaşları", "Napoleon Savaşları"], "a": 2, "e": "Yedi Yıl Savaşları; 1763 Paris Antlaşması ile bitti.", "ar": "خسرت فرنسا أمريكا الشمالية لصالح إنجلترا في حرب السنوات السبع التي انتهت بصلح باريس 1763. حرب الوراثة الإسبانية أعطت إنجلترا أجزاء فقط."}, {"u": 3, "q": "Aşağıdakilerden hangisi Küçük Kaynarca Antlaşması’nın sonuçlarından biri değildir?", "o": ["Kırım’ın Rusya’ya bırakılması", "Rus gemilerine Karadeniz’de serbest ticaret", "İstanbul’da daimi Rus elçiliği", "Polonya’nın büyük kısmının Rusya’ya bırakılması", "Rusya’nın Eflak-Boğdan Ortodokslarını koruma hakkı"], "a": 3, "e": "Polonya bu antlaşmanın konusu değildi; Polonya 1772–1795 arasında ayrı antlaşmalarla paylaşıldı. Diğerleri kitaba göre Küçük Kaynarca’nın sonuçlarıdır.", "ar": "بولندا ليست من بنود كوتشوك كاينارجة؛ تقسيمها تمّ باتفاقات منفصلة بين 1772 و1795. بقية الخيارات من نتائج المعاهدة حسب الكتاب."}, {"u": 3, "q": "Amerikan Bağımsızlık Savaşı’nı tetikleyen gelişme hangisidir?", "o": ["İngiliz Parlamentosu’nun Damga Vergisi ile yeni vergiler koyması", "Fransa’nın İngiltere’yle işbirliği", "Rusya’nın kolonilere yardımı", "Amerika’nın Avrupa’da söz sahibi olmak istemesi", "İspanya’nın kolonileri işgali"], "a": 0, "e": "Yedi Yıl Savaşları’nın masrafını ödemek için konan vergiler isyanı başlattı.", "ar": "ضريبة الدمغة 1765 التي فرضها البرلمان الإنجليزي أشعلت شعار «لا ضرائب بلا تمثيل». فرنسا وقفت مع المستعمرات لا مع إنجلترا."}, {"u": 3, "q": "Aşağıdakilerden hangisi XIV. Louis’nin uygulamalarından biri değildir?", "o": ["Protestan haklarının kaldırılması", "Sürekli askerlik", "Dışişlerinin yeniden yapılandırılması", "İlk kapsamlı hukuk kodifikasyonu", "Katoliklerin din değiştirmeye zorlanması"], "a": 4, "e": "Din değiştirmeye zorlananlar Katolikler değil Protestanlardı. Fransa’nın ilk büyük hukuk kodifikasyonunu ise gerçekten yaptı.", "ar": "لويس الرابع عشر أجبر البروتستانت لا الكاثوليك على تغيير دينهم، فهذا هو الخيار الخاطئ. أما الجيش الدائم وإصلاح الخارجية والتقنين الشامل فكلها من أعماله."}, {"u": 3, "q": "İngiltere’de 1688 Şanlı Devrim’de tahta davet edilen kimdir?", "o": ["Oliver Cromwell", "I. Charles", "Orange Prensi William", "VIII. Henry", "I. Elizabeth"], "a": 2, "e": "Hollanda’dan Orange Prensi William.", "ar": "في الثورة المجيدة 1688 دُعي أمير أورانج وليام من هولندا إلى العرش بعد خلع جيمس الثاني. كرومويل يخصّ عهد الجمهورية لا الثورة المجيدة."}, {"u": 3, "q": "I. James ve I. Charles’ın Parlamento ile çatışmasının temelinde aşağıdakilerden hangisi yatar?", "o": ["Parlamento’nun Fransa ile ittifak istemesi", "İskoçya’nın bağımsızlık istemesi", "Kralın Tanrı tarafından verilmiş hakları olduğuna inanmaları", "Kralların cumhuriyet kurmak istemesi", "Parlamento’nun Katolik olması"], "a": 2, "e": "İki Stuart kralı da “ilahi hak” anlayışıyla Fransa tipi mutlakiyete özendi; 1215’ten beri yetkileri paylaşan Parlamento buna direndi.", "ar": "ملوك ستيوارت آمنوا بأن سلطتهم من الله (ilahi hak) وأرادوا حكمًا مطلقًا كفرنسا، بينما البرلمان الإنجليزي اعتاد منذ 1215 على مشاركة الملك السلطة. البرلمان لم يكن كاثوليكيًا بل معاديًا للكاثوليكية."}, {"u": 3, "q": "Parlamento’nun 1628’de kabul ettiği ------- ile Parlamento onayı olmadan yeni vergi konulması yasaklanmıştır.", "o": ["Hak Dilekçesi", "Nantes Fermanı", "Magna Carta", "Haklar Yasası", "İhanet Yasası"], "a": 0, "e": "7 Haziran 1628 Hak Dilekçesi (Petition of Right) onaysız vergiyi, keyfi tutuklamayı ve sivil evlerin askerlerce zorla kullanılmasını yasakladı. Haklar Yasası 1689’dur.", "ar": "عريضة الحقوق (Hak Dilekçesi) سنة 1628 منعت فرض ضرائب جديدة دون موافقة البرلمان. احذر الخلط مع قانون الحقوق (Haklar Yasası) سنة 1689 ومع الماغنا كارتا سنة 1215."}, {"u": 3, "q": "İngiltere’de Cumhuriyet döneminde Oliver Cromwell’in 1653 darbesinden sonra kullandığı unvan hangisidir?", "o": ["Birinci Konsül", "Büyük Britanya Kralı", "Lord Protektör", "Devlet Konseyi Başkanı", "Lord Şansölye"], "a": 2, "e": "Cromwell 1653’te Parlamento’yu feshetti, atanan parlamento onu Lord Protektör ilan etti; 1658’e kadar diktatörce yönetti. Birinci Konsül Napoleon’un unvanıdır.", "ar": "بعد انقلاب 1653 صار كرومويل «اللورد الحامي» (Lord Protektör) وحكم حكمًا دكتاتوريًا حتى وفاته 1658. «القنصل الأول» لقب نابليون، و«اللورد المستشار» منصب من عهد هنري الثامن."}, {"u": 3, "q": "Katolik II. James’in tahttan indirilip yerine Hollanda’dan bir prensin davet edilmesi İngiliz tarihinde hangi adla anılır?", "o": ["Diplomatik Devrim", "Güller Savaşı", "Şanlı Devrim", "Commonwealth", "Hak Dilekçesi"], "a": 2, "e": "1688’de Anglikan din adamları ve soylular Orange Prensi William’ı davet etti, II. James Fransa’ya gitti. Bu kansız değişim “Şanlı Devrim”dir.", "ar": "خلع جيمس الثاني الكاثوليكي ودعوة وليام أورانج سنة 1688 يُسمّى «الثورة المجيدة» (Şanlı Devrim). «الثورة الدبلوماسية» فخّ لأنها انقلاب التحالفات سنة 1756."}, {"u": 3, "q": "1689 Haklar Yasası ile ilgili aşağıdaki ifadelerden hangileri doğrudur?<br>I. Hükümdarın yetkisinin milletin iradesinden kaynaklandığını belirtti.<br>II. İngiltere’yi mutlak monarşiye dönüştürdü.<br>III. Kral ile Parlamento arasındaki uzun çekişmeyi Parlamento lehine sonuçlandırdı.", "o": ["Yalnız I", "Yalnız II", "Yalnız III", "I ve II", "I ve III"], "a": 4, "e": "I ve III doğrudur. Haklar Yasası kralın yetkisini sınırlandırdı; mutlak monarşiye dönüşüm Fransa’nın yoludur, II yanlıştır.", "ar": "قانون الحقوق 1689 جعل مصدر سلطة الملك إرادة الأمة لا الحق الإلهي، وأنهى صراع 85 عامًا لصالح البرلمان. أما «الملكية المطلقة» فطريق فرنسا لا إنجلترا، فالعبارة الثانية خاطئة."}, {"u": 3, "q": "İngiltere’de bugünkü Liberal Parti’nin atası sayılan ve Katolik bir kralın tahta çıkmasına karşı çıkan grup hangisidir?", "o": ["Presbiteryen", "Jakoben", "Tory", "Püriten", "Whig"], "a": 4, "e": "Whig’ler Katolik krala ve mutlakiyete karşı çıktı; Tory’ler (Muhafazakâr Parti’nin atası) James’in kral olmasında sakınca görmedi.", "ar": "الويغ (Whig) هم أجداد الحزب الليبرالي وعارضوا ملكًا كاثوليكيًا وحكمًا مطلقًا. التوري (Tory) أجداد المحافظين ولم يمانعوا تولّي جيمس العرش، فهم الفخّ."}, {"u": 3, "q": "XIV. Louis döneminde maliye bakanı olarak ilk modern maliye yapısını kuran ve merkantilist politika izleyen kişi kimdir?", "o": ["Talleyrand", "Wolsey", "Mazarin", "Colbert", "Richelieu"], "a": 3, "e": "1665’te maliye bakanı yapılan Jean Baptiste Colbert vergi sistemini yeniledi, devlet borçlarını azalttı ve ithalatı kısan merkantilist politika izledi.", "ar": "جان باتيست كولبير وزير مالية لويس الرابع عشر أسّس أول نظام مالي حديث واتّبع المركنتيلية بتقليل الواردات. ريشيليو ومازاران كاردينالان سبقا عهد لويس المنفرد بالحكم."}, {"u": 3, "q": "XIV. Louis’nin, İspanya’nın drahomayı ödememesini gerekçe göstererek 1667’de başlattığı savaş hangisidir?", "o": ["İntikal Savaşı", "İspanya Veraset Savaşı", "Yedi Yıl Savaşları", "Fransa–Hollanda Savaşı", "Otuz Yıl Savaşları"], "a": 0, "e": "500.000 altınlık drahoma ödenmeyince XIV. Louis İspanyol Hollandası’nın kendisine “intikal etmesi” gerektiğini ileri sürdü; savaş 1668 Aix-la-Chapelle ile bitti.", "ar": "لما لم تدفع إسبانيا مهر ماري تيريز، ادّعى لويس الرابع عشر أن هولندا الإسبانية يجب أن «تؤول» إليه، فشنّ «حرب الأيلولة» (İntikal Savaşı) سنة 1667. حرب الوراثة الإسبانية جاءت بعد ذلك بأكثر من ثلاثين عامًا."}, {"u": 3, "q": "Aşağıdakilerden hangisi 1713 Utrecht Antlaşması’nın hükümlerinden biri değildir?", "o": ["Cebelitarık ve Minorka’nın İngiltere’ye verilmesi", "İngiltere’ye köle taşıma tekelinin (asiento) verilmesi", "İspanya ve Fransa taçlarının birleştirilmemesi", "Fransa’nın Kuzey Amerika’da İngilizlerin ticaret hakkını kabul etmesi", "Silezya’nın Prusya’ya bırakılması"], "a": 4, "e": "Silezya Prusya’ya Avusturya Veraset Savaşları sonunda 1748 Aix-la-Chapelle ile bırakıldı. Diğerleri Utrecht hükümleridir.", "ar": "سيليزيا أُعطيت لبروسيا في صلح إكس لا شابيل 1748 بعد حرب الوراثة النمساوية، لا في أوترخت. أما جبل طارق ومينوركا واحتكار العبيد وعدم توحيد التاجين فكلها من أوترخت 1713."}, {"u": 3, "q": "Baltacı Mehmet Paşa’nın Rus ordusunu Prut kıyısında çembere almasından sonra imzalanan antlaşmayla aşağıdakilerden hangisi gerçekleşmiştir?", "o": ["Belgrat Avusturya’ya geçti", "Kırım Rusya’ya bırakıldı", "Rusya’ya ticari kapitülasyon verildi", "Azak kalesi Osmanlı’ya geri verildi", "Mora Venedik’e bırakıldı"], "a": 3, "e": "1711 Prut Antlaşması ile 1700’de Rusya’ya bırakılan Azak kalesi geri alındı ve Rusya’nın Polonya’nın içişlerine karışmaması kararlaştırıldı.", "ar": "في معاهدة بروت 1711 استعاد العثمانيون قلعة آزوف التي أعطوها لروسيا سنة 1700، وتعهّدت روسيا بعدم التدخل في شؤون بولندا. القرم والامتيازات التجارية لروسيا من معاهدة 1774."}, {"u": 3, "q": "Aşağıdakilerden hangisi Çar I. Petro’nun uygulamalarından biri değildir?", "o": ["Ordu ve donanmayı Batı tekniğiyle yeniden kurması", "Boyarların yönetimdeki etkisini azaltması", "Küçük Kaynarca Antlaşması’nı imzalaması", "Başkenti St. Petersburg’a taşıması", "Eğitimi yaygınlaştırması"], "a": 2, "e": "Küçük Kaynarca 1774’te, II. Katerina döneminde imzalandı; I. Petro 1725’te ölmüştü. Diğerleri I. Petro’nun reformlarıdır.", "ar": "بطرس الأكبر مات سنة 1725، أما معاهدة كوتشوك كاينارجة فوُقّعت سنة 1774 في عهد كاترين الثانية. نقل العاصمة وتحديث الجيش وإضعاف البويار ونشر التعليم كلها من إصلاحاته."}, {"u": 3, "q": "Avusturya Veraset Savaşları’nı sona erdiren 1748 antlaşmasıyla ilgili aşağıdakilerden hangisi doğrudur?", "o": ["Utrecht’te imzalandı", "Avusturya Silezya’yı geri aldı", "Silezya Prusya toprağı olarak tanındı", "Fransa Kuzey Amerika’yı kaybetti", "Alman İkiliği sona erdi"], "a": 2, "e": "Aix-la-Chapelle (Aachen) Antlaşması büyük ölçüde savaş öncesi duruma dönüş öngördü ama Silezya’yı Prusya toprağı olarak tanıdı; Alman İkiliği keskinleşti.", "ar": "صلح إكس لا شابيل 1748 أعاد الأمور تقريبًا إلى ما قبل الحرب، لكنه اعترف بسيليزيا أرضًا بروسية، فازدادت الثنائية الألمانية حدّة بدل أن تنتهي. فرنسا خسرت أمريكا الشمالية لاحقًا سنة 1763."}, {"u": 3, "q": "Yedi Yıl Savaşları öncesinde Fransa’nın eski düşmanı Avusturya ile, Prusya’nın eski düşmanı İngiltere ile ittifak kurması siyasi tarihte hangi adla anılır?", "o": ["Avrupa Uyumu", "Diplomatik Devrim", "Alman İkiliği", "Kutsal İttifak", "Büyük İttifak"], "a": 1, "e": "1756’da ittifak yapısının tamamen tersine dönmesine siyasi tarihçiler Diplomatik Devrim adını verir; ebedi dostluk olmadığını gösterir.", "ar": "انقلاب التحالفات سنة 1756، حين تحالفت فرنسا مع عدوّتها النمسا وبروسيا مع عدوّتها إنجلترا، يُسمّى «الثورة الدبلوماسية» (Diplomatik Devrim). «التحالف الكبير» تحالف قديم ضد فرنسا من 1689."}, {"u": 3, "q": "Amerikan kolonilerinin İngiltere’ye karşı ilk organize tepkisi olarak sembolik önem taşıyan olay hangisidir?", "o": ["Kıtasal Kongre", "Saratoga Savaşı", "Albany Toplantısı", "Damga Vergisi Yasası", "Boston Çay Partisi"], "a": 4, "e": "1773 Çay Yasası’na karşı kolonicilerin Boston limanında İngiliz gemilerindeki çayları denize dökmesi ilk organize tepkidir. Damga Vergisi tepkinin sebebidir, tepkinin kendisi değil.", "ar": "«حفلة شاي بوسطن» 1773، حين ألقى المستعمرون شاي السفن الإنجليزية في البحر، هي أول ردّ منظّم ضد إنجلترا. ضريبة الدمغة 1765 هي سبب الغضب لا الرد المنظّم نفسه."}, {"u": 3, "q": "Amerikan Bağımsızlık Savaşı sırasında ABD’yi resmen tanıyıp onunla ittifak antlaşması imzalayan ilk Avrupa devleti hangisidir?", "o": ["Prusya", "Rusya", "Hollanda", "İspanya", "Fransa"], "a": 4, "e": "Fransa, 1777 Saratoga zaferinden sonra Şubat 1778’de ABD’yi tanıyan ilk devlet oldu; Hollanda 1782’de ikinci oldu.", "ar": "فرنسا كانت أول دولة تعترف رسميًا بالولايات المتحدة في فبراير 1778 بعد انتصار ساراتوغا، بمنطق «عدوّ عدوّي صديقي». هولندا كانت الثانية سنة 1782، وإسبانيا انضمّت إلى التحالف 1779."}, {"u": 3, "q": "Thomas Paine’in “Sağduyu” adlı eserinde savunduğu, Avrupa işlerinden uzak durma düşüncesi ABD’nin hangi dış politika ilkesinin kökenidir?", "o": ["Müdahalecilik", "Yalnızcılık", "Merkantilizm", "Sömürgecilik", "Güç dengesi"], "a": 1, "e": "Paine’e göre okyanus ötesi işler kolonileri ilgilendirmiyordu; bu düşünce ABD’nin bağımsızlık sonrası “yalnızcılık” politikasının köküdür.", "ar": "توماس بين رأى في كتابه «الحسّ السليم» أن شؤون أوروبا لا تعني الأمريكيين، ومن هنا وُلدت سياسة الانعزالية (yalnızcılık) الأمريكية. التدخّل (müdahalecilik) عكسها تمامًا."}, {"u": 4, "q": "Aşağıdakilerden hangisi Fransız Devrimi’nin iç nedenlerinden biri değildir?", "o": ["Savaşları finanse etmek için yeni vergiler", "Fiyatların ücretlerden hızlı artması", "Aristokrasinin vergi muafiyeti", "Burjuvazinin siyasi haklardan yoksunluğu", "Kilise’nin halka destek vermesi"], "a": 4, "e": "Kilise kral ve soyluların yanındaydı.", "ar": "الكنيسة كانت مع الملك والنبلاء ضد الشعب، فدعمها للشعب ليس سببًا للثورة بل عكس الواقع. الضرائب والتضخّم والإعفاءات والحرمان السياسي كلها أسباب حقيقية."}, {"u": 4, "q": "Aşağıdakilerden hangisi Aydınlanma düşünürlerinden biri değildir?", "o": ["Diderot", "Voltaire", "Montesquieu", "Hobbes", "Rousseau"], "a": 3, "e": "Hobbes daha önceki, 17. yüzyıl İngiliz geleneğine aittir.", "ar": "هوبز فيلسوف إنجليزي من القرن السابع عشر وليس من الموسوعيين الفرنسيين. ديدرو وفولتير ومونتسكيو وروسو هم أعمدة التنوير الفرنسي."}, {"u": 4, "q": "Aşağıdakilerden hangisi Fransız Devrimi’nin getirdiği yeniliklerden değildir?", "o": ["Yasalar önünde eşitlik", "Basın özgürlüğü", "Özel mülkiyetin dokunulmazlığı", "Kadınlara seçme-seçilme hakkı", "Adil vergi"], "a": 3, "e": "Kadınlar oy hakkı almadı.", "ar": "الثورة لم تمنح النساء حق التصويت ولا التعليم. المساواة أمام القانون وحرية الصحافة والملكية الخاصة والضرائب العادلة من مكاسبها."}, {"u": 4, "q": "1792–1795 Ulusal Konvansiyon dönemine özgü özellik hangisidir?", "o": ["İki meclisli yapı", "Yasama ve yürütmenin tek elde toplanması", "Kralın eski haklarına kavuşması", "Beş direktörlü yönetim", "Anayasal monarşi"], "a": 1, "e": "Konvansiyon erkleri birleştirdi; 1795 Direktuvarı onları yeniden ayırdı.", "ar": "المؤتمر الوطني جمع السلطتين التشريعية والتنفيذية في هيئة واحدة. المجلسان والمديرون الخمسة من دستور 1795، والملكية الدستورية من 1791."}, {"u": 4, "q": "Aşağıdakilerden hangisi Napoleon’un reformlarından değildir?", "o": ["İlk Fransız Anayasası’nın yürürlüğe konması", "Fransız Medeni Kanunu", "Fransa Merkez Bankası", "Eğitimin modernleşmesi", "Kilise ile ilişkilerin düzeltilmesi"], "a": 0, "e": "İlk anayasa 1791’de, Napoleon iktidara gelmeden önce yapıldı.", "ar": "أول دستور فرنسي صدر سنة 1791 قبل وصول نابليون إلى الحكم. القانون المدني والبنك المركزي والتعليم والصلح مع الكنيسة كلها من إصلاحاته."}, {"u": 4, "q": "Napoleon İngiltere’yi ekonomik olarak yenmek için hangi yönteme başvurdu?", "o": ["İngiltere’yi istila", "Kıta Ablukası", "Ren Konfederasyonu", "Tilsit Antlaşması", "Trafalgar Savaşı"], "a": 1, "e": "Kıta Ablukası İngiltere’nin Avrupa ile ticaretini kesti.", "ar": "الحصار القاري (Kıta Ablukası) كان سلاحًا اقتصاديًا لقطع تجارة بريطانيا مع أوروبا بعد عجزه بحريًا. الطرف الأغر (Trafalgar) معركة بحرية خسرها."}, {"u": 4, "q": "Aşağıdakilerden hangisi Napoleon’un zayıflamasına yol açan etkenlerden biri değildir?", "o": ["Kıta Ablukası yüzünden destek kaybı", "Almanya’da milliyetçiliğin yükselmesi", "Feodalizmi yeniden kurmaya çalışması", "Otoriterliğin simgesi hâline gelmesi", "Diğer ulusların Fransız egemenliğine tepkisi"], "a": 2, "e": "Modern reformlar yaydı; feodalizmi geri getirmedi.", "ar": "نابليون لم يحاول إعادة الإقطاع، بل كان يقدّم نفسه عدوًا له. فقدان الدعم بسبب الحصار وصعود القومية الألمانية وصورته السلطوية كلها أسباب ضعفه."}, {"u": 4, "q": "Aşağıdakilerden hangisi “Dörtlü İttifak”ta yer almamıştır?", "o": ["Osmanlı İmparatorluğu", "Prusya", "Avusturya", "İngiltere", "Rusya"], "a": 0, "e": "İngiltere, Rusya, Avusturya ve Prusya.", "ar": "التحالف الرباعي في شومون 1814 ضمّ بريطانيا وروسيا والنمسا وبروسيا فقط، ولم يكن العثمانيون فيه."}, {"u": 4, "q": "Aşağıdakilerden hangisi Viyana Kongresi’nin özelliklerinden biri değildir?", "o": ["Uzun süre büyük savaşları önledi", "Güç dengesi sistemi kuruldu", "Polonya Rus nüfuz alanına girdi", "Fransa’ya karşı Hollanda büyütüldü", "Alman devletleri Prusya çatısı altında birleştirildi"], "a": 4, "e": "Prusya–Avusturya ikiliği sürdü; Almanya çok daha sonra birleşti.", "ar": "مؤتمر فيينا لم يوحّد ألمانيا بل تركها اتحادًا رخوًا من 37 دولة مع استمرار التنافس النمساوي البروسي. الوحدة الألمانية جاءت بعد عقود."}, {"u": 4, "q": "Viyana Düzeni’nin asıl mimarları kimlerdir?", "o": ["Napoleon ve Alexander", "Metternich ve Castlereagh", "Richelieu ve Mazarin", "Robespierre ve Danton", "Bismarck ve Cavour"], "a": 1, "e": "Avusturya’dan Metternich ve İngiltere’den Castlereagh.", "ar": "مهندسا نظام فيينا هما مترنيخ رئيس وزراء النمسا وكاسلري وزير خارجية بريطانيا. ريشيليو ومازاران من القرن السابع عشر، وبسمارك وكافور من زمن لاحق."}, {"u": 4, "q": "1791 Anayasası ile Fransa’da nasıl bir yönetim kuruldu?", "o": ["Mutlak monarşi", "Cumhuriyet", "Anayasal monarşi", "Direktuvar", "İmparatorluk"], "a": 2, "e": "Anayasal monarşi; kral sadece geciktirici veto yetkisin }, {"u": 4, "q": "Kutsal Roma İmparatorluğu’nun 1806’da tarih sahnesinden silinmesine yol açan gelişme hangisidir?", "o": ["Viyana Kongresi", "Waterloo Savaşı", "Tilsit Antlaşması", "Napoleon’un Avusturya’yı Ulm ve Austerlitz’de yenmesi", "Westphalia Barışı"], "a": 3, "e": "Ulm ve Austerlitz yenilgilerinden sonra II. Franz 1806’da Kutsal Roma İmparatorluğu tacını bırakıp yalnızca Avusturya İmparatoru oldu; 962’den beri süren imparatorluk bitti.", "ar": "بعد هزيمتي أولم وأوسترليتز سنة 1805 تخلّى فرانز الثاني عن تاج الإمبراطورية الرومانية المقدسة سنة 1806 واكتفى بلقب إمبراطور النمسا، فانتهت إمبراطورية عمرها منذ 962."}, {"u": 4, "q": "Donanmasıyla yenemediği rakibini, müttefik ve işgal altındaki ülkelerin onunla ticaretini yasaklayarak ekonomik olarak çökertmeye çalışan bir hükümdarın bu politikası Napoleon döneminde hangi adla bilinir?", "o": ["Merkantilizm", "Kıta Ablukası", "Güç dengesi", "Yalnızcılık", "Tarafsızlık"], "a": 1, "e": "Trafalgar’dan sonra Napoleon Kasım 1806’da İngiltere ile ticareti yasakladı; bu Kıta Ablukası (Kıtasal Sistem) idi ve sonunda Fransa’yı da vurdu.", "ar": "بعد هزيمة الطرف الأغر عجز نابليون عن غزو بريطانيا، فمنع حلفاءه والبلدان المحتلّة من التجارة معها: هذا هو الحصار القاري (Kıta Ablukası). المركنتيلية سياسة عامة لتقليل الواردات لا حصار ضد دولة."}, {"u": 4, "q": "Napoleon’un “ulus-üstü” anlayışına karşı ilk büyük milli uyanışın ortaya çıktığı ve romantizm akımının doğduğu yer hangisidir?", "o": ["Almanya", "Rusya", "İngiltere", "İspanya", "İtalya"], "a": 0, "e": "İlk büyük milli uyanış Napoleon’un işgalindeki Alman topraklarında, Prusya merkezli olarak doğdu ve romantizm akımını yarattı.", "ar": "أول يقظة قومية كبيرة ضد نابليون ظهرت في الأراضي الألمانية المحتلّة، وكانت بروسيا مركزها، ومنها وُلد تيار الرومانسية الذي قدّم العاطفة والخصوصية القومية على العقل. إسبانيا قاومت أيضًا لكن الكتاب يسمّي ألمانيا."}, {"u": 4, "q": "18 Haziran 1815’te Brüksel yakınlarında yapılan ve Napoleon’un St. Helena’ya sürülmesiyle sonuçlanan savaş hangisidir?", /* AÖF shared core: storage, dates, progress model, spaced repetition, icons.
   Used by the hub and every course page (same origin, so they read each other's progress). */
const AOF = (() => {
  const PASS = 0.7; // test score that counts a unit as passed
  let syncer = null; // set by startSync; told about every progress write
