urdu. Roma 1957 EURATOM ve AET’yi kurdu; Maastricht “Birlik” adını getirdi.", "ar": "اتفاقية الدمج (Füzyon) سنة 1965 وحّدت الجماعات الثلاث تحت مفوضية ومجلس وبرلمان واحد. معاهدة روما فخ لأنها أنشأت جماعتين جديدتين ولم تدمج شيئًا."}, {"u": 2, "q": "Avrupa Birliği’ni diğer uluslararası örgütlerden ayıran temel özellik aşağıdakilerden hangisidir?", "o": ["Sadece Avrupa devletlerinin üye olması", "Askeri bir ittifak olması", "Bazı kararlarını uluslarüstü düzeyde alması", "Kâr amacı gütmesi", "Kararlarını her zaman oybirliğiyle alması"], "a": 2, "e": "AB hükümetlerarası yapısının yanında bazı kararlarını uluslarüstü düzeyde alan sui generis bir yapıdır. Hükümetlerarası örgütlerde genel kural oybirliğidir; AB bu kuralın istisnasıdır.", "ar": "ما يجعل الاتحاد الأوروبي فريدًا (sui generis) أنه يتخذ بعض قراراته فوق مستوى الدول (uluslarüstü) فتلتزم بها حتى لو اعترضت. خيار «الإجماع دائمًا» فخ لأنه عكس الحقيقة."}, {"u": 2, "q": "I. Ortakları doğrudan devletlerdir.<br>II. Anglo-Iranian Oil Company bu türe örnektir.<br>III. Ortakları farklı devletlerin vatandaşlarıdır.<br>Yukarıdakilerden hangileri uluslararası nitelikte çokuluslu şirketler için doğrudur?", "o": ["Yalnız I", "Yalnız III", "I ve II", "II ve III", "I, II ve III"], "a": 2, "e": "Uluslararası nitelikte çokuluslu şirketlerin ortakları devletlerdir; 1933 İngiltere–İran sözleşmesiyle kurulan Anglo-Iranian bunun örneğidir. Ortakların farklı ülke vatandaşları olması uluslaraşırı şirketlerin özelliğidir.", "ar": "الشركة «الدولية» (uluslararası nitelikte) شركاؤها حكومات، ومثالها شركة النفط الأنجلو-إيرانية سنة 1933، فالعبارتان الأولى والثانية صحيحتان. أما كون الشركاء مواطنين من دول مختلفة فهو صفة الشركة العابرة للقوميات."}, {"u": 2, "q": "Aşağıdakilerden hangisi ulusal kurtuluş hareketlerine örnek <b>değildir<\/b>?", "o": ["Kuvva-i Milliye", "Cezayir Kurtuluş Ordusu", "Afrika Milli Kongresi", "Uluslararası Af Örgütü", "Hindistan Ulusal Kongresi"], "a": 3, "e": "Uluslararası Af Örgütü insan hakları alanında çalışan bir hükümetler-dışı örgüttür. Diğerleri işgale veya sömürgeciliğe karşı kurulmuş ulusal kurtuluş hareketleridir.", "ar": "منظمة العفو الدولية (Af Örgütü) منظمة غير حكومية سلمية لحقوق الإنسان، لا تحمل السلاح ولا تسعى لتحرير أرض. أما القوات الوطنية التركية وجيش التحرير الجزائري وحزب المؤتمر الأفريقي فحركات تحرر."}, {"u": 2, "q": "Küresel ölçekte geçerli bir terörizm tanımı yapılamamasının kitapta belirtilen temel nedeni nedir?", "o": ["Terörün yeni bir olgu olması", "Tanımın ezilen halkların kurtuluş mücadelelerine zarar verme ihtimali", "BM’nin terörle ilgilenmemesi", "Terör örgütlerinin hepsinin devlet olması", "Siber terörün ölçülememesi"], "a": 1, "e": "Terör eylemleri bazen kurtuluş hareketlerinin eylemlerine benzediği için bir tanım halkların meşru müdafaa hakkını zedeleyebilir; 1937 sözleşmesi bu kaygıyla yürürlüğe girmedi.", "ar": "لم يُتفق على تعريف عالمي للإرهاب لأن أي تعريف قد يشمل حركات التحرر المشروعة فيسلب الشعوب المضطهدة حق الدفاع عن نفسها. لهذا لم تدخل اتفاقية 1937 حيز التنفيذ."}, {"u": 2, "q": "ABD’nin Vietnam’dan çekilmesine yönelik girişimleri nedeniyle 1973’te Nobel Barış Ödülü alan ve mekik diplomasisiyle tanınan devlet adamı kimdir?", "o": ["George Kennan", "Woodrow Wilson", "Nelson Mandela", "Otto von Bismarck", "Henry Kissinger"], "a": 4, "e": "Kissinger mekik diplomasisiyle SSCB ile yumuşamayı, Çin–ABD temasını ve İsrail–Mısır ilişkisini sağladı ve 1973’te Nobel aldı. Kennan çevreleme politikasıyla tanınır.", "ar": "هنري كيسنجر (Kissinger) وزير الخارجية الأمريكي اشتهر بالدبلوماسية المكوكية (mekik diplomasisi) ونال نوبل للسلام 1973. كينان فخ لأنه صاحب سياسة الاحتواء (çevreleme)."}, {"u": 3, "q": "Uluslararası politikada aşağıdakilerden hangisi realizmin ilk kaynaklarından biri sayılır?", "o": ["Kant’ın Ebedi Barış’ı", "Grotius’un savaş ve barış hukuku", "Wilson’ın 14 İlkesi", "Thucydides’in Peloponnes Savaşı analizi", "Marx’ın Komünist Manifesto’su"], "a": 3, "e": "Thucydides’in Atina–Sparta arasındaki Peloponnes Savaşı analizi realizmin ilk kaynaklarından sayılır. Kant ve Wilson idealist/liberal, Marx ise Marksist geleneğe aittir.", "ar": "تحليل ثوسيديدس (Thucydides) لحرب البيلوبونيز بين أثينا وإسبرطة يُعدّ أقدم مصادر الواقعية. كانط وولسن من المثالية الليبرالية، وماركس من التقليد الماركسي."}, {"u": 3, "q": "“İnsan doğası hakkında kötümser fikirlere sahip olan ------- , güçlü liderlerin temel kaygılarının güç ve güvenlik olduğunu savunmuştur.” Boşluğa hangisi gelmelidir?", "o": ["Kant", "Machiavelli", "Locke", "Grotius", "Bentham"], "a": 1, "e": "Prens’in yazarı Machiavelli insan doğasına kötümser bakar ve liderlerin temel kaygısının güç ve güvenlik olduğunu söyler. Kant, Locke ve Bentham liberal geleneğin düşünürleridir.", "ar": "ميكافيلي (Machiavelli) صاحب كتاب «الأمير» نظر بتشاؤم إلى الطبيعة البشرية، ورأى أن هم القادة الأقوياء هو القوة والأمن. كانط ولوك وبنثام مفكرون ليبراليون، فهم فخاخ."}, {"u": 3, "q": "Morgenthau’nun realizm ilkelerine göre aşağıdakilerden hangisi <b>yanlıştır<\/b>?", "o": ["Politika, kaynağı insan doğası olan objektif kanunlarla yönetilir.", "Uluslararası politikada çıkar güç olarak tanımlanır.", "Ahlaki buyruklar ile siyasi eylem arasında daima gerginlik vardır.", "Çıkarı güç olarak tanımlamak politikayı bağımsız bir disiplin yapar.", "Bir ülkenin ahlaki kaygıları evrensel ahlak kurallarıyla aynıdır."], "a": 4, "e": "Morgenthau’nun beşinci ilkesine göre belli bir ülkenin ahlaki kaygıları evrensel ahlaki kurallarla aynı anlama gelmez. Diğer ifadeler altı ilke arasındadır.", "ar": "مورغنثاو يفصل بين أخلاق دولة معينة والأخلاق العالمية: ما تراه دولة أخلاقيًا ليس بالضرورة قاعدة عالمية. لذلك عبارة «أخلاق الدولة = الأخلاق العالمية» خاطئة، وبقية العبارات من مبادئه الستة."}, {"u": 3, "q": "Devletlerin askeri yöntemler yerine kendi değer ve ideolojilerini başkalarına benimseterek istediklerini yaptırabilme yeteneğine ne ad verilir?", "o": ["Sert güç", "Mutlak güç", "Yumuşak güç", "Göreceli güç", "Güç kapasitesi"], "a": 2, "e": "Değer ve ideolojiyi benimseterek, zor kullanmadan etki etmek yumuşak güçtür; gücü başkalarının gözünde meşru kılar. Sert güç ise askeri yöntemlere dayanır.", "ar": "القوة الناعمة (yumuşak güç) هي أن تجعل الآخرين يريدون ما تريد عبر قيمك وثقافتك وأفكارك، دون إكراه. أما القوة الصلبة فهي الإجبار بالسلاح، وهي الفخ المعاكس."}, {"u": 3, "q": "Bir ülkenin güç öğelerinin sayısal toplamını ifade eden kavram hangisidir?", "o": ["Mutlak güç", "Göreceli güç", "Yumuşak güç", "Güç dengesi", "Güç kapasitesi"], "a": 0, "e": "Mutlak güç güç öğelerinin sayısal toplamıdır. Realistlere göre asıl anlamlı olan göreceli güçtür, yani bu toplamın diğer devletlerinkine oranı.", "ar": "القوة المطلقة (mutlak güç) هي مجموع أرقام عناصر القوة. والواقعيون يقولون إنها وحدها بلا معنى، فالمهم القوة النسبية (göreceli güç) أي مقارنتك بالآخرين."}, {"u": 3, "q": "Aşağıdakilerden hangisi kitapta güç kapasiteleri (kısa dönemli güç öğeleri) arasında yer alır?", "o": ["Toprak", "Doğal kaynaklar", "Nüfus", "Devlet bürokrasisinin kalitesi", "Coğrafi konum"], "a": 3, "e": "Güç kapasiteleri askeri güç, askeri-endüstriyel yapı ve devlet bürokrasisinin kalitesidir. Toprak, doğal kaynaklar, nüfus ve coğrafi konum uzun dönemli güç kaynaklarıdır.", "ar": "قدرات القوة (güç kapasiteleri) هي ما يمكن استعماله بسرعة: الجيش والصناعة العسكرية وجودة البيروقراطية. أما الأرض والسكان والموارد والموقع فهي موارد طويلة المدى."}, {"u": 3, "q": "Realistlere göre güç dengesinin barışı sağlayabilmesinin koşulu aşağıdakilerden hangisidir?", "o": ["Sistemde bir hegemonun bulunması", "Statüko güçlerinin revizyonistlerden güçlü ve kararlı olması", "Tüm devletlerin silahsızlanması", "Uluslararası örgütlerin güçlenmesi", "Devletlerin demokratik olması"], "a": 1, "e": "Güç dengesi ancak statükoyu korumak isteyen güçler revizyonist devletlerden güçlü ve kararlı olursa başarılı olur. Hegemon varlığı ise güç dengesinin önlemeye çalıştığı durumdur.", "ar": "ينجح توازن القوى فقط إذا كانت الدول الراضية بالوضع القائم (statüko) أقوى وأكثر عزمًا من الدول التعديلية. وجود هيمنة فخ لأنه عكس هدف التوازن تمامًا."}, {"u": 3, "q": "Klasik realistlere göre barış ve istikrar için en uygun uluslararası sistem hangisidir?", "o": ["Tek kutuplu sistem", "İki kutuplu sistem", "Hegemonik sistem", "Hiyerarşik sistem", "Çok kutuplu sistem"], "a": 4, "e": "Klasik realistler 19. yüzyıl Avrupa Uyumu’nu örnek gösterip çok kutuplu sistemi en istikrarlı sayar. Neorealistler ise Soğuk Savaş’a bakarak iki kutuplu sistemi tercih eder.", "ar": "الواقعيون الكلاسيكيون استدلوا بالوفاق الأوروبي في القرن التاسع عشر، فرأوا أن تعدد الأقطاب (çok kutuplu) أكثر استقرارًا. أما الواقعيون الجدد فاستدلوا بالحرب الباردة على أفضلية القطبين."}, {"u": 3, "q": "Realistlere göre bir işbirliği durumunda devletlerin baktığı en önemli şey nedir?", "o": ["Mutlak kazançlar", "Uluslararası hukuk", "Göreceli kazançlar", "Kamuoyunun görüşü", "Ahlaki değerler"], "a": 2, "e": "Anarşide kimseye güvenilemediği için devletler kendi kazançlarından çok diğerinin ne kazandığına, yani göreceli kazanca bakar. Mutlak kazanca odaklanmak neoliberallerin görüşüdür.", "ar": "في عالم بلا ثقة، تسأل الدولة الواقعية: هل سيكسب شريكي أكثر مني فيصبح أقوى؟ هذا هو المكسب النسبي (göreceli kazanç). المكسب المطلق فخ لأنه رأي الليبراليين الجدد."}, {"u": 3, "q": "I. Devletler yekpare aktörler gibi seçim yapar.<br>II. Devletler çıkarlarını öncelik sırasına koyabilir.<br>III. Devletler fayda-maliyet analizi yapabilir.<br>Realizmdeki rasyonellik varsayımı yukarıdakilerden hangilerini beraberinde getirir?", "o": ["Yalnız I", "Yalnız III", "I ve II", "II ve III", "I, II ve III"], "a": 4, "e": "Kitaba göre rasyonellik üç varsayımı getirir: yekpare aktör, çıkarları sıralayabilme ve fayda-maliyet analizi. Üçü birlikte devletleri benzer davranan aktörler olarak görmeyi sağlar.", "ar": "العقلانية (rasyonellik) عند الواقعيين تتضمن الثلاثة معًا: الدولة كفاعل موحد، وترتيب المصالح، وحساب الربح والكلفة. لذلك الجواب يشمل العبارات الثلاث."}, {"u": 3, "q": "Soğuk Savaş döneminde realizmin güç dengesi kavramını çevreleme politikası olarak yorumlayan ABD’li diplomat kimdir?", "o": ["Henry Kissinger", "Hans Morgenthau", "John Mearsheimer", "George Kennan", "Woodrow Wilson"], "a": 3, "e": "George Kennan güç dengesini SSCB’nin yayılmasını önlemek için çevreleme politikası olarak yorumladı. Kissinger de realist bir devlet adamıdır ama çevreleme Kennan’la özdeşleşir.", "ar": "جورج كينان (Kennan) فسّر توازن القوى بسياسة الاحتواء (çevreleme) لمنع توسع الاتحاد السوفيتي. كيسنجر فخ لأنه واقعي أيضًا لكنه مشهور بالدبلوماسية المكوكية والانفراج."}, {"u": 3, "q": "Waltz’a göre siyasi yapının üç öğesinden hangisi değişkendir?", "o": ["Düzenleyici prensip", "Kapasitelerin dağılımı", "Birimlerin işlevsel özellikleri", "Anarşi", "İnsan doğası"], "a": 1, "e": "Waltz’a göre düzenleyici prensip (anarşi) ve birimlerin işlevsel benzerliği sabittir; değişen tek öğe kapasitelerin dağılımıdır. Sistemin kutup sayısı buna göre değişir.", "ar": "عند فالتز البنية لها ثلاثة عناصر: مبدأ التنظيم وهو الفوضى (ثابت)، وتشابه وظائف الدول (ثابت)، وتوزيع القدرات (kapasitelerin dağılımı) وهو العنصر الوحيد المتغير، ولذلك يتغير عدد الأقطاب."}, {"u": 3, "q": "Realistlerin uluslararası işbirliğinin neden zor olduğunu ve silahlanma yarışını açıklamak için kullandıkları metodolojik araç hangisidir?", "o": ["Analiz düzeyi", "Tit-for-tat stratejisi", "Analojik akıl yürütme", "Kantitatif içerik analizi", "Mahkûmların İkilemi oyunu"], "a": 4, "e": "Oyun teorisinin Mahkûmların İkilemi oyunu, güvensizliğin aktörleri işbirliğinden uzaklaştırdığını gösterir. Tit-for-tat ise neoliberallerin tekrarlanan oyunda işbirliğini açıklamak için kullandığı karşılıklılık ilkesidir.", "ar": "معضلة السجينين (Mahkûmların İkilemi) تُظهر أن الطرفين يختاران الخيانة رغم أن التعاون أفضل لهما، بسبب انعدام الثقة. «واحدة بواحدة» (tit-for-tat) فخ لأنها أداة الليبراليين الجدد لإثبات إمكانية التعاون."}, {"u": 3, "q": "Uluslararası sistemde ya da bir bölgede güçlü bir devletin varlığının askeri ve ekonomik güvenliği sağlayacağını savunan teori hangisidir?", "o": ["Tehdit Dengesi Teorisi", "Demokratik Barış Teorisi", "Hegemonik İstikrar Teorisi", "Bağımlılık Teorisi", "Karşılıklı Bağımlılık Teorisi"], "a": 2, "e": "Hegemonik İstikrar Teorisi’ne göre hegemonun varlığı sistemi güvenli kılar; Japonya, Kore ve Tayvan’ın gelişmesi bölgesel hegemon ABD’ye bağlanır. Tehdit dengesi ise Walt’ın ittifak açıklamasıdır.", "ar": "نظرية الاستقرار بالهيمنة (Hegemonik İstikrar) ترى أن وجود دولة مهيمنة يوفر الأمن والاستقرار، ومثالها دور أمريكا في نهضة اليابان وكوريا وتايوان. توازن التهديد فخ لأنه نظرية والت في التحالفات."}, {"u": 3, "q": "Saldırgan realizme göre aşağıdakilerden hangisi <b>doğrudur<\/b>?", "o": ["Tehdit altındaki devletler sorumluluğu başkalarının üzerine atma eğilimindedir.", "Devletler sadece uygun miktarda güç peşinde koşmalıdır.", "Saldırı-savunma dengesi genellikle savunmadan yanadır.", "Hegemonya hırsı çılgınlıktır.", "Fetihlerin maliyeti her zaman kazancından yüksektir."], "a": 0, "e": "Saldırgan realistlere göre tehdit altındaki devletler dengeleme yükünü başkalarına yükler; bu da saldırgan politikaları kolaylaştırır. Diğer seçenekler savunmacı realizmin görüşleridir.", "ar": "الواقعيون الهجوميون يقولون إن الدول المهددة تتهرب وتحمّل غيرها عبء المواجهة، فيسهل على الدولة الطامحة أن تتوسع. بقية الخيارات كلها آراء الواقعية الدفاعية، وهي الفخ."}, {"u": 4, "q": "Tüm insanların farklı siyasi topluluklarda yaşasalar da daha büyük bir topluluğun parçası olduğunu savunan ve liberal düşüncenin köklerinden sayılan akım hangisidir?", "o": ["Faydacılık", "Pozitivizm", "Merkantilizm", "Davranışçılık", "Stoacılık"], "a": 4, "e": "MÖ 300’lerde Eski Yunan’da doğan Stoacılık evrenselliği savunur ve Grotius ile Kant’ı etkilemiştir. Faydacılık ise Bentham’ın refah ve mutluluk odaklı akımıdır.", "ar": "الرواقية (Stoacılık) في اليونان القديمة رأت البشر جميعًا جزءًا من مجتمع واحد كبير، وهي جذر فكرة العالمية عند غروتيوس وكانط. النفعية فخ لأنها مذهب بنثام في السعادة."}, {"u": 4, "q": "Uygun davranışın herkes için refahı ve mutluluğu artıran davranış olduğunu savunan felsefi akım ve öncüsü hangisidir?", "o": ["Stoacılık – Zenon", "Klasik liberalizm – John Locke", "Faydacılık – Jeremy Bentham", "İdealizm – Woodrow Wilson", "Merkantilizm – Adam Smith"], "a": 2, "e": "Faydacılık (utilitarianism) herkesin refah ve mutluluğunu artıran davranışı doğru sayar; öncüsü Bentham’dır ve bireyleri rasyonel aktörler olarak tanımlar.", "ar": "النفعية (Faydacılık) تقول إن الفعل الصحيح هو ما يزيد سعادة الجميع ورفاههم، ورائدها جيريمي بنثام (Bentham) الذي رأى الفرد فاعلًا عاقلًا يختار الأفضل لنفسه."}, {"u": 4, "q": "Devletin kurgusal bir varlık olduğunu, asıl moral değer taşıyanın insan olduğunu savunan düşünür kimdir?", "o": ["Immanuel Kant", "Thomas Hobbes", "Hans Morgenthau", "Niccolo Machiavelli", "Karl Marx"], "a": 0, "e": "Kant devletin kurgusal olduğunu, insanlığın devletlere bölünmüşlüğünün geçici olduğunu ve bir gün ortak toplulukta birleşileceğini savunur. Hobbes ise güçlü devleti savaşın tek çaresi sayar.", "ar": "كانط (Kant) رأى أن الدولة كيان «متخيَّل» وأن الإنسان وحده صاحب القيمة الأخلاقية، وأن انقسام البشر إلى دول مؤقت. هوبز فخ لأنه على العكس جعل الدولة القوية ضرورة للخروج من حالة الطبيعة."}, {"u": 4, "q": "Kant’a göre devletler arasında daimi barışı sağlayacak federasyonun kurulmasının başlıca şartı nedir?", "o": ["Bir dünya devletinin kurulması", "Güç dengesinin sağlanması", "Büyük güçlerin ittifak kurması", "Diktatörlük ve monarşilerin yerine cumhuriyetlerin kurulması", "Serbest ticaretin kaldırılması"], "a": 3, "e": "Kant bir dünya devleti değil gevşek bir federasyon önerir; şartı diktatörlük ve monarşilerin kaldırılıp cumhuriyetlerin kurulmasıdır. Güç dengesiyle barışın beyhude olduğunu söyler.", "ar": "كانط لم يطلب دولة عالمية بل اتحادًا مرنًا، وشرطه أن تحل الجمهوريات محل الديكتاتوريات والملكيات، لأن المواطن الحر لا العبد هو من يتجاوز حالة الطبيعة. خيار «الدولة العالمية» فخ."}, {"u": 4, "q": "Liberallere göre devletler arasında işbirliğinin gerçekleşmesi için gerekli şartlardan biri aşağıdakilerden hangisidir?", "o": ["Göreceli kazançlara odaklanılması", "Devletlerarası ilişkilerin daha şeffaf olması", "Askeri gücün artırılması", "Uluslararası örgütlerin kaldırılması", "Devletlerin yekpare aktör olarak davranması"], "a": 1, "e": "Liberallere göre yanlış algıları önlemek için ilişkiler şeffaf olmalı, özgürlüğü kısıtlayan kurumlar kalkmalı ve mutlak kazanca odaklanılmalıdır. Göreceli kazanca odaklanmak işbirliğini zorlaştırır.", "ar": "الليبراليون يرون أن الشفافية (şeffaflık) تمنع سوء الفهم بين القادة، فتسهل التعاون. أما التركيز على المكسب النسبي فهو بالضبط ما يعيق التعاون عند الواقعيين، فهو فخ."}, {"u": 4, "q": "I. Demokrasiler savaşı dışlayan aynı liberal değerlere sahiptir.<br>II. Demokrasilerde karar alma tek bir liderin elinde değildir.<br>III. Demokrasiler hiçbir devletle savaşmaz.<br>Demokratik Barış Teorisi’ne göre yukarıdakilerden hangileri doğrudur?", "o": ["Yalnız I", "Yalnız III", "I ve II", "II ve III", "I, II ve III"], "a": 2, "e": "Teori demokrasilerin birbirleriyle savaşmamasını iki nedene bağlar: ortak liberal değerler ve çok aktörlü karar süreci. Demokrasilerin otoriter rejimlerle savaşabileceğini kabul ettiği için III yanlıştır.", "ar": "السببان (I) و(II) صحيحان: قيم ليبرالية مشتركة، وقرار الحرب يحتاج إقناع جهات كثيرة. أما (III) فخطأ لأن الديمقراطيات قد تحارب الأنظمة الاستبدادية."}, {"u": 4, "q": "Neoliberallere göre tekrarlanan Mahkûmların İkilemi oyununda ortaya çıkan ve işbirliğini rasyonel kılan ilke hangisidir?", "o": ["Göreceli kazanç", "Kendi kendine yardım", "Karşılıklılık (tit-for-tat)", "Sıfır toplamlı oyun", "Güç dengesi"], "a": 2, "e": "Oyun tekrarlandığında bir aktörün işbirliğine yönelik ilk hamlesi karşılık görür (tit-for-tat) ve ikisi de kazanır. Kendi kendine yardım ve sıfır toplamlı oyun realist kavramlardır.", "ar": "عندما تتكرر اللعبة يتعلم الطرفان أن التعاون يُقابَل بالتعاون، وهذا مبدأ المعاملة بالمثل (karşılıklılık / tit-for-tat). الاعتماد على الذات واللعبة الصفرية مفاهيم واقعية، فهي فخاخ."}, {"u": 4, "q": "Devletlerin üzerinde anlaştıkları ve belli alanlardaki davranışlarını düzenleyen kurallar, normlar ve ilkelerin tümüne ne ad verilir?", "o": ["Uluslararası rejim", "Kolektif güvenlik", "Hegemonya", "Güç dengesi", "Ulusaşırıcılık"], "a": 0, "e": "Uluslararası rejim, örneğin GATT gibi, belli bir alandaki davranışı düzenleyen kurallar bütünüdür. Kitap bu kavramın devletin iç siyasi rejimiyle karıştırılmaması gerektiğini vurgular.", "ar": "النظام الدولي (rejim) مجموعة قواعد ومعايير ومبادئ تتفق عليها الدول في مجال معين، مثل نظام الغات (GATT) للتجارة. لا تخلطه بمعنى «النظام السياسي» الداخلي للدولة."}, {"u": 4, "q": "Marx ve Engels’e göre toplumların tarihi neyin tarihidir?", "o": ["Devletler arası savaşların", "Dinler arası rekabetin", "Teknolojik ilerlemenin", "Sınıf çatışmasının", "Ulusların doğuşunun"], "a": 3, "e": "Komünist Manifesto’ya göre toplumların tarihi sınıf çatışmasının tarihidir: burjuva ile proletarya. Devletler arası savaş vurgusu realizme aittir.", "ar": "في البيان الشيوعي (Komünist Manifesto) كتب ماركس وإنجلز أن تاريخ المجتمعات هو تاريخ صراع الطبقات (sınıf çatışması) بين البرجوازية والبروليتاريا. التركيز على حروب الدول فخ واقعي."}, {"u": 4, "q": "Sömürgeciliğin doğrudan işgaller yoluyla değil, siyasi, ekonomik ve kültürel araçlarla dolaylı olarak sürdürülmesini anlatan kavram hangisidir?", "o": ["Emperyalizm", "Neokolonyalizm", "Dekolonizasyon", "Revizyonizm", "Modernleşme"], "a": 1, "e": "Neokolonyalizm, bağımsızlık sonrası sömürünün borçlar, şirketler ve kültür gibi dolaylı yollarla sürmesidir. Dekolonizasyon ise sömürgelerin bağımsızlığını kazanma sürecidir.", "ar": "الاستعمار الجديد (neokolonyalizm) استغلال بلا جيوش: عبر القروض والشركات والثقافة بعد الاستقلال الرسمي. «إنهاء الاستعمار» فخ لأنه عملية نيل الاستقلال نفسها."}, {"u": 4, "q": "Bağımlılık Teorisi hangi teoriye eleştiri olarak 1960’lardan sonra geliştirilmiştir?", "o": ["Neorealizm", "Demokratik Barış Teorisi", "Sosyal İnşacılık", "Hegemonik İstikrar Teorisi", "Modernleşme Teorisi"], "a": 4, "e": "Bağımlılık Teorisi, gelişmenin kapitalist sistemle sağlanacağını söyleyen liberal Modernleşme Teorisi’ne karşı, özellikle Latin Amerikalı düşünürlerce geliştirildi.", "ar": "نظرية التبعية ظهرت بعد الستينيات ردًا على نظرية التحديث (Modernleşme) الليبرالية التي وعدت بأن الرأسمالية ستنقل الدول الفقيرة إلى التقدم. مفكرو أمريكا اللاتينية رأوا أن العكس هو ما حدث."}, {"u": 4, "q": "Kapitalizmin sistemik ve evrensel bir olgu olduğunu savunan, dünyayı merkez, çevre ve yarı-çevre olarak ayıran teori hangisidir?", "o": ["Bağımlılık Teorisi", "Eleştirel Teori", "Dünya Sistemleri Teorisi", "Karşılıklı Bağımlılık", "Neoliberal Kurumsalcılık"], "a": 2, "e": "Wallerstein’ın Dünya Sistemleri Teorisi kapitalizmi sistemik ve evrensel sayar ve merkez–çevre–yarı-çevre yapısını kurar. Bağımlılık Teorisi benzer ama bu üçlü yapıyı Wallerstein geliştirmiştir.", "ar": "نظرية النظم العالمية (Dünya Sistemleri) لفالرشتاين ترى الرأسمالية نظامًا عالميًا واحدًا، وتقسمه إلى مركز وأطراف وشبه أطراف. نظرية التبعية قريبة منها، لكن التقسيم الثلاثي من صنع فالرشتاين."}, {"u": 4, "q": "Eleştirel Teori’nin Uluslararası İlişkiler disiplinine 1980’lerde girmesini sağlayan ve Gramsci’nin hegemonya kavramını kullanan düşünür kimdir?", "o": ["Robert Cox", "Alexander Wendt", "Immanuel Wallerstein", "Jürgen Habermas", "Kenneth Waltz"], "a": 0, "e": "Robert Cox 1980’lerde Gramsci’nin hegemonya kavramını Uİ’ye taşıyarak Eleştirel Teori’yi disipline soktu. Habermas Frankfurt Okulu’ndandır ama Uİ’ye taşıyan isim Cox’tur.", "ar": "روبرت كوكس (Cox) هو من أدخل النظرية النقدية إلى العلاقات الدولية في الثمانينيات مستعينًا بمفهوم الهيمنة عند غرامشي. هابرماس فخ لأنه من مدرسة فرانكفورت لكنه ليس من نقلها إلى هذا العلم."}, {"u": 4, "q": "Sosyal inşacılara göre devletlerin birbirini rakip olarak tanımladığı kültür hangisidir?", "o": ["Hobbesçu kültür", "Kantçı kültür", "Grotiusçu kültür", "Lockeçu kültür", "Machiavelci kültür"], "a": 3, "e": "Wendt’in üç kültüründe Hobbesçu kültürde herkes düşman, Lockeçu kültürde rakip, Kantçı kültürde dosttur. Grotiusçu ve Machiavelci kültür bu sınıflamada yoktur.", "ar": "عند فندت ثلاث ثقافات: الهوبزية (Hobezyen) حيث الكل أعداء، واللوكية (Lockeyan) حيث الكل منافسون، والكانطية (Kantiyen) حيث الصداقة والتعاون. المنافس يعني الثقافة اللوكية."}, {"u": 4, "q": "“İnşacılara göre yapı ve aktör birbirlerini ------- olarak inşa ederler.” cümlesinde boşluğa ne gelmelidir?", "o": ["tek yönlü", "karşılıklı", "maddi", "rastlantısal", "hiyerarşik"], "a": 1, "e": "İnşacılara göre yapı aktörün davranışını etkiler, aktör de eylemleriyle yapıyı değiştirebilir; yani inşa karşılıklıdır. Neorealizmde ise yapı aktörü tek yönlü belirler.", "ar": "البنائيون يقولون إن البنية والفاعل يبني كل منهما الآخر بشكل متبادل (karşılıklı): البنية تؤثر في الدول، والدول بأفعالها تغيّر البنية. «أحادي الاتجاه» فخ لأنه رأي الواقعية الجديدة."}, {"u": 4, "q": "Sosyal İnşacılığın sistemik yaklaşımını eleştiren ve ulusal kimliğin önemine işaret eden yaklaşım hangisidir?", "o": ["Neoklasik Realizm", "Eleştirel Teori", "Post-yapısalcılık", "Karşılıklı Bağımlılık", "Aktör-Temelli İnşacılık"], "a": 4, "e": "Aktör-Temelli İnşacılık, kimlik üzerindeki bireysel ve ulusal etkileri vurgular; devletlerin sistemik ve ulusal olmak üzere iki kimliği olduğunu söyler. Neoklasik realizm de iç faktörlere bakar ama inşacı değil, realisttir.", "ar": "البنائية المتمركزة حول الفاعل (Aktör-Temelli İnşacılık) انتقدت تركيز فندت على النظام، وقالت إن للدولة هويتين: وطنية ونظامية. الكلاسيكية الجديدة فخ لأنها تنظر للداخل أيضًا لكنها واقعية."}]};
const TERM={"id": "vize", "examFirst": "2026-12-05", "examDates": "5–6 Aralık", "examName": "Ara sınav", "start": "2026-10-19", "sync": null};
</script>
<script>
/* AÖF shared core: storage, dates, progress model, spaced repetition, icons.
   Used by the hub and every course page (same origin, so they read each other's progress). */
const AOF = (() => {
  const PASS = 0.7; // test score that counts a unit as passed
  let syncer = null; // set by startSync; told about every progress write
  const BOXES = [0, 1, 2, 4, 8]; // Leitner box -> days until the card is due again

  function store(prefix) {
    return {
      get(k, d) { try { const v = localStorage.getItem(prefix + ":" + k); return v === null ? d : JSON.parse(v) } catch (e) { return d } },
      set(k, v) { try { localStorage.setItem(prefix + ":" + k, JSON.stringify(v)) } catch (e) {} if (syncer) syncer.dirty() }
    };
  }

  // ---- dates (local calendar days as YYYY-MM-DD) ----
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d) };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
  const today = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t };
  const daysBetween = (a, b) => Math.round((b - a) / 864e5);
  const AY = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
  const AYLAR = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const GUN = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
  const GUNLER = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

  // ---- scores ----
  // best values are stored as "7/10" strings (kept from the first version).
  const pct = s => { if (s == null) return null; const [a, b] = String(s).split("/").map(Number); return b ? a / b : null };
  const passed = s => { const p = pct(s); return p != null && p >= PASS };

  // ---- card ids: stable across sessions and content edits elsewhere in the deck ----
  function cardId(unit, front) {
    let h = 5381; const s = unit + "|" + front;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  /* Per-course progress. Keys (prefix = course code):
       done   {u1:true}           unit read ("Okudum")
       best   {1:"8/10", mix:..}  best test score per unit
       srs    {id:{b,d,u}}        Leitner box, next due date, unit
       log    {"2026-10-21":{cards:n,test:"8/10",list:1,visit:1}}  daily activity, drives automatic day completion */
  function course(code, examISO) {
    const st = store(code);
    const s = {
      done: st.get("done", {}), best: st.get("best", {}), srs: st.get("srs", {}), log: st.get("log", {}),
      reload() { for (const k of ["done", "best", "srs", "log"]) s[k] = st.get(k, {}) },
      save(k) { st.set(k, s[k]) },
      get: st.get, set: st.set,
      mark(kind, value) {
        const k = iso(today()); const day = s.log[k] || (s.log[k] = {});
        if (kind === "cards") day.cards = (day.cards || 0) + 1;
        else if (kind === "test") { if (!day.test || pct(value) > pct(day.test)) day.test = value }
        else day[kind] = 1;
        s.save("log");
      },
      // Leitner review: "Bildim" moves a card up a box, "Tekrar" back to box 1. Due dates never pass the exam.
      review(id, unit, knew) {
        const cur = s.srs[id] || { b: 0 };
        const b = knew ? Math.min(BOXES.length - 1, cur.b + 1) : 0;
        let due = addDays(today(), knew ? BOXES[b] : 0);
        if (examISO) { const ex = addDays(parse(examISO), -1); if (due > ex && today() <= ex) due = ex }
        s.srs[id] = { b, d: iso(due), u: unit, t: Date.now() };
        s.save("srs");
        s.mark("cards");
      },
      isDue(id) { const c = s.srs[id]; return !!c && c.d <= iso(today()) },
      dueCount(unit) { const t = iso(today()); return Object.values(s.srs).filter(c => c.d <= t && (!unit || c.u === unit)).length },
      seenCount(unit) { return Object.values(s.srs).filter(c => c.u === unit).length },
      // A unit's three steps. cardTotal comes from the course data (or the hub's per-unit counts).
      unit(n, cardTotal) {
        const read = !!s.done["u" + n];
        const cards = cardTotal ? s.seenCount(n) >= cardTotal : read;
        const test = passed(s.best[n]);
        return { read, cards, test, complete: read && cards && test, steps: (read ? 1 : 0) + (cards ? 1 : 0) + (test ? 1 : 0) };
      }
    };
    return s;
  }

  // ---- icons: one 2px stroke family, drawn on a 24px grid ----
  const I = {
    home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
    units: '<path d="M4 6h16M4 12h16M4 18h11"/>',
    cards: '<rect x="3" y="7" width="13" height="13" rx="2.5"/><path d="M8 4h10.5A2.5 2.5 0 0 1 21 6.5V17"/>',
    test: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    bulb: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    back: '<path d="M15 18l-6-6 6-6"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    repeat: '<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/>',
    flip: '<path d="M4 7h13l-3-3M20 17H7l3 3"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
    flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
    play: '<path d="M7 5l12 7-12 7z"/>'
  };
  const ico = (n, size, label) => `<svg class="ico" viewBox="0 0 24 24"${size ? ` style="width:${size}px;height:${size}px"` : ""}${label ? ` role="img" aria-label="${label}"` : ' aria-hidden="true"'}>${I[n]}</svg>`;
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Three step marks (Oku / Kartlar / Test) used on the hub, course home and plan.
  const steps = u => `<span class="marks" role="img" aria-label="Oku ${u.read ? "tamam" : "yapılmadı"}, kartlar ${u.cards ? "tamam" : "yapılmadı"}, test ${u.test ? "geçti" : "yapılmadı"}"><i class="${u.read ? "on" : ""}"></i><i class="${u.cards ? "on" : ""}"></i><i class="${u.test ? "on" : ""}"></i></span>`;

  // Keep the sticky header's hairline only while content scrolls under it (scroll-edge effect).
  function scrollEdge(el) {
    const f = () => el.classList.toggle("edge", scrollY > 4);
    addEventListener("scroll", f, { passive: true }); f();
  }

  /* ---- sync across devices ----
     The whole progress (every course plus the hub's plan) is one JSON row in Supabase.
     Each sync pulls the row, merges it with this device, writes the result back to both.
     Merge: read marks and done days combine, best score wins, latest card review wins, latest plan shift wins.
     A restart raises "epoch"; older data from other devices is then dropped instead of merged back in. */
  const SYNCED = /^(.+):(done|best|srs|log|missq)$/;
  const canon = o => JSON.stringify(o, (k, v) => v && typeof v === "object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, x) => (a[x] = v[x], a), {}) : v);
  const pv = s => { const p = pct(s); return p == null ? -1 : p };
  function pick(a, b, f) { a = a || {}; b = b || {}; const o = {}; for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) o[k] = k in a && k in b ? f(a[k], b[k]) : k in a ? a[k] : b[k]; return o }
  const either = (a, b) => pick(a, b, (x, y) => x || y);
  function mergeCourse(a, b) {
    a = a || {}; b = b || {};
    return {
      done: either(a.done, b.done),
      best: pick(a.best, b.best, (x, y) => pv(y) > pv(x) ? y : x),
      srs: pick(a.srs, b.srs, (x, y) => (y.t || 0) > (x.t || 0) ? y : x),
      log: pick(a.log, b.log, (x, y) => { const o = Object.assign({}, x, y); o.cards = Math.max(x.cards || 0, y.cards || 0) || undefined; o.test = pv(y.test) > pv(x.test) ? y.test : x.test; o.list = x.list || y.list; o.visit = x.visit || y.visit; for (const k in o) if (o[k] === undefined) delete o[k]; return o }),
      missq: [...new Set([...(a.missq || []), ...(b.missq || [])])]
    };
  }
  function mergeDocs(l, r) {
    if (!r) return l;
    if ((r.epoch || 0) > (l.epoch || 0)) return r;
    if ((l.epoch || 0) > (r.epoch || 0)) return l;
    const courses = {};
    for (const c of new Set([...Object.keys(l.courses || {}), ...Object.keys(r.courses || {})])) courses[c] = mergeCourse((l.courses || {})[c], (r.courses || {})[c]);
    const lh = l.hub || {}, rh = r.hub || {}, newer = (rh.schedT || 0) > (lh.schedT || 0) ? rh : lh;
    return { epoch: l.epoch || 0, courses, hub: { done: either(lh.done, rh.done), schedule: newer.schedule || null, ack: newer.ack || null, schedT: newer.schedT || 0 } };
  }
  function startSync(cfg) {
    const listeners = [];
    if (!cfg || !cfg.url || !cfg.key) return { dirty() {}, now: async () => {}, onChange() {}, status: () => "off" };
    const T = cfg.term, LS = localStorage;
    const get = k => { try { const v = LS.getItem(k); return v == null ? null : JSON.parse(v) } catch (e) { return null } };
    const put = (k, v) => { try { v == null ? LS.removeItem(k) : LS.setItem(k, JSON.stringify(v)) } catch (e) {} };
    const keys = () => { const out = []; try { for (let i = 0; i < LS.length; i++) out.push(LS.key(i)) } catch (e) {} return out };
    function localDoc() {
      const d = { epoch: get("aof:epoch") || 0, courses: {}, hub: { done: get(T + ":done") || {}, schedule: get(T + ":schedule"), ack: get(T + ":ack"), schedT: get(T + ":schedT") || 0 } };
      for (const k of keys()) { const m = k && k.match(SYNCED); if (!m || m[1] === T) continue; (d.courses[m[1]] || (d.courses[m[1]] = {}))[m[2]] = get(k) }
      return d;
    }
    function writeLocal(d) {
      if ((d.epoch || 0) !== (get("aof:epoch") || 0)) for (const k of keys()) { const m = k && k.match(SYNCED); if (m && m[1] !== T) put(k, null) }
      put("aof:epoch", d.epoch || 0);
      for (const c in d.courses || {}) for (const f in d.courses[c]) put(c + ":" + f, d.courses[c][f]);
      const h = d.hub || {}; put(T + ":done", h.done || {}); put(T + ":schedule", h.schedule || null); put(T + ":ack", h.ack || null); put(T + ":schedT", h.schedT || 0);
    }
    const endpoint = cfg.url + "/rest/v1/aof_sync", headers = { apikey: cfg.key, "Content-Type": "application/json" };
    let busy = null, timer = null, again = false;
    async function run() {
      if (busy) { again = true; return busy }
      busy = (async () => {
        try {
          if (navigator.onLine === false) { put("aof:syncState", "offline"); return }
          const res = await fetch(endpoint + "?id=eq." + encodeURIComponent(cfg.row) + "&select=data", { headers, cache: "no-store" });
          if (!res.ok) throw new Error("pull " + res.status);
          const rows = await res.json(), remote = rows[0] ? rows[0].data : null, local = localDoc();
          const merged = mergeDocs(local, remote);
          if (canon(merged) !== canon(local)) { writeLocal(merged); listeners.forEach(f => f()) }
          if (!remote || canon(merged) !== canon(remote)) {
            const up = await fetch(endpoint, { method: "POST", headers: Object.assign({ Prefer: "resolution=merge-duplicates,return=minimal" }, headers), body: JSON.stringify({ id: cfg.row, data: merged }) });
            if (!up.ok) throw new Error("push " + up.status);
          }
          put("aof:lastSync", Date.now()); put("aof:syncState", "ok");
        } catch (e) { put("aof:syncState", "error") }
      })();
      await busy; busy = null;
      if (again) { again = false; return run() }
    }
    addEventListener("online", run);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") run() });
    setTimeout(run, 50);
    return syncer = {
      dirty() { clearTimeout(timer); timer = setTimeout(run, 1500) },
      now: () => run(),
      onChange(f) { listeners.push(f) },
      // a restart: progress on every device starts over from here
      newEpoch() { put("aof:epoch", Date.now()) },
      status() { const st = get("aof:syncState"), t = get("aof:lastSync"); return { state: st || "never", at: t } }
    };
  }

  return { PASS, store, startSync, mergeDocs, iso, parse, addDays, today, daysBetween, AY, AYLAR, GUN, GUNLER, pct, passed, cardId, course, ico, esc, reduced, steps, scrollEdge };
})();

</script>
<script>
document.documentElement.lang="tr";
const C=COURSE, UNITS=C.units, CARDS=C.cards, QS=C.qs, N=UNITS.length, U=C.unitWord||"Ünite";
const EN_CONTENT=C.contentLang==="en";
const S=AOF.course(C.code,TERM.examFirst), {ico,esc}=AOF;
const app=document.getElementById("app"), live=document.getElementById("live"), bar=document.getElementById("bar");
const actionbar=document.getElementById("actionbar"), actions=document.getElementById("actions");
// Unit words: the İngilizce course says "Unit" (English, so it reads and uppercases as English).
const UW=U==="Unit"?'<span lang="en">Unit</span>':U;
const UWS=U==="Unit"?"Üniteler":U+"ler";
const SHORT=n=>(U==="Bölüm"?"B":U==="Unit"?"U":"Ü")+n;
const UCODE=n=>`${C.code} · ${SHORT(n)}`;
const enAttr=EN_CONTENT?' lang="en"':"";
const EXAM=AOF.parse(TERM.examFirst);
const daysLeft=()=>Math.max(0,AOF.daysBetween(AOF.today(),EXAM));
const cardsOf=n=>CARDS.filter(c=>c[0]===n);
const ID=c=>AOF.cardId(c[0],c[1]);
const unitState=n=>S.unit(n,cardsOf(n).length);
const EN=s=>s?`<div class="enp" lang="en">${s}</div>`:"";
const AR=s=>s?`<div class="arp" lang="ar" dir="rtl">${s}</div>`:"";
const isAr=s=>/[\u0600-\u06FF]/.test(s||"");
// Explanation box for a field: Arabic (xAr) when present, else the older English (xEn).
const XP=(o,k)=>o[k+"Ar"]?AR(o[k+"Ar"]):EN(o[k+"En"]);
const termsHTML=u=>u.terms&&u.terms.length?`<details class="panel terms"><summary>Terimler · ${u.terms.length}${ico("chev")}</summary><dl>${u.terms.map(t=>`<div class="t"><dt>${t[0]}</dt><dd>${t[1]}</dd>${t[2]?`<dd class="ar" lang="ar" dir="rtl">${t[2]}</dd>`:""}</div>`).join("")}</dl></details>`:"";
const chainHTML=c=>c&&c.length?`<ol class="chain">${c.map(x=>`<li>${x}</li>`).join("")}</ol>`:"";
const say=t=>{live.textContent="";setTimeout(()=>live.textContent=t,30)};
AOF.scrollEdge(bar);
S.mark("visit");
// Progress from other devices: refresh state; redraw only views that aren't mid-exercise.
const SYNC=AOF.startSync(Object.assign({term:TERM.id},TERM.sync));
SYNC.onChange(()=>{S.reload();const v=current().v;if(["home","units","unit"].includes(v))render(false);else drawNav(current())});

const prov=(n,cls="")=>{const st=unitState(n);return `<span class="prov ${cls}" data-s="${st.steps}" aria-hidden="true"><b>${st.complete?ico("check",14):SHORT(n)}</b></span>`};

// ---------- routing: each view is a history entry, so the back gesture walks views ----------
const TABS=[["home","Ana sayfa","home"],["units",UWS,"units"],["cards","Kartlar","cards"],["test","Test","test"],["list",C.listShort||"Liste","list"]];
function parseRoute(h){
  h=(h||"").replace(/^#/,"");
  if(h==="start"||h==="plan")h="home"; if(h==="who")h="list";
  let m;
  if(["home","units","cards","test","list","review"].includes(h))return {v:h};
  if((m=h.match(/^u(\d+)$/))&&+m[1]>=1&&+m[1]<=N)return {v:"unit",n:+m[1]};
  if((m=h.match(/^s(\d+)([ctd]?)$/))&&+m[1]>=1&&+m[1]<=N)return {v:"session",n:+m[1],step:m[2]||"r"};
  return {v:"home"};
}
// Inside the single-file version pages live in srcdoc frames, where "#x" links would load the shell itself:
// there the route is kept in memory (the shell passes the start route in window.__aofHash).
const MEM=typeof window.__aofHash==="string";
let memHash=MEM?window.__aofHash:"";
const current=()=>parseRoute(MEM?memHash:location.hash);
const tabOf=r=>r.v==="unit"||r.v==="session"?"units":r.v==="review"?"cards":r.v;
function go(h){if(MEM){memHash="#"+h;render(true)}else if(location.hash==="#"+h){render(true)}else{location.hash=h}}
addEventListener("hashchange",()=>{if(!MEM)render(true)});
document.addEventListener("click",e=>{const a=e.target.closest("a[href^='#']");if(!a)return;
  if(MEM||location.hash===a.getAttribute("href")){e.preventDefault();go(a.getAttribute("href").slice(1))}});

function drawNav(r){
  const t=tabOf(r);
  document.getElementById("tabs").innerHTML=TABS.map(([id,l,ic])=>`<a href="#${id}"${t===id?' aria-current="page"':""}>${ico(ic)}<span>${l}</span></a>`).join("");
  document.getElementById("side").innerHTML=`<a class="home" href="index.html">${ico("back")}Dersler</a><div class="cap grp">${esc(C.name)}</div>`+
    TABS.map(([id,l,ic])=>`<a href="#${id}"${t===id&&!(r.n&&id==="units")?' aria-current="page"':""}>${ico(ic)}${l}</a>`).join("")+
    `<div class="cap grp">${UWS}</div>`+UNITS.map((u,i)=>`<a class="u" href="#u${i+1}"${r.n===i+1?' aria-current="page"':""}>${prov(i+1)}<span>${esc(u.title)}</span></a>`).join("");
}
function setActions(html){actions.innerHTML=html||"";actionbar.hidden=!html;document.body.classList.toggle("has-action",!!html)}
function frame(title,focus){
  document.title=title===C.name?C.name:title+" · "+C.name;
  document.getElementById("ttl").textContent=title;
  if(focus){const h=app.querySelector("h1");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}}
}
function render(focus){
  const r=current(); drawNav(r); setActions("");
  if(r.v!=="cards"&&r.v!=="review"&&!(r.v==="session"&&r.step==="c"))stopKeys();
  if(r.v==="home")home();else if(r.v==="units")unitList();else if(r.v==="unit")unit(r.n,false);
  else if(r.v==="session")session(r.n,r.step);else if(r.v==="cards")cards({mode:"scope"});
  else if(r.v==="review")cards({mode:"due"});else if(r.v==="test")test({});else list();
  scrollTo({top:0});
  if(focus)frame(document.getElementById("ttl").textContent,true);
}

// ---------- home: country header, provinces, about ----------
function nextUnit(){for(let i=1;i<=N;i++)if(!unitState(i).complete)return i;return 0}
function home(){
  const nx=nextUnit(), due=S.dueCount(), done=UNITS.filter((u,i)=>unitState(i+1).complete).length;
  const st=nx?unitState(nx):null;
  const label=!nx?"Karışık test çöz":st.steps?`Devam et: ${UW} ${nx}`:`Oturumu başlat: ${UW} ${nx}`;
  app.innerHTML=`<div class="stack">
   <section class="country-head" aria-labelledby="h1">
     <h1 id="h1">${esc(C.name)}</h1>
     <div class="meta"><span class="code">${esc(C.code)} · ${UW} 1–${N}</span><span><b>${daysLeft()}</b> gün · ${esc(TERM.examName)} ${esc(TERM.examDates)}</span><span><b>${done}/${N}</b> ${U==="Unit"?"unit":U.toLocaleLowerCase("tr")} tamam</span></div>
     <div class="cta"><a class="btn primary" href="#${nx?"s"+nx:"test"}">${ico("play",16)}${label}</a>${due?`<a class="btn ghost" href="#review">${ico("repeat",18)}Tekrar · ${due} kart</a>`:""}</div>
   </section>
   <section class="panel" aria-labelledby="ph"><div class="section-h" style="margin-top:0"><h2 id="ph">${UWS}</h2>${legend()}</div>
     <div class="rows">${UNITS.map((u,i)=>provRow(i+1)).join("")}</div></section>
   <section class="panel"><h2>Bu ders hakkında</h2><p class="muted" style="margin-top:8px">${C.about}</p>${XP(C,"about")}</section>
   <section class="panel"><h2>Çalışma döngün</h2><p class="muted" style="margin-top:6px">Her ${U==="Unit"?"unit":U.toLocaleLowerCase("tr")} için bir oturum: <b>Oku</b> → <b>Kartlar</b> → <b>Test</b> (10’da 7). Üçü bitince haritadaki bölge dolar. Bilmediğin kartlar sonraki günlerde tekrar gelir.</p></section>
  </div>`;
  frame(C.name);
}
const legend=()=>`<span class="marks" aria-hidden="true" title="Oku · Kartlar · Test"><i class="on"></i><i class="on"></i><i></i></span>`;
function provRow(n){
  const u=UNITS[n-1], st=unitState(n), b=S.best[n];
  return `<a class="prow" href="#u${n}">${prov(n)}<span class="tx"><b>${esc(u.title)}</b><span class="sub">${u.sub||u.en||""}</span>
   <span class="st"><span class="code">${SHORT(n)}</span>${AOF.steps(st)}<span>${st.complete?"Tamam":st.read?(st.cards?"Test kaldı":"Kartlar kaldı"):"Başlanmadı"}</span>${b?`<span>· En iyi ${esc(b)}</span>`:""}</span></span>${ico("chev")}</a>`;
}
function unitList(){
  app.innerHTML=`<div class="stack"><div class="view-h"><h1>${UWS}</h1><span class="code">${esc(C.code)}</span></div>
   <section class="panel"><div class="rows">${UNITS.map((u,i)=>provRow(i+1)).join("")}
   <a class="prow" href="#list"><span class="prov" data-s="0" aria-hidden="true"><b>${ico("list",14)}</b></span><span class="tx"><b>${esc(C.listName||"Ezber listesi")}</b><span class="sub">${C.listIntro||""}</span></span>${ico("chev")}</a></div></section></div>`;
  frame(UWS);
}

// ---------- reading ----------
const LEGEND=`<div class="legendx"><span><i style="background:var(--ink)"></i>Kitaptan</span><span><i style="background:var(--ex)"></i><ex>Kitap dışı örnek</ex></span><span><i style="background:var(--muted)"></i>${EN_CONTENT?"In English: açıklama":"بالعربية: açıklama"}</span></div>`;
function readingHTML(n){
  const u=UNITS[n-1];
  return `<section class="bigidea" aria-label="Ana fikir"><p>${u.big}</p>${XP(u,"big")}</section>
   ${termsHTML(u)}
   ${u.why?`<section class="note why"><span class="ic">${ico("bulb")}</span><div><h2>Neden böyle?</h2><p>${u.why}</p>${XP(u,"why")}</div></section>`:""}
   ${u.sections.map((s,j)=>`<section class="panel sec"><h2><span class="k">${j+1}</span>${s.h}</h2>${s.diagram?`<pre class="diagram">${esc(s.diagram)}</pre>`:""}${s.pts?`<ul class="pts">${s.pts.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}${chainHTML(s.chain)}${s.ar?AR(s.ar):EN(s.en)}</section>`).join("")}
   <section class="note tip"><span class="ic">${ico("star")}</span><div><h2>Akılda tutma ipucu</h2><p>${u.tip}</p>${XP(u,"tip")}</div></section>
   <section class="note trap"><span class="ic">${ico("alert")}</span><div><h2>Sınav tuzağı</h2><p>${u.trap}</p>${XP(u,"trap")}</div></section>`;
}
function unitHead(n,extra=""){
  const u=UNITS[n-1];
  return `<div class="view-h"><h1>${esc(u.title)}</h1><span class="code">${UCODE(n)} · ${n} / ${N}</span><p>${u.sub||u.en||""}</p>${extra}${LEGEND}</div>`;
}
function unit(n){
  const st=unitState(n);
  app.innerHTML=`<div class="stack reading">${unitHead(n)}${readingHTML(n)}
   <div class="readrow"><button class="readbtn" id="readbtn" aria-pressed="${st.read}">${ico("check")}<span>${st.read?"Okundu":"Okudum"}</span></button>
   <div class="pair"><a class="btn ghost" href="#s${n}c">${ico("cards",18)}Kartlar</a><a class="btn primary" href="#s${n}t">${ico("test",18)}Teste başla</a></div></div>
   <div class="pager">${n>1?`<a href="#u${n-1}"><small>← Önceki</small><b>${esc(UNITS[n-2].title)}</b></a>`:"<span></span>"}${n<N?`<a class="nx" href="#u${n+1}"><small>Sonraki →</small><b>${esc(UNITS[n].title)}</b></a>`:`<a class="nx" href="#test"><small>Sonraki →</small><b>Karışık test</b></a>`}</div>
  </div>`;
  const rb=document.getElementById("readbtn");
  rb.onclick=()=>{const v=!S.done["u"+n];S.done["u"+n]=v;S.save("done");rb.setAttribute("aria-pressed",v);rb.lastElementChild.textContent=v?"Okundu":"Okudum";say(v?"Okundu olarak işaretlendi":"Okundu işareti kaldırıldı");drawNav(current())};
  frame(UNITS[n-1].title);
}

// ---------- guided session: Oku → Kartlar → Test → finish ----------
function stepper(step){
  const ix={r:0,c:1,t:2,d:3}[step];
  return `<div class="stepper" aria-label="Oturum adımı ${Math.min(ix+1,3)} / 3">${["Oku","Kartlar","Test"].map((l,i)=>`<span class="${i===ix?"on":i<ix?"done":""}"${i===ix?' aria-current="step"':""}>${i+1} · ${l}</span>`).join("")}</div>`;
}
function session(n,step){
  if(step==="r"){
    app.innerHTML=`<div class="stack reading">${unitHead(n,stepper("r"))}${readingHTML(n)}</div>`;
    setActions(`<a class="btn ghost" href="#home" aria-label="Oturumdan çık">${ico("close",18)}</a><button class="btn primary" id="readnext">${ico("check",18)}Okudum, kartlara geç</button>`);
    document.getElementById("readnext").onclick=()=>{S.done["u"+n]=true;S.save("done");go("s"+n+"c")};
    frame(UNITS[n-1].title);
  }else if(step==="c")cards({mode:"session",n});
  else if(step==="t")test({session:n});
  else finish(n);
}
function finish(n){
  const st=unitState(n);
  const msg=st.complete?`${UW} ${n} tamam. Haritadaki bölgesi doldu.`:!st.test?"Test henüz 7/10 değil. Yanlışlarına bakıp yarın tekrar dene.":"Kartların bir kısmı daha görülmedi.";
  app.innerHTML=`<div class="stack"><section class="panel finish">${stepper("d")}<span class="prov fresh" data-s="${st.steps}" aria-hidden="true"><b>${st.complete?ico("check",30):SHORT(n)}</b></span>
   <h1>${st.complete?"Bölge doldu":"Oturum bitti"}</h1><p class="muted">${msg}</p>${AOF.steps(st)}
   <div class="pair" style="width:100%"><a class="btn ghost" href="#home">Ders ana sayfası</a><a class="btn primary" href="index.html">Bugüne dön</a></div></section></div>`;
  frame(st.complete?"Bölge doldu":"Oturum bitti");
}

// ---------- flash cards with spaced repetition and swipe ----------
let deck=[], flipped=false, tally={k:0,a:0}, deckKey="";
const cardScopeOpts=()=>[["due","Tekrar"],["0","Tümü"]].concat(UNITS.map((u,i)=>[String(i+1),SHORT(i+1)]));
function buildDeck(opt){
  let pool;
  if(opt.mode==="due")pool=CARDS.filter(c=>S.isDue(ID(c)));
  else if(opt.mode==="session")pool=cardsOf(opt.n).filter(c=>!S.srs[ID(c)]||S.isDue(ID(c)));
  else{const sc=String(S.get("cardScope",0));pool=sc==="due"?CARDS.filter(c=>S.isDue(ID(c))):CARDS.filter(c=>sc==="0"||c[0]===+sc)}
  deck=pool.slice().sort(()=>Math.random()-.5); deck.total=deck.length; flipped=false; tally={k:0,a:0};
}
function cards(opt){
  const key=JSON.stringify(opt)+(opt.mode==="scope"?S.get("cardScope",0):"");
  if(key!==deckKey||!deck.total&&!deck.finished){buildDeck(opt);deckKey=key}
  const title=opt.mode==="due"?"Bugünkü tekrar":opt.mode==="session"?`${UNITS[opt.n-1].title}`:"Kartlar";
  const sc=String(S.get("cardScope",0));
  const head=opt.mode==="session"?`<div class="view-h"><h1>${esc(title)}</h1><span class="code">${UCODE(opt.n)} · Kartlar</span>${stepper("c")}</div>`
    :`<div class="view-h"><h1>${title}</h1><span class="code">${esc(C.code)}</span></div>`+(opt.mode==="scope"?`<div class="scopes" role="group" aria-label="Kart kapsamı">${cardScopeOpts().map(([v,l])=>`<button data-s="${v}" aria-pressed="${sc===v}">${l}${v==="due"?` · ${S.dueCount()}`:""}</button>`).join("")}</div>`:"");
  app.innerHTML=`<div class="stack">${head}<div id="cardzone"></div></div>`;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.set("cardScope",b.dataset.s==="due"?"due":+b.dataset.s);deckKey="";cards(opt)});
  drawCard(opt);
  frame(title);
}
function meter(){const t=deck.total||0,d=t-deck.length;return `<div class="meter"><div class="bar"><i style="--p:${t?d/t:0}"></i></div><p>${t} kartın ${d} tanesi bitti · ${tally.k} bildim · ${tally.a} tekrar</p></div>`}
function drawCard(opt,dir){
  const z=document.getElementById("cardzone"); const c=deck[0];
  if(!c){
    deck.finished=true; stopKeys();
    const empty=!deck.total;
    const next=opt.mode==="session"?`#s${opt.n}t`:"#test";
    z.innerHTML=`<section class="panel finish"><h2>${empty?(opt.mode==="due"?"Bugün tekrar edilecek kart yok":"Bu kartlar güncel"):"Deste bitti"}</h2>
      <p class="muted">${empty?"Yeni kartlar, bildiğin kartlar ve tekrar günü gelenler burada toplanır.":`${tally.k} bildim · ${tally.a} tekrar. Bilmediklerin sonraki günlerde yeniden gelecek.`}</p>
      <div class="pair" style="width:100%">${opt.mode==="session"?`<a class="btn ghost" href="#home">Çık</a>`:`<button class="btn ghost" id="re">Yeniden karıştır</button>`}<a class="btn primary" href="${next}">${ico("test",18)}Teste geç</a></div></section>`;
    const re=document.getElementById("re"); if(re)re.onclick=()=>{deckKey="";cards(opt)};
    return;
  }
  flipped=false;
  z.innerHTML=`<div class="cardgrid"><div class="stage"><div class="fc${dir?" in-"+dir:""}" id="fc" role="button" tabindex="0" aria-describedby="fchint" aria-label="Kart: ${esc(c[1])}. Çevirmek için dokun.">
      <span class="stamp l" aria-hidden="true">Tekrar</span><span class="stamp r" aria-hidden="true">Bildim</span>
      <div class="face front"><div class="term"${enAttr}>${c[1]}</div><div class="hint" id="fchint">${ico("flip",16)} Önce cevabı söyle, sonra çevir</div><span class="code">${UCODE(c[0])}</span></div>
      <div class="face rear" inert><span class="echo"${enAttr}>${c[1]}</span><div class="tr">${c[2]}</div>${isAr(c[3])?`<div class="ar" lang="ar" dir="rtl">${c[3]}</div>`:`<div class="en" lang="en">${c[3]||""}</div>`}</div></div></div>
    <div class="side-ctl stack">${meter()}<div class="cardbtns"><button class="btn again" id="again" aria-disabled="true">${ico("repeat",18)}Tekrar</button><button class="btn know" id="got" aria-disabled="true">${ico("check",18)}Bildim</button></div>
    <p class="kbd">Boşluk: çevir · ←: tekrar · →: bildim</p></div></div>`;
  const fc=document.getElementById("fc"), front=fc.querySelector(".front"), rear=fc.querySelector(".rear");
  const ag=document.getElementById("again"), gt=document.getElementById("got");
  const setFlip=v=>{flipped=v;fc.classList.toggle("flipped",v);front.inert=v;rear.inert=!v;ag.setAttribute("aria-disabled",!v);gt.setAttribute("aria-disabled",!v);if(v)say(rear.innerText.replace(/\s+/g," "))};
  const answer=knew=>{
    if(!flipped)return;
    S.review(ID(c),c[0],knew);
    deck.shift();
    if(knew)tally.k++;else{tally.a++;deck.splice(Math.min(3,deck.length),0,c)}
    drawCard(opt,knew?"r":"l");
  };
  fc.onclick=()=>{if(!fc.dragged)setFlip(!flipped)};
  fc.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();setFlip(!flipped)}};
  ag.onclick=()=>answer(false); gt.onclick=()=>answer(true);
  swipe(fc,answer,()=>setFlip(true));
  keys=e=>{if(e.target.closest("input"))return;if(e.key===" "){e.preventDefault();setFlip(!flipped)}else if(e.key==="ArrowLeft")answer(false);else if(e.key==="ArrowRight")answer(true)};
  addEventListener("keydown",keys);
  if(dir)fc.focus({preventScroll:true});
}
let keys=null; function stopKeys(){if(keys){removeEventListener("keydown",keys);keys=null}}
// Pointer swipe: 1:1 drag with the grab offset, decide by distance or velocity, spring back otherwise.
function swipe(el,answer,flip){
  let x0=0,y0=0,t0=0,dx=0,active=false,locked=null;
  const stamps=[el.querySelector(".stamp.l"),el.querySelector(".stamp.r")];
  el.addEventListener("pointerdown",e=>{if(e.button)return;active=true;locked=null;x0=e.clientX;y0=e.clientY;t0=performance.now();dx=0;el.dragged=false});
  el.addEventListener("pointermove",e=>{
    if(!active)return; dx=e.clientX-x0; const dy=e.clientY-y0;
    if(locked===null&&Math.hypot(dx,dy)>8){locked=Math.abs(dx)>Math.abs(dy);if(locked)el.setPointerCapture(e.pointerId)}
    if(!locked)return;
    el.dragged=true; el.style.transition="none";
    el.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`;
    const k=Math.min(1,Math.abs(dx)/110); stamps[0].style.opacity=dx<0&&flipped?k:0; stamps[1].style.opacity=dx>0&&flipped?k:0;
  });
  const end=()=>{
    if(!active)return; active=false;
    const v=Math.abs(dx)/Math.max(1,performance.now()-t0);
    const decide=locked&&(Math.abs(dx)>100||v>.45&&Math.abs(dx)>40);
    stamps.forEach(s=>s.style.opacity=0);
    if(decide&&flipped){el.style.transition=`transform .2s var(--ease),opacity .2s`;el.style.transform=`translateX(${dx>0?480:-480}px) rotate(${dx>0?12:-12}deg)`;el.style.opacity=0;setTimeout(()=>answer(dx>0),180)}
    else{
      el.style.transition=AOF.reduced()?"none":"transform .45s cubic-bezier(.34,1.4,.64,1)";el.style.transform="";
      if(decide&&!flipped){flip();say("Önce cevabı gör, sonra kaydır")}
    }
    setTimeout(()=>el.dragged=false,0);
  };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
}

// ---------- test ----------
let T={key:null,q:[],i:0,score:0,misses:[],answered:null};
const qid=q=>AOF.cardId(q.u,q.q);
function testScopes(){const m=S.get("missq",[]);return UNITS.map((u,i)=>[String(i+1),`${SHORT(i+1)}`]).concat([["0","Karışık 20"]]).concat(m.length?[["miss",`Yanlışlarım · ${m.length}`]]:[])}
function startTest(scope,sess){
  let p;
  if(scope==="miss"){const m=new Set(S.get("missq",[]));p=QS.filter(q=>m.has(qid(q)))}
  else if(scope==="retry")p=T.misses.slice();
  else p=QS.filter(q=>scope==="0"||q.u===+scope);
  // unit tests draw 10 random questions from the unit's bank (pass = 7/10); mixed tests draw 20
  p=p.slice().sort(()=>Math.random()-.5); if(scope==="0")p=p.slice(0,20); else if(/^\d+$/.test(scope))p=p.slice(0,10);
  T={key:scope,sess:sess||0,q:p.map(q=>{const ix=q.o.map((_,i)=>i).sort(()=>Math.random()-.5);return Object.assign({},q,{o:ix.map(i=>q.o[i]),a:ix.indexOf(q.a)})}),i:0,score:0,misses:[],answered:null};
}
function test(opt){
  const sess=opt.session;
  // Keep a running test across tab switches; a session always tests its own unit.
  if(sess){if(T.sess!==sess)startTest(String(sess),sess)}
  else if(!T.q.length||T.sess)startTest(String(S.get("testScope",1)));
  const title=sess?UNITS[sess-1].title:"Test";
  const head=sess?`<div class="view-h"><h1>${esc(title)}</h1><span class="code">${UCODE(sess)} · Test</span>${stepper("t")}</div>`
    :`<div class="view-h"><h1>Test</h1><span class="code">${esc(C.code)}</span></div><div class="scopes" role="group" aria-label="Test kapsamı">${testScopes().map(([v,l])=>`<button data-t="${v}" aria-pressed="${T.key===v}">${l}</button>`).join("")}</div>`;
  app.innerHTML=`<div class="stack">${head}<div id="tz" class="stack"></div></div>`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    if(T.i>0&&T.i<T.q.length&&b.dataset.t!==T.key&&!confirm("Test bitmedi. Kapsamı değiştirirsen bu testteki ilerleme silinir. Devam edilsin mi?"))return;
    if(b.dataset.t!=="miss")S.set("testScope",+b.dataset.t);
    startTest(b.dataset.t);test(opt)});
  drawQ(opt);
  frame(title);
}
function drawQ(opt){
  const z=document.getElementById("tz"), sess=opt.session;
  if(T.i>=T.q.length){showResult(opt);return}
  const q=T.q[T.i], L="ABCDE";
  z.innerHTML=`<div class="meter"><div class="bar"><i style="--p:${T.i/T.q.length}"></i></div><p>Soru ${T.i+1} / ${T.q.length} · ${UCODE(q.u)} · ${T.score} doğru</p></div>
   <section class="panel stack" style="gap:16px" aria-labelledby="qtext"><p class="q" id="qtext"${enAttr}>${q.q}</p>
   <div class="opts" role="group" aria-labelledby="qtext">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="L" aria-hidden="true">${L[k]}</span><span${enAttr}>${o}</span></button>`).join("")}</div>
   <div id="fb"></div></section><p class="kbd">A–E veya 1–5: cevap · Enter: sonraki</p>`;
  const pick=k=>{
    if(T.answered!==null)return; T.answered=k;
    const ok=k===q.a; if(ok)T.score++; else T.misses.push(q);
    const miss=new Set(S.get("missq",[])); ok?miss.delete(qid(q)):miss.add(qid(q)); S.set("missq",[...miss]);
    z.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("right");else if(i===k)b.classList.add("wrong")});
    const fb=document.getElementById("fb");
    fb.innerHTML=`<div class="fb ${ok?"ok":"no"}" tabindex="-1">${ok?`<b>Doğru!</b>`:`<b>Yanlış.</b><p class="right-ans">Doğru cevap: <strong${enAttr}>${L[q.a]}) ${q.o[q.a]}</strong></p>`}${q.e}${(q.ar?AR(q.ar):EN(q.en))}</div>`;
    say((ok?"Doğru. ":"Yanlış. Doğru cevap "+L[q.a]+". ")+fb.innerText.replace(/\s+/g," "));
    setActions(`<button class="btn primary" id="next">${T.i+1<T.q.length?"Sonraki soru":"Sonucu gör"}${ico("arrow",18)}</button>`);
    document.getElementById("next").onclick=nextQ; fb.firstElementChild.scrollIntoView({block:"nearest",behavior:AOF.reduced()?"auto":"smooth"});
  };
  const nextQ=()=>{T.i++;T.answered=null;setActions("");drawQ(opt);scrollTo({top:0});const p=document.getElementById("qtext");if(p){p.setAttribute("tabindex","-1");p.focus({preventScroll:true})}};
  z.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  stopKeys();
  keys=e=>{if(e.target.closest("input"))return;const k="abcde".indexOf(e.key.toLowerCase()),d="12345".indexOf(e.key);
    if(T.answered===null&&(k>=0||d>=0)&&(k>=0?k:d)<q.o.length)pick(k>=0?k:d);else if(e.key==="Enter"&&T.answered!==null){e.preventDefault();nextQ()}};
  addEventListener("keydown",keys);
}
function showResult(opt){
  stopKeys(); setActions("");
  const z=document.getElementById("tz"), sess=opt.session, n=T.q.length, res=`${T.score}/${n}`, ok=T.score/n>=AOF.PASS;
  if(T.key!=="retry"&&T.key!=="miss"){const bk=T.key==="0"?"mix":T.key;if(S.best[bk]==null||AOF.pct(S.best[bk])<T.score/n){S.best[bk]=res;S.save("best")}}
  S.mark("test",res);
  z.innerHTML=`<section class="panel stack"><div class="score ${ok?"pass":"fail"}"><b>${res}</b><span class="muted">doğru</span></div>
    <h2>${ok?"Geçtin. 10’da 7 ve üstü.":"Az kaldı. Yanlışlarını oku, sonra tekrar dene."}</h2>
    ${T.misses.length?`<div><span class="cap">Bunları tekrar et</span><div class="misses">${T.misses.map(m=>`<a href="#u${m.u}"><b${enAttr}>${m.q}</b><span>Cevap: <span${enAttr}>${m.o[m.a]}</span> · ${UW} ${m.u}’i oku →</span></a>`).join("")}</div></div>`:""}
    <div class="pair">${T.misses.length?`<button class="btn ghost" id="retrymiss">Yanlışları çöz</button>`:`<button class="btn ghost" id="retry">Tekrar dene</button>`}${sess?`<a class="btn primary" href="#s${sess}d">Oturumu bitir</a>`:`<button class="btn primary" id="retry2">Yeni test</button>`}</div></section>`;
  say(`Sonuç: ${res}. ${ok?"Geçtin.":"Henüz geçmedin."}`);
  const rm=document.getElementById("retrymiss"); if(rm)rm.onclick=()=>{startTest("retry",T.sess);drawQ(opt);scrollTo({top:0})};
  const r1=document.getElementById("retry"); if(r1)r1.onclick=()=>{startTest(T.key,T.sess);drawQ(opt)};
  const r2=document.getElementById("retry2"); if(r2)r2.onclick=()=>{startTest(String(S.get("testScope",1)));test(opt)};
  const h=z.querySelector("h2");h.setAttribute("tabindex","-1");h.focus({preventScroll:true});
}

// ---------- list ----------
function list(){
  S.mark("list");
  app.innerHTML=`<div class="stack"><div class="view-h"><h1>${esc(C.listName||"Ezber listesi")}</h1><span class="code">${esc(C.code)}</span><p>${C.listIntro||""}</p></div>
   <label class="search">${ico("search")}<span class="vh">Listede ara</span><input id="q" type="search" enterkeyhint="search" placeholder="Ara: isim, tarih, terim" autocomplete="off"></label>
   <p class="muted" id="cnt" aria-live="polite" style="font-size:14px"></p>
   <section class="panel"><div class="rows" id="rows"></div></section></div>`;
  const draw=f=>{const s=f.toLocaleLowerCase("tr");const rs=C.list.filter(r=>!s||(r[0]+" "+r[1]).toLocaleLowerCase("tr").includes(s));
    document.getElementById("rows").innerHTML=rs.map(r=>`<div class="lrow"><div class="tx"><b${enAttr}>${r[0]}</b><span>${r[1]}</span></div><span class="tag">${/^\d+$/.test(r[2])?SHORT(r[2]):esc(r[2])}</span></div>`).join("")||`<p class="muted" style="padding:8px 0">“${esc(f)}” için sonuç yok.</p>`;
    document.getElementById("cnt").textContent=s?`${rs.length} sonuç`:`${rs.length} satır`};
  draw("");document.getElementById("q").oninput=e=>draw(e.target.value);
  frame(C.listName||"Liste");
}

render(false);
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})</script>
