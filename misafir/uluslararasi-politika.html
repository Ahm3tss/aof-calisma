<style>
/* Atlas Plate: the term as a political map you colour in.
   Sea-grey ground, paper land panels, ink type, flat course tints, frontier red for exam marks.
   Rank comes from weight, case and rule, not size inflation. No gradients, no glow, no glass. */
:root{
  --sea:#dfe8ea; --land:#fbfaf6; --land-2:#eef2ef; --ink:#1d2430; --muted:#4f5b69; --line:#c3cfd3; --line-2:#dde4e6;
  --frontier:#c8102e; --good:#17703f; --bad:#b3261e; --good-soft:#e2f0e6; --bad-soft:#f8e5e3;
  --focus:#1d2430;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:14px; --r-s:10px;
  --bar-h:64px; --nav-h:64px;
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0e151a; --land:#172029; --land-2:#1e2933; --ink:#e7edf2; --muted:#a3b2bf; --line:#30404d; --line-2:#24313c;
  --frontier:#ff7083; --good:#62d394; --bad:#ff8a80; --good-soft:#163326; --bad-soft:#3a1d1d; --focus:#e7edf2; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0e151a; --land:#172029; --land-2:#1e2933; --ink:#e7edf2; --muted:#a3b2bf; --line:#30404d; --line-2:#24313c;
  --frontier:#ff7083; --good:#62d394; --bad:#ff8a80; --good-soft:#163326; --bad-soft:#3a1d1d; --focus:#e7edf2; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 12px);scroll-padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 88px)}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
::selection{background:color-mix(in srgb,var(--c,var(--ink)) 28%,transparent)}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
/* cartographic label: spaced caps, carried by weight and case */
.cap{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.code{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- app bar: solid land, hairline only once content scrolls under it ---- */
.appbar{position:sticky;top:0;z-index:30;background:var(--sea);padding-top:env(safe-area-inset-top,0px);transition:box-shadow .2s}
.appbar.edge{box-shadow:0 1px 0 var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:8px;min-height:var(--bar-h)}
.iconbtn{display:inline-flex;align-items:center;gap:4px;min-width:44px;min-height:44px;padding:0 10px 0 6px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:700;font-size:16px}
.iconbtn:active{background:var(--line-2)}
.appbar .ttl{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.appbar.edge .ttl{opacity:1;transform:none}

/* ---- panels: land on sea, one elevation (hairline) ---- */
.panel{background:var(--land);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:10px 0 2px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .12s var(--ease),background-color .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--c-ink,var(--ink));color:var(--on-c,var(--land))}
.btn.ghost{background:var(--land);border:1px solid var(--line);color:var(--ink)}
.btn.quiet{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 6px}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn .ico{width:18px;height:18px}

/* ---- step marks (Oku / Kartlar / Test) ---- */
.marks{display:inline-flex;gap:3px;flex:0 0 auto}
.marks i{width:14px;height:6px;border-radius:2px;border:1.5px solid var(--c-ink,var(--ink));opacity:.55}
.marks i.on{background:var(--c-ink,var(--ink));opacity:1}

/* ---- course swatch: flat country colour with its short code ---- */
.sw{width:40px;height:40px;border-radius:9px;background:var(--c-sw,var(--c));color:var(--on-swatch,#fff);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.02em;flex:0 0 auto}

/* ---- rows ---- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px;border-top:1px solid var(--line-2);text-decoration:none;color:inherit}
.rows > .row:first-child{border-top:0}
a.row:active,button.row:active{background:var(--land-2)}
button.row{width:100%;text-align:left}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .tx b{font-weight:700;line-height:1.3}
.row .tx span{color:var(--muted);font-size:15px;line-height:1.35}
.row .go{color:var(--muted)}

/* ---- the map scale bar: countdown to the exam, one tick per week ---- */
.scale{margin-top:4px}
.scale .track{position:relative;height:12px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.scale .track{background:var(--land)}
.scale .track::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:var(--ink)}
.scale .track span{position:relative;border-left:1.5px solid var(--ink)}
.scale .track span.past{border-left-color:var(--land)}
.scale .track span:first-child{border-left:0}
.scale{position:relative}
.scale .now{position:absolute;top:-5px;height:22px;width:3px;margin-left:-1.5px;background:var(--frontier);border-radius:1px}
.scale .ticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.scale .ticks span:last-child{text-align:right;color:var(--frontier)}
.flapnum{display:inline-block}
.flapnum.flip{animation:flap .5s var(--ease)}
@keyframes flap{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}

/* ---- the term plate: countries with provinces that fill in ---- */
.plate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.country{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);background:var(--land);border:1px solid var(--line);text-decoration:none;color:inherit;min-height:44px;transition:transform .12s var(--ease)}
.country:active{transform:scale(.98)}
.country .nm{font-weight:700;font-size:15px;line-height:1.25}
.provinces{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px}
.prov{position:relative;aspect-ratio:1.25;border:1.5px solid var(--c-ink);border-radius:4px;overflow:hidden;background:var(--land)}
.prov::before{content:"";position:absolute;inset:0;background:var(--c);transform-origin:left;transform:scaleX(var(--f,0));transition:transform .4s var(--ease)}
.prov[data-s="1"]{--f:.34}.prov[data-s="2"]{--f:.67}.prov[data-s="3"]{--f:1}
.prov[data-s="1"]::before,.prov[data-s="2"]::before{opacity:.55}
.prov b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--c-ink)}
.prov[data-s="3"] b{color:var(--on-swatch,#fff)}
.prov.fresh::before{animation:fillin .4s var(--ease) both}
@keyframes fillin{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:11px;border:1.5px solid var(--ink);border-radius:3px;background:linear-gradient(90deg,var(--ink) var(--f),transparent var(--f))}

/* ---- bottom tab bar (course pages) ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--land);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;min-width:44px}
.tabbar a .ico{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--c-ink)}
.tabbar a[aria-current="page"] .ico{stroke-width:2.4}
.tabbar a:active{background:var(--land-2)}

/* sticky action bar above the tab bar (Next question, session steps) */
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:35;padding:10px 0;background:color-mix(in srgb,var(--sea) 94%,transparent);border-top:1px solid var(--line)}
.actionbar .wrap{display:flex;gap:10px}
.actionbar .btn{flex:1}
.actionbar .btn.ghost:first-child:not(:last-child){flex:0 0 52px;padding:0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .prov::before{transition:opacity .2s}
  .btn:active,.country:active{transform:none}
}
@media (prefers-reduced-transparency:reduce){.actionbar{background:var(--sea)}}

}
/* ---------- course page ---------- */
:root{--ex:#a3207f;--mark:#fbe7a1;--mark-ink:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ex:#ff9be8;--mark:#5a4a10;--mark-ink:#fff6cc}}
:root[data-theme="dark"]{--ex:#ff9be8;--mark:#5a4a10;--mark-ink:#fff6cc}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px)}
body.has-action{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 110px)}
main{padding-block:4px 8px}
main:focus{outline:none}
ex{color:var(--ex)}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* country header: flat course tint, large title, the one next action */
.country-head{background:var(--c-tint);border:1px solid var(--c-line);border-radius:var(--r);padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px}
.country-head h1{font-size:clamp(30px,8.4vw,42px);letter-spacing:-.03em}
.country-head .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:15px}
.country-head .meta b{color:var(--ink)}
.prow .st .code{color:var(--c-ink)}
.face.front .code{margin-top:6px}
.country-head .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.country-head .cta .btn{flex:1 1 auto}
.view-h{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.view-h h1{font-size:clamp(28px,7.6vw,36px);letter-spacing:-.03em}
.view-h p{color:var(--muted)}
.view-h:focus,h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,.q[tabindex="-1"]:focus{outline:none}

/* provinces list on course home / units */
.prow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-2);text-decoration:none;color:inherit;min-height:64px}
.rows > .prow:first-child{border-top:0}
.prow:active{background:var(--land-2)}
.prow .prov{width:46px;flex:0 0 auto}
.prow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .tx b{font-weight:700;line-height:1.3}
.prow .tx .sub{color:var(--muted);font-size:15px;line-height:1.35}
.prow .st{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:13px;color:var(--muted);font-weight:700}

/* reading */
.legendx{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legendx span{display:inline-flex;align-items:center;gap:6px}
.legendx i{width:9px;height:9px;border-radius:2px;display:inline-block}
.bigidea{background:var(--c-tint);border:1px solid var(--c-line);border-radius:var(--r);padding:18px}
.bigidea p{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.4;margin-top:6px;letter-spacing:-.01em}
.note{border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;background:var(--land);border:1px solid var(--line)}
.note .ic{flex:0 0 auto;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--land)}
.note h2{font-size:17px;margin-bottom:4px;letter-spacing:-.01em}
.note.why .ic{background:none;color:var(--c-ink);width:auto} .note.why h2{color:var(--c-ink)}
.note.tip .ic{background:var(--good)} .note.tip h2{color:var(--good)}
.note.trap{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))} .note.trap .ic{background:var(--bad)} .note.trap h2{color:var(--bad)}
.sec h2{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;font-size:19px}
.sec h2 .k{flex:0 0 auto;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--c-ink);font-family:var(--body)}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pts li{position:relative;padding-left:18px;min-width:0}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:1.5px;background:var(--c)}
.diagram{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.5;background:var(--land-2);border-radius:var(--r-s);padding:14px;overflow-x:auto;margin:0 0 12px;color:var(--ink)}
.enp{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--land-2);font-size:15.5px;line-height:1.55}
.arp{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--land-2);font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.8;text-align:right}
.arp::before{content:"بالعربية";display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.terms summary{cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:800;font-size:19px}
.terms summary::-webkit-details-marker{display:none}
.terms summary .ico{transition:transform .2s var(--ease);color:var(--muted)}
.terms[open] summary .ico{transform:rotate(90deg)}
.terms dl{margin:6px 0 0;display:flex;flex-direction:column}
.terms .t{padding:10px 0;border-top:1px solid var(--line-2)}
.terms dt{font-weight:700}
.terms dd{margin:2px 0 0;color:var(--muted)}
.terms dd.ar{color:var(--ink);font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic",system-ui,sans-serif;text-align:right;font-size:16px;line-height:1.7}
.chain{list-style:none;margin:14px 0 0;padding:12px 14px;border:1.5px dashed var(--c-line);border-radius:var(--r-s);display:flex;flex-direction:column;gap:6px}
.chain::before{content:"Neden → Sonuç";font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink)}
.chain li{position:relative;padding-left:22px}
.chain li::before{content:"→";position:absolute;left:0;color:var(--c-ink);font-weight:700}
.chain li:first-child::before{content:"•"}
.face .ar{font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic",system-ui,sans-serif;font-size:17px;line-height:1.7;color:var(--muted)}
.enp::before{content:"In English";display:block;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.readrow{display:flex;flex-direction:column;gap:10px}
.readbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:12px;border:1.5px dashed var(--c-ink);font-weight:700;width:100%;color:var(--c-ink)}
.readbtn[aria-pressed="true"]{border-style:solid;background:var(--c-ink);color:var(--on-c)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager a{min-height:64px;border-radius:12px;background:var(--land);border:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;text-decoration:none}
.pager a.nx{text-align:right;align-items:flex-end}
.pager small{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pager b{font-size:15px;line-height:1.3}

/* session stepper */
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stepper span{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.stepper span::before{content:"";height:5px;border-radius:2px;background:var(--line)}
.stepper span.on{color:var(--ink)} .stepper span.on::before{background:var(--c-ink)}
.stepper span.done::before{background:var(--c)}

/* scope chips: a scrollable segmented control with an edge fade hint */
.scopes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent)}
.scopes::-webkit-scrollbar{display:none}
.scopes button{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--land);font-weight:700;font-size:15px;white-space:nowrap}
.scopes button[aria-pressed="true"]{background:var(--ink);color:var(--land);border-color:var(--ink)}
.scopes button:last-child{margin-right:16px}

.meter{display:flex;flex-direction:column;gap:6px}
.meter .bar{height:6px;border-radius:2px;background:var(--line-2);overflow:hidden}
.meter .bar i{display:block;height:100%;width:100%;background:var(--c-ink);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .35s var(--ease)}
.meter p{font-size:14px;color:var(--muted)}

/* flash cards */
.stage{position:relative;touch-action:pan-y}
.fc{position:relative;display:grid;width:100%;min-height:clamp(300px,48vh,440px);text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;will-change:transform}
.face{grid-area:1/1;border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--land);border:1px solid var(--line);transition:opacity .22s var(--ease),filter .22s var(--ease),transform .22s var(--ease)}
.face .term{font-family:var(--display);font-weight:800;font-size:clamp(26px,6.6vw,38px);line-height:1.15;text-wrap:balance;letter-spacing:-.02em}
.face .tr{font-size:20px;line-height:1.45;font-weight:700;text-wrap:pretty}
.face .en{font-size:15.5px;color:var(--muted)}
.face .echo{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.face .hint{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.face.rear{background:var(--c-tint);border-color:var(--c-line)}
.fc .rear{opacity:0;filter:blur(4px);transform:scale(.98)}
.fc.flipped .front{opacity:0;filter:blur(4px);transform:scale(.98)}
.fc.flipped .rear{opacity:1;filter:none;transform:none}
.fc .stamp{position:absolute;top:16px;padding:4px 10px;border-radius:6px;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:0;border:2px solid currentColor;pointer-events:none}
.fc .stamp.l{left:16px;color:var(--bad)} .fc .stamp.r{right:16px;color:var(--good)}
.fc.in-l{animation:inl .26s var(--ease)} .fc.in-r{animation:inr .26s var(--ease)}
@keyframes inl{from{opacity:0;transform:translateX(-18px)}} @keyframes inr{from{opacity:0;transform:translateX(18px)}}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.again{background:var(--bad-soft);color:var(--bad)}
.btn.know{background:var(--good-soft);color:var(--good)}
.kbd{display:none;font-size:13px;color:var(--muted);text-align:center}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}

/* test */
.q{font-size:19px;font-weight:700;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--land);min-height:56px;width:100%;transition:border-color .15s,background-color .15s}
.opt:active{background:var(--land-2)}
.opt .L{flex:0 0 auto;width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .L{background:var(--good);border-color:var(--good);color:var(--land)}

<script>
const COURSE={"code": "ULİ201U", "name": "Uluslararası Politika I", "unitWord": "Ünite", "lede": "Ünite 1–4: uluslararası politika nedir, aktörleri, realizm ve alternatif kuramlar.", "about": "Bu ders devletlerin neden öyle davrandığıyla ilgilidir. Her kuram farklı bir cevap verir. Realizm, patronu olmayan bir dünyada her şeyin <b>güç ve hayatta kalma<\/b> meselesi olduğunu söyler. Liberalizm, <b>işbirliği, kurumlar ve demokrasinin<\/b> bunu yumuşatabileceğini söyler. Marksizm, işin aslının <b>ekonomik sömürü<\/b> olduğunu söyler. İnşacılık, her şeyin devletlerin etkileşimle kurduğu <b>kimliklere<\/b> bağlı olduğunu söyler. Feminizm, bütün alanın dünyaya <b>erkeklerin gözüyle<\/b> baktığını söyler. Her kuramın devletleri neyin yönlendirdiğini düşündüğünü tek cümleyle söyleyebilirsen soruların çoğu kendiliğinden çözülür. Bu senin ana bölüm dersin, iyi anlamaya değer.", "aboutAr": "هذه المادة تسأل: لماذا تتصرف الدول كما تتصرف؟ وكل نظرية تجيب بطريقتها. الواقعية (realizm) تقول إن العالم بلا رئيس، فكل شيء صراع على القوة والبقاء. والليبرالية (liberalizm) تقول إن التعاون والمؤسسات والديمقراطية تخفف هذا الصراع. والماركسية ترى الاستغلال الاقتصادي أصل كل شيء، والبنائية (inşacılık) ترى الهوية تصنع المصلحة، والنسوية ترى أن العلم كله كُتب بعيون الرجال. إذا استطعت أن تقول في جملة واحدة ما الذي يحرك الدول عند كل نظرية، ستُحلّ أغلب الأسئلة وحدها.", "listShort": "Kim?", "listName": "Kim ne dedi?", "listCols": ["Kim / ne", "Ana fikir"], "listIntro": "AÖF sık sık “bunu hangi düşünür veya kuram söyler?” diye sorar. Her isim için tek satır.", "list": [["Thucydides", "Peloponnes Savaşı (Atina–Sparta) analizi; realizmin ilk kaynağı", "Ü1, Ü3"], ["Machiavelli", "Prens; güç, güç dengesi, ittifak, ulusal güvenlik", "Ü3"], ["Hobbes", "Leviathan; “insan insanın kurdudur”; kötümser insan doğası; yöneticinin görevi güvenlik", "Ü1, Ü3"], ["Morgenthau", "Klasik realizm; Politics Among Nations (1948); çıkar = güç", "Ü3"], ["E. H. Carr", "Klasik realist; Yirmi Yıl Krizi 1919–1939 (1939)", "Ü1, Ü3"], ["Spykman, Kennan", "Klasik realistler; Kennan güç dengesini çevreleme politikası olarak yorumladı", "Ü1, Ü3"], ["Kenneth Waltz", "Neorealizm (yapısal realizm); Theory of International Politics (1979)", "Ü3"], ["Stephen Walt", "Savunmacı realizm; tehdit dengesi: devletler gücü değil tehdidi dengeler", "Ü3"], ["John Mearsheimer", "Saldırgan realizm; daha fazla güç = hayatta kalmanın en iyi yolu", "Ü3"], ["Woodrow Wilson", "İdealizm; 14 İlke (8 Ocak 1918); kolektif güvenlik; Milletler Cemiyeti", "Ü1, Ü4"], ["Kant", "Ebedi (Daimi) Barış; idealizmin öncüsü; üç hukuk; devlet kurgusaldır; demokratik barışın kaynağı", "Ü1, Ü4"], ["Doyle, Rummel, Russett", "Demokratik Barış Teorisi", "Ü4"], ["Adam Smith, Grotius, Bentham", "Liberal teorinin öncüleri (Smith ve Ricardo: ekonomi; Bentham: faydacılık)", "Ü4"], ["Lenin", "Emperyalizm: kapitalizmin en son aşaması", "Ü4"], ["Wallerstein", "Dünya Sistemleri Teorisi: merkez, yarı-çevre, çevre", "Ü4"], ["Robert Cox", "Eleştirel teoriyi Uİ’ye taşıdı (1980’ler); Gramsci’nin hegemonya kavramı", "Ü4"], ["Gramsci, Horkheimer, Fromm", "Kitapta Eleştirel Teori (Frankfurt Okulu) öncüleri; Gramsci: rızaya dayalı hegemonya", "Ü4"], ["Alexander Wendt", "Sosyal inşacılık (Marksist değil, realist değil)", "Ü1, Ü4"], ["Singer", "Analiz düzeyi", "Ü1"], ["Nehru, Nasır, Tito, Sukarno", "Bağlantısızlar Hareketi liderleri (Jivkov değil)", "Ü1"], ["1919, Aberystwyth", "İlk Uİ kürsüsü (Galler), Woodrow Wilson adını taşır", "Ü1"], ["4 büyük tartışma", "1930’lar Realizm–İdealizm · 1960’lar Gelenekselcilik–Davranışçılık · 1980’ler Neorealizm–Neoliberalizm · 1990’lar Rasyonalist–Reflektivist", "Ü1"], ["BM üye sayısı", "193", "Ü2"], ["Jean Bodin", "Devlet Üzerine Altı Kitap (1576); egemenliği ilk tanımlayan", "Ü1"], ["Hugo Grotius", "Uluslararası hukukun babası; açık denizlerin serbestliği; haklı savaş; yargı bağışıklığı; pozitif hukuk", "Ü1, Ü4"], ["Metternich", "Avusturya başbakanı; “dengenin baronu”; Avrupa Uyumu’nun sembolü", "Ü1"], ["Bismarck", "Demir Şansölye; Alman birliği (1871); birey-aktör örneği", "Ü1, Ü2"], ["Cavour, Mazzini, Garibaldi", "İtalya’nın birliği (1861; Roma 1870)", "Ü1"], ["Schwarzenberger", "Güç Politikası (1941): hukuk ve ahlak tali kavramlardır", "Ü1"], ["Deutsch, Singer, Rosenau, Kaplan", "Davranışçılığın öncüleri (1960’lar)", "Ü1"], ["Holsti ve Frankel", "Üç analiz düzeyi: birey, devlet, sistem", "Ü1"], ["Rosenau", "Analiz düzeyi: ulusal, bölgesel, küresel; aktörde devlet merkezli – çok merkezli", "Ü1, Ü2"], ["Waltz, Bull, Gilpin", "Neorealizmi 1970’lerde geliştirenler", "Ü1"], ["Tayyar Arı", "Aktör için ek ölçütler: açıkça belirlenmiş olma ve belirli süre var olma", "Ü2"], ["Kissinger", "Mekik diplomasisi; yumuşama; 1973 Nobel Barış Ödülü; realist politika", "Ü2, Ü3"], ["Gandi", "Hindistan’da pasif direniş; birey-aktör", "Ü2"], ["Sun Tzu, Kautilya", "Savaş Sanatı; Arthashastra: güç politikasının eski kaynakları", "Ü3"], ["Locke", "Klasik liberalizm; bireyin özgürlüğü", "Ü4"], ["Stoacılar", "Tüm insanlar tek büyük topluluk (evrensellik); liberalizmin kökü", "Ü4"], ["Marx ve Engels", "Komünist Manifesto: tarih sınıf çatışmasının tarihidir", "Ü4"], ["Prebisch, Dos Santos, Cardoso, Amin, Frank", "Bağımlılık Teorisi’nin öncüleri", "Ü4"], ["Michael Doyle", "Demokratik Barış Teorisi (Rummel, Russett ile)", "Ü4"]], "units": [{"title": "Uluslararası Politikanın Temel Kavramları ve Metodolojisi", "sub": "Tanımlar, tarih, temel kavramlar ve disiplinin gelişimi", "big": "<mark>Uluslararası politika<\/mark>, uluslararası aktörler (en başta devletler) arasındaki <b>politik<\/b> ilişkileri inceleyen, uluslararası ilişkilerin alt disiplinidir.", "bigAr": "السياسة الدولية (uluslararası politika) فرعٌ من العلاقات الدولية يهتم بالجانب السياسي فقط من العلاقات بين الفاعلين، وأهمهم الدول. فالعلاقات الدولية تشمل الرياضة والثقافة والاقتصاد، أما السياسة الدولية فتأخذ منها البعد السياسي (politik boyut) وحده.", "why": "Disiplinin tarihini, her biri dünyadaki olaylarla tetiklenen dört tartışma olarak hatırla. Birinci Dünya Savaşı’ndan sonra insanlar savaşı bitirmek istedi → Wilson idealizmi ve Milletler Cemiyeti. 1930’larda Cemiyet saldırıları (Mançurya 1931, Etiyopya) durduramadı; Carr idealistleri “ütopyacı” diye eleştirdi → <b>realizm–idealizm (1930’lar)<\/b>. Sonra sosyal bilimler fizik gibi “bilimsel” olmak istedi → <b>gelenekselcilik–davranışçılık (1960’lar)<\/b>. 1980’lerde iki kampın yeni sürümleri tartıştı → <b>neorealizm–neoliberalizm<\/b>. 1990’larda bazıları bütün “bilim” modelini reddedip kimliğe ve anlama odaklandı → <b>rasyonalistler–reflektivistler<\/b>.", "whyAr": "تذكّر تاريخ هذا العلم كأربعة نقاشات، كلٌّ منها ولّدته أحداث في العالم. بعد الحرب العالمية الأولى أراد الناس إنهاء الحروب فظهرت المثالية (idealizm)، ثم فشلت عصبة الأمم في الثلاثينيات فانتقدها كار (Carr) فبدأ نقاش الواقعية والمثالية. بعدها أراد الباحثون أن يكون العلم «علميًا» كالفيزياء (davranışçılık)، ثم تجادلت النسخ الجديدة في الثمانينيات، وأخيرًا رفض التأمليون (reflektivist) نموذج العلم الطبيعي كله في التسعينيات.", "sections": [{"h": "Nedir?", "pts": ["Uluslararası ilişkiler sınır ötesi her şeyi kapsar: politika, kültür, spor, yardım, ekonomi, hukuk. <b>Uluslararası politika<\/b> bunun <mark>yalnızca politik boyutunu<\/mark> inceleyen alt disiplindir.", "Amacı: aktörlerin davranışlarını <b>tanımlamak, açıklamak ve öngörmek<\/b>.", "<mark>Analiz düzeyi<\/mark> (Singer): parçalara (bireyler, devletler) mı yoksa bütüne (sistem) mi odaklanılacağını seçmek.", "<ex>Örnek: Türkiye’nin bir maçta başka bir ülkeyle karşılaşması uluslararası ilişkilerin konusudur; ama iki ülkenin o maç yüzünden büyükelçilerini geri çağırması uluslararası politikanın konusudur.<\/ex>"], "chain": ["Uİ sınır ötesi her ilişkiyi kapsar", "Bunların içinden sadece politik olanlar seçilir", "Bu seçilmiş alan = uluslararası politika (alt disiplin)"], "ar": "تخيّل العلاقات الدولية دائرة كبيرة فيها الرياضة والثقافة والتجارة والقانون. السياسة الدولية (uluslararası politika) دائرة أصغر داخلها، تأخذ البعد السياسي فقط. لذلك إذا سُئلت «أي بُعد تدرسه؟» فالجواب دائمًا: السياسي (politik)."}, {"h": "Westphalia, egemenlik ve uluslararası hukuk", "pts": ["Kökleri <b>Thucydides<\/b>’in Peloponnes Savaşı (Atina–Sparta, MÖ 431–404) anlatısına uzanır. Machiavelli, Hobbes, Locke ve Kant da konuya değindi.", "<mark>Westphalia (1648)<\/mark>: <b>Otuz Yıl Savaşları<\/b>’nı bitirdi; Kutsal Roma Germen İmparatorluğu Alman prensliklerinin egemenliğini tanıdı. Ulus devletin <b>miladı<\/b> sayılır; gerçek anlamda “uluslararası” bundan sonra başlar.", "Devletin <b>üç unsuru<\/b>: ülke, egemen iktidar, insan topluluğu.", "<b>Jean Bodin<\/b> (1576, <i>Devlet Üzerine Altı Kitap<\/i>): egemenliği ilk kez tanımladı: kanunla kısıtlanmayan, mutlak ve en üstün iktidar.", "<b>Hugo Grotius<\/b> (Hollandalı hukukçu): uluslararası hukukun en önemli düşünürü. <b>Açık denizlerin serbestliği<\/b>; <b>haklı savaş<\/b> ilkesi (savaş sadece meşru müdafaa, cezalandırma ve mülkiyetin geri kazanılması için hukuki olabilir); diplomatlara <b>yargı bağışıklığı<\/b>.", "Yargı bağışıklığı <b>1815 Viyana Kongresi<\/b> ile uluslararası hukuk normu oldu. Viyana Kongresi <mark>diplomatik usulleri belirleyen ilk kongredir<\/mark>.", "<b>Diplomasi<\/b>: uluslar arası müzakerenin temsilcilerle yürütülmesi ve bunu inceleyen bilim. Katkı verenler: Machiavelli, Guicciardini, Grotius, Richelieu, Wicquefort, Callières, Satow (Kant <b>değil<\/b>)."], "chain": ["Westphalia prenslerin egemenliğini tanıdı", "Egemen devletlerin üstünde otorite kalmadı", "Aralarındaki ilişkileri düzenleyecek kurallar gerekti", "Grotius → uluslararası hukuk; Viyana 1815 → diplomatik usuller"], "ar": "قبل وستفاليا (Westphalia) كانت الإمارات خاضعة للإمبراطورية والكنيسة، وبعدها صار لكل دولة سيادة (egemenlik) لا يعلوها أحد. وحين لا يوجد «رئيس» فوق الدول تحتاج إلى قواعد تنظم علاقاتها، ومن هنا جاء دور غروتيوس (Grotius) في القانون الدولي ودور مؤتمر فيينا في تنظيم الدبلوماسية."}, {"h": "19. yüzyıl: Avrupa Uyumu, milliyetçilik ve yeni devletler", "pts": ["<mark>Avrupa Uyumu<\/mark>: Viyana Kongresi’nden sonra kurulan düzen. Kurucuları Napolyon Savaşları’nın galipleri: <b>İngiltere, Rusya, Avusturya, Prusya<\/b>. İlkeleri: <b>yasallık<\/b> ve uluslar arasında <b>iyi geçinme<\/b>.", "Tehdit: 15. yüzyılda İspanya ve Portekiz’de görülen, <b>1789 Fransız Devrimi<\/b>’yle tüm Avrupa’ya yayılan <b>milliyetçilik<\/b>; çok uluslu imparatorlukları parçalamakla tehdit etti.", "Uyumu bozan olay: <b>Belçika’nın bağımsızlığı (1830)<\/b>. 1830 ve 1848 devrimleri milliyetçi-liberal fikirleri yaydı. “Dengenin baronu” <b>Metternich<\/b> (Avusturya) bunu durduramadı.", "Yeni devletler: Yunanistan (1829), Kolombiya (1819), Bolivya (1821), Meksika (1824).", "Uzakdoğu: Japonya’da Tokugawa Şogunluğu yıkıldı; <b>Meiji<\/b> (1868) ülkeyi modernleştirdi. Japonya 1894’te <b>Çin<\/b>’i yenip Kore’yi aldı, 1904–1905’te Rusya’yı yendi.", "<b>Almanya<\/b>: Zollverein (gümrük birliği, 1819–1836) → Bismarck 1862’de Prusya şansölyesi → <mark>18 Ocak 1871<\/mark> Versailles’da Alman birliği.", "<b>İtalya<\/b>: Kont <b>Cavour<\/b> 1861’de İtalya Krallığı’nı kurdu; 1870’te Roma alındı; Mazzini ve Garibaldi de etkili oldu. İtalya, ulus devletleşmeyi İspanya, Fransa, İngiltere ve Belçika’dan <b>daha geç<\/b> tamamladı.", "I. Dünya Savaşı’nın nedenleri: güç dengesi sisteminin bozulması, imparatorlukların serbest ticarete engel olması ve <b>geç kalmış İtalya ile Almanya’nın sömürge istemesi<\/b>. Kıvılcım: 28 Haziran 1914, Franz Ferdinand suikastı."], "chain": ["Fransız Devrimi milliyetçiliği yaydı", "Çok uluslu imparatorluklar ve Avrupa Uyumu sarsıldı", "Almanya ve İtalya geç birleşti ve sömürge istedi", "Güç dengesi bozuldu → I. Dünya Savaşı"], "ar": "أنشأ المنتصرون على نابليون نظام «الوفاق الأوروبي» (Avrupa Uyumu) ليحلّوا المشكلات دون حرب. لكن القومية (milliyetçilik) التي نشرتها الثورة الفرنسية هزّت الإمبراطوريات، فتوحّدت ألمانيا وإيطاليا متأخرتين وأرادتا مستعمرات، فاختلّ توازن القوى وجاءت الحرب العالمية الأولى."}, {"h": "Hobbes, Kant ve Grotius: üç bakış", "pts": ["<b>Hobbes<\/b> (1588–1679): “<b>İnsan insanın kurdudur<\/b>”. Eseri <i>Leviathan<\/i>. Doğa durumunda insan kötü yaratılışı yüzünden sürekli savaştadır; savaşı ancak güçlü bir devlet önler. Devletler egemenliğinden vazgeçmeyeceği için uluslararası alan daima anarşik kalır → <mark>realizmin öncüsü<\/mark>.", "<b>Kant<\/b> (1724–1804): insan doğası iyidir. Eseri <i>Ebedi Barış<\/i>. Barış güç dengesiyle değil, <b>hukukla<\/b> kurulur. Üç hukuk: <b>anayasal<\/b>, <b>uluslararası<\/b>, <b>kozmopolitan<\/b> (bireyin kendi ve diğer devletlerle ilişkisi) → <mark>idealizmin öncüsü<\/mark>.", "<b>Grotius<\/b>: ne kötümser ne iyimser; <b>akılcı<\/b>. Sistem anarşiktir ama akıl, ortak çıkar ve hukukla savaşçı eğilim aşılabilir. <b>Roma Statüsü<\/b> (17 Temmuz 1998, BM önderliğinde) ile kurulan daimi <b>Uluslararası Ceza Mahkemesi<\/b> onu doğrular niteliktedir.", "Wilson’ın 14 İlkesi, bu tartışmada <b>Kantçı görüşün<\/b> kazandığını gösterdi: I. Dünya Savaşı sonrası düzen idealist ilkelerle kuruldu."], "chain": ["İnsan doğasına bakış farklı", "Hobbes: kötü → güçlü devlet ve güç (realizm)", "Kant: iyi → hukuk ve barış (idealizm)", "Grotius: akıl → anarşi hukukla yumuşar"], "ar": "الفرق كله يبدأ من سؤال: هل الإنسان شرير أم خيّر؟ هوبز (Hobbes) قال «الإنسان ذئب لأخيه الإنسان» فخرجت منه الواقعية. وكانط (Kant) رأى الإنسان خيّرًا فدعا إلى السلام عبر القانون فصار رائد المثالية. أما غروتيوس (Grotius) فتوسّط: الفوضى موجودة لكن العقل والقانون يخففانها."}, {"h": "Wilson ve iki savaş arası dönem", "pts": ["Wilson’ın <mark>14 İlkesi<\/mark> (8 Ocak 1918, ABD Kongresi): serbest ticaret, <b>self-determinasyon<\/b> (kendi kaderini tayin), silahların sınırlandırılması, açık antlaşmalar.", "1919 <b>Paris Barış Konferansı<\/b>’nda evrensel örgüt fikri kabul edildi → <mark>Milletler Cemiyeti<\/mark> (10 Ocak 1920, İsviçre). Amacı barışı korumak ve anlaşmazlıkları barışçı yollarla çözmek.", "Cemiyet savaşı <b>yasaklamadı<\/b> (Grotius’un haklı savaş ilkesine saygı); ihlal eden devlete ticari ve finansal yaptırım öngördü.", "<b>ABD<\/b> Senato onayı çıkmadığı için üye <b>olmadı<\/b>. <b>SSCB<\/b> 1934’e kadar üye olamadı. <b>Türkiye<\/b> başvurusu olmadığı hâlde barışa katkısı için <mark>davetle 1932’de<\/mark> üye oldu.", "Çöküş: 1929 ekonomik krizi; aşırı sağ yönetimler; Japonya’nın Mançurya’yı işgali (1931), İtalya’nın Etiyopya’ya saldırısı. Yaptırımlar kaldırıldı → Kantçı idealizm Hobbesçu realizme yenildi."], "chain": ["I. Dünya Savaşı çok kanlı oldu", "Wilson: liberal ilkeler + evrensel örgüt", "Milletler Cemiyeti kuruldu (1920)", "Büyük güçler dışarıda kaldı, saldırılar durdurulamadı", "İdealizm itibar kaybetti → realizm yükseldi"], "ar": "بعد مجازر الحرب الأولى اقترح الرئيس ولسن مبادئه الأربعة عشر (14 İlke) وأُسّست عصبة الأمم (Milletler Cemiyeti) سنة 1920 لحفظ السلام. لكنها بلا أسنان: أمريكا لم تدخلها، ولم تستطع وقف اليابان وإيطاليا، فخسرت المثالية مصداقيتها."}, {"h": "Disiplinin doğuşu ve klasik realizm", "pts": ["1859: <b>Oxford<\/b>’da uluslararası hukuk ve diplomasi kürsüsü.", "<mark>İlk uluslararası ilişkiler kürsüsü: 1919, Galler-Aberystwyth<\/mark> (İngiltere); Woodrow Wilson’ın adını taşır. Disiplinin doğuşu I. Dünya Savaşı sonu, teorik gelişimi II. Dünya Savaşı sonudur.", "<b>E. H. Carr<\/b>, <i>Yirmi Yıl Krizi<\/i> (1939): Uİ’nin bağımsız disiplin olarak çıkışını müjdeleyen eser. İdealistlere “<b>ütopyacı<\/b>” dedi ve <b>ilk tartışma kuşağını<\/b> başlattı. Savaşın nedeni: <b>güç dağılımındaki eşitsizlik<\/b>; güç gerçeğini görmeyen idealizm <b>revizyonist devletlerin<\/b> çıkarlarıyla çatıştı.", "<b>Revizyonist devletler<\/b>: I. Dünya Savaşı antlaşmalarında kayba uğrayıp sistemi değiştirmek isteyenler: <b>Almanya, Bulgaristan, Japonya, İtalya<\/b>.", "<b>Schwarzenberger<\/b>, <i>Güç Politikası<\/i> (1941): hukuk ve ahlak politikanın tali kavramlarıdır.", "<mark>Morgenthau<\/mark>: realizmin <b>gerçek kurucu babası<\/b>. Kökü insan doğasında; odak noktası <b>güç olarak tanımlanan çıkar<\/b>. Spykman ve Kennan da katkı verdi.", "Klasik realizmin temel kavramları: <b>güç, çıkar, bekâ, anarşi<\/b>. <b>Bekâ<\/b> = devletin varlığını sürdürmesi; en temel saik.", "<b>Yüksek politika<\/b> = askeri güç arayışı; <b>düşük politika<\/b> = ekonomi gibi diğer alanlar (Morgenthau)."], "chain": ["Milletler Cemiyeti başarısız oldu", "Carr idealistleri ütopyacı ilan etti (1939)", "Morgenthau realizmi kuramsallaştırdı", "Güç, çıkar, bekâ, anarşi temel kavram oldu"], "ar": "وُلد علم العلاقات الدولية كتخصص مستقل من صراع الواقعية والمثالية. أول كرسي جامعي أُنشئ في أبيريستويث (Aberystwyth) سنة 1919، ثم جاء كار (Carr) سنة 1939 فسمّى المثاليين «طوباويين»، وبعده بنى مورغنثاو (Morgenthau) الواقعية الكلاسيكية على مفاهيم القوة والمصلحة والبقاء (bekâ) والفوضى."}, {"h": "Dört büyük tartışma ve metodoloji", "diagram": "1930’lar  Klasik Realizm       – İdealizm\n1960’lar  Gelenekselcilik      – Davranışçılık\n1980’ler  Neorealizm           – Neoliberalizm\n1990’lar  Rasyonalist teoriler – Reflektivist teoriler", "pts": ["<mark>Klasik realizm<\/mark>: güç ve çıkar temel kavramlardır (Morgenthau, Carr, Spykman, Kennan). <b>Wendt klasik realist DEĞİLDİR<\/b>.", "<b>İdealizm / neoliberalizm<\/b>: ekonominin rolüne dikkat çeker ve siyasetin barış için çabalaması gerektiğini söyler.", "<mark>Davranışçılık<\/mark> (Deutsch, Singer, Rosenau, Kaplan): realistleri ve idealistleri “gelenekselci” ve bilimsel olmamakla eleştirdi; <b>istatistik, sayısal analiz, bilgisayar<\/b> ve <b>kantitatif<\/b> (ölçülerek elde edilen) veri istedi. Etkisi en çok ABD’de oldu.", "<b>Singer<\/b> (1961), “Uluslararası İlişkilerde Analiz Düzeyi Sorunu”. <b>Holsti ve Frankel<\/b>: birey – devlet – sistem. <b>Rosenau<\/b>: ulusal – bölgesel – küresel.", "<b>Rasyonalizm<\/b>: doğruya dogmalar olmadan akılla ulaşılır. <mark>Reflektivizm<\/mark>: doğa bilimi yöntemlerine karşıdır; kimliğe, sosyolojik faktörlere, algılara ve araştırmacının yorumuna odaklanır.", "Reflektivist (eleştirel) teoriler: <b>Eleştirel teori, Post-yapısalcılık, Sosyal İnşacılık<\/b>. Sosyal gerçeklik onu yorumlayandan bağımsız değildir.", "“Eleştirel teori – post-yapısalcılık” dört tartışmadan biri <b>değildir<\/b>."], "chain": ["Her yeni yaklaşım eskisine itiraz eder", "İtiraz bir tartışma kuşağı doğurur", "Davranışçılar: ölç ve say", "Reflektivistler: ölçemezsin, yorumla"], "ar": "كل نقاش من النقاشات الأربعة هو اعتراض من مدرسة جديدة على مدرسة قديمة. السلوكيون (davranışçılar) أرادوا قياس كل شيء بالأرقام كالعلوم الطبيعية، والتأمليون (reflektivistler) ردّوا بأن الواقع الاجتماعي لا يُفهم إلا بتفسير الهويات والتصورات."}, {"h": "Soğuk Savaş ve sonrası", "pts": ["II. Dünya Savaşı: Mihver (İtalya, Almanya, Japonya) yenildi. 6 Ağustos 1945 Hiroşima, üç gün sonra Nagazaki.", "<mark>Gevşek çift kutuplu sistem<\/mark>: iki süper güç (ABD, SSCB) ve etraflarındaki bloklar; kutuplar içinde hiyerarşi zayıftı ve bazı devletler bağımsız kalabildi.", "<b>Bağlantısızlar Hareketi<\/b>: iki bloka da girmeyenler; liderleri <b>Nehru<\/b> (Hindistan), <b>Nasır<\/b> (Mısır), <b>Tito<\/b> (Yugoslavya), <b>Sukarno<\/b> (Endonezya).", "<b>Neorealizm<\/b> (1970’ler; Waltz, Bull, Gilpin): yapısalcı-sistemci analiz; devletin gerçek amacı güç değil <b>güvenlik<\/b>. Soğuk Savaş’ı en iyi açıklayan teori.", "<mark>Hegemonya<\/mark>: en güçlü devletin bütün sistem üzerinde siyasi hâkimiyet kurma, sürdürme ve koruma arzusu (neorealizmin katkısı).", "SSCB <b>Aralık 1991<\/b>’de dağıldı → Soğuk Savaş ve gevşek iki kutupluluk bitti. ABD en güçlü hegemonik güç; AB ve <b>BRICS<\/b> (Brezilya, Rusya, Hindistan, Çin, Güney Afrika) gibi bölgesel aktörler güçlendi ama yeni bir çift kutupluluk yok."], "chain": ["İki süper güç bloklar kurdu", "Bazı devletler bloklara girmedi (Bağlantısızlar)", "Bu yüzden sistem “gevşek” çift kutuplu", "1991’de SSCB dağıldı → ABD hegemon, bölgesel güçler yükseldi"], "ar": "في الحرب الباردة كان هناك قطبان: أمريكا والاتحاد السوفيتي، لكن النظام «ثنائي قطبي مرن» (gevşek çift kutuplu) لأن دولًا مثل الهند ومصر ويوغسلافيا وإندونيسيا رفضت الانضمام. ولا تُعدّ تركيا ولا كوريا الجنوبية من مجموعة بريكس (BRICS)."}, {"h": "Temel kavramlar", "pts": ["<mark>Egemenlik<\/mark>: devletin ülkesi üzerinde siyasi yönetim yetkisini kullanma hakkı. <b>İç egemenlik<\/b>: ülke içinde kuvvet kullanmaya yetkili tek birim olmak. <b>Dış egemenlik<\/b>: devletin uluslararası sistemdeki bağımsızlığı.", "<mark>Ulus devlet<\/mark>: sınırları belirli bir ülkede yerleşik insan topluluğunun egemen bir iktidarca yönetildiği siyasi kurum.", "<b>Uluslararası hukuk<\/b>: kamu hukukunun bir alt dalı; aktörler arasındaki hukuki ilişkileri inceler.", "<b>Anarşi<\/b>: devletin üzerinde emredici bir üst otoritenin olmaması. Egemen devletler “uluslararası doğa hâlinde”dir.", "<b>Self-determinasyon<\/b>: ulusların kendi kaderini tayin hakkı (sömürgeler ve ayrılma hakkı olan federe devletler).", "<ex>Örnek: Türkiye’de sadece devletin polisi ve ordusu meşru olarak silah kullanabilir (iç egemenlik); Türkiye kendi dış politikasını başka bir ülkeye sormadan belirler (dış egemenlik).<\/ex>"], "chain": ["Devlet ülkesinde tek meşru güçtür (iç egemenlik)", "Dışarıda kimseye bağlı değildir (dış egemenlik)", "Hiçbir devlet diğerinin üstünde değildir", "Sonuç: sistem anarşiktir"], "ar": "السيادة (egemenlik) لها وجهان: داخلي يعني أن الدولة وحدها تملك استعمال القوة داخل أرضها، وخارجي يعني استقلالها عن أي دولة أخرى. وبما أن كل دولة ذات سيادة، فلا توجد سلطة فوقها، وهذا هو معنى الفوضى (anarşi) في هذا العلم."}], "tip": "Dört tartışma, yaklaşık her 20–30 yılda bir: <b>R-İ, G-D, NR-NL, Ras-Ref<\/b>. Her birini “eski – yeni” olarak oku. Tarih çapaları: <b>1648<\/b> Westphalia, <b>1815<\/b> Viyana, <b>1871<\/b> Almanya, <b>1918<\/b> 14 İlke, <b>1919<\/b> ilk kürsü, <b>1920<\/b> Milletler Cemiyeti, <b>1932<\/b> Türkiye MC’de, <b>1939<\/b> Carr.", "tipAr": "احفظ النقاشات الأربعة بترتيبها الزمني: واقعية–مثالية، تقليدية–سلوكية، واقعية جديدة–ليبرالية جديدة، عقلانية–تأملية. واربط كل تاريخ بحدث: 1648 وستفاليا (Westphalia)، 1815 مؤتمر فيينا، 1920 عصبة الأمم (Milletler Cemiyeti)، 1932 انضمام تركيا إليها.", "trap": "Uluslararası politika Uİ’nin tamamını değil, <b>politik<\/b> boyutunu inceler. Diplomasi düşünürleri arasında Kant <b>yoktur<\/b>. Bağlantısızların liderleri arasında Jivkov (Bulgaristan’ın komünist lideri) <b>yoktur<\/b>. Soğuk Savaş <b>gevşek<\/b> çift kutupluydu. Türkiye Milletler Cemiyeti’ne <b>başvurmadan, davetle<\/b> girdi. “Eleştirel teori – post-yapısalcılık” dört tartışmadan biri değildir.", "trapAr": "انتبه: كانط (Kant) ليس من مفكري الدبلوماسية بل رائد المثالية. والحرب الباردة كانت ثنائية قطبية «مرنة» (gevşek) لأن دول عدم الانحياز بقيت خارج المعسكرين. وتركيا دخلت عصبة الأمم بدعوة خاصة سنة 1932 دون أن تتقدم بطلب.", "terms": [["Uluslararası politika", "Devletler arasındaki ilişkilerin sadece siyasi kısmını inceleyen bilim dalı", "السياسة الدولية: الجانب السياسي من العلاقات الدولية"], ["Uluslararası ilişkiler", "Sınır ötesi tüm ilişkiler: siyaset, ekonomi, kültür, spor", "العلاقات الدولية: كل التفاعلات العابرة للحدود"], ["Alt disiplin", "Büyük bir bilim dalının içindeki daha dar alan", "فرع علمي: تخصص أضيق داخل علم أكبر"], ["Analiz düzeyi", "Olaya hangi seviyeden bakılacağı: birey, devlet ya da sistem", "مستوى التحليل: الفرد أو الدولة أو النظام"], ["Egemenlik", "Devletin kendi ülkesini kimseye sormadan yönetme hakkı", "السيادة: حق الدولة في حكم أرضها"], ["İç egemenlik", "Ülke içinde güç kullanma yetkisinin sadece devlette olması", "السيادة الداخلية: احتكار الدولة للقوة في الداخل"], ["Dış egemenlik", "Devletin dünyada bağımsız olması", "السيادة الخارجية: الاستقلال تجاه الدول الأخرى"], ["Ulus devlet", "Belli toprakta yaşayan halkın egemen bir yönetimle oluşturduğu devlet", "الدولة القومية: أرض وشعب وسلطة ذات سيادة"], ["Uluslararası hukuk", "Devletler arasındaki ilişkileri düzenleyen kurallar; kamu hukukunun dalı", "القانون الدولي: قواعد العلاقات بين الدول"], ["Westphalia Antlaşması", "1648; Otuz Yıl Savaşlarını bitiren, ulus devletin başladığı antlaşma", "صلح وستفاليا 1648: بداية الدولة القومية"], ["Haklı savaş", "Grotius: savaş sadece meşru müdafaa, ceza ve mal geri almak için hukukidir", "الحرب العادلة: حرب مشروعة لأسباب محددة"], ["Yargı bağışıklığı", "Diplomatların bulundukları ülkenin mahkemelerinde yargılanmaması", "الحصانة القضائية للدبلوماسيين"], ["Diplomasi", "Devletlerin temsilciler aracılığıyla görüşmesi ve bunu inceleyen bilim", "الدبلوماسية: التفاوض عبر الممثلين"], ["Avrupa Uyumu", "Napolyon sonrası büyük güçlerin sorunları savaşsız çözme düzeni", "الوفاق الأوروبي: نظام ما بعد نابليون"], ["Güç dengesi sistemi", "Güçlerin yaklaşık eşit olduğu, savaş riskinin azaldığı düzen", "نظام توازن القوى"], ["Self-determinasyon", "Bir halkın kendi geleceğine kendisinin karar vermesi", "حق تقرير المصير"], ["Revizyonist devlet", "Savaş sonrası düzeni değiştirmek isteyen, kayba uğramış devlet", "الدولة التعديلية: تريد تغيير الوضع القائم"], ["Bekâ", "Devletin varlığını ve yaşamını sürdürmesi", "البقاء: استمرار وجود الدولة"], ["Yüksek politika", "Askeri güç ve güvenlik konuları", "السياسة العليا: الأمن والقوة العسكرية"], ["Anarşi", "Devletlerin üstünde emir veren bir otoritenin olmaması (kaos değil)", "الفوضى: غياب سلطة عليا فوق الدول"], ["Davranışçılık", "Sosyal bilimde doğa bilimleri gibi ölçme ve sayıyla çalışma", "السلوكية: تطبيق مناهج العلوم الطبيعية"], ["Kantitatif", "Ölçerek elde edilen, sayısal", "كمّي: قائم على القياس والأرقام"], ["Rasyonalizm", "Doğruya dogmasız, akılla ulaşılacağını savunan görüş", "العقلانية: الوصول إلى الحقيقة بالعقل"], ["Reflektivizm", "Doğa bilimi yöntemine karşı çıkıp yoruma ve kimliğe önem veren yaklaşım", "التأملية: رفض المنهج الطبيعي والتركيز على التفسير"], ["Gevşek çift kutuplu sistem", "İki büyük güç var ama bazı devletler bloklara girmeden kalabiliyor", "ثنائية قطبية مرنة: قطبان مع دول خارجهما"], ["Bağlantısızlar Hareketi", "Soğuk Savaşta iki bloka da katılmayan ülkeler", "حركة عدم الانحياز"], ["Hegemonya", "En güçlü devletin tüm sisteme hâkim olma isteği", "الهيمنة: سيطرة الدولة الأقوى على النظام"], ["BRICS", "Brezilya, Rusya, Hindistan, Çin, Güney Afrika", "بريكس: خمس قوى صاعدة"]]}, {"title": "Uluslararası Politikadaki Aktörler", "sub": "Kimler aktör sayılır: devletler, örgütler, şirketler, hareketler, bireyler", "big": "<mark>Aktör<\/mark>, <b>özerk<\/b> hareket edebilen ve diğer aktörleri <b>etkileyebilen<\/b> birimdir. Asıl aktör <mark>devlettir<\/mark>, ama devlet dışı aktörler de önemlidir.", "bigAr": "الفاعل (aktör) في السياسة الدولية هو كل وحدة تستطيع أن تتصرف باستقلال (özerk) وأن تغيّر سلوك الآخرين. الدولة هي الفاعل الرئيسي، لكن المنظمات والشركات والحركات والأفراد قد يكونون فاعلين أيضًا.", "why": "Her şeyi iki test belirler: <b>(1) başka bir aktörün iznine gerek kalmadan kendi başına hareket edebiliyor mu<\/b>, <b>(2) başkalarının yaptığını değiştirebiliyor mu?<\/b> Bir hükümeti bir kanunu değiştirmeye zorlayan çokuluslu şirket iki testi de geçer. Zayıf, çökmüş ve devlet benzeri yapılar devletliğin hangi parçasının eksik olduğuna göre ayrılır: güç (zayıf), ülke içinde egemenliği kullanabilme (çökmüş) veya tanınma ve BM üyeliği (devlet benzeri).", "whyAr": "اختباران يحسمان كل شيء: هل يتصرف دون إذن أحد؟ وهل يغيّر ما يفعله الآخرون؟ ثم إن الدول الضعيفة تُميَّز بحسب ما ينقصها: الضعيفة (zayıf) تنقصها القوة، والمنهارة (çökmüş) لا تستطيع ممارسة سيادتها داخل أرضها، وشبه الدولة (devlet benzeri) ينقصها الاعتراف وعضوية الأمم المتحدة.", "sections": [{"h": "Aktörü aktör yapan nedir?", "pts": ["İki temel ölçüt: <mark>özerk eylem yapabilme<\/mark> (başkalarının izni olmadan kendi çıkarına göre hareket etmek) ve <mark>diğer aktörlerin davranışını değiştirebilme<\/mark>.", "<b>Tayyar Arı<\/b> iki ölçüt daha ekler: varlığının <b>açıkça belirlenmiş<\/b> olması ve <b>belirli bir süre<\/b> var olması. “Dış güçler” gibi belirsiz ifadeler bu yüzden anlamsızdır.", "<b>Realizm ve İdealizm<\/b> (geleneksel teoriler) devleti <b>yegâne aktör<\/b> ve yegâne analiz birimi sayar. Klasik realizm devleti tek gerçek aktör görür.", "Diğer teoriler: <b>Karşılıklı Bağımlılık<\/b> (1970’ler) çokuluslu şirketleri en az devletler kadar önemli sayar; <b>Liberal Kurumsalcılık<\/b> uluslararası örgütleri (BM) öne çıkarır; <b>Reflektivistler<\/b> bireyin öznel yorumlarını vurgular.", "<b>Rosenau<\/b>: aktör sorununda iki bakış vardır: <b>devlet merkezli<\/b> ve <b>çok merkezli<\/b>.", "Bazı devlet dışı aktörler (BM, NATO, AB, OPEC) birçok devletten daha özerk ve etkilidir; OPEC’in etkisi Liberya veya Togo’nunkinden fazladır.", "Aktörler: <b>devletler<\/b> ve <b>devlet dışı aktörler<\/b> (uluslararası örgütler, çokuluslu şirketler, baskı grupları, ulusal kurtuluş hareketleri, terör örgütleri, bireyler)."], "chain": ["Bir birim kendi başına karar verebiliyor (özerk)", "Bu kararlar başkalarının davranışını değiştiriyor (etki)", "Varlığı belli ve kalıcı", "→ Uluslararası aktördür"], "ar": "الفاعل الدولي يشبه لاعبًا في مباراة: لا يكفي أن يكون في الملعب، بل يجب أن يتحرك بقراره (özerk) وأن تؤثر حركته في اللاعبين الآخرين. لهذا قد تكون منظمة أوبك (OPEC) فاعلًا أقوى من بعض الدول الصغيرة."}, {"h": "Devlet ve üç temel ilkesi", "pts": ["Tanım: sınırları belirlenmiş bir ülkede yerleşik bir insan topluluğunun, egemenlik yetkisine sahip bir iktidarca yönetildiği siyasi kurum.", "<b>BM Şartı<\/b> (yürürlük <b>24 Ekim 1945<\/b>) sistemin <b>en üst hukuki normudur<\/b>. Md. 2/1: egemen eşitlik; Md. 2/4: toprak bütünlüğüne karşı kuvvet kullanmama.", "Modern devletin <mark>üç temel ilkesi: egemenlik, eşitlik, ülke bütünlüğü<\/mark>.", "<b>Eşitlik<\/b> = uluslararası hukuktaki hak ve sorumluluklarda eşitlik; güç eşitliği değil. Örnek: Güvenlik Konseyi’nin 5 daimi üyesi (ABD, SSCB/Rusya, Çin, Fransa, İngiltere) <b>veto<\/b> hakkına sahiptir.", "<b>Ülke bütünlüğü<\/b> egemenliğin doğal sonucudur. Uluslararası hukuk koruması <mark>BM vasıtasıyla<\/mark> uygulanır; devletler ayrıca güç unsurlarını artırarak korur.", "Gerilim: BM Şartı md. 1/2 <b>self-determinasyonu<\/b> da korur. Soğuk Savaş’a kadar sadece sömürgeler için uygulandı; sonra federe birimlere de uygulandı. <b>Kosova<\/b> Sırbistan’dan ayrıldı; UAD 22 Temmuz 2010’da tanınmasının hukuka aykırı olmadığına karar verdi.", "<b>UAD’nin 16.10.1975 danışma görüşü<\/b>: devlet için asgari bir siyasi ve sosyal örgütlenme gerekir. Devletin unsurları: <b>ülke, ulus, kendi üzerinde otorite tanımayan hükümet<\/b>.", "<mark>Tanıma kurucu değil, teyit edicidir<\/mark>. Sadece Türkiye’nin tanıdığı KKTC ya da BM üyesi olmayan Kosova da devlettir."], "chain": ["Devletler egemendir", "Egemenlerin hukuken eşit olması gerekir", "Egemen devletin toprağına dokunulamaz (ülke bütünlüğü)", "Ama self-determinasyon ayrılmaya izin verebilir → gerilim"], "ar": "الدولة الحديثة تقوم على ثلاث ركائز: السيادة والمساواة ووحدة الأراضي. المساواة قانونية فقط، فالدول الخمس الدائمة في مجلس الأمن تملك حق النقض (veto). ووحدة الأراضي تتعارض أحيانًا مع حق تقرير المصير، كما في حالة كوسوفو."}, {"h": "Devlet, millet, milliyetçilik", "pts": ["Modern devletin doğuşu genellikle <b>1648 Westphalia<\/b>’ya bağlanır. 16. yüzyıldan sonra <b>state, etat, stato<\/b> sözcükleri kullanılmaya başladı; feodalite ve kilisenin gücü zayıfladı.", "<mark>Millet<\/mark>: aynı ülkede yaşayan, ortak gelenek, özlem ve çıkarları olan, grubunu sürdürme sorumluluğu taşıyan insan grubu. Halk ve etnik gruptan farkı <b>modern<\/b> olması ve bir <b>devlete sahip olma<\/b> isteğidir.", "<mark>Milliyetçilik<\/mark>: bir milletin devletinin bekâsına yönelik tutumu ya da devlete sahip olma iradesini oluşturan bilinç; <b>ulus devletin kurucu ideolojisi<\/b>.", "İlkel biçimleri İspanya ve Portekiz’de; 1789 Fransız Devrimi’nin sloganı “Fransa Fransızlarındır”. Türkiye, Hindistan ve Rusya’da ise <b>önce devlet kuruldu, sonra modern millet yaratıldı<\/b>.", "Dalgalar: <b>19. yüzyıl<\/b> Avrupa; <b>I. Dünya Savaşı sonrası<\/b> (Wilson ilkeleri) çok uluslu imparatorlukların dağılması; <b>II. Dünya Savaşı sonrası<\/b> <mark>dekolonizasyon<\/mark>; <b>1990’lar<\/b> SSCB ve Yugoslavya’nın dağılması.", "ABD yönetimindeki <b>Pasifik Adaları 1994<\/b> halk oylamasıyla bağımsız oldu → dünyada koloni yönetimi kalmadı.", "En genç devlet: <b>Güney Sudan<\/b> (9 Temmuz 2011). Bugün <b>193<\/b> BM üyesi var."], "chain": ["Bir halk ortak bir kimlik hisseder (millet)", "Kendi devletine sahip olmak ister (milliyetçilik)", "İmparatorluklar ve sömürge yönetimleri çözülür", "Yeni ulus devletler doğar → BM üye sayısı 193"], "ar": "الأمة (millet) جماعة حديثة تريد أن تكون لها دولة، والقومية (milliyetçilik) هي الوعي بهذه الرغبة، لذلك تُسمّى الأيديولوجيا المؤسِّسة للدولة القومية. وقد جاءت موجاتها بعد الثورة الفرنسية، ثم بعد الحربين العالميتين بإنهاء الاستعمار (dekolonizasyon)، ثم بعد تفكك الاتحاد السوفيتي."}, {"h": "Zayıf, çökmüş ve devlet benzeri", "pts": ["<mark>Zayıf devlet<\/mark>: hukuken eşit ama güç unsurlarında dezavantajlı (küçük ekonomi, düşük askeri kapasite, az nüfus, küçük ülke). Örnek: <b>Marshall Adaları<\/b>, <b>Mikronezya<\/b>. BM üyesidirler.", "<mark>Çökmüş devlet<\/mark>: <b>kendi ülkesinde egemenlik yetkisini kullanamayan<\/b> devlet. Suç ve yolsuzluk yüksek, vatandaş devlete güvenmiyor, can ve mal endişesi var, ekonomi devlet denetimi dışında, sınır güvenliği yok. Nedenleri: savaş, işgal, etnik/dini çatışma, doğal afet.", "Fund for Peace’e göre 2011’de <b>20<\/b> çökmüş devlet: 14’ü Afrika’da (Somali, Sudan, Çad…), 5’i Asya’da (Afganistan, Irak, Pakistan, Yemen, Myanmar), 1’i Amerika’da (Haiti).", "<mark>Devlet benzeri<\/mark> (quasi state): ülke, millet ve hükümet kriterlerini karşılayıp bağımsızlık ilan etmiş ama <b>genel olarak tanınmamış ve BM’ye üye olamamış<\/b> devletler. Diğer adları: tanınmamış devlet, de facto devlet, para-devlet, pseudo-devlet.", "Tanınma derecesi değişir: tek devletçe tanınan (<b>KKTC<\/b>, Türkiye), çok devletçe tanınan ama BM üyesi olmayan (<b>Kosova<\/b>), hiç tanınmayan (<b>Güney Osetya<\/b>, sözde Karabağ). Diğer örnekler: Tayvan, Irak Kürt Federe Yönetimi, Batı Sahara, Filistin.", "Bazen örgütlerde temsil edilirler: KKTC İslam İşbirliği Teşkilatı’nda <b>gözlemci<\/b>; Filistin <b>UNESCO<\/b> üyesi.", "<ex>Örnek: Lüksemburg çok küçüktür ama polisi, mahkemeleri ve ekonomisi işler; zayıf olabilir ama çökmüş değildir. Çökmüş devlette ise market alışverişinde bile can güvenliği yoktur.<\/ex>"], "chain": ["Devlet olmanın parçaları: güç, iç düzen, tanınma", "Güç eksik → zayıf devlet", "İç egemenlik eksik → çökmüş devlet", "Tanınma ve BM üyeliği eksik → devlet benzeri"], "ar": "ثلاثة أنواع من الدول «غير الفعالة»: الضعيفة (zayıf) عضو في الأمم المتحدة لكنها صغيرة القوة، والمنهارة (çökmüş) لا تسيطر على أرضها فينتشر الجريمة والفساد، وشبه الدولة (devlet benzeri) تملك أرضًا وشعبًا وحكومة لكن العالم لا يعترف بها عمومًا ولا تدخل الأمم المتحدة."}, {"h": "Uluslararası örgütler: tanım ve sınıflama", "pts": ["Tanım: birden çok devletin ya da farklı devletlerdeki birey, sivil toplum örgütü veya devlet dışı birimlerin oluşturduğu, <b>ticari amaç taşımayan<\/b> kurumlar.", "İlk uluslararası örgüt: 1815 Viyana Kongresi’nden doğan, Ren Nehri ulaşımını düzenleyen <mark>Uluslararası Akarsular Komisyonu<\/mark>. Sayıları II. Dünya Savaşı’ndan sonra belirgin arttı.", "Genel özellikleri: bir <b>anlaşma<\/b> ile kurulur; kurucu belgede belirlenmiş <b>amaçları<\/b> vardır; <b>ilkeler<\/b> benimser; her durumda olmasa da üyelerini <b>egemen ve eşit<\/b> sayar; <b>organlar<\/b> oluşturur; <b>kaynak<\/b> temin eder; genelde bir <b>merkezi<\/b> vardır. Savaş ilan etme ya da barış imzalama yetkileri <b>yoktur<\/b>.", "<b>Coğrafi kriter<\/b>: bölgesel (NAFTA, ASEAN) – küresel (BM, ILO).", "<b>Fonksiyon kriteri<\/b>: askeri (NATO), ekonomik (EFTA, APEC), çevre (Greenpeace), insan hakları (Af Örgütü), basın özgürlüğü (Sınır Tanımayan Gazeteciler), insani yardım (Kızılay, Kızılhaç), gıda-tarım (FAO).", "<b>Üyeye göre<\/b>: <mark>hükümetlerarası<\/mark> (üyeleri devletler) – <mark>hükümetler-dışı<\/mark> (üyeleri farklı ülkelerdeki gruplar)."], "chain": ["Devletler tek başına ulaşamadıkları amaçlar için birleşir", "Bir anlaşmayla örgüt kurarlar", "Örgüt yer, işlev ve üyelere göre sınıflanır"], "ar": "المنظمة الدولية مؤسسة غير ربحية تُنشأ باتفاقية ولها أهداف وأجهزة ومقر. تُصنَّف حسب الجغرافيا (إقليمية أو عالمية)، وحسب الوظيفة (عسكرية، اقتصادية، بيئية...)، وحسب الأعضاء: حكومية (hükümetlerarası) أو غير حكومية (hükümetler-dışı). وأول منظمة دولية هي لجنة الأنهار الدولية لنهر الراين سنة 1815."}, {"h": "Hükümetlerarası örgütler ve BM", "pts": ["Devletlerin kurduğu ama kurulunca <b>ayrı irade ve tüzel kişiliğe<\/b> sahip olan yapılar. Genel ilke: kararlar <b>oybirliği<\/b> ile alınır (egemenlik gereği); en önemli istisna <b>AB<\/b>’dir.", "Örnekler: Avrupa Uyumu, Milletler Cemiyeti, BM. <b>BM<\/b>: 24 Ekim 1945; 51 kurucu, bugün <b>193<\/b> üye.", "<mark>BM’nin 6 ana organı<\/mark>: Genel Kurul, Güvenlik Konseyi, Ekonomik ve Sosyal Konsey, Genel Sekreterlik, <b>Uluslararası Adalet Divanı<\/b>, <b>Vesayet Konseyi<\/b>.", "Yardımcı organlar: <b>alt organlar<\/b> (Uluslararası Hukuk Komisyonu, İnsan Hakları Komisyonu); <b>teknik yardımcı<\/b> (BM Yönetim Mahkemesi); <b>özel yardımcı<\/b> (<b>UNICEF<\/b>, BM Sığınmacılar Yüksek Komiserliği).", "Neden üye olunur: daha geniş güvenlik sistemi, ortak tehditten korunma, yeni pazarlar, ortak değerler. NATO ve Varşova Paktı = güvenlik; Dünya Ticaret Örgütü = pazar.", "<b>Ekonomik bütünleşme<\/b> örgütleri: APEC, CACM (Orta Amerika Ortak Pazarı), GCC (Körfez İşbirliği Konseyi), SADC, CAREC.", "<b>Ortak değer<\/b> örgütleri: <b>İslam İşbirliği Teşkilatı<\/b> (25 Eylül 1969; 2011’de bu adı aldı; 57 üye), <b>Avrupa Konseyi<\/b> (<mark>1949<\/mark>; barış, insan hakları, demokrasi; 47 üye), Roma Statüsü ile kurulan Uluslararası Ceza Mahkemesi."], "chain": ["Devletler egemenliklerini korumak ister", "Bu yüzden örgütlerde kararlar genelde oybirliğiyle alınır", "AB bazı kararları uluslarüstü alır → istisna"], "ar": "المنظمات الحكومية تتخذ قراراتها عادة بالإجماع، لأن فرض قرار على دولة رافضة يمسّ سيادتها، والاتحاد الأوروبي هو الاستثناء الأهم. وللأمم المتحدة ستة أجهزة رئيسية، أما يونيسف (UNICEF) فهي جهاز فرعي خاص وليست جهازًا رئيسيًا."}, {"h": "Avrupa Birliği: sui generis yapı", "pts": ["AB hem hükümetlerarası hem de bazı kararlarını <b>uluslarüstü<\/b> alan <mark>sui generis<\/mark> (kendine özgü) bir yapıdır.", "<b>1951<\/b>: Avrupa Kömür ve Çelik Topluluğu (AKÇT); kurucu altı devlet: Almanya, Fransa, İtalya, Belçika, Hollanda, Lüksemburg.", "<b>1957 Roma Anlaşması<\/b>: EURATOM ve Avrupa Ekonomik Topluluğu (AET).", "<mark>1965 Füzyon Anlaşması<\/mark>: üç topluluk tek Komisyon, Konsey ve Parlamento altında birleşti → Avrupa Toplulukları.", "<b>1992 Maastricht<\/b>: “Birlik” adı ve üç sütun: Avrupa Topluluğu (uluslarüstü), Ortak Dışişleri ve Güvenlik Politikası ile Adalet ve İçişleri (hükümetlerarası). <b>Lizbon<\/b> (1 Aralık 2009) uluslarüstü alanları genişletti.", "AB organları (kitaba göre): Avrupa Konseyi, AB Bakanlar Konseyi, Avrupa Komisyonu, Avrupa Parlamentosu, AB Adalet Divanı, Sayıştay, Ekonomik ve Sosyal Komite, Avrupa Merkez Bankası, Avrupa Yatırım Bankası, Ombudsman."], "chain": ["Kömür ve çelik ortak yönetildi (1951)", "Başarı yeni topluluklar doğurdu (1957)", "Topluluklar birleşti (1965) ve Birlik oldu (1992)", "Bazı kararlar devletlerin üstünde alınır → sui generis"], "ar": "الاتحاد الأوروبي فريد من نوعه (sui generis) لأنه يجمع بين التعاون الحكومي والقرار فوق الوطني (uluslarüstü). بدأ بجماعة الفحم والصلب سنة 1951، ثم معاهدة روما 1957، ثم اتفاقية الدمج (Füzyon) 1965، ثم ماستريخت 1992."}, {"h": "Hükümetler-dışı örgütler", "pts": ["Üyeleri devlet değil, farklı ülkelerdeki gruplardır; bağlı oldukları devleti değil <b>üyelerinin çıkarını<\/b> temsil ederler. Kâr amacı gütmezler, kaynaklarını kendileri yaratırlar.", "Uluslararası ölçekte faaliyet gösteren sivil toplum örgütleri gibidirler; <b>şiddeti yöntem olarak kabul etmezler<\/b>. Bir genel merkezleri ve o ülkenin hukukuna uygun kuruluş belgeleri olmalıdır.", "İlk örnek: <mark>Dünya Olimpiyat Komitesi<\/mark> (1894; 1896’dan beri olimpiyatlar).", "<b>Uluslararası Af Örgütü<\/b>: 1961’de kuruldu; <b>1977 Nobel Barış Ödülü<\/b>.", "Diğerleri: Dünya Sendikalar Federasyonu, Sınır Aşan Doktorlar, Kızılhaç, Lions Kulüpleri. BM ve Avrupa Konseyi tarafından kayıt altına alınırlar.", "Bosna’da insani müdahale için kamuoyu yaratan en önemli aktörler hükümetler-dışı örgütlerdi.", "<ex>Örnek: Kızılay’a sen de gönüllü olarak üye olabilirsin; NATO’ya ise sadece devletler üye olur. Fark hükümetler-dışı ile hükümetlerarası arasındaki farktır.<\/ex>"], "chain": ["Aynı amaca sahip gruplar sınır ötesinde birleşir", "Devlete değil üyelerine bağlıdırlar", "Hükümetlere baskı ve farkındalık yaratırlar"], "ar": "المنظمات غير الحكومية (hükümetler-dışı) أعضاؤها أفراد وجماعات لا دول، ولا تستخدم العنف. أول مثال لها اللجنة الأولمبية الدولية سنة 1894، ومنظمة العفو الدولية تأسست 1961 ونالت جائزة نوبل للسلام 1977."}, {"h": "Çokuluslu şirketler", "pts": ["<b>Karşılıklı Bağımlılık<\/b>, <b>Marksist<\/b> ve <b>Eleştirel<\/b> teori çokuluslu şirketleri en önemli analiz birimi sayar.", "<b>Lenin<\/b> (1917, <i>Emperyalizm: Kapitalizmin En Yüksek Aşaması<\/i>): şirketler sermayenin küresel tekelleşmesinin aracıdır (olumsuz bakış).", "<b>Kant<\/b> ve Wilson ilkeleri ticaret ile barış arasında bağ kurar → liberaller şirketlerin barışa hizmetini vurgular (olumlu bakış).", "<mark>Uluslararası nitelikte<\/mark> çokuluslu şirket: <b>ortakları doğrudan devletler<\/b>dir; örnek 1933 İngiltere–İran anlaşmasıyla kurulan <b>Anglo-Iranian Oil Company<\/b>.", "<mark>Uluslaraşırı<\/mark> çokuluslu şirket: bir merkeze bağlı, ortakları farklı devletlerin vatandaşları, birçok ülkede faaliyet gösterir (General Motors, Shell, Unilever, Microsoft, Boeing).", "Etkileri: yasaları değiştirmek için baskı, hatta rejim değişikliği (Şili’de Allende, 1970; ITT destekli darbe). Liberallere göre katkıları: yabancı sermaye, <b>teknoloji transferi<\/b>, istihdam, vergi."], "chain": ["Şirketlerin ekonomik gücü bazı devletlerden büyüktür", "Bu güç hükümetler üzerinde baskıya dönüşür", "Marksistler sömürü, liberaller kalkınma görür", "Her iki görüşte de şirket önemli bir aktördür"], "ar": "الشركات متعددة الجنسيات نوعان: دولية (uluslararası) شركاؤها حكومات مثل شركة النفط الأنجلو-إيرانية، وعابرة للقوميات (uluslaraşırı) يملكها أفراد من دول كثيرة. الماركسيون يرونها أداة استغلال، والليبراليون يرونها مصدر استثمار وتقنية وفرص عمل."}, {"h": "Baskı grupları ve lobiler", "pts": ["<mark>Baskı grubu<\/mark>: belirli bir düşünce ya da çıkar etrafında toplanıp sadece o amaç için hükümete baskı yapan topluluk. Güçleri üye sayısından veya ekonomik güçten gelir.", "Aktörlük bakımından <b>ikincil düzeydedir<\/b>: uluslararası politikayı doğrudan değil, hükümetlerin politikaları üzerinden etkilerler.", "Örnekler: işçi sendikaları, ticari dernekler, meslek grupları, etnik ve kadın örgütleri, dini gruplar, <b>lobiler<\/b>.", "<mark>Lobi<\/mark>: parlamento üyelerini kanun koyma sürecinde kendi çıkarları doğrultusunda etkilemek için örgütlenmiş grup.", "Yöntemler: politikacılarla görüşme, imza kampanyası, sosyal medya, basın açıklaması, gösteri, grev, boykot, medya kuruluşu satın alma."], "chain": ["Bir grubun ortak çıkarı var", "Oy, grev veya para ile hükümete baskı yapar", "Hükümet politikasını değiştirir", "Uluslararası politika dolaylı olarak etkilenir"], "ar": "جماعة الضغط (baskı grubu) لا تحكم ولا تدخل البرلمان، لكنها تضغط على الحكومة بالأصوات أو الإضرابات أو المال. واللوبي (lobi) نوع منها يركّز على التأثير في النواب أثناء صياغة القوانين، ولذلك تأثيرها في السياسة الدولية غير مباشر."}, {"h": "Ulusal kurtuluş hareketleri ve terör örgütleri", "pts": ["<mark>Ulusal kurtuluş hareketi<\/mark> statüsü <b>BM Genel Kurulu<\/b>’nda tanınmış, hukuki nitelik kazanmıştır. Amaç: <b>meşru müdafaa<\/b> veya <b>kendi kaderini tayin<\/b>.", "İki tür: (1) <b>savaş/işgal<\/b> sırasında yasal hükümet direnemeyince kurulanlar: Fransız direnişi, Yugoslav Partizanları, Çekoslovak Ulusal Komitesi, <b>Kuvva-i Milliye<\/b>, Afgan Mücahitleri; (2) <b>sömürgeciliğe<\/b> karşı kurulanlar: Cezayir Kurtuluş Ordusu, Mozambik Kurtuluş Örgütü, <b>Hindistan Ulusal Kongresi<\/b>, Afrika Milli Kongresi (apartheid’e karşı).", "<b>UÇK<\/b> (Kosova Kurtuluş Ordusu) neredeyse herkesçe meşru sayılsa da bazı eylemleri terör kapsamında değerlendirilmiştir.", "<b>FKÖ<\/b> farklıdır: ne savaş ne sömürge mücadelesiyle kuruldu. 1947’de <b>BM Genel Kurulu<\/b> Filistin’i böldü; 14 Mayıs 1948 İsrail kuruldu; 1964 Arap Zirvesi’nde Filistin Ulusal Konseyi → FKÖ. Merkezi 1967 Ürdün, 1970 Lübnan, 1982 Tunus; 1994’te Filistin Otoritesi.", "<b>Terörün küresel tanımı yoktur<\/b>: tanım kurtuluş mücadelelerine zarar verebilir. 1937 Tedhişçiliğin Önlenmesi Sözleşmesi bu yüzden yürürlüğe girmedi. En kapsamlı karar: <b>2002 AB Çerçeve Kararı<\/b>.", "<mark>Terör örgütü<\/mark>: halkı sindirip korkutarak, şiddetle siyasi amaca ulaşmak isteyen yasa dışı örgüt; çoğu zaman insanlığa karşı suç işler. İnternet saldırısı = <b>siber terör<\/b>. 11 Eylül 2001 terörle mücadelede milat oldu.", "<b>Gerilla<\/b>: İspanyolca “küçük savaş”; düzenli orduya karşı küçük gruplarla direnen kurtuluş hareketi üyesi. <b>Apartheid<\/b>: Güney Afrika’da 1994’e kadar süren yasal ırk ayrımı."], "chain": ["Bir halk işgal veya sömürge altında", "Kendi kaderini tayin hakkı için silahlanır", "BM bu hareketlere hukuki statü verir", "Terör örgütünün ise meşru statüsü yoktur"], "ar": "الفرق بين حركة التحرر الوطني (ulusal kurtuluş hareketi) والمنظمة الإرهابية أن الأولى تقاوم احتلالًا أو استعمارًا من أجل حق تقرير المصير، والجمعية العامة للأمم المتحدة تمنحها وضعًا قانونيًا. أما الإرهاب فيستهدف ترويع المدنيين لأهداف سياسية، ولا يوجد له تعريف عالمي متفق عليه."}, {"h": "Bireyler", "pts": ["<b>Liberal çoğulcu<\/b> teoriler bireyin zaman zaman önemli bir aktör olabileceğini söyler.", "<b>Realistler<\/b>: birey ancak devletin verdiği temsil yetkisiyle hareket eder, özerk değildir → aktör sayılamaz.", "Kişisel yetenek, inisiyatif ve uzak öngörü ile aktör olanlar: <b>Atatürk<\/b>, <b>Bismarck<\/b>, <b>Mazzini<\/b>, <b>Richelieu<\/b>, <b>Yaser Arafat<\/b>, <b>Nelson Mandela<\/b>, <b>Gandi<\/b> (İngiliz sömürgesine karşı <b>pasif direniş<\/b>).", "<mark>Kissinger<\/mark>: <b>mekik diplomasisi<\/b>; SSCB ile yumuşama, Çin–ABD ilk teması, İsrail–Mısır ilişkisi; Vietnam’dan çekilme girişimleri için <b>1973 Nobel Barış Ödülü<\/b>.", "Aktör sayılan bireylerin neredeyse hepsi devlet adamıdır; ama <mark>her devlet adamı aktör değildir<\/mark>."], "chain": ["Birey normalde devlet adına konuşur", "Olağanüstü yetenek ve inisiyatif onu özerk kılabilir", "Diğer aktörlerin davranışını değiştirir", "→ Nadiren de olsa birey aktör olur"], "ar": "الفرد عادة يتحدث باسم دولته، لذلك يرفض الواقعيون اعتباره فاعلًا. لكن بعض القادة مثل أتاتورك وبسمارك وغاندي وكيسنجر (Kissinger) غيّروا مجرى الأحداث بقدراتهم الشخصية، فصاروا فاعلين. ومع ذلك ليس كل رجل دولة فاعلًا دوليًا."}], "tip": "Aktör testi = <b>Özerk + Etkili<\/b> (Tayyar Arı ekler: açıkça belirlenmiş + belirli süre var). Zayıf / Çökmüş / Devlet benzeri: <b>güç yok / iç egemenlik yok / tanınma ve BM üyeliği yok<\/b>. Devletin üç ilkesi: <b>egemenlik, eşitlik, ülke bütünlüğü<\/b>.", "tipAr": "احفظ المعادلة: فاعل = مستقل + مؤثر. ومثلث الدولة الحديثة: السيادة (egemenlik)، والمساواة (eşitlik)، ووحدة الأراضي (ülke bütünlüğü). وفرّق بين الضعيفة والمنهارة وشبه الدولة بالعنصر الناقص.", "trap": "Tayvan, Kosova, Filistin, Güney Osetya, KKTC = <b>devlet benzeri<\/b>dir; zayıf veya çökmüş değil. NATO hükümetlerarasıdır, sivil toplum kuruluşu değil. Çokuluslu şirketler <b>uluslararası – uluslaraşırı<\/b> diye ayrılır; hükümetlerarası – hükümetler-dışı diye değil. UNICEF ve Uluslararası Hukuk Komisyonu BM’nin <b>ana organı değildir<\/b>. Tanıma devleti <b>kurmaz<\/b>, sadece teyit eder.", "trapAr": "تايوان وكوسوفو وفلسطين وشمال قبرص التركية أمثلة على «شبه الدولة» (devlet benzeri) لا على الدولة المنهارة. ويونيسف (UNICEF) ولجنة القانون الدولي ليستا من الأجهزة الرئيسية للأمم المتحدة. والاعتراف لا يُنشئ الدولة بل يؤكد وجودها فقط (teyit edici).", "terms": [["Aktör", "Kendi kararıyla hareket edip başkalarının davranışını değiştirebilen birim", "الفاعل: وحدة مستقلة ومؤثرة"], ["Özerk eylem", "Başkasının izni olmadan kendi kararıyla davranmak", "الفعل المستقل"], ["Devlet dışı aktör", "Devlet olmayan ama uluslararası etkisi olan birim", "فاعل من غير الدول"], ["Analiz birimi", "Araştırmada incelenen temel birim (örneğin devlet)", "وحدة التحليل"], ["Eşitlik (devletlerin)", "Hukukta hak ve sorumlulukların eşit olması; güç eşitliği değil", "المساواة القانونية بين الدول"], ["Ülke bütünlüğü", "Devletin toprağına saldırılamaması ve bölünememesi", "وحدة أراضي الدولة"], ["Veto", "Güvenlik Konseyi daimi üyesinin bir kararı tek başına engelleme hakkı", "حق النقض (الفيتو)"], ["Tanıma", "Diğer devletlerin bir devletin varlığını kabul etmesi; kurucu değil teyit edici", "الاعتراف: يؤكد الدولة ولا ينشئها"], ["Millet", "Ortak gelenek ve çıkarları olan, devlete sahip olmak isteyen modern topluluk", "الأمة بالمعنى الحديث"], ["Milliyetçilik", "Bir milletin devletini koruma ya da devlet kurma bilinci", "القومية: أيديولوجيا الدولة القومية"], ["Dekolonizasyon", "Sömürgelerin bağımsız devlet olma süreci", "إنهاء الاستعمار"], ["Zayıf devlet", "Hukuken eşit ama gücü az olan devlet", "الدولة الضعيفة"], ["Çökmüş devlet", "Kendi ülkesinde egemenliğini kullanamayan devlet", "الدولة المنهارة أو الفاشلة"], ["Devlet benzeri", "Devlet kriterlerini taşıyan ama tanınmayan ve BM üyesi olmayan yapı", "شبه الدولة: غير معترف بها"], ["Hükümetlerarası örgüt", "Üyeleri devletler olan örgüt", "منظمة حكومية دولية"], ["Hükümetler-dışı örgüt", "Üyeleri farklı ülkelerdeki gruplar olan, kâr amaçsız örgüt", "منظمة غير حكومية"], ["Uluslarüstü", "Devletlerin üstünde, onları bağlayan karar düzeyi", "فوق وطني: يعلو على الدول"], ["Sui generis", "Kendine özgü, başka hiçbir şeye benzemeyen", "فريد من نوعه"], ["Uluslararası çokuluslu şirket", "Ortakları doğrudan devletler olan şirket", "شركة دولية شركاؤها حكومات"], ["Uluslaraşırı çokuluslu şirket", "Tek merkezli, ortakları farklı ülke vatandaşları olan şirket", "شركة عابرة للقوميات"], ["Baskı grubu", "Bir çıkar için hükümete baskı yapan topluluk", "جماعة ضغط"], ["Lobi", "Milletvekillerini kanun yaparken etkilemeye çalışan örgütlü grup", "اللوبي: التأثير على المشرّعين"], ["Ulusal kurtuluş hareketi", "İşgal veya sömürgeye karşı silahlı, BM’ce statü tanınan direniş", "حركة تحرر وطني"], ["Terör örgütü", "Halkı korkutarak şiddetle siyasi amaç güden yasa dışı örgüt", "منظمة إرهابية"], ["Gerilla", "Küçük gruplarla düzenli orduya karşı savaşan direnişçi", "حرب العصابات: مقاتل غير نظامي"], ["Apartheid", "Güney Afrika’da 1994’e kadar süren yasal ırk ayrımı", "الفصل العنصري"], ["Mekik diplomasisi", "Arabulucunun taraflar arasında gidip gelerek uzlaşma araması", "الدبلوماسية المكوكية"]]}, {"title": "Güç ve Güç Politikaları: Realizm", "sub": "Güç, unsurları, güç dengesi ve realizmin kolları", "big": "<mark>Realizm<\/mark>: uluslararası politika, üstlerinde otorite olmayan <b>anarşik<\/b> bir sistemde <b>devletler<\/b> arasındaki bir <b>güç mücadelesidir<\/b>.", "bigAr": "الواقعية (realizm) ترى السياسة الدولية صراعًا على القوة (güç mücadelesi) بين دول تعيش في نظام فوضوي (anarşik)، أي بلا حكومة عالمية فوقها. ومن هذه الفكرة الواحدة تخرج كل مفاهيمها: الاعتماد على الذات وتوازن القوى والمعضلة الأمنية.", "why": "Realizmdeki her şey tek bir gerçekten çıkar: dünya hükümeti yoktur. Seni kimse kurtarmayacak → kendi gücüne güvenmek zorundasın (kendi kendine yardım) → başkaları hakkında en kötüsünü varsayarsın → kimsenin senden güçlü olmasına izin veremezsin → güç dengesi. Savunma adımların bile komşularını korkutur, onlar da silahlanır → <b>güvenlik ikilemi<\/b>. İşbirliğinde bile “o benden fazla mı kazanıyor?” diye bakarsın → <b>göreceli kazanç<\/b>, <b>sıfır toplamlı oyun<\/b>. Realizmin kolları sadece güç arayışının <b>nereden<\/b> geldiği (insan doğası mı, sistemin yapısı mı) ve <b>ne kadar<\/b> gücün yeterli olduğu konusunda ayrılır.", "whyAr": "كل شيء في الواقعية ينبع من حقيقة واحدة: لا توجد حكومة عالمية. لا أحد سينقذك، فعليك الاعتماد على نفسك (kendi kendine yardım)، فتفترض الأسوأ في الآخرين ولا تسمح لأحد أن يصبح أقوى منك، فيظهر توازن القوى. حتى خطواتك الدفاعية تخيف جيرانك فيتسلحون، فتنشأ المعضلة الأمنية (güvenlik ikilemi). وفروع الواقعية تختلف فقط في مصدر السعي إلى القوة: الطبيعة البشرية أم بنية النظام، وفي مقدار القوة الكافي.", "sections": [{"h": "Teori ve realizm", "pts": ["<b>Teori<\/b>: karmaşık olayları açıklamaya yarayan <b>varsayımlar bütünü<\/b>; bir yol haritası. Kanunlar gibi kesin doğru değildir; tek bir teori her şeyi açıklayamaz.", "<mark>Realizm<\/mark> (politik realizm, gerçekçilik): uluslararası politikayı <b>güç<\/b> açısından açıklayan düşünce okulu; disiplini en çok etkileyen teorilerden biri.", "Devletlerin ilişkilerde güce başvurmasına <b>reelpolitik<\/b> ya da <b>güç politikası<\/b> denir."], "chain": ["Olaylar karmaşıktır", "Teori onları basitleştiren varsayımlar sunar", "Realizmin anahtar varsayımı: güç"], "ar": "النظرية (teori) خريطة طريق تبسّط الأحداث المعقدة عبر مجموعة افتراضات، وليست قانونًا مطلقًا. والواقعية تفسر كل شيء بمفتاح واحد هو القوة (güç)، ولهذا تُسمّى سياستها «سياسة القوة» أو الريل بوليتيك (reelpolitik)."}, {"h": "Realist düşüncenin kökleri", "pts": ["<b>Thucydides<\/b> (MÖ 471–400): Atina–Sparta arasındaki <b>Peloponnes Savaşı<\/b> (MÖ 431–404) analizi; realizmin ilk kaynağı.", "<b>Sun Tzu<\/b> (Çinli general): <i>Savaş Sanatı<\/i>. <b>Kautilya<\/b> (Hint, MÖ 4. yy.): <i>Arthashastra<\/i>.", "<mark>Machiavelli<\/mark> (1469–1527), <i>Prens<\/i>: İtalyan şehir devletleri arasındaki rekabeti <b>güç, güç dengesi, ittifak ve ulusal güvenlik<\/b> kavramlarıyla inceledi. İnsan doğasına kötümser bakar; güçlü liderlerin temel kaygısı <b>güç ve güvenliktir<\/b>.", "<mark>Hobbes<\/mark> (1588–1679), <i>Leviathan<\/i> (İngilizcede ilk genel siyaset teorisi eseri): yöneticinin temel görevi <b>halkın güvenliği<\/b>; egemenin olmadığı <b>doğa hâli<\/b>nde herkes korku ve ölüm tehlikesindedir; güç bir egemene devredilmelidir.", "Bu düşünürler kendilerini realist olarak <b>tanımlamadılar<\/b>; fikirleri II. Dünya Savaşı öncesi doğan realizmi etkiledi.", "Modern realizm 1930’ların sonunda, İtalya ve Almanya’nın politikalarıyla <b>kolektif güvenlik sistemi<\/b> çökerken doğdu. <b>E. H. Carr<\/b> (1892–1982), <i>Yirmi Yıl Krizi 1919–1939<\/i> (1939): savaşın eşiğine gelinmesinin nedeni <b>statükoyu korumak isteyenlerle değiştirmek isteyenler<\/b> arasındaki çıkar çatışmasıdır; “barıştan herkesin çıkarı var” diyen idealizmi eleştirdi.", "Rousseau kitapta realizme katkı yapanlar arasında <b>sayılmaz<\/b>."], "chain": ["Antik çağdan beri güç savaşları gözlendi", "Machiavelli ve Hobbes güç ve güvenliği merkeze aldı", "1930’larda kolektif güvenlik çöktü", "Carr ve sonra Morgenthau modern realizmi kurdu"], "ar": "جذور الواقعية قديمة: ثوسيديدس (Thucydides) حلّل حرب أثينا وإسبرطة، وميكافيلي في «الأمير» تحدث عن القوة والتحالفات، وهوبز في «اللفياثان» قال إن غياب السلطة يعني الخوف الدائم. هؤلاء لم يسمّوا أنفسهم واقعيين، لكن أفكارهم صنعت الواقعية الحديثة حين فشل نظام الأمن الجماعي في الثلاثينيات."}, {"h": "Morgenthau ve klasik realizm", "pts": ["<mark>Hans J. Morgenthau<\/mark> (1904–1980): modern realizm üzerinde en etkili düşünür; Uİ’nin tarih, felsefe ya da hukukun alt dalı değil <b>bağımsız bir disiplin<\/b> olarak benimsenmesinde büyük payı var.", "<i>Politics Among Nations<\/i> (<b>1948<\/b>): realizmin temel başvuru kaynağı. Sonradan bu yaklaşıma <b>Klasik Realizm<\/b> dendi.", "Morgenthau’nun <b>6 ilkesi<\/b>: (1) politika, kaynağı <b>insan doğası<\/b> olan objektif kanunlarla yönetilir; (2) <mark>çıkar güç olarak tanımlanır<\/mark>; (3) güç olarak çıkar evrenseldir ama içeriği kültürel ve siyasi ortama göre değişebilir; (4) ahlaki buyruklar ile siyasi eylem arasında daima gerginlik vardır; (5) bir ülkenin ahlaki kaygıları evrensel ahlakla aynı değildir; (6) çıkarı güçle tanımlamak politikayı <b>bağımsız disiplin<\/b> yapar.", "Klasik realizm güç hırsını <b>insan doğasının kötü ve bencil olmasına<\/b> bağlar. Güç bir <b>amaçtır<\/b> ve sınırı belirsizdir."], "chain": ["İnsan doğası güç ister", "Devletler de insanlar gibi davranır", "Çıkar = güç", "Uluslararası politika daimi bir güç mücadelesidir"], "ar": "مورغنثاو (Morgenthau) مؤسس الواقعية الكلاسيكية في كتاب «السياسة بين الأمم» سنة 1948. فكرته المركزية أن المصلحة تُعرَّف بالقوة (çıkar güç olarak tanımlanır)، وأن جذر الصراع هو الطبيعة البشرية الأنانية. ولهذا القوة عنده غاية لا حد لها."}, {"h": "Güç ve unsurları", "pts": ["<mark>Güç<\/mark> (Morgenthau): bir aktörün diğerinin <b>düşünce ve davranışını kontrol edebilme<\/b> yeteneği; ya da ona <b>aksi hâlde yapmayacağı bir şeyi yaptırabilme<\/b> kabiliyeti. Güç bir durum değil, bir <b>etki sürecidir<\/b>.", "<b>Güç kaynakları<\/b> (uzun dönem): GSMH, nüfus, toprak, coğrafi konum, doğal kaynaklar.", "<b>Güç kapasiteleri<\/b> (kısa dönem): <b>askeri güç<\/b>, askeri-endüstriyel yapı, devlet bürokrasisinin kalitesi.", "<b>Fiziki<\/b> unsurlar: ekonomi, coğrafya, doğal kaynaklar, askeri güç, nüfus. <b>Fiziki olmayan<\/b> unsurlar: ulusal özellikler, <b>ulusal moral<\/b>, diplomasi, hükümetin kalitesi.", "Realistler için en önemli unsur <mark>askeri güçtür<\/mark> (güvenliğe verdikleri önem yüzünden). Diğer unsurlar askeri güce dönüştürülebildiği ölçüde önemlidir. Uluslararası örgütlere üyelik bir güç unsuru <b>değildir<\/b>.", "<b>Sert güç<\/b>: savaş gibi askeri yöntemlerle istediğini yaptırma. <b>Yumuşak güç<\/b>: kendi <b>değer ve ideolojilerini<\/b> benimseterek, zor kullanmadan istediğini yaptırma; gücü başkalarının gözünde meşru kılmak.", "<b>Mutlak güç<\/b>: bir ülkenin güç öğelerinin sayısal toplamı. <b>Göreceli güç<\/b>: bir ülkenin gücünün diğerlerinin gücüne oranı. Realizme göre tek başına mutlak güç anlam taşımaz; güç <b>kıyasla<\/b> ortaya çıkar.", "<ex>Örnek: Bir futbol takımının stadyumu ve bütçesi güç kaynağıdır; sahaya çıkan formda kadro güç kapasitesidir; taraftarın coşkusu ise fiziki olmayan bir unsurdur.<\/ex>"], "chain": ["Güç = başkasına bir şey yaptırabilmek", "Bunun için kaynak (uzun dönem) ve kapasite (kısa dönem) gerekir", "Anarşide en çok güvenlik önemlidir", "Bu yüzden en önemli unsur askeri güçtür"], "ar": "القوة عند الواقعيين ليست شيئًا تملكه بل عملية تأثير
