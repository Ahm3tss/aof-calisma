: أن تجعل غيرك يفعل ما لم يكن ليفعله. مواردها بعيدة المدى كالسكان والأرض، وقدراتها قصيرة المدى كالجيش. والقوة الصلبة (sert güç) تعتمد على السلاح، والناعمة (yumuşak güç) على نشر القيم والأفكار."}, {"h": "Güç dengesi ve kutupluluk", "pts": ["<mark>Güç dengesi<\/mark>: bir devletin ya kendi olanaklarıyla ya da başkalarıyla <b>gücünü birleştirerek<\/b>, başka bir devletin veya devletler topluluğunun tek başına güçlenmesini önleme politikası.", "Neden: devletler için en büyük tehlike daha güçlü devletlerdir; dünyayı tek bir devletin (<b>hegemon<\/b>) yönetmesini önlemek isterler.", "Yöntemler: <b>askeri ittifaklar<\/b> (en önemlisi), silahlanma, böl ve yönet, toprak paylaşımı.", "Başarı koşulu: <b>statüko güçleri<\/b> revizyonistlerden güçlü ve kararlı olmalı; sistemin en güçlü devletleri dengeye katılmalı.", "Sistem türleri gücün dağılımına göre: <b>tek kutuplu (hegemonik)<\/b>, <b>iki kutuplu<\/b>, <b>çok kutuplu<\/b> (üç ve daha fazla). <mark>Kutup sayısını belirleyen temel faktör güç dağılımıdır<\/mark>.", "İstikrar tartışması: <b>Klasik realistler<\/b> 19. yüzyıl Avrupa Uyumu’na bakıp <b>çok kutuplu<\/b> sistemi; <b>neorealistler<\/b> Soğuk Savaş’a bakıp <b>iki kutuplu<\/b> sistemi daha istikrarlı bulur."], "chain": ["Anarşide kimse diğerinin niyetinden emin olamaz", "En kötüsü varsayılır", "Kimsenin aşırı güçlenmesine izin verilmez", "İttifak ve silahlanmayla denge kurulur"], "ar": "توازن القوى (güç dengesi) يعني منع أي دولة من أن تصبح قوية بما يكفي لتسيطر وحدها، إما بزيادة قوتك أو بالتحالف مع غيرك. وعدد الأقطاب في النظام يحدده توزيع القوة: قطب واحد أو اثنان أو أكثر."}, {"h": "Anarşi ve sonuçları", "pts": ["Realizmin birinci varsayımı: <b>uluslararası politika bir güç mücadelesidir<\/b>; devletin ilk amacı ne olursa olsun son amacı güçtür.", "İkinci varsayım: <mark>sistem anarşidir<\/mark>. Anarşi kaos değil, kural koyacak ve uygulayacak <b>üst otoritenin yokluğu<\/b>dur. Sebebi devletlerin <b>egemen eşit<\/b> olmasıdır; iç politika hiyerarşik, uluslararası sistem ise yataydır.", "Realistlere göre devletler sadece <b>egemenlik<\/b> açısından eşittir, güç açısından değil.", "Anarşinin 1. sonucu: <mark>kendi kendine yardım<\/mark> sistemi: devlet kendi başınadır.", "2. sonucu: güvensizlik → <mark>güvenlik ikilemi<\/mark>: bir devletin savunma tedbirleri diğerince saldırı işareti sayılır, o da silahlanır; sonuçta herkes daha güvensiz olur.", "3. sonucu: <b>işbirliği zorlaşır<\/b>. Devletler <b>mutlak kazanca<\/b> (kendi kazancı) değil <mark>göreceli kazanca<\/mark> (diğerinin ne kazandığı) bakar.", "Bu yüzden realistler uluslararası politikayı <b>sıfır toplamlı oyun<\/b> sayar: birinin kazancı otomatik olarak diğerinin kaybıdır.", "<ex>Örnek: Bir mahallede herkes kendini korumak için kapısına kilit, sonra demir, sonra kamera takarsa, komşular birbirinden daha çok şüphelenmeye başlar. Kimse daha güvende hissetmez.<\/ex>"], "chain": ["Üst otorite yok (anarşi)", "Herkes kendi başına (kendi kendine yardım)", "Kimse kimseye güvenmez", "Savunma bile tehdit görünür (güvenlik ikilemi)", "İşbirliğinde göreceli kazanç hesaplanır → sıfır toplamlı oyun"], "ar": "الفوضى (anarşi) عند الواقعيين تعني غياب «شرطي عالمي»، لا الخراب. ومنها تخرج ثلاث نتائج: الاعتماد على الذات، والمعضلة الأمنية حيث يجعل دفاعك الجميع أقل أمنًا، وصعوبة التعاون لأن كل دولة تسأل «هل يكسب الآخر أكثر مني؟» (göreceli kazanç)، فتصير اللعبة صفرية (sıfır toplamlı)."}, {"h": "Devletler: rasyonel ve yekpare aktörler", "pts": ["Üçüncü varsayım: en önemli aktörler <b>devletlerdir<\/b>. Örgütler ve şirketler bağımsız aktör değil, <b>devlet gücünün uzantısı<\/b> ya da dış politika aracıdır; devlet dışı aktörlerin etkisi <b>marjinaldir<\/b>.", "<mark>Rasyonellik<\/mark>: devlet adamlarının politika seçeneklerinin güçlü ve zayıf yönlerini değerlendirebilmesi. Üç sonucu: (1) devlet <b>yekpare<\/b> bir aktör gibi seçim yapar; (2) devlet çıkarlarını belirleyip <b>öncelik sırasına<\/b> koyabilir (önemli olan lider değil <b>ulusal çıkar<\/b>); (3) <b>fayda-maliyet analizi<\/b> yapar.", "Klasik realistlere göre bütün devletler aynı tercihe sahiptir, çünkü güç isteği insan doğasındadır.", "Realizm Soğuk Savaş’ta özellikle ABD dış politikasını etkiledi. <mark>George Kennan<\/mark> güç dengesini <b>çevreleme politikası<\/b> olarak yorumladı (SSCB’nin yayılmasını önlemek). <b>Henry Kissinger<\/b> (1960–70’ler) de realist politikaların savunucusuydu."], "chain": ["Devlet tek bir akıl gibi davranır (yekpare)", "Çıkarlarını sıralar ve fayda-maliyet hesaplar", "Bütün devletler benzer durumda benzer davranır", "Devlet dışı aktörler ikincil kalır"], "ar": "الواقعيون يتخيلون الدولة كشخص واحد عاقل (rasyonel ve yekpare) يرتب مصالحه ويحسب الربح والخسارة. لذلك يقولون «أمريكا فعلت كذا» كأنها إنسان. وقد طبّق كينان (Kennan) هذا التفكير في سياسة الاحتواء (çevreleme) ضد توسع الاتحاد السوفيتي."}, {"h": "Waltz ve neorealizm", "pts": ["<mark>Kenneth Waltz<\/mark>, <i>Theory of International Politics<\/i> (<b>1979<\/b>): teori sadece devlete değil <b>uluslararası sisteme<\/b> odaklanmalıdır.", "<b>Sistem<\/b>: bir yapı ve etkileşim içindeki birimlerin oluşturduğu bütün. Waltz’a göre siyasi yapının <b>üç öğesi<\/b>: <b>düzenleyici prensip<\/b> (anarşi veya hiyerarşi), <b>birimlerin özellikleri<\/b> (işlevsel benzerlik), <b>kapasitelerin dağılımı<\/b>.", "İlk ikisi sabittir: düzenleyici prensip anarşidir; devletler işlevsel olarak aynıdır. <mark>Değişen tek öğe kapasitelerin dağılımıdır<\/mark>; sistem buna göre tek, iki ya da çok kutuplu olur.", "En büyük fark: güç hırsının kaynağı <b>insan doğası değil, sistemin yapısıdır<\/b> (üst otoritenin yokluğu). Güç <b>amaç değil, güvenliğin ve hayatta kalmanın aracıdır<\/b>.", "Waltz’a göre güç dengesi <b>kendiliğinden<\/b> ortaya çıkar; devletler ya dengeler ya da saldırgan devletin yanında yer alır.", "<b>Oyun Teorisi<\/b> (pazarlık sonuçlarını tahmin eden matematik dalı) ve <mark>Mahkûmların İkilemi<\/mark>: iki mahkûm sessiz kalsa (işbirliği) ikisi de kazanır; ama güvensizlik yüzünden ikisi de itiraf eder ve kötü sonuca razı olur. Realistler bunu işbirliğinin neden zor olduğunu ve silahlanma yarışını açıklamak için kullanır.", "İç faktörlere (liderin iyi/kötü olması, ülkenin yapısı) hiç yer vermediği için <b>Sistemik<\/b> ya da <b>Yapısalcı Realizm<\/b> denir.", "<b>Hegemon<\/b> (Yunanca “lider”): askeri, siyasi, ekonomik gücüyle sistemin kurallarını koyup uygulatan devlet. <mark>Hegemonik İstikrar Teorisi<\/mark>: hegemonun varlığı sistemi güvenli kılar; örneğin Japonya, Kore ve Tayvan’ın hızlı gelişmesinin arkasında bölgesel hegemon <b>ABD<\/b> vardır."], "chain": ["Üst otorite yok (yapısal gerçek)", "Kim olursa olsun her lider rekabete zorlanır", "Güç güvenlik için bir araçtır", "Davranışı belirleyen sistemin yapısıdır → yapısal realizm"], "ar": "فالتز (Waltz) نقل سبب الصراع من داخل الإنسان إلى بنية النظام: لأن لا سلطة فوق الدول، يُجبَر أي قائد، طيبًا كان أو شريرًا، على التنافس. لذلك تُسمّى نظريته الواقعية البنيوية (yapısalcı realizm)، والقوة عنده وسيلة للأمن لا غاية. ومعضلة السجينين (Mahkûmların İkilemi) تشرح لماذا يصعب التعاون رغم أنه مفيد للطرفين."}, {"h": "Realizmin yeni kolları", "diagram": "Klasik Realizm   Morgenthau (1948)   sebep: insan doğası\nNeorealizm       Waltz (1979)        sebep: sistemin yapısı\nNeoklasik        —                   sebep: sistem + iç faktörler\nSavunmacı        Walt                yeterli güç; tehdidi dengele\nSaldırgan        Mearsheimer         mümkün olan en çok güç; hatta hegemonya", "pts": ["<mark>Neoklasik realizm<\/mark>: davranışı hem <b>sistemik<\/b> hem <b>iç politik<\/b> faktörler belirler. Göreceli güç önemlidir (bu onu realist yapar) ama etkisi dolaylıdır; liderlerin güç algısı ve devlet-toplum ilişkisi araya girer. Aynı kapasitedeki farklı yapılı devletler farklı davranabilir.", "<mark>Savunmacı realizm<\/mark> (neorealizmin içinden): sürekli daha çok güç istemek akıllıca değildir; devletler <b>uygun miktarda<\/b> güç aramalı, <b>ılımlı<\/b> politika izlemelidir. Üç neden: (1) çok güçlenen devlet dengelenir; (2) <b>saldırı-savunma dengesi savunmadan yanadır<\/b>; (3) fetih maliyeti kazançtan yüksektir (milliyetçilik fethedilen yeri yönetmeyi zorlaştırır). Hegemonya hırsı “çılgınlıktır”.", "<b>Stephen Walt<\/b> (1987), <mark>tehdit dengesi<\/mark>: devletler gücü değil <b>algıladıkları tehdidi<\/b> dengeler. Yayılmacı ve revizyonist devletler kendilerine karşı daha güçlü ittifak doğurur (Nazi Almanyası örneği).", "<mark>Saldırgan realizm<\/mark> (<b>John Mearsheimer<\/b>): kazanabildiğin kadar güç kazan; uygun zamanda <b>hegemonya<\/b> peşinde koş. Daha fazla güç = hayatta kalmanın en iyi yolu. Dengeleme genellikle yetersizdir; tehdit altındakiler sorumluluğu <b>başkalarının üzerine atar<\/b>; <b>ilk saldıran genellikle kazanır<\/b>.", "<b>Revizyonizm<\/b>: devletlerin statükoyu değiştirmek için izlediği politikalar."], "chain": ["Hepsi anarşiyi kabul eder", "Ayrıldıkları soru: güç arayışı nereden gelir ve ne kadar güç yeter?", "Savunmacı: ılımlı güç, savunma avantajlı", "Saldırgan: en çok güç, saldırı avantajlı"], "ar": "كل فروع الواقعية تقبل الفوضى، لكنها تختلف في كمية القوة المطلوبة. الواقعية الدفاعية (savunmacı) تقول: اكتفِ بقدر معتدل لأن الإفراط يستفز الآخرين، والدفاع أسهل من الهجوم. والهجومية (saldırgan) مع ميرشايمر تقول: اجمع أكبر قدر ممكن حتى الهيمنة. أما الكلاسيكية الجديدة (neoklasik) فتضيف العوامل الداخلية إلى ضغط النظام."}, {"h": "Realizme yöneltilen eleştiriler", "pts": ["<b>Tek boyutlu<\/b>dur: sadece güç ve çatışmaya bakar; oysa insanlar işbirliğine de yatkındır, devletlerin ortak çıkarları da vardır.", "Sadece <b>devletleri<\/b> aktör görür; Greenpeace, Af Örgütü gibi devlet dışı aktörlerin artan etkisini önemsemez.", "Tek davranış kuralının güç olduğunu varsayar; oysa devletleri bağlayan <b>hukuk ve gelenek kuralları<\/b>, haklar ve yükümlülükler vardır."], "chain": ["Realizm sadece gücü görür", "İşbirliği, devlet dışı aktörler ve hukuk dışarıda kalır", "Bu boşluklar alternatif teorileri doğurur (Ünite 4)"], "ar": "يُنتقد الواقعيون بأنهم يرون العالم بعين واحدة: القوة والصراع فقط. فهم يتجاهلون التعاون والمصالح المشتركة، ويهملون دور المنظمات غير الحكومية، وينسون أن القانون والأعراف الدولية تقيّد الدول أيضًا. ومن هذه الثغرات وُلدت النظريات البديلة."}], "tip": "Klasik ile neo tek satırda: <b>Morgenthau insanı suçlar, Waltz sistemi suçlar.<\/b> Klasikte güç <b>amaçtır<\/b> (sınırı belirsiz); neoda güç güvenliğin <b>aracıdır<\/b>. Savunmacı ile saldırgan: <b>“yeterli” – “daha fazla”<\/b>. Walt = <b>tehdit<\/b> dengesi; Mearsheimer = saldırgan; Kennan = <b>çevreleme<\/b>.", "tipAr": "مورغنثاو يلوم طبيعة الإنسان، وفالتز (Waltz) يلوم بنية النظام. عند الكلاسيكيين القوة غاية بلا حدود، وعند الواقعيين الجدد هي وسيلة للأمن. والدفاعيون يقولون «يكفي قدر معتدل»، والهجوميون يقولون «أكثر دائمًا». ووالت (Walt) صاحب توازن التهديد.", "trap": "“Devlet davranışının sebebi sistemin yapısıdır” demek <b>neorealizmi<\/b> tanımlar, klasik realizmi değil. Anarşi ≠ kaos. <b>Ulusal moral<\/b> ve <b>diplomasi<\/b> fiziki olmayan unsurdur. Uluslararası örgüt üyeliği güç unsuru <b>değildir<\/b>. Savunmacı realistlere göre <b>savunma<\/b> avantajlıdır; “ilk saldıran kazanır” saldırgan realizmdir. Walt’ın tehdit dengesi <b>savunmacı<\/b> realizmdir.", "trapAr": "انتبه: القول بأن «بنية النظام هي سبب سلوك الدول» يصف الواقعية الجديدة لا الكلاسيكية. والفوضى (anarşi) ليست فوضى بمعنى الخراب بل غياب سلطة عليا. والمعنويات الوطنية (ulusal moral) عنصر غير مادي، وعضوية المنظمات ليست عنصر قوة أصلًا.", "terms": [["Teori", "Olayları açıklamak için kurulan varsayımlar bütünü", "النظرية: مجموعة افتراضات تفسيرية"], ["Realizm", "Uluslararası politikayı güç mücadelesi olarak açıklayan okul", "الواقعية: السياسة صراع على القوة"], ["Reelpolitik", "Ahlaktan çok güce dayanan pratik politika", "السياسة الواقعية العملية"], ["Güç", "Başkasına aksi hâlde yapmayacağı şeyi yaptırabilme", "القوة: القدرة على التأثير في سلوك الآخر"], ["Güç kaynakları", "Uzun dönemde gücü artıran öğeler: GSMH, nüfus, toprak", "موارد القوة طويلة المدى"], ["Güç kapasiteleri", "Kısa dönemde kullanılabilen öğeler: ordu, bürokrasi", "قدرات القوة قصيرة المدى"], ["Ulusal moral", "Halkın ruh hâli ve direnci; fiziki olmayan güç öğesi", "المعنويات الوطنية: عنصر غير مادي"], ["Sert güç", "Askerî yollarla istediğini yaptırma", "القوة الصلبة"], ["Yumuşak güç", "Değer ve fikirlerini benimseterek istediğini yaptırma", "القوة الناعمة"], ["Mutlak güç", "Güç öğelerinin sayısal toplamı", "القوة المطلقة: مجموع العناصر"], ["Göreceli güç", "Bir ülkenin gücünün diğerlerininkine oranı", "القوة النسبية: مقارنة بالآخرين"], ["Güç dengesi", "Tek bir devletin aşırı güçlenmesini önleme politikası", "توازن القوى"], ["Hegemon", "Sistemin kurallarını koyup uygulatan en güçlü devlet", "القوة المهيمنة"], ["Hegemonik istikrar teorisi", "Bir hegemonun varlığının sistemi güvenli kıldığını söyleyen teori", "نظرية الاستقرار بالهيمنة"], ["Kendi kendine yardım", "Devletin güvenliği için sadece kendine güvenmesi", "الاعتماد على الذات"], ["Güvenlik ikilemi", "Savunma tedbirlerinin herkesi daha güvensiz yapması", "المعضلة الأمنية"], ["Göreceli kazanç", "Benim kazancımın karşıdakinin kazancına oranı", "المكسب النسبي"], ["Mutlak kazanç", "Bir devletin işbirliğinden elde ettiği net kazanç", "المكسب المطلق"], ["Sıfır toplamlı oyun", "Birinin kazancının otomatik olarak diğerinin kaybı olması", "اللعبة الصفرية"], ["Rasyonellik", "Seçenekleri tartıp en faydalıyı seçebilme", "العقلانية: حساب المنفعة والكلفة"], ["Yekpare aktör", "Devletin tek bir bütün gibi karar vermesi", "فاعل موحد"], ["Çevreleme politikası", "Kennan: SSCB’nin yayılmasını durdurma stratejisi", "سياسة الاحتواء"], ["Neorealizm", "Devlet davranışını sistemin yapısıyla açıklayan realizm", "الواقعية الجديدة (البنيوية)"], ["Mahkûmların ikilemi", "Güvensizlik yüzünden işbirliği yerine kötü sonucu seçme oyunu", "معضلة السجينين"], ["Tehdit dengesi", "Walt: devletler gücü değil tehdidi dengeler", "توازن التهديد"], ["Revizyonizm", "Statükoyu değiştirmeye yönelik politika", "النزعة التعديلية"]]}, {"title": "Uluslararası Politikada Alternatif Yaklaşımlar", "sub": "Liberalizm, Marksizm, inşacılık ve feminizm", "big": "Realizme her alternatif bir temel varsayımı değiştirir: <mark>liberalizm<\/mark> işbirliğinin mümkün olduğunu; <mark>Marksizm<\/mark> her şeyi ekonominin yönlendirdiğini; <mark>inşacılık<\/mark> kimliklerin çıkarları şekillendirdiğini; <mark>feminizm<\/mark> alanın kadınları görmezden geldiğini söyler.", "bigAr": "كل نظرية بديلة تغيّر افتراضًا واحدًا من افتراضات الواقعية: الليبرالية (liberalizm) تقول إن التعاون ممكن، والماركسية (Marksizm) تقول إن الاقتصاد هو المحرك، والبنائية (inşacılık) تقول إن الهوية تصنع المصلحة، والنسوية (feminizm) تقول إن هذا العلم يرى العالم بعيون الرجال.", "why": "Her kuramı realizmle tek bir soru üzerinden karşılaştır: devletleri ne yönlendirir? Realizm → anarşide güç. Liberalizm → insan iyidir ve çıkarlar paylaşılabilir; bu yüzden kurumlar, hukuk ve demokrasi işbirliğini kârlı yapar; herkes kazanabilir (<b>mutlak kazanç<\/b>). Marksizm → kapitalist ekonomi; zengin merkez yoksul çevreyi sömürür; ekonomi <b>temel açıklayıcı değişkendir<\/b>. İnşacılık → yapı maddi değil <b>sosyaldir<\/b>; kimlik etkileşimle kurulur ve kim olduğunu bilmeden ne istediğini bilemezsin. Feminizm → kategorilerin kendisi (devlet, güç, egemenlik) erkek bakışını yansıtır.", "whyAr": "قارن كل نظرية بالواقعية عبر سؤال واحد: ما الذي يحرك الدول؟ الليبرالية: الإنسان خيّر والمصالح يمكن تقاسمها، فالمؤسسات والقانون والديمقراطية تجعل التعاون مربحًا للجميع (mutlak kazanç). الماركسية: الاقتصاد الرأسمالي حيث يستغل المركز الغني الأطراف الفقيرة. البنائية: البنية اجتماعية والهوية تُبنى بالتفاعل. النسوية: مفاهيم الدولة والقوة نفسها ذكورية.", "sections": [{"h": "Liberal düşüncenin kökleri", "pts": ["Liberal yaklaşım 18. ve 19. yüzyıllara uzanır ve modern liberal devletle doğdu. Temel soru: <b>adil ve barışçıl bir dünya düzeni nasıl kurulur?<\/b>", "Kökleri <mark>Stoacılık<\/mark>’a (MÖ 300, Eski Yunan) uzanır: farklı topluluklarda yaşasalar da tüm insanlar <b>daha büyük bir topluluğun<\/b> parçasıdır (evrensellik). Grotius ve Kant’ı etkiledi.", "<b>Klasik Liberalizm<\/b> (17. yy.): çıkış noktası <mark>birey<\/mark> ve özgürleşmesidir; birey hem en önemli analiz birimi hem hak sahibidir. Devletin görevi bireylerin özgürce yaşayabileceği ortamı sağlamaktır. En önemli düşünür: <b>John Locke<\/b> (1632–1704).", "Ekonomide <b>Adam Smith<\/b> ve <b>David Ricardo<\/b> bireysel girişimciyi öne çıkardı.", "<mark>Jeremy Bentham<\/mark>: <b>Faydacılar<\/b>ın öncüsü; bireyleri kendileri için en iyi seçimi yapabilen <b>rasyonel aktörler<\/b> olarak tanımladı. <b>Faydacılık<\/b>: uygun davranış, herkesin refahını ve mutluluğunu artıran davranıştır.", "<b>Hugo Grotius<\/b> (1583–1645): <b>pozitif hukukun kurucusu<\/b>. Uluslararası ilişkiler anarşiktir ama bir <b>toplumsallık<\/b> vardır; bu toplumun temeli güç değil, <b>gelenekler ve normlardır<\/b>.", "<mark>Immanuel Kant<\/mark> (1724–1804), <i>Perpetual Peace<\/i> (Daimi Barış): barış için en sistematik yaklaşım. <b>Devlet kurgusal bir varlıktır<\/b>; asıl moral değer taşıyan insandır. Bir dünya devleti değil, hukukun üstünlüğüne dayalı <b>gevşek bir federasyon<\/b> önerir; bunun şartı diktatörlük ve monarşilerin yerine <b>cumhuriyetler<\/b>dir.", "Liberalizm ancak <b>I. Dünya Savaşı sonrası<\/b> bir Uİ teorisi oldu. Türevleri: <b>İdealizm, Karşılıklı Bağımlılık, Demokratik Barış, Neoliberal Kurumsalcılık<\/b>. Morgenthau liberal öncüler arasında <b>değildir<\/b>."], "chain": ["Stoacılar: tüm insanlar tek topluluk", "Klasik liberaller: birey ve özgürlük önce gelir", "Kant: devlet kurgusal, asıl olan insan; cumhuriyetler federasyonu", "→ Barış hukukla ve işbirliğiyle kurulabilir"], "ar": "جذور الليبرالية تبدأ من الرواقيين (Stoacılık) الذين رأوا البشر جميعًا أسرة واحدة، ثم لوك الذي جعل الفرد مركز السياسة، وبنثام (Bentham) الذي رأى الفرد عاقلًا يختار الأنفع، وكانط (Kant) الذي قال إن الدولة كيان «مُتخيَّل» وإن الإنسان هو الأصل، فدعا إلى اتحاد جمهوريات يسوده القانون."}, {"h": "Modern liberalizmin varsayımları", "pts": ["<b>Devletler tek aktör değildir<\/b>: <b>plüralist<\/b> bakış; bireyler ve örgütler de aktördür.", "<b>İnsanlar temelde iyidir<\/b> (<mark>iyimser<\/mark>): savaş ve adaletsizlik kötü kurumlardan ve yanlış algılardan doğar; kurumsal reform ve kolektif eylemle azaltılabilir.", "<mark>İşbirliği mümkündür<\/mark> ve herkes kazanabilir. Şartları: ilişkiler daha <b>şeffaf<\/b> olmalı; özgürlüğü kısıtlayan kurumlar kalkmalı; <b>göreceli değil mutlak kazanca<\/b> odaklanılmalı.", "Sistem <b>sadece güçle<\/b> yapılanmamıştır; değişim normlar, örgütler ve hukuk yoluyla da olur.", "Devletler <b>yekpare değildir<\/b>; içerideki farklı aktörler dış politikayı etkiler.", "<b>Rasyonellik<\/b>: realistlere göre kısa dönemli çıkarı artırmak; liberallere göre birey toplumun <mark>uzun dönemli<\/mark> çıkarı için kısa dönemli çıkarından vazgeçebilir. Savaş irrasyoneldir.", "<b>Askeri güç<\/b>: maliyeti artıyor; <b>son çare<\/b>dir. Diplomasi ve barışı koruma daha etkindir.", "<ex>Örnek: Türkiye ile Almanya arasındaki ticaret ikisini de zenginleştirir; birinin kazancı diğerinin kaybı değildir. Liberaller dünyaya böyle bakar.<\/ex>"], "chain": ["İnsan iyidir, kötülük kötü kurumlardan doğar", "Kurumlar düzeltilirse işbirliği mümkündür", "İşbirliğinde herkes kazanır (mutlak kazanç)", "Savaş uzun dönemde irrasyoneldir"], "ar": "الليبراليون متفائلون بالطبيعة البشرية: الحرب ليست قدرًا بل نتيجة مؤسسات سيئة وسوء فهم. لذلك إذا أُصلحت المؤسسات وزادت الشفافية صار التعاون ممكنًا، والكل يربح (mutlak kazanç). والقوة العسكرية عندهم آخر الحلول لا أولها."}, {"h": "İdealizm ve kolektif güvenlik", "pts": ["<mark>İdealizm<\/mark> (Woodrow Wilson): savaşlar önlenebilir; güç mücadelesi uluslararası kurumlarla azaltılabilir. “İdealizm” adını <b>realistler<\/b> verdi ve onu hayalperest, ütopik olmakla suçladı.", "Savaşın nedenleri: <b>baskıcı rejimler<\/b>, liderlerin demokratik sorumluluğunun olmaması, anlaşmazlığı önleyecek <b>uluslararası mekanizmaların yokluğu<\/b>.", "<b>Kolektif savunma<\/b>: iki veya daha fazla devletin ittifakla birbirini koruma sözü vermesi; idealistlere göre savaşları önlemez.", "<mark>Kolektif güvenlik<\/mark>: sistemdeki <b>büyük devletlerin<\/b> bir araya gelerek sistemi saldırganlardan koruması ve potansiyel saldırganları caydırması. <b>Milletler Cemiyeti<\/b> bu amaçla kuruldu; II. Dünya Savaşı sonrası <b>BM<\/b> ile canlandırılmaya çalışıldı.", "Araçlar: uluslararası örgütler, hukuk, <b>diplomasi<\/b> (çatışmaları güç kullanmadan çözmek için iletişim ve müzakere), arabuluculuk. <b>Güce önem veren bir yaklaşım değildir<\/b>."], "chain": ["Savaşı baskıcı rejimler ve mekanizma eksikliği doğurur", "İttifaklar (kolektif savunma) savaşı önlemez", "Büyük güçler birlikte saldırgana karşı durmalı (kolektif güvenlik)", "→ Milletler Cemiyeti, sonra BM"], "ar": "المثاليون بقيادة ولسن رأوا أن الأحلاف العسكرية (kolektif savunma) لا تمنع الحرب، فاقترحوا الأمن الجماعي (kolektif güvenlik): أن تتفق الدول الكبرى على الوقوف معًا ضد أي معتدٍ على النظام. وعلى هذه الفكرة بُنيت عصبة الأمم ثم الأمم المتحدة."}, {"h": "Demokratik Barış Teorisi", "pts": ["<b>Kant<\/b>’tan etkilenen <b>Michael Doyle, Rudolph Rummel, Bruce Russett<\/b>: demokrasiler <mark>birbirleriyle savaşmaz<\/mark>.", "İki neden: (1) demokrasiler savaşı ve şiddeti dışlayan <b>aynı liberal değerlere<\/b> sahiptir; (2) karar alma tek bir liderin elinde değildir; kurumları, baskı gruplarını, partileri ve kamuoyunu ikna etmek zordur.", "Demokrasiler <b>otoriter rejimlerle savaşabilir<\/b>; teori “demokrasiler hiç savaşmaz” demez."], "chain": ["Demokrasiler ortak liberal değerler taşır", "Karar birçok aktörün onayını gerektirir", "Savaş kararı zorlaşır", "→ Demokrasiler birbirleriyle savaşmaz (ama otoriterlerle savaşabilir)"], "ar": "نظرية السلام الديمقراطي تقول إن الديمقراطيات لا تتحارب فيما بينها، لسببين: قيم ليبرالية مشتركة ترفض العنف، وقرار الحرب يحتاج إقناع البرلمان والأحزاب والرأي العام. لكنها قد تحارب الأنظمة الاستبدادية، وهذا هو الفخ المتكرر."}, {"h": "Neoliberal kurumsalcılık", "pts": ["<b>1980’ler<\/b>de realizme eleştiri olarak doğdu. Bazı <b>realist varsayımları kabul eder<\/b>: sistem <b>anarşiktir<\/b>; devletler <b>bencil, rasyonel ve yekpare<\/b>dir.", "Fark: bencillik işbirliğinden kaçınmak demek değildir; işbirliği devletlerin çıkarınadır ve <b>uluslararası örgütler<\/b> ortak çıkarı gerçekleştirmeye yardım eder. Uzun dönemli ortak kazanç daha rasyoneldir.", "Devletler daima göreceli kazanca odaklanmaz; <mark>mutlak kazanç<\/mark> da önemlidir. <b>Mutlak kazanç<\/b> = devletin net kazancı; <b>göreceli kazanç<\/b> = kazancının diğerinin kazancına oranı.", "Mahkûmların İkilemi’ni realistler gibi kullanırlar ama oyun <b>tekrarlanırsa<\/b> <mark>karşılıklılık<\/mark> (<b>tit-for-tat<\/b>) ilkesi doğar: işbirliğine yönelik ilk hamle karşılık görür ve işbirliği rasyonel olur.", "<b>Rejim<\/b>: devletlerin belli alanlardaki davranışlarını düzenleyen kurallar, normlar ve ilkelerin tümü (iç siyasi rejimle karıştırma). Örnek: II. Dünya Savaşı sonrası <b>GATT<\/b> rejimi.", "İşbirliği <b>ekonomide kolay<\/b>, askeri ve güvenlik konularında zordur (realistlerle ortak kabul).", "<b>Ulusaşırıcılık<\/b>: çokuluslu şirketlerin ve hükümetler dışı örgütlerin klasik egemenliği zorlayan faaliyetleri. <b>Karşılıklı Bağımlılık<\/b>: ticaret ve sermaye akışıyla birbirine bağlanan devletler savaşmaktan kaçınır.", "Liberalizme eleştiriler: dünyanın <b>nasıl olduğuyla<\/b> değil <b>nasıl olması gerektiğiyle<\/b> ilgilenir; örgütlerin <b>yüksek politikada<\/b> etkisi azdır; ahlaki değerleri abartır."], "chain": ["Anarşiyi ve bencil devleti kabul eder", "Ama oyun tekrar edilir (devletler hep karşılaşır)", "Karşılıklılık güven üretir", "Örgütler ve rejimler işbirliğini kalıcı kılar → mutlak kazanç"], "ar": "الليبرالية المؤسسية الجديدة تتفق مع الواقعيين في أن النظام فوضوي والدول أنانية، لكنها تقول: الدول تلتقي مرارًا، ومع تكرار اللعبة تنشأ المعاملة بالمثل (tit-for-tat)، فيصبح التعاون عقلانيًا. والمنظمات والأنظمة الدولية (rejim) مثل الغات (GATT) تجعل هذا التعاون دائمًا."}, {"h": "Marksist düşüncenin temeli", "pts": ["Marksist (radikal) teoriler 20. yüzyılda en <b>radikal alternatif<\/b> oldu. <b>Karl Marx<\/b> (1818–1883) kendisi bir Uİ teorisi <b>yazmadı<\/b>; sonraki yazarlar onun fikirlerinden teori geliştirdi.", "<b>Marx ve Engels<\/b> (1820–1895), <mark>Komünist Manifesto<\/mark>: toplumların tarihi <b>sınıf çatışmasının tarihidir<\/b>.", "İki sınıf: üretim araçlarına sahip <b>burjuva<\/b> ve onlara sahip olmayıp burjuva için çalışan <mark>proletarya<\/mark>. Proletarya devrimi → üretim araçlarında özel mülkiyetin olmadığı <b>komünizm<\/b>.", "Fark: liberallere göre ekonomi işbirliğini açıklayan faktörlerden biri; realistlere göre gücün öğelerinden biri. Marksistlere göre ekonomi <mark>temel açıklayıcı değişkendir<\/mark>.", "Kapitalizm zenginlik için gerekli bir sistem <b>değil<\/b>, eşitsizliğin kaynağıdır."], "chain": ["Toplum ekonomik sınıflara bölünür", "Sınıflar arasında çatışma vardır", "Bu çatışma uluslararası alana taşınır", "→ Uluslararası politikayı ekonomi açıklar"], "ar": "الماركسية تقرأ التاريخ كصراع طبقات: البرجوازية (burjuva) تملك وسائل الإنتاج، والبروليتاريا (proletarya) تعمل عندها. ماركس لم يكتب نظرية في العلاقات الدولية، لكن أتباعه نقلوا هذا الصراع إلى العالم، فصار الاقتصاد عندهم هو المتغير الأساسي الذي يفسر كل شيء."}, {"h": "Lenin ve emperyalizm", "pts": ["Marx’ı uluslararası alana ilk uygulayan: <b>Lenin<\/b> (1870–1924), SSCB’nin ilk lideri.", "<mark>Emperyalizm<\/mark>: Lenin’e göre <b>kapitalizmin en son (en yüksek) aşaması<\/b>; gelişmiş devletlerin ucuz hammadde, işgücü ve fazla mallarına pazar için zayıf ülkeleri sömürgeleştirmesi.", "Lenin sınıf çatışmasını devletler arasına taşıdı: emperyalist ve sömürülen devletler. Pazar arayışı kapitalistler arasında çatışma doğurur; <b>I. Dünya Savaşı<\/b>’nın temel sebebi budur.", "Emperyalizm hiyerarşik bir sistem yaratır ve geri kalmış ülkeleri gelişmişlere <b>bağımlı<\/b> kılar."], "chain": ["Kapitalist ülkede mal fazlası ve kâr ihtiyacı", "Hammadde, işgücü ve pazar için sömürge", "Sömürgeler için kapitalistler çatışır", "→ Emperyalizm = kapitalizmin son aşaması; I. Dünya Savaşı"], "ar": "لينين (Lenin) قال إن الرأسمالية حين تكبر تحتاج مواد خامًا رخيصة وعمالًا وأسواقًا، فتستعمر الدول الضعيفة، وهذه هي الإمبريالية (emperyalizm) «أعلى مراحل الرأسمالية». ثم تتصارع الدول الرأسمالية على المستعمرات، وهذا عنده سبب الحرب العالمية الأولى."}, {"h": "Bağımlılık ve Dünya Sistemleri teorileri", "pts": ["<mark>Bağımlılık Teorisi<\/mark>: öncüleri Raul Prebisch, Dos Santos, Cardoso, Samir Amin, Andre Gunder Frank, Wallerstein. III. Dünya’nın geri kalmışlığının nedeni <b>sermaye ve teknoloji açısından gelişmiş ülkelere bağımlılığıdır<\/b>.", "<b>1960’lardan sonra<\/b> liberal <b>Modernleşme Teorisi<\/b>’ne (ekonomik gelişme kapitalizmle olur) eleştiri olarak doğdu; Latin Amerikalı düşünürler etkili oldu.", "<mark>Neokolonyalizm<\/mark>: sömürgeciliğin doğrudan işgalle değil, <b>siyasi, ekonomik ve kültürel araçlarla dolaylı<\/b> sürmesi. Yasal bağımsızlık var ama ekonomik bağımlılık sürer: IMF ve Dünya Bankası borçlarının koşulları, kârın çokuluslu şirketlerle ana ülkeye transferi.", "<mark>Dünya Sistemleri Teorisi<\/mark> (<b>Immanuel Wallerstein<\/b>): <b>kapitalizm sistemik ve evrenseldir<\/b>. 16. yüzyılda Avrupa’da doğan kapitalist dünya ekonomisinin üç konumu: <b>merkez<\/b> (zengin, mamul madde), <b>çevre/periferi<\/b> (yoksul, hammadde), <b>yarı-çevre<\/b>. Merkez çevreyi sömürür; fark giderek büyür.", "Wallerstein neorealizm gibi <b>sistemik<\/b> düşünür ama yapıyı <b>ekonomik<\/b> tanımlar (neorealizmde yapı siyasidir) → <b>yapısalcı yaklaşım<\/b>. Devletler ulusal çıkarı değil baskın sınıfın (kapitalistlerin) çıkarını temsil eder.", "<ex>Örnek: Bir ülke kakao çekirdeğini ucuza satar, başka bir ülke onu çikolata yapıp pahalıya satar. Wallerstein’a göre ilki çevre, ikincisi merkezdir ve aradaki fark sistemin özüdür.<\/ex>"], "chain": ["Sömürgeler hukuken bağımsız oldu", "Ama sermaye ve teknoloji için zengin ülkelere muhtaç kaldı", "Hammadde ucuza gider, mamul pahalıya gelir", "Merkez–çevre farkı büyür → bağımlılık sürer"], "ar": "نظرية التبعية (Bağımlılık) تقول إن دول العالم الثالث استقلت سياسيًا لكنها بقيت تابعة اقتصاديًا، وهذا هو الاستعمار الجديد (neokolonyalizm). وفالرشتاين (Wallerstein) قسّم الاقتصاد العالمي الرأسمالي إلى مركز غني وأطراف فقيرة وشبه أطراف، والمركز يستغل الأطراف باستمرار."}, {"h": "Eleştirel Teori ve Gramsci’nin hegemonyası", "pts": ["<mark>Eleştirel Teori<\/mark>: <b>1920’lerde Frankfurt<\/b>’ta toplanan entelektüellerin çalışmalarına dayanır (<b>Frankfurt Okulu<\/b>). Kitabın saydığı öncüler: Antonio Gramsci, Max Horkheimer, Theodor Adorno, Walter Benjamin, Herbert Marcuse, Erich Fromm, Leo Lowenthal, Jürgen Habermas.", "Varsayımları: dünyayı anlamak için önce kapitalizmin ekonomik ve sosyal güçlerini anlamalıyız; devlet ve kurumlar kapitalizmi destekleme işlevleriyle incelenmeli; <b>tüm bilgi ideolojiktir<\/b>; kültür ve ideoloji düzeni destekleyen veya ona meydan okuyan araçlardır; uluslararası politika statükoyu destekleyen ve ona karşı çıkan sosyal gruplar arasında bir mücadeledir; <b>bilgi insanlığın kurtuluşuna adanmalıdır<\/b>.", "Uİ’ye girişi: <mark>1980’ler, Robert Cox<\/mark>. Cox, İtalyan komünist <b>Antonio Gramsci<\/b>’den etkilenip onun <b>hegemonya<\/b> kavramını Uİ’ye taşıdı.", "<b>Gramsci<\/b> (1891–1937): devrim sanayi ülkesinde değil tarım toplumu Rusya’da olunca klasik Marksizmi eleştirdi. <mark>Hegemonya<\/mark>: kapitalist sınıfın yönetimini çalışan sınıfa <b>fikir ve ideolojiyle<\/b> benimsetmesi; baskıdan çok <b>rızaya<\/b> dayanır; popüler kültür, eğitim, medya, sanat ve partilerle yürür.", "Cox’a göre küreselleşmeyle baskın ekonomik gruplar küresel örgütlenir, çalışanlar ise milliyet, etnisite, sınıf ve cinsiyetle bölünür.", "Marksizme eleştiriler: sadece ekonomiye bakar (feministler cinsiyeti görmediğini söyler); kapitalist ve sosyalist devletler arasındaki işbirliğini ve Kore, Tayvan gibi ülkelerin bağımlılıktan kurtuluşunu açıklayamaz.", "Morgenthau eleştirel teorisyen <b>değildir<\/b>."], "chain": ["Devrim beklenen yerde çıkmadı", "Gramsci: kapitalistler fikirlerle rıza üretiyor (hegemonya)", "Cox bu kavramı Uİ’ye taşıdı (1980’ler)", "→ Bilgi tarafsız değil, ideolojiktir"], "ar": "النظرية النقدية (Eleştirel Teori) وُلدت في مدرسة فرانكفورت في العشرينيات، ودخلت العلاقات الدولية مع روبرت كوكس (Cox) في الثمانينيات. أخذ كوكس من غرامشي فكرة الهيمنة (hegemonya) بمعنى السيطرة عبر الأفكار والإعلام والتعليم حتى يقبل الناس النظام برضاهم، لا بالقوة."}, {"h": "İnşacılık", "pts": ["Soğuk Savaş’ın sonunda realizmin <b>materyalist<\/b> yaklaşımını ve sistemik değişimi açıklayamamasını eleştirerek doğdu.", "<mark>Sosyal İnşacılık<\/mark> (<b>Alexander Wendt<\/b>): kolektif kimlikler <b>sistemik etkileşimle<\/b> oluşabilir. Wendt bazı realist varsayımları kabul eder ama yapı, değişim, kimlik ve çıkarda ayrılır.", "Sistemin yapısı <b>maddi değil sosyaldir<\/b>. Sosyal yapının üç öğesi: <b>ortak bilgi<\/b> (paylaşılan bilgi, beklenti, normlar), <b>maddi kaynaklar<\/b> (sosyalleşmiş: anlamı dost/düşman imajına bağlı), <b>uygulamalar<\/b>.", "Kitabın örneği: <b>İran’ın nükleer çalışmaları<\/b> Türkiye için tehdit değil, ABD için tehdittir; çünkü birine dost, diğerine düşmandır.", "Yapı ve aktör <mark>birbirini karşılıklı inşa eder<\/mark>: yapı davranışı etkiler, aktörler de eylemleriyle yapıyı değiştirebilir (neorealizmde yapı aktörü tek yönlü belirler).", "Üç kültür: <b>Hobbesçu<\/b> (herkes düşman), <b>Lockeçu<\/b> (rakip), <b>Kantçı<\/b> (dost, işbirliği). Sistemik değişim = hâkim norm ve fikirlerin değişmesiyle olan <b>kültürel değişim<\/b>.", "Kimlik yapı tarafından <b>dayatılmaz<\/b>, <b>etkileşimden<\/b> doğar: iyi etkileşim → kolektif kimlik; kötü etkileşim → bencil kimlik. <mark>Önce kimlik, sonra çıkar<\/mark>: kim olduğunu bilmeden çıkarını bilemezsin.", "Kolektif kimliği etkileyen üç faktör: (1) uluslararası veya bölgesel alt sistemin <b>yapısı<\/b>; (2) <b>sistemik süreçler<\/b> (karşılıklı bağımlılığın derecesi, değerlerin yakınlığı); (3) <b>stratejik uygulama<\/b> (davranışsal ve söylemsel).", "<mark>Aktör-Temelli İnşacılık<\/mark>: Sosyal İnşacılığın sistemik yaklaşımını eleştirir; <b>ulusal kimliği<\/b> ve siyasi elitin inançlarını öne çıkarır. Devletlerin iki kimliği vardır: sistemik ve ulusal.", "Eleştiriler: fikirlerin neden değiştiğini açıklayamaz; metodolojisi belirsizdir; her şey sübjektif olduğundan genel bir teori kurulamaz."], "chain": ["Devletler etkileşime girer", "Etkileşimin niteliği kimliği kurar (kolektif ya da bencil)", "Kimlik çıkarı belirler", "Paylaşılan normlar değişirse sistem de değişir"], "ar": "البنائية الاجتماعية (sosyal inşacılık) مع فندت (Wendt) تقول إن بنية النظام الدولي اجتماعية لا مادية فقط: السلاح نفسه يعني شيئًا مختلفًا بحسب من يملكه، فنووي إيران يقلق أمريكا لا تركيا لأن الأولى تراها عدوًا. والهوية تُبنى بالتفاعل، ثم تحدد المصلحة، أي أنك لا تعرف ماذا تريد قبل أن تعرف من أنت."}, {"h": "Feminizm", "pts": ["1980’lerden itibaren tartışmaya katıldı. Ortak nokta: uluslararası politikada <mark>cinsiyet<\/mark> önemlidir ama göz ardı edilmiştir.", "Geleneksel teorilerin evrensel saydığı varsayımlar sadece <b>erkekler<\/b> için geçerlidir; realizmin <b>devlet, güç, anarşi, çıkar, egemenlik<\/b> kavramları erkeklerin etkileşim biçimini ve bakışını yansıtır.", "Cinsiyet ayrımcılığı erkeklerin en üstte olduğu hiyerarşiler yarattı ve kadınların katkısını görmezden geldi.", "Kadınlar da erkekler kadar etkilidir, ama etkileri <b>resmi değil, gayriresmi ve devlet dışı<\/b> kanallardan gelir.", "Dışlanmanın temel nedeni: politikanın <mark>geleneksel olarak erkek işi sayılması<\/mark>; bu bir <b>sosyal inşa<\/b>dır: roller cinsiyete göre dağıtılır, erkek kamusal-siyasi alana, kadın özel alana yönlendirilir.", "Feministlere göre kadın değerlerinin hâkim olduğu bir sistem daha barışçı olurdu (Ünite 2)."], "chain": ["Toplum rolleri cinsiyete göre dağıtır", "Siyaset erkek işi sayılır", "Teoriler erkek deneyimini evrensel sanır", "→ Kadınların katkısı görünmez olur"], "ar": "النسوية (feminizm) ترى أن مفاهيم الدولة والقوة والسيادة صيغت بعيون الرجال، لأن المجتمع اعتبر السياسة «عمل الرجال» تقليديًا. والنساء مؤثرات فعلًا، لكن عبر قنوات غير رسمية وغير حكومية، فلا يراهن الباحثون التقليديون."}], "tip": "Her kurama bir kelime: <b>Realizm = güç<\/b>, <b>Liberalizm = işbirliği<\/b>, <b>Marksizm = ekonomi<\/b>, <b>İnşacılık = kimlik<\/b>, <b>Feminizm = toplumsal cinsiyet<\/b>. İsim çapaları: Kant (Daimi Barış), Bentham (faydacılık), Lenin (emperyalizm), Wallerstein (merkez-çevre), Cox ← Gramsci (hegemonya), Wendt (sosyal inşacılık).", "tipAr": "لكل نظرية كلمة: الواقعية = القوة، الليبرالية = التعاون، الماركسية = الاقتصاد، البنائية = الهوية، النسوية = النوع الاجتماعي. واربط كل اسم بفكرته: كانط بالسلام الدائم، ولينين بالإمبريالية، وفالرشتاين بالمركز والأطراف، وكوكس بغرامشي، وفندت بالبنائية.", "trap": "“İnsan doğası kötü ve bencildir” <b>realist<\/b> bir varsayımdır, asla liberal değil. Demokratik barış = demokrasiler <b>birbirleriyle<\/b> savaşmaz; “hiç savaşmaz” değil. Neoliberaller <b>mutlak<\/b> kazançla ilgilenir; göreceli kazanç realistlerin kaygısıdır. Wendt inşacıdır, Marksist değil. Morgenthau liberal öncü ya da eleştirel teorisyen <b>değildir<\/b>. Gramsci’nin hegemonyası <b>fikir ve rızaya<\/b>, realistlerin hegemonyası <b>maddi güce<\/b> dayanır. Dünya Sistemleri’nde yapı <b>ekonomik<\/b>, neorealizmde <b>siyasidir<\/b>.", "trapAr": "«الإنسان شرير وأناني» افتراض واقعي لا ليبرالي. والسلام الديمقراطي يعني أن الديمقراطيات لا تتحارب فيما بينها فقط، لا أنها لا تحارب أبدًا. والهيمنة عند غرامشي (Gramsci) قائمة على الأفكار والرضا، أما عند الواقعيين فقائمة على القوة المادية. والبنية عند فالرشتاين اقتصادية، وعند فالتز سياسية.", "terms": [["Liberalizm", "İşbirliğinin mümkün olduğunu, bireyin önemli olduğunu savunan yaklaşım", "الليبرالية"], ["Stoacılık", "Tüm insanların büyük tek bir topluluk olduğunu savunan Antik Yunan akımı", "الرواقية: وحدة البشر"], ["Klasik liberalizm", "Bireyi ve özgürlüğünü merkeze alan 17. yüzyıl düşüncesi", "الليبرالية الكلاسيكية: الفرد أولًا"], ["Faydacılık", "Doğru davranış herkesin refahını ve mutluluğunu artırandır", "النفعية (بنثام)"], ["Plüralist", "Birçok aktörü (devlet, birey, örgüt) kabul eden bakış", "تعددي: فاعلون كثيرون"], ["İdealizm", "Wilson’ın, savaşların kurumlarla önlenebileceği görüşü", "المثالية"], ["Kolektif savunma", "Devletlerin ittifakla birbirini koruma sözü vermesi", "الدفاع الجماعي: تحالف"], ["Kolektif güvenlik", "Büyük devletlerin sistemi saldırgana karşı birlikte koruması", "الأمن الجماعي"], ["Demokratik barış", "Demokrasilerin birbirleriyle savaşmadığı görüşü", "السلام الديمقراطي"], ["Neoliberal kurumsalcılık", "Anarşide de örgütlerle işbirliğinin mümkün olduğunu söyleyen teori", "الليبرالية المؤسسية الجديدة"], ["Karşılıklılık (tit-for-tat)", "Karşı tarafın ilk hamlesine aynısıyla cevap verme ilkesi", "المعاملة بالمثل"], ["Rejim (uluslararası)", "Bir alandaki davranışı düzenleyen kurallar, normlar, ilkeler", "النظام الدولي: قواعد مجال معين"], ["Karşılıklı bağımlılık", "Ticaret ve sermayeyle birbirine bağlanan devletlerin savaştan kaçınması", "الاعتماد المتبادل"], ["Ulusaşırıcılık", "Şirket ve sivil örgütlerin sınırları ve egemenliği aşan faaliyetleri", "العبور القومي"], ["Burjuva", "Üretim araçlarına sahip kapitalist sınıf", "البرجوازية: مالكو وسائل الإنتاج"], ["Proletarya", "Üretim aracı olmayan, burjuvaya çalışan işçi sınıfı", "البروليتاريا: الطبقة العاملة"], ["Komünizm", "Üretim araçlarında özel mülkiyetin olmadığı düzen", "الشيوعية: لا ملكية خاصة لوسائل الإنتاج"], ["Emperyalizm", "Lenin: kapitalizmin son aşaması; sömürgeleştirme politikası", "الإمبريالية: أعلى مراحل الرأسمالية"], ["Bağımlılık teorisi", "Yoksul ülkelerin geri kalmasını zengin ülkelere bağımlılıkla açıklayan teori", "نظرية التبعية"], ["Modernleşme teorisi", "Gelişmenin kapitalizmle olacağını söyleyen liberal teori", "نظرية التحديث"], ["Neokolonyalizm", "Sömürgeciliğin ekonomik ve kültürel araçlarla dolaylı sürmesi", "الاستعمار الجديد"], ["Merkez – çevre – yarı-çevre", "Wallerstein: zengin, yoksul ve arada kalan ülkeler", "المركز والأطراف وشبه الأطراف"], ["Eleştirel teori", "Frankfurt Okulu kökenli, bilginin ideolojik olduğunu söyleyen teori", "النظرية النقدية"], ["Hegemonya (Gramsci)", "Egemen sınıfın fikirlerle rıza üreterek yönetmesi", "الهيمنة الثقافية عند غرامشي"], ["Sosyal inşacılık", "Yapının sosyal olduğunu, kimliğin etkileşimle kurulduğunu söyleyen teori", "البنائية الاجتماعية"], ["Kolektif kimlik", "Devletlerin kendilerini bir grubun parçası olarak görmesi", "الهوية الجماعية"], ["Aktör-temelli inşacılık", "Ulusal kimliğe ve elitlerin inancına odaklanan inşacılık", "البنائية المتمركزة حول الفاعل"], ["Toplumsal cinsiyet", "Toplumun kadın ve erkeğe yüklediği roller", "النوع الاجتماعي (الجندر)"]]}], "cards": [[1, "Uluslararası politika", "Uluslararası aktörler arasındaki politik ilişkileri inceleyen alt disiplin.", "السياسة الدولية: البعد السياسي فقط"], [1, "İç egemenlik", "Devletin ülkesinde yegâne kuvvet kullanma yetkisine sahip olması.", "السيادة الداخلية: الدولة وحدها تستعمل القوة"], [1, "Dış egemenlik", "Devletin uluslararası sistemdeki bağımsızlığı.", "السيادة الخارجية: استقلال الدولة في النظام الدولي"], [1, "Hegemonya", "En güçlü devletin sistem üzerinde kendi hâkimiyetini kurma ve koruma arzusu.", "الهيمنة: رغبة الأقوى في السيطرة على النظام"], [1, "Gevşek çift kutuplu sistem", "Soğuk Savaş: iki süper güç ve etrafında kutuplaşmış devletler.", "ثنائية قطبية مرنة: قطبان ودول محايدة"], [1, "Bağlantısızlar Hareketi", "Nehru, Nasır, Tito, Sukarno; iki bloka da katılmayanlar.", "عدم الانحياز: نهرو، عبد الناصر، تيتو، سوكارنو"], [1, "Davranışçılık", "Sosyal bilimlerde doğa bilimlerinin yöntemlerini savunur.", "السلوكية: مناهج العلوم الطبيعية في السياسة"], [1, "Reflektivist teoriler", "Bilimsel model yerine kimlik, algı ve yorumu öne çıkarır.", "التأملية: الهوية والتفسير بدل القياس"], [1, "İlk Uİ kürsüsü", "1919, Aberystwyth (Galler), Wilson adına.", "أول كرسي للعلاقات الدولية: ويلز 1919"], [1, "Diplomatik usulleri belirleyen ilk kongre", "Viyana Kongresi.", "مؤتمر فيينا 1815: أول تنظيم للدب sı güç ve güvenlik.", "ميكافيلي: القوة والأمن"], [3, "Kutupluluk ve istikrar", "Klasik realist: çok kutuplu daha istikrarlı. Neorealist: iki kutuplu daha istikrarlı.", "أي نظام أكثر استقرارًا؟"], [3, "Rasyonelliğin üç sonucu", "Yekpare aktör; çıkarları sıralayabilme; fayda-maliyet analizi.", "ثلاث نتائج للعقلانية"], [4, "Stoacılık", "MÖ 300; tüm insanlar daha büyük bir topluluğun parçası (evrensellik); Grotius ve Kant’ı etkiledi.", "الرواقية: أصل فكرة العالمية"], [4, "Klasik liberalizmin çıkış noktası", "Birey ve bireyin özgürleşmesi; en önemli düşünür John Locke.", "الفرد نقطة انطلاق الليبرالية"], [4, "Jeremy Bentham", "Faydacıların öncüsü; bireyler rasyonel aktörlerdir.", "بنثام: النفعية والفرد العاقل"], [4, "Kant: Daimi Barış", "Devlet kurgusaldır; cumhuriyetlerden oluşan gevşek federasyon; Demokratik Barış’ın ilham kaynağı.", "كانط: الدولة كيان متخيَّل"], [4, "Kolektif savunma – kolektif güvenlik", "Savunma: ittifakla karşılıklı koruma. Güvenlik: büyük devletlerin sistemi saldırgana karşı birlikte koruması.", "الفرق بين الدفاع الجماعي والأمن الجماعي"], [4, "Tit-for-tat (karşılıklılık)", "Tekrarlanan Mahkûmların İkilemi’nde ilk işbirliği hamlesi karşılık görür → işbirliği rasyonel.", "المعاملة بالمثل تجعل التعاون عقلانيًا"], [4, "Uluslararası rejim", "Belli alanda davranışı düzenleyen kurallar, normlar, ilkeler; örnek GATT.", "النظام الدولي: قواعد متفق عليها"], [4, "Komünist Manifesto", "Marx ve Engels: toplumların tarihi sınıf çatışmasının tarihidir.", "البيان الشيوعي: تاريخ صراع الطبقات"], [4, "Proletarya", "Üretim araçlarına sahip olmayan, burjuva için çalışan sınıf.", "البروليتاريا: الطبقة العاملة"], [4, "Neokolonyalizm", "Sömürgeciliğin doğrudan işgal yerine siyasi, ekonomik ve kültürel araçlarla dolaylı sürmesi.", "الاستعمار غير المباشر"], [4, "Gramsci’nin hegemonyası", "Kapitalist sınıfın yönetimini fikir ve ideolojiyle, rızaya dayanarak sürdürmesi.", "الهيمنة بالأفكار والرضا"], [4, "Wendt’in üç kültürü", "Hobbesçu (düşman), Lockeçu (rakip), Kantçı (dost).", "ثلاث ثقافات: عدو، منافس، صديق"], [4, "Kolektif kimliği etkileyen üç faktör", "Alt sistemin yapısı; sistemik süreçler (karşılıklı bağımlılık, değer yakınlığı); stratejik uygulama.", "عوامل تكوين الهوية الجماعية"], [4, "Aktör-Temelli İnşacılık", "Sosyal inşacılığın sistemik yaklaşımını eleştirir; ulusal kimliğe odaklanır.", "بنائية تركّز على الهوية الوطنية"], [4, "Neoliberallerin kabul ettiği realist varsayımlar", "Sistem anarşiktir; devletler bencil, rasyonel ve yekparedir.", "ما يقبله الليبراليون الجدد من الواقعية"]], "qs": [{"u": 1, "q": "Uluslararası politika, uluslararası ilişkilerin hangi boyutunu inceler?", "o": ["Ekonomik", "Politik", "Sportif", "Kültürel", "Tarihi"], "a": 1, "e": "Uluslararası politika, Uİ’nin yalnızca politik boyutuyla ilgilenir. Ekonomi, kültür ve spor Uİ’nin geniş alanına girer ama uluslararası politikanın konusu değildir.", "ar": "السياسة الدولية تأخذ من العلاقات الدولية جانبها السياسي (politik) فقط. أما الاقتصاد والثقافة والرياضة فهي داخل العلاقات الدولية الواسعة، وهي فخاخ لأنها كلها «دولية» لكنها ليست «سياسية»."}, {"u": 1, "q": "Ulus devletin ortaya çıkışı için milat kabul edilen antlaşma hangisidir?", "o": ["Versay", "Paris", "Viyana", "Westphalia", "Trianon"], "a": 3, "e": "Otuz Yıl Savaşları’nı bitiren Westphalia (1648) ulus devletin miladıdır. Viyana 1815’te diplomatik usulleri belirledi; Versay ve Trianon I. Dünya Savaşı sonrasıdır.", "ar": "صلح وستفاليا (Westphalia) سنة 1648 اعترف بسيادة الإمارات الألمانية، فوُلدت الدولة القومية. أما فيينا فمرتبطة بالدبلوماسية، وفرساي وتريانون جاءتا بعد الحرب الأولى بثلاثة قرون تقريبًا."}, {"u": 1, "q": "Aşağıdakilerden hangisi diplomasi biliminin gelişmesine katkıda bulunan düşünürlerden biri değildir?", "o": ["Machiavelli", "Guicciardini", "Grotius", "Wicquefort", "Kant"], "a": 4, "e": "Kitap diplomasiye katkı verenler arasında Machiavelli, Guicciardini, Grotius, Wicquefort, Richelieu, Callières ve Satow’u sayar. Kant idealizmin ve barışın düşünürüdür, diplomasi listesinde yoktur.", "ar": "كانط (Kant) مشهور بفكرة السلام الدائم، لذلك يظن الطالب أنه ساهم في الدبلوماسية. لكن الكتاب لا يذكره بين مفكري الدبلوماسية، بينما يذكر ميكافيلي وغروتيوس وغيرهما."}, {"u": 1, "q": "Diplomatik usullerin belirlendiği ilk uluslararası kongre hangisidir?", "o": ["Viyana Kongresi", "Paris Barış Kongresi", "Berlin Kongresi", "Aix-la-Chapelle", "Troppau"], "a": 0, "e": "Diplomatik usuller ve yargı bağışıklığı 1815 Viyana Kongresi ile uluslararası norm hâline geldi. Paris ve Berlin kongreleri daha sonraki siyasi düzenlemelerdir.", "ar": "مؤتمر فيينا (Viyana Kongresi) سنة 1815 هو أول مؤتمر وضع قواعد العمل الدبلوماسي، ومنه صارت حصانة الدبلوماسيين قاعدة دولية. بقية المؤتمرات كانت لتسويات سياسية."}, {"u": 1, "q": "Aşağıdakilerden hangisi klasik realist düşünürler arasında yer almaz?", "o": ["Morgenthau", "E. H. Carr", "Spykman", "Kennan", "Alexander Wendt"], "a": 4, "e": "Morgenthau, Carr, Spykman ve Kennan klasik realisttir. Alexander Wendt sosyal inşacılığın kurucusudur.", "ar": "فندت (Wendt) مؤسس البنائية الاجتماعية (sosyal inşacılık)، التي تركّز على الهوية لا على القوة. لذا فهو الوحيد في القائمة الذي ليس واقعيًا كلاسيكيًا."}, {"u": 1, "q": "En güçlü devletin tüm sistem üzerinde hâkimiyet kurma ve koruma arzusuna ne denir?", "o": ["Analiz düzeyi", "Hegemonya", "Gevşek çift kutupluluk", "Güç dengesi", "Sıkı çift kutupluluk"], "a": 1, "e": "Hegemonya, en güçlü devletin tüm sistem üzerinde siyasi hâkimiyetini kurma, sürdürme ve koruma arzusudur. Güç dengesi ise tam tersine tek bir devletin hâkim olmasını önleme politikasıdır.", "ar": "الهيمنة (hegemonya) هي رغبة الدولة الأقوى في السيطرة على النظام كله. أما توازن القوى فهو عكسها تمامًا: منع أي دولة من أن تسيطر وحدها."}, {"u": 1, "q": "Klasik realizm ve idealizmi bilimsel yöntem kullanmamakla eleştiren yaklaşım hangisidir?", "o": ["Eleştirel teori", "Sosyal inşacılık", "Davranışçılık", "Post-yapısalcılık", "Liberal kurumsalcılık"], "a": 2, "e": "Davranışçılar klasik realistleri ve idealistleri “gelenekselci” sayıp bilimsel yöntem kullanmamakla eleştirdi; doğa bilimlerinin yöntemlerini istedi. Eleştirel teori ise tersine bu yöntemleri reddeder.", "ar": "السلوكيون (davranışçılar) أرادوا أن يدرسوا السياسة بالأرقام والإحصاء كعلماء الطبيعة، لذلك انتقدوا الواقعيين والمثاليين بأنهم غير علميين. أما النظرية النقدية فتقف في الجهة المقابلة."}, {"u": 1, "q": "Aşağıdakilerden hangisi disiplinin gelişmesini sağlayan büyük tartışmalardan biri değildir?", "o": ["Klasik Realizm–İdealizm", "Gelenekselcilik–Davranışçılık", "Neorealizm–Neoliberalizm", "Eleştirel teori–Post-yapısalcılık", "Rasyonalist–Reflektivist"], "a": 3, "e": "Dört tartışma: realizm–idealizm, gelenekselcilik–davranışçılık, neorealizm–neoliberalizm, rasyonalist–reflektivist. Eleştirel teori ve post-yapısalcılık aynı (reflektivist) kampın parçalarıdır, birbirleriyle bir “tartışma” oluşturmaz.", "ar": "النظرية النقدية وما بعد البنيوية تقفان في معسكر واحد هو المعسكر التأملي (reflektivist)، فلا يمكن أن تكونا طرفين في نقاش. الفخ أن الاسمين مألوفان فيظنهما الطالب نقاشًا مستقلًا."}, {"u": 1, "q": "Aşağıdakilerden hangisi Bağlantısızlar Hareketi’nin liderlerinden biri değildir?", "o": ["Jivkov", "Nasır", "Tito", "Sukarno", "Nehru"], "a": 0, "e": "Bağlantısızların önde gelen liderleri Nehru, Nasır, Tito ve Sukarno’dur. Jivkov, Sovyet bloku içindeki Bulgaristan’ın lideriydi, yani bağlantısız değildi.", "ar": "جيفكوف (Jivkov) كان زعيم بلغاريا الشيوعية التابعة للمعسكر السوفيتي، فلا يمكن أن يكون من دول عدم الانحياز التي رفضت الانضمام إلى أي معسكر."}, {"u": 1, "q": "Devletin uluslararası sistemdeki bağımsızlığını ifade eden kavram hangisidir?", "o": ["İç egemenlik", "Dış egemenlik", "Ülke bütünlüğü", "Eşitlik", "Saldırmazlık"], "a": 1, "e": "Dış egemenlik devletin uluslararası sistemdeki bağımsızlığıdır. İç egemenlik ise ülke içinde tek kuvvet kullanma yetkisidir; iki kavram en sık karıştırılan çifttir.", "ar": "السيادة الخارجية (dış egemenlik) = استقلال الدولة أمام الدول الأخرى. والسيادة الداخلية = احتكار القوة داخل الحدود. السؤال يتكلم عن «النظام الدولي» فالجواب هو الخارجية."}, {"u": 1, "q": "Soğuk Savaş dönemindeki uluslararası sistem nasıl tanımlanır?", "o": ["Tek kutuplu", "Gevşek çift kutuplu", "Çok kutuplu", "Güç dengesi sistemi", "Hegemonik"], "a": 1, "e": "Soğuk Savaş’ta iki süper güç ve blokları vardı ama Bağlantısızlar dışarıda kalabildiği için sistem gevşek çift kutupludur. Sıkı çift kutuplulukta hiçbir devlet dışarıda kalamazdı.", "ar": "النظام «مرن» (gevşek) لأن بعض الدول استطاعت البقاء خارج المعسكرين. لو كان كل العالم داخل المعسكرين لكان النظام صارمًا (sıkı)."}, {"u": 2, "q": "Hangi teoride devlet uluslararası politikanın yegâne aktörü kabul edilir?", "o": ["Klasik realizm", "Sosyal inşacılık", "Eleştirel teori", "Feminizm", "Oyun teorisi"], "a": 0, "e": "Realizm (ve geleneksel teoriler) devleti yegâne aktör sayar. Sosyal inşacılık, eleştirel teori ve feminizm devlet dışı unsurlara da önem verir.", "ar": "الواقعية الكلاسيكية (klasik realizm) ترى الدولة هي الفاعل الوحيد الحقيقي، وما سواها امتداد لها. أما البنائية والنظرية النقدية والنسوية فتعطي وزنًا للهوية والاقتصاد والنوع الاجتماعي، فهي فخاخ."}, {"u": 2, "q": "Suç oranının yüksek olduğu, vatandaşların devlete güvenini kaybettiği, ekonominin devlet kontrolü dışında olduğu devlete ne denir?", "o": ["Zayıf devlet", "Devlet benzeri", "Çökmüş devlet", "Sömürge devlet", "Vesayet altında devlet"], "a": 2, "e": "Bu tablo, ülkesinde egemenliğini kullanamayan çökmüş devletin tanımıdır. Zayıf devlette düzen işler, sadece güç azdır.", "ar": "الجريمة والفساد وفقدان ثقة المواطنين وخروج الاقتصاد عن سيطرة الدولة كلها علامات الدولة المنهارة (çökmüş devlet). الدولة الضعيفة فخ لأن نظامها يعمل لكن قوتها صغيرة."}, {"u": 2, "q": "Güney Osetya, Filistin, Tayvan ve Kosova hangi kavramla tanımlanır?", "o": ["Zayıf devlet", "Devlet benzeri", "Çökmüş devlet", "Sömürge", "Konfederasyon"], "a": 1, "e": "Bu yapılar devlet kriterlerini taşıyıp bağımsızlık ilan etmiş ama genel olarak tanınmamış ve BM’ye üye olamamıştır: devlet benzeri. Çökmüş devletler ise BM üyesidir ama içeride çökmüştür.", "ar": "هذه الكيانات تملك أرضًا وشعبًا وحكومة لكنها لم تحصل على اعتراف عام ولا على مقعد في الأمم المتحدة، فهي «شبه دول» (devlet benzeri). الدولة المنهارة فخ لأنها معترف بها وعضو أممي لكن داخلها منهار."}, {"u": 2, "q": "Hangisi uluslararası örgütlerin genel özelliklerinden biri değildir?", "o": ["Bir anlaşmayla kurulurlar", "Belirli amaçları vardır", "İlkeler benimserler", "Üyelerini egemen ve eşit sayarlar", "Savaş açma ve barış imzalama yetkileri vardır"], "a": 4, "e": "Örgütler anlaşmayla kurulur, amaç ve ilkeleri vardır, üyelerini genelde egemen ve eşit sayar; ama savaş açma ve barış imzalama gibi devlete özgü yetkileri yoktur.", "ar": "المنظمة الدولية لها أهداف ومبادئ وأجهزة، لكنها لا تملك صلاحيات الدولة السيادية مثل إعلان الحرب أو توقيع السلام. هذه الصلاحيات تبقى بيد الدول الأعضاء."}, {"u": 2, "q": "Hangisi BM’nin ana organlarından biri değildir?", "o": ["Genel Kurul", "Güvenlik Konseyi", "UNICEF", "Ekonomik ve Sosyal Konsey", "Genel Sekreterlik"], "a": 2, "e": "BM’nin ana organları Genel Kurul, Güvenlik Konseyi, ECOSOC, Genel Sekreterlik, Uluslararası Adalet Divanı ve Vesayet Konseyi’dir. UNICEF özel yardımcı organdır.", "ar": "يونيسف (UNICEF) مشهورة جدًا فيظنها الطالب جهازًا رئيسيًا، لكنها في الكتاب «جهاز فرعي خاص». الأجهزة الرئيسية ستة: الجمعية العامة ومجلس الأمن والمجلس الاقتصادي والاجتماعي والأمانة العامة ومحكمة العدل ومجلس الوصاية."}, {"u": 2, "q": "Uluslararası örgütler üyelerine göre nasıl sınıflandırılır?", "o": ["Hükümetlerarası – hükümetler-dışı", "Devletlerarası – uluslarötesi", "Hükümetlerarası – devletlerarası", "Bölgesel – küresel", "Askeri – ekonomik"], "a": 0, "e": "Üyelerine göre ayrım: üyeleri devletler olan hükümetlerarası ve üyeleri gruplar olan hükümetler-dışı örgütler. Bölgesel–küresel coğrafi, askeri–ekonomik ise fonksiyon kriteridir.", "ar": "السؤال عن التصنيف حسب الأعضاء: إن كانوا دولًا فهي حكومية (hükümetlerarası)، وإن كانوا أفرادًا وجماعات فهي غير حكومية. أما إقليمي/عالمي فتصنيف جغرافي، وعسكري/اقتصادي تصنيف وظيفي."}, {"u": 2, "q": "Hangisi hükümetler-dışı uluslararası örgüt sayılamaz?", "o": ["Uluslararası Af Örgütü", "Sınır Tanımayan Doktorlar", "Kızılhaç", "NATO", "Uluslararası Olimpiyat Komitesi"], "a": 3, "e": "NATO’nun üyeleri devletlerdir; yani hükümetlerarası bir askeri örgüttür. Af Örgütü, Sınır Aşan Doktorlar, Kızılhaç ve Olimpiyat Komitesi hükümetler-dışıdır.", "ar": "حلف الناتو (NATO) أعضاؤه دول، فهو منظمة حكومية عسكرية. بقية الخيارات منظمات يشارك فيها الأفراد والجمعيات، فهي غير حكومية."}, {"u": 2, "q": "Çokuluslu şirketler nasıl sınıflandırılır?", "o": ["Hükümetlerarası – hükümetler-dışı", "Uluslararası – uluslaraşırı", "Devletlerarası – uluslarötesi", "Bölgesel – küresel", "Kamu – özel"], "a": 1, "e": "Kitap çokuluslu şirketleri uluslararası nitelikte (ortakları devletler) ve uluslaraşırı (ortakları farklı ülke vatandaşları) olarak ayırır. Hükümetlerarası–hükümetler-dışı ayrımı örgütler içindir.", "ar": "الفخ هنا أن تصنيف المنظمات (حكومية/غير حكومية) يُنقل خطأً إلى الشركات. الشركات تُصنَّف إلى دولية (uluslararası) شركاؤها حكومات، وعابرة للقوميات (uluslaraşırı) شركاؤها أفراد من دول مختلفة."}, {"u": 2, "q": "FKÖ, UÇK ve Hindistan Ulusal Kongresi hangi aktör türündedir?", "o": ["Terör örgütleri", "Ulusal kurtuluş hareketleri", "Lobiler", "Baskı grupları", "Bağlantısızlar"], "a": 1, "e": "FKÖ, UÇK ve Hindistan Ulusal Kongresi kitapta ulusal kurtuluş hareketi örneğidir. UÇK’nin bazı eylemleri terör sayılsa da hareketin kendisi meşru kabul edilir.", "ar": "منظمة التحرير الفلسطينية وجيش تحرير كوسوفو والمؤتمر الوطني الهندي أمثلة الكتاب على حركات التحرر الوطني (ulusal kurtuluş hareketleri). خيار الإرهاب فخ لأن بعض الدول تصف هذه الحركات به لأسباب سياسية."}, {"u": 2, "q": "Bir birimin aktör sayılması için gereken iki ölçüt hangisidir?", "o": ["Toprak ve nüfus", "Özerk eylem ve diğerlerini etkileyebilme", "Tanınma ve BM üyeliği", "Ordu ve bütçe", "Anayasa ve hükümet"], "a": 1, "e": "Aktör olmanın iki temel ölçütü özerk eylem yapabilme ve diğer aktörleri etkileyebilmedir. Tanınma ve BM üyeliği devletliğin kurucu unsuru bile sayılmaz.", "ar": "معيارا الفاعل هما الاستقلال في الفعل (özerk eylem) والقدرة على التأثير في الآخرين. الأرض والسكان والاعتراف عناصر للدولة، لكن الفاعل قد يكون شركة أو منظمة بلا أرض."}, {"u": 3, "q": "Hangisi realist düşünceye katkıda bulunan düşünürlerden biri kabul edilemez?", "o": ["Thucydides", "Machiavelli", "Hobbes", "Morgenthau", "Rousseau"], "a": 4, "e": "Thucydides, Machiavelli, Hobbes ve Morgenthau realist düşüncenin kaynaklarıdır. Rousseau kitapta bu listede yer almaz.", "ar": "ثوسيديدس وميكافيلي وهوبز ومورغنثاو كلهم في سلسلة الفكر الواقعي. روسو (Rousseau) فيلسوف شهير أيضًا، لكنه ليس من مصادر الواقعية في الكتاب، وهذا هو الفخ."}, {"u": 3, "q": "Hangisi klasik realizm için söylenemez?", "o": ["Devlet davranışının sebebi sistemin yapısıdır", "Uluslararası politika güç mücadelesidir", "Sistem anarşidir", "En önemli aktörler devletlerdir", "Ulusal çıkar güç olarak tanımlanır"], "a": 0, "e": "Davranışın sebebini sistemin yapısında görmek Waltz’ın neorealizmine aittir. Klasik realizm sebebi insan doğasında görür; diğer ifadeler klasik realizm için doğrudur.", "ar": "الواقعية الكلاسيكية تفسر الصراع بالطبيعة البشرية، أما تفسيره ببنية النظام (sistemin yapısı) فهو الواقعية الجديدة عند فالتز. بقية الخيارات صحيحة للكلاسيكية."}, {"u": 3, "q": "Hangisi güç öğesi kabul edilemez?", "o": ["Nüfus", "Diplomasi yeteneği", "Askeri güç", "Uluslararası örgütlere üyelik", "Doğal kaynaklar"], "a": 3, "e": "Nüfus, diplomasi, askeri güç ve doğal kaynaklar güç öğesidir. Uluslararası örgütlere üyelik kitapta güç öğesi sayılmaz.", "ar": "عضوية المنظمات الدولية ليست من عناصر القوة الوطنية في الكتاب. أما الدبلوماسية فعنصر غير مادي، والسكان والموارد عناصر مادية، والجيش أهمها."}, {"u": 3, "q": "Hangisi fiziki bir güç öğesi değildir?", "o": ["Nüfus", "Askeri güç", "Ulusal moral", "Ekonomi", "Doğal kaynaklar"], "a": 2, "e": "Ulusal moral soyut, yani fiziki olmayan bir güç öğesidir. Nüfus, askeri güç, ekonomi ve doğal kaynaklar fiziki öğelerdir.", "ar": "المعنويات الوطنية (ulusal moral) شيء لا يُلمس ولا يُعدّ، فهي عنصر غير مادي. أما السكان والجيش والاقتصاد والموارد فكلها أشياء ملموسة يمكن قياسها."}, {"u": 3, "q": "Realistlere göre en önemli güç öğesi hangisidir?", "o": ["Ekonomi", "Coğrafya", "Doğal kaynaklar", "Ulusal moral", "Askeri güç"], "a": 4, "e": "Realistler güvenliğe önem verdiği için askeri güce öncelik verir; diğer öğeler askeri güce dönüştürüldükleri ölçüde önemlidir. Ekonomi önemli ama araçtır.", "ar": "الواقعيون يقدمون الأمن على كل شيء، ولذلك فالقوة العسكرية (askeri güç) أهم عنصر عندهم. الاقتصاد فخ لأنه مهم، لكنه عندهم وسيلة لبناء الجيش."}, {"u": 3, "q": "Realistlere göre uluslararası sistemin anarşi olması ne demektir?", "o": ["Sürekli savaş", "Sürekli kaos", "Devletlerin üzerinde üst otoritenin olmaması", "Büyüklerin küçükleri ezmesi", "Bir hegemonun olması"], "a": 2, "e": "Anarşi, devletlerin üzerinde kural koyacak bir üst otoritenin olmamasıdır. Realistler bunun sürekli savaş ya da kaos anlamına gelmediğini özellikle vurgular.", "ar": "الفوضى (anarşi) عند الواقعيين لا تعني حربًا دائمة ولا خرابًا، بل تعني غياب سلطة عليا تضع القواعد فوق الدول. خيارا «الحرب الدائمة» و«الفوضى المستمرة» فخان يعتمدان على المعنى اليومي للكلمة."}, {"u": 3, "q": "Hangisi neorealizmin varsayımı değildir?", "o": ["Uluslararası politika güç mücadelesidir", "En önemli aktörler devletlerdir", "Güç arayışının temel sebebi insan doğasıdır", "Sistemin yapısı davranışı belirler", "Sistem anarşidir"], "a": 2, "e": "Neorealizm güç arayışını insan doğasına değil, sistemin yapısına bağlar. Diğer ifadeler (güç mücadelesi, devletler, yapı, anarşi) neorealizm için doğrudur.", "ar": "الواقعية الجديدة رفضت تفسير الصراع بالطبيعة البشرية، وهذا بالضبط ما يميزها عن الكلاسيكية. لذلك عبارة «سبب السعي للقوة هو الطبيعة البشرية» ليست من افتراضاتها."}, {"u": 3, "q": "Neoklasik realistlere göre dış politika davranışları neden etkilenir?", "o": ["Sadece sistemden", "Sadece iç faktörlerden", "Sadece liderlerden", "Hem sistemik hem iç faktörlerden", "Sadece ekonomiden"], "a": 3, "e": "Neoklasik realistlere göre dış politika hem sistemik baskılardan hem iç politik faktörlerden etkilenir. “Sadece sistem” neorealizmin görüşüdür.", "ar": "الواقعية الكلاسيكية الجديدة (neoklasik) تجمع المستويين: ضغط النظام الدولي والعوامل الداخلية كإدراك القادة. خيار «النظام فقط» فخ لأنه رأي الواقعية الجديدة."}, {"u": 3, "q": "Hangisi savunmacı realizmin varsayımı değildir?", "o": ["Uygun miktarda güç aranmalı", "Ilımlı politikalar daha iyidir", "Savunma saldırıdan avantajlıdır", "Saldırı savunmadan avantajlıdır", "Güç peşinde koşmak dengelemeyi tetikler"], "a": 3, "e": "Savunmacı realistlere göre saldırı-savunma dengesi savunmadan yanadır. “Saldırı daha avantajlıdır” ve “ilk saldıran kazanır” saldırgan realizmin görüşüdür.", "ar": "الواقعية الدفاعية ترى أن الدفاع أسهل وأربح من الهجوم، لذا تدعو إلى سياسة معتدلة. القول بأن الهجوم أفضل هو رأي الواقعية الهجومية، فهو ليس من افتراضات الدفاعية."}, {"u": 3, "q": "Bir devletin savunma tedbirlerinin diğer devletçe tehdit algılanıp herkesin güvensizleşmesine ne denir?", "o": ["Güç dengesi", "Güvenlik ikilemi", "Kolektif güvenlik", "Hegemonya", "Caydırıcılık"], "a": 1, "e": "Güvenlik ikilemi, bir devletin savunma amaçlı tedbirlerinin diğerince tehdit algılanması ve herkesin daha güvensiz olmasıdır. Kolektif güvenlik ise liberal bir mekanizmadır.", "ar": "المعضلة الأمنية (güvenlik ikilemi): أشتري سلاحًا لأحمي نفسي، فيخاف جاري ويتسلح، فنصبح كلانا أقل أمنًا. الأمن الجماعي فخ لأنه حل ليبرالي لا مشكلة واقعية."}, {"u": 3, "q": "“Theory of International Politics” (1979) adlı eserle neorealizmi kuran düşünür kimdir?", "o": ["Morgenthau", "Carr", "Waltz", "Mearsheimer", "Walt"], "a": 2, "e": "Neorealizmi Kenneth Waltz 1979’daki Theory of International Politics ile kurdu. Morgenthau klasik realizmin, Mearsheimer saldırgan realizmin, Walt tehdit dengesinin temsilcisidir.", "ar": "كينيث فالتز (Waltz) أسس الواقعية الجديدة بكتابه «نظرية السياسة الدولية» سنة 1979. مورغنثاو فخ لأنه صاحب الكلاسيكية سنة 1948."}, {"u": 4, "q": "Hangisi liberalizmin varsayımı değildir?", "o": ["İnsan doğası doğuştan kötü ve bencildir", "Uluslararası örgütler iş birliğini sağlar", "Barış kolektif güvenlikle sağlanabilir", "Aktörler sadece devletler değildir", "Sistem sadece güçle yapılanmamıştır"], "a": 0, "e": "Liberaller insan doğası hakkında iyimserdir; kötü davranış kötü kurumlardan doğar. “İnsan doğası kötü ve bencildir” klasik realizmin varsayımıdır.", "ar": "الليبراليون متفائلون: الإنسان خيّر والشر سببه المؤسسات السيئة. أما القول بأن الطبيعة البشرية شريرة وأنانية فهو حجر أساس الواقعية الكلاسيكية، لذلك ليس افتراضًا ليبراليًا."}, {"u": 4, "q": "Hangisi liberal teorinin öncülerinden kabul edilemez?", "o": ["Adam Smith", "Grotius", "Morgenthau", "Kant", "Bentham"], "a": 2, "e": "Adam Smith, Grotius, Kant ve Bentham liberal düşüncenin öncüleridir. Morgenthau klasik realizmin kurucusudur.", "ar": "مورغنثاو (Morgenthau) مؤسس الواقعية الكلاسيكية، فهو في المعسكر المقابل لليبرالية. بقية الأسماء من رواد الفكر الليبرالي في الاقتصاد والقانون والفلسفة."}, {"u": 4, "q": "Büyük devletlerin sisteme gelecek saldırılara karşı birlikte oluşturduğu güvenlik mekanizmasına ne denir?", "o": ["Kolektif savunma", "İttifak", "Uluslararası savunma örgütü", "Kolektif güvenlik", "Sistemik güvenlik"], "a": 3, "e": "Büyük devletlerin sistemi saldırganlara karşı birlikte koruması kolektif güvenliktir. Kolektif savunma ise ittifak içindeki devletlerin yalnızca birbirini korumasıdır.", "ar": "الأمن الجماعي (kolektif güvenlik) يحمي النظام كله من أي معتدٍ، بينما الدفاع الجماعي (kolektif savunma) تحالف يحمي أعضاءه فقط. والسؤال عن «النظام الدولي» لا عن تحالف."}, {"u": 4, "q": "Hangisi idealizm için söylenemez?", "o": ["Liberal teoriden etkilenmiştir", "Uluslararası politikada güce önem verir", "Hukuk ve örgütlerin etkisini artırmak ister", "En bilinen savunucusu Wilson’dur", "I. Dünya Savaşı sonrası etkilidir"], "a": 1, "e": "İdealizm güce önem vermez; savaşları örgütler, hukuk ve diplomasiyle önlemek ister. Diğer ifadeler idealizm için doğrudur.", "ar": "المثالية تقلل من شأن القوة وتراهن على المنظمات والقانون والدبلوماسية. لذلك القول بأنها «تعطي أهمية للقوة» هو الخطأ الوحيد بين الخيارات."}, {"u": 4, "q": "Demokratik Barış Teorisi için hangisi söylenebilir?", "o": ["Demokrasiler hiç savaşmaz", "Demokrasiler herkesle savaşabilir", "Demokrasiler bölgelerindeki devletlerle savaşmaz", "Demokrasiler uzak devletlerle savaşmaz", "Demokrasiler sadece diğer demokrasilerle savaşmaz"], "a": 4, "e": "Demokratik barış teorisi demokrasilerin yalnızca birbirleriyle savaşmadığını söyler; otoriter rejimlerle savaşabilirler.", "ar": "الديمقراطيات لا تتحارب فيما بينها فقط، لكنها قد تحارب الأنظمة غير الديمقراطية. خيار «لا تحارب أحدًا» فخ يبالغ في معنى النظرية."}, {"u": 4, "q": "Hangisi neoliberallerin varsayımı değildir?", "o": ["Sistem anarşidir", "Devletler rasyonel ve yekparedir", "Devletler için göreceli kazançlar önemlidir", "Devletler için mutlak kazançlar önemlidir", "İş birliği mümkündür"], "a": 2, "e": "Neoliberaller anarşiyi ve rasyonel, yekpare devleti kabul eder ama mutlak kazancın da önemli olduğunu ve işbirliğinin mümkün olduğunu söyler. Göreceli kazanç kaygısı realistlerindir.", "ar": "الليبراليون الجدد يقبلون الفوضى والدولة العاقلة الموحدة، لكنهم يركزون على المكسب المطلق (mutlak kazanç). الاهتمام بالمكسب النسبي هو هاجس الواقعيين، وهو الإجابة."}, {"u": 4, "q": "Hangisi Marksist yaklaşımın varsayımı değildir?", "o": ["Temel faktörler ekonomiktir", "III. Dünya zengin ülkelere bağımlıdır", "Kapitalizm zenginlik için gerekli bir sistemdir", "Kapitalizm eşitsizliğin kaynağıdır", "Ulusaşırı kapitalist güçler hegemonyayı sürdürmek için birleşmiştir"], "a": 2, "e": "Marksistler kapitalizmi zenginlik için gerekli görmez, eşitsizliğin kaynağı sayar. Diğer ifadeler Marksist varsayımlardır.", "ar": "الماركسيون يرون الرأسمالية سبب اللامساواة بين الدول والطبقات، فلا يمكن أن يقولوا إنها ضرورية للثروة. هذا القول أقرب إلى الليبراليين."}, {"u": 4, "q": "İnşacılara göre devlet çıkarının temelinde ne vardır?", "o": ["Ekonomi", "Siyaset", "Uluslararası örgütler", "Uluslararası hukuk", "Devletlerin kimliği"], "a": 4, "e": "İnşacılara göre kimlik önce gelir; devletler çıkarlarını kimliklerine göre belirler. Ekonomi Marksistlerin, uluslararası örgütler liberallerin vurgusudur.", "ar": "عند البنائيين الهوية (kimlik) أولًا ثم المصلحة، فلا تعرف ما تريد قبل أن تعرف من أنت. الاقتصاد فخ ماركسي، والمنظمات الدولية فخ ليبرالي."}, {"u": 4, "q": "Hangisi Marksist bir düşünür değildir?", "o": ["Alexander Wendt", "Lenin", "Gramsci", "Horkheimer", "Fromm"], "a": 0, "e": "Lenin, Gramsci, Horkheimer ve Fromm Marksist gelenekten gelir. Wendt sosyal inşacılığın kurucusudur.", "ar": "فندت (Wendt) مؤسس البنائية الاجتماعية، وليس ماركسيًا. بقية الأسماء من التقليد الماركسي ومدرسة فرانكفورت."}, {"u": 4, "q": "Feministlere göre kadınların uluslararası politikadan dışlanmasının temel nedeni nedir?", "o": ["Kadınların ilgisizliği", "Kadın liderlerin azlığı", "Kadın akademisyenlerin azlığı", "Politikanın geleneksel olarak erkek işi sayılması", "Kadınların bu meslekleri seçmemesi"], "a": 3, "e": "Feministlere göre kadınların dışlanmasının temel nedeni politikanın geleneksel olarak erkek işi sayılmasıdır. Kadın lider azlığı bu inşanın sonucudur, nedeni değil.", "ar": "النسويات يرين أن السبب العميق هو اعتبار السياسة تقليديًا «عمل الرجال». قلة القائدات النساء نتيجة لهذا التصور لا سببه، وهذا هو الفخ الأذكى."}, {"u": 4, "q": "Lenin’e göre emperyalizm nedir?", "o": ["Feodalizmin son aşaması", "Kapitalizmin en son aşaması", "Sosyalizmin ilk aşaması", "Liberalizmin sonucu", "Milliyetçiliğin ürünü"], "a": 1, "e": "Lenin’e göre emperyalizm kapitalizmin en son (en yüksek) aşamasıdır: hammadde, ucuz işgücü ve pazar için sömürgeleştirme.", "ar": "لينين (Lenin) سمّى الإمبريالية «أعلى مراحل الرأسمالية»، لأن الرأسمالية حين تكبر تحتاج مستعمرات للمواد الخام والأسواق. خيار «أول مراحل الاشتراكية» فخ لفظي."}, {"u": 1, "q": "Westphalia Antlaşması hangi savaşı sona erdirmiştir?", "o": ["Yüz Yıl Savaşları", "Otuz Yıl Savaşları", "Napolyon Savaşları", "Peloponnes Savaşı", "Kırım Savaşı"], "a": 1, "e": "1648 Westphalia Antlaşması Otuz Yıl Savaşları’nı bitirmiştir. Peloponnes Savaşı Atina–Sparta arasında antik çağda yaşanmıştır; Napolyon Savaşları ise Viyana Kongresi’yle kapanır.", "ar": "صلح وستفاليا (Westphalia) سنة 1648 أنهى حرب الثلاثين عامًا (Otuz Yıl Savaşları) في أوروبا. خيار حروب نابليون فخ لأنها انتهت بمؤتمر فيينا سنة 1815."}, {"u": 1, "q": "Egemenlik kavramını ilk kez tanımlayan ve onu “kanunla kısıtlanmayan, mutlak ve en üstün iktidar” olarak gören düşünür kimdir?", "o": ["Hugo Grotius", "Thomas Hobbes", "John Locke", "Immanuel Kant", "Jean Bodin"], "a": 4, "e": "Jean Bodin 1576’da Devlet Üzerine Altı Kitap’ta egemenliği ilk kez tanımlamıştır. Grotius ise egemenliğin sınırlarını ve devletler arası hukuku geliştirmiştir.", "ar": "جان بودان (Bodin) في كتابه «ستة كتب عن الدولة» سنة 1576 هو أول من عرّف السيادة بأنها سلطة مطلقة عليا. غروتيوس فخ لأنه اهتم بحدود هذه السيادة وبالقانون بين الدول."}, {"u": 1, "q": "Grotius’un haklı savaş ilkesine göre aşağıdakilerden hangisi savaşı hukuki kılabilecek bir nedendir?", "o": ["Toprak genişletme", "Hanedan çıkarlarının korunması", "Mülkiyetin geri kazanılması", "Yeni pazarlar elde etme", "Dinin yayılması"], "a": 2, "e": "Grotius’a göre savaş yalnızca meşru müdafaa, cezalandırma ve mülkiyetin geri kazanılması için hukuki olabilir. Toprak ve pazar kazanmak bu nedenler arasında değildir; tam tersine saldırı sayılır.", "ar": "غروتيوس (Grotius) جعل للحرب العادلة (haklı savaş) ثلاثة أسباب فقط: الدفاع الشرعي، والعقاب، واسترداد الملكية. أما التوسع في الأرض أو الأسواق فهو عدوان وليس سببًا مشروعًا."}, {"u": 1, "q": "Napolyon Savaşları’ndan sonra Avrupa Uyumu’nu kuran galip devletler arasında aşağıdakilerden hangisi <b>yoktur<\/b>?", "o": ["İspanya", "İngiltere", "Rusya", "Avusturya", "Prusya"], "a": 0, "e": "Avrupa Uyumu Napolyon’u yenen İngiltere, Rusya, Avusturya ve Prusya’nın düzenidir. İspanya bu dört galip arasında sayılmaz.", "ar": "الوفاق الأوروبي (Avrupa Uyumu) أسسته الدول الأربع المنتصرة على نابليون: إنجلترا وروسيا والنمسا وبروسيا. إسبانيا ليست منها، رغم أنها دولة أوروبية كبيرة قديمة."}, {"u": 1, "q": "Avrupa Uyumu’nu bozan ve milliyetçilikler çağını başlatan gelişme hangisidir?", "o": ["1871’de Alman birliğinin kurulması", "1648 Westphalia Antlaşması", "1914 Saraybosna suikastı", "1830’da Belçika’nın bağımsızlığını ilan etmesi", "1861’de İtalya Krallığı’nın kurulması"], "a": 3, "e": "Kitaba göre uyumu bozan gelişme Belçika’nın 1830’da bağımsızlığını ilan etmesidir; ardından Polonya isyanı bastırıldı ve milliyetçilikler çağı başladı. Alman ve İtalyan birlikleri bu sürecin sonraki sonuçlarıdır.", "ar": "إعلان بلجيكا استقلالها سنة 1830 هو الذي هزّ الوفاق الأوروبي وفتح عصر القوميات. توحيد ألمانيا وإيطاليا جاء لاحقًا كنتيجة لهذا العصر، لذلك هما فخ زمني."}, {"u": 1, "q": "Alman Ulusal Birliği hangi yıl Versailles Sarayı’nda resmen kurulmuştur?", "o": ["1815", "1871", "1848", "1861", "1918"], "a": 1, "e": "Bismarck’ın çabalarıyla 18 Ocak 1871’de I. Wilhelm’e imparatorluk tacı giydirildi ve Alman birliği kuruldu. 1861 İtalya Krallığı’nın kuruluş yılıdır.", "ar": "تأسست الوحدة الألمانية في 18 يناير 1871 في قصر فرساي بجهود بسمارك (Bismarck). سنة 1861 فخ لأنها سنة تأسيس مملكة إيطاليا على يد كافور."}, {"u": 1, "q": "Türkiye Milletler Cemiyeti’ne hangi yıl ve nasıl üye olmuştur?", "o": ["1920’de kurucu üye olarak", "1923’te Lozan’dan sonra başvurarak", "1934’te SSCB ile birlikte", "1945’te başvurarak", "1932’de özel bir davetle"], "a": 4, "e": "Türkiye başvurusu olmadığı hâlde uluslararası barışa katkısı nedeniyle 1932’de davetle üye oldu. 1934, SSCB’nin üye olabildiği yıldır.", "ar": "دخلت تركيا عصبة الأمم (Milletler Cemiyeti) سنة 1932 بدعوة خاصة تقديرًا لإسهامها في السلام، دون أن تقدم طلبًا. سنة 1934 فخ لأنها سنة انضمام الاتحاد السوفيتي."}, {"u": 1, "q": "Aşağıdakilerden hangisi Milletler Cemiyeti için <b>yanlıştır<\/b>?", "o": ["10 Ocak 1920’de İsviçre’de kurulmuştur.", "Kuruluşuna ABD öncülük etmiştir.", "ABD, Cemiyet’in kurucu ve en güçlü üyesi olmuştur.", "Sözleşmeyi ihlal edene ticari ve finansal yaptırım öngörmüştür.", "Savaşı tamamen yasaklamamıştır."], "a": 2, "e": "ABD Cemiyet’in kurulmasına ön ayak olduğu hâlde Senato’dan yeterli oy çıkmadığı için üye olmamıştır. Diğer ifadeler kitapla uyumludur.", "ar": "المفارقة أن أمريكا هي التي اقترحت عصبة الأمم، لكن مجلس الشيوخ الأمريكي رفض الانضمام، فلم تصبح عضوًا أبدًا. لذلك عبارة «أمريكا أقوى أعضائها» خاطئة."}, {"u": 1, "q": "Uİ’nin politika biliminden bağımsız bir disiplin olarak doğuşunu müjdeleyen ve idealistleri “ütopyacı” diye damgalayan eser hangisidir?", "o": ["Yirmi Yıl Krizi", "Leviathan", "Ebedi Barış", "Güç Politikası", "Prens"], "a": 0, "e": "E. H. Carr’ın 1939 tarihli Yirmi Yıl Krizi eseri idealistleri ütopyacı ilan ederek ilk tartışma kuşağını başlatmıştır. Güç Politikası Schwarzenberger’in 1941 tarihli eseridir.", "ar": "كتاب «أزمة العشرين عامًا» (Yirmi Yıl Krizi) لكار (Carr) سنة 1939 هو الذي سمّى المثاليين طوباويين وأطلق النقاش الأول. «سياسة القوة» فخ لأنه لشفارتسنبرغر بعده بسنتين."}, {"u": 1, "q": "İki savaş arası dönemde I. Dünya Savaşı sonrası kurulan düzeni değiştirmek isteyen “revizyonist” devletler arasında aşağıdakilerden hangisi sayılmaz?", "o": ["Almanya", "Bulgaristan", "Japonya", "Fransa", "İtalya"], "a": 3, "e": "Kitap revizyonist devletler olarak Almanya, Bulgaristan, Japonya ve İtalya’yı sayar. Fransa savaşın galibi olarak statükoyu korumak isteyen taraftadır.", "ar": "الدول التعديلية (revizyonist) هي الخاسرة أو غير الراضية عن تسويات الحرب الأولى. فرنسا كانت من المنتصرين، فهي تريد الحفاظ على الوضع القائم لا تغييره."}, {"u": 1, "q": "Uİ alanında ilk kürsü hangi yıl ve nerede kurulmuştur?", "o": ["1859 – Oxford", "1919 – Galler-Aberystwyth", "1919 – Paris", "1920 – Cenevre", "1945 – New York"], "a": 1, "e": "İlk uluslararası ilişkiler kürsüsü 1919’da Galler-Aberystwyth Üniversitesi’nde kuruldu ve Wilson’ın adını taşır. 1859 Oxford kürsüsü uluslararası hukuk ve diplomasi kürsüsüdür.", "ar": "أول كرسي للعلاقات الدولية أُسس سنة 1919 في جامعة أبيريستويث (Aberystwyth) في ويلز باسم ولسن. أكسفورد 1859 فخ لأنه كان كرسيًا للقانون الدولي والدبلوماسية لا للعلاقات الدولية."}, {"u": 1, "q": "Morgenthau’ya göre askeri güç arayışı için yürütülen politikaya ne ad verilir?", "o": ["Düşük politika", "Reelpolitik", "Kozmopolitan politika", "Güç dengesi", "Yüksek politika"], "a": 4, "e": "Morgenthau askeri güç arayışını yüksek politika, ekonomi gibi diğer alanları düşük politika olarak tanımlar. Reelpolitik genel olarak güç politikası anlamındadır.", "ar": "عند مورغنثاو (Morgenthau) السياسة العليا (yüksek politika) هي سياسة الأمن والقوة العسكرية لأنها تتعلق ببقاء الدولة، والسياسة الدنيا هي الاقتصاد وما شابهه."}, {"u": 1, "q": "Davranışçılar için bilimsel bilgi üretmede aşağıdaki veri türlerinden hangisi en önemlidir?", "o": ["Tarihsel anlatılar", "Felsefi metinler", "Kantitatif veriler", "Diplomatik anılar", "Öznel yorumlar"], "a": 2, "e": "Davranışçılar değişkenleri sayısallaştırıp ölçülebilir (kantitatif) verilerle formel hipotezlere ulaşmak ister. Öznel yorum reflektivistlerin önem verdiği şeydir.", "ar": "السلوكيون يريدون أرقامًا قابلة للقياس (kantitatif) مثل الإحصاءات، لأنهم يقلدون العلوم الطبيعية. أما «التفسير الذاتي» فهو ما يمدحه التأمليون، أي عكسهم تمامًا."}, {"u": 1, "q": "Holsti ve Frankel’e göre Uİ incelemesi hangi üç analiz düzeyinde yapılabilir?", "o": ["Birey – devlet – sistem", "Ulusal – bölgesel – küresel", "Yerel – ulusal – uluslararası", "Ekonomi – siyaset – kültür", "Devlet – örgüt – şirket"], "a": 0, "e": "Holsti ve Frankel birey, devlet ve sistem düzeylerini sayar. Ulusal–bölgesel–küresel ayrımı Rosenau’ya aittir.", "ar": "هولستي وفرانكل قسّما مستويات التحليل إلى: الفرد والدولة والنظام. أما «الوطني والإقليمي والعالمي» فهو تقسيم روزناو (Rosenau)، وهو الفخ هنا."}, {"u": 1, "q": "I. Dünya Savaşı’ndan sonra 1919’da toplanan ve evrensel bir örgüt kurma fikrinin kabul edildiği konferans hangisidir?", "o": ["Viyana Kongresi", "Berlin Kongresi", "Lozan Konferansı", "Paris Barış Konferansı", "Yalta Konferansı"], "a": 3, "e": "Evrensel örgüt fikri 1919 Paris Barış Konferansı’nda kabul edildi ve 1920’de Milletler Cemiyeti kuruldu. Viyana Kongresi 1815’tir.", "ar": "في مؤتمر باريس للسلام (Paris Barış Konferansı) سنة 1919 تقرر إنشاء منظمة عالمية، فوُلدت عصبة الأمم سنة 1920. مؤتمر فيينا فخ لأنه بعد نابليون قبل قرن."}, {"u": 2, "q": "Modern devletin uluslararası sistemde üzerine kurulduğu üç temel ilke hangisinde doğru verilmiştir?", "o": ["Ülke – millet – hükümet", "Egemenlik – tanınma – BM üyeliği", "Egemenlik – eşitlik – ülke bütünlüğü", "Demokrasi – hukuk – insan hakları", "Güç – çıkar – bekâ"], "a": 2, "e": "Kitap BM Şartı’na dayanarak modern devletin üç ilkesini egemenlik, eşitlik ve ülke bütünlüğü olarak sayar. “Ülke – millet – hükümet” ise devletin unsurlarıdır, ilkeleri değil.", "ar": "المبادئ الثلاثة للدولة الحديثة حسب ميثاق الأمم المتحدة: السيادة والمساواة ووحدة الأراضي. خيار «الأرض والأمة والحكومة» فخ قوي لأنه يذكر عناصر الدولة لا مبادئها."}, {"u": 2, "q": "Kitaba göre egemen devletin ülke bütünlüğünün uluslararası hukuk koruması hangi vasıtayla uygulanır?", "o": ["Birleşmiş Milletler", "NATO", "Avrupa Konseyi", "Uluslararası Ceza Mahkemesi", "İkili ittifaklar"], "a": 0, "e": "Ülke bütünlüğü uluslararası hukuk koruması altındadır ve bu koruma BM vasıtasıyla uygulanır. NATO bir ittifaktır, tüm devletlerin bütünlüğünü korumakla görevli değildir.", "ar": "وحدة أراضي الدولة محمية بالقانون الدولي، وهذه الحماية تُطبَّق عبر الأمم المتحدة (Birleşmiş Milletler). الناتو فخ لأنه تحالف لأعضائه فقط وليس حاميًا لكل الدول."}, {"u": 2, "q": "Devletin varlığından ancak asgari bir siyasi ve sosyal örgütlenmeyle söz edilebileceğini belirten 1975 tarihli danışma görüşü hangi kuruma aittir?", "o": ["BM Genel Kurulu", "Avrupa İnsan Hakları Mahkemesi", "Uluslararası Ceza Mahkemesi", "Uluslararası Adalet Divanı", "Güvenlik Konseyi"], "a": 3, "e": "16.10.1975 tarihli danışma görüşü Uluslararası Adalet Divanı’na aittir. Danışma görüşü vermek bir mahkeme işlevidir; Genel Kurul karar alır ama görüş bildiren yargı organı değildir.", "ar": "الرأي الاستشاري (danışma görüşü) سنة 1975 صدر عن محكمة العدل الدولية (Uluslararası Adalet Divanı)، وقرر أن الدولة تحتاج حدًا أدنى من التنظيم السياسي والاجتماعي. المحكمة الجنائية فخ لأنها لم تكن موجودة آنذاك."}, {"u": 2, "q": "“Tanıma devletin kurucu unsuru değil, ------- bir ilkedir.” cümlesinde boş bırakılan yere ne gelmelidir?", "o": ["zorunlu", "teyit edici", "yasaklayıcı", "uluslarüstü", "geçici"], "a": 1, "e": "Kitaba göre tanıma kurucu değil teyit edici bir ilkedir; bu yüzden sadece Türkiye’nin tanıdığı KKTC de devlettir. Yine de tanınmayan devletlerin hareket alanı çok dardır.", "ar": "الاعتراف لا يخلق الدولة بل يؤكد (teyit eder) وجودها. لذلك تُعدّ شمال قبرص التركية دولة رغم أن تركيا وحدها تعترف بها، لكن حركتها الدولية محدودة جدًا."}, {"u": 2, "q": "Aşağıdakilerden hangisi zayıf devlete örnek olarak gösterilebilir?", "o": ["Somali", "Kosova", "Tayvan", "Haiti", "Marshall Adaları"], "a": 4, "e": "Marshall Adaları BM üyesi, işleyen ama nüfusu ve ekonomisi çok küçük bir zayıf devlettir. Somali ve Haiti çökmüş, Kosova ve Tayvan devlet benzeridir.", "ar": "جزر مارشال (Marshall Adaları) دولة عضو في الأمم المتحدة يعمل نظامها لكن سكانها واقتصادها صغيرة جدًا، فهي دولة ضعيفة. الصومال وهايتي منهارتان، وكوسوفو وتايوان شبه دول."}, {"u": 2, "q": "Kendi ülkesi içinde egemenlik yetkisini kullanamayan devlete ne ad verilir?", "o": ["Zayıf devlet", "Devlet benzeri", "Çökmüş devlet", "Federe devlet", "Tampon devlet"], "a": 2, "e": "Kitabın tanımına göre çökmüş devlet, kendi ülkesinde egemenlik yetkisini kullanamayan devlettir. Devlet benzerinde sorun içeride değil, dışarıdan tanınmamadır.", "ar": "الدولة المنهارة (çökmüş devlet) هي التي لا تستطيع ممارسة سيادتها داخل أرضها. «شبه الدولة» فخ لأن مشكلتها في الاعتراف الخارجي لا في السيطرة الداخلية."}, {"u": 2, "q": "Kitaba göre uluslararası örgütleri birbirinden ayırmada kullanılan iki temel kriter hangileridir?", "o": ["Coğrafi kriter ve fonksiyon kriteri", "Bütçe ve üye sayısı", "Kuruluş tarihi ve merkez", "Dil ve din", "Askeri güç ve ekonomik güç"], "a": 0, "e": "Örgütler temel olarak coğrafi kriter (bölgesel–küresel) ve fonksiyon kriteri (amaç) ile ayrılır. Ayrıca üyeye göre hükümetlerarası–hükümetler-dışı ayrımı yapılır.", "ar": "المنظمات الدولية تُميَّز بمعيارين أساسيين: الجغرافي (إقليمي أو عالمي) والوظيفي (عسكري، اقتصادي، بيئي...). وإلى جانبهما يوجد تصنيف حسب نوع الأعضاء."}, {"u": 2, "q": "Aşağıdakilerden hangisi BM’nin <b>ana organlarından<\/b> biridir?", "o": ["Uluslararası Hukuk Komisyonu", "BM Yönetim Mahkemesi", "BM Sığınmacılar Yüksek Komiserliği", "Vesayet Konseyi", "İnsan Hakları Komisyonu"], "a": 3, "e": "Vesayet Konseyi altı ana organdan biridir. Uluslararası Hukuk Komisyonu ve İnsan Hakları Komisyonu alt organ, Yönetim Mahkemesi teknik yardımcı, Sığınmacılar Yüksek Komiserliği özel yardımcı organdır.", "ar": "مجلس الوصاية (Vesayet Konseyi) أحد الأجهزة الرئيسية الستة رغم أنه قليل الذكر اليوم. أما لجنة القانون الدولي ولجنة حقوق الإنسان فأجهزة فرعية، ومفوضية اللاجئين جهاز فرعي خاص."}, {"u": 2, "q": "Aşağıdakilerden hangisi kitapta ekonomik bütünleşmeyi hedefleyen hükümetlerarası örgütler arasında <b>sayılmaz<\/b>?", "o": ["APEC", "Avrupa Konseyi", "CACM", "GCC", "SADC"], "a": 1, "e": "Avrupa Konseyi 1949’da barış, insan hakları ve demokrasi için kurulmuş bir ortak değer örgütüdür. APEC, CACM, GCC ve SADC ekonomik bütünleşme örgütleridir.", "ar": "مجلس أوروبا (Avrupa Konseyi) تأسس سنة 1949 لنشر حقوق الإنسان والديمقراطية، فهو منظمة «قيم مشتركة» لا تكامل اقتصادي. بقية الخيارات منظمات اقتصادية إقليمية."}, {"u": 2, "q": "Avrupa Kömür ve Çelik Topluluğu, EURATOM ve Avrupa Ekonomik Topluluğu’nu tek Komisyon, Konsey ve Parlamento altında birleştiren anlaşma hangisidir?", "o": ["Roma Anlaşması (1957)", "Maastricht Anlaşması (1992)", "Lizbon Antlaşması (2009)", "Paris Anlaşması (1951)", "Füzyon Anlaşması (1965)"], "a": 4, "e": "1965 Füzyon Anlaşması üç topluluğu birleştirip Avrupa Toplulukları’nı oluşt
