<style>
/* Atlas Plate: the term as a political map you colour in.
   Sea-grey ground, paper land panels, ink type, flat course tints, frontier red for exam marks.
   Rank comes from weight, case and rule, not size inflation. No gradients, no glow, no glass. */
:root{
  --sea:#dfe8ea; --land:#fbfaf6; --land-2:#eef2ef; --ink:#1d2430; --muted:#4f5b69; --line:#c3cfd3; --line-2:#dde4e6;
  --frontier:#c8102e; --good:#17703f; --bad:#b3261e; --good-soft:#e2f0e6; --bad-soft:#f8e5e3;
  --focus:#1d2430;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:14px; --r-s:10px;
  --bar-h:64px; --nav-h:64px;
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0e151a; --land:#172029; --land-2:#1e2933; --ink:#e7edf2; --muted:#a3b2bf; --line:#30404d; --line-2:#24313c;
  --frontier:#ff7083; --good:#62d394; --bad:#ff8a80; --good-soft:#163326; --bad-soft:#3a1d1d; --focus:#e7edf2; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0e151a; --land:#172029; --land-2:#1e2933; --ink:#e7edf2; --muted:#a3b2bf; --line:#30404d; --line-2:#24313c;
  --frontier:#ff7083; --good:#62d394; --bad:#ff8a80; --good-soft:#163326; --bad-soft:#3a1d1d; --focus:#e7edf2; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 12px);scroll-padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 88px)}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
::selection{background:color-mix(in srgb,var(--c,var(--ink)) 28%,transparent)}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.rn{font-weight:400;color:var(--muted);font-size:.86em;white-space:nowrap}
/* cartographic label: spaced caps, carried by weight and case */
.cap{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.code{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- app bar: solid land, hairline only once content scrolls under it ---- */
.appbar{position:sticky;top:0;z-index:30;background:var(--sea);padding-top:env(safe-area-inset-top,0px);transition:box-shadow .2s}
.appbar.edge{box-shadow:0 1px 0 var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:8px;min-height:var(--bar-h)}
.iconbtn{display:inline-flex;align-items:center;gap:4px;min-width:44px;min-height:44px;padding:0 10px 0 6px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:700;font-size:16px}
.iconbtn:active{background:var(--line-2)}
.appbar .ttl{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.appbar.edge .ttl{opacity:1;transform:none}

/* ---- panels: land on sea, one elevation (hairline) ---- */
.panel{background:var(--land);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:10px 0 2px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .12s var(--ease),background-color .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--c-ink,var(--ink));color:var(--on-c,var(--land))}
.btn.ghost{background:var(--land);border:1px solid var(--line);color:var(--ink)}
.btn.quiet{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 6px}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn .ico{width:18px;height:18px}

/* ---- step marks (Oku / Kartlar / Test) ---- */
.marks{display:inline-flex;gap:3px;flex:0 0 auto}
.marks i{width:14px;height:6px;border-radius:2px;border:1.5px solid var(--c-ink,var(--ink));opacity:.55}
.marks i.on{background:var(--c-ink,var(--ink));opacity:1}

/* ---- course swatch: flat country colour with its short code ---- */
.sw{width:40px;height:40px;border-radius:9px;background:var(--c-sw,var(--c));color:var(--on-swatch,#fff);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.02em;flex:0 0 auto}

/* ---- rows ---- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px;border-top:1px solid var(--line-2);text-decoration:none;color:inherit}
.rows > .row:first-child{border-top:0}
a.row:active,button.row:active{background:var(--land-2)}
button.row{width:100%;text-align:left}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .tx b{font-weight:700;line-height:1.3}
.row .tx span{color:var(--muted);font-size:15px;line-height:1.35}
.row .go{color:var(--muted)}

/* ---- the map scale bar: countdown to the exam, one tick per week ---- */
.scale{margin-top:4px}
.scale .track{position:relative;height:12px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.scale .track{background:var(--land)}
.scale .track::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:var(--ink)}
.scale .track span{position:relative;border-left:1.5px solid var(--ink)}
.scale .track span.past{border-left-color:var(--land)}
.scale .track span:first-child{border-left:0}
.scale{position:relative}
.scale .now{position:absolute;top:-5px;height:22px;width:3px;margin-left:-1.5px;background:var(--frontier);border-radius:1px}
.scale .ticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.scale .ticks span:last-child{text-align:right;color:var(--frontier)}
.flapnum{display:inline-block}
.flapnum.flip{animation:flap .5s var(--ease)}
@keyframes flap{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}

/* ---- the term plate: countries with provinces that fill in ---- */
.plate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.country{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);background:var(--land);border:1px solid var(--line);text-decoration:none;color:inherit;min-height:44px;transition:transform .12s var(--ease)}
.country:active{transform:scale(.98)}
.country .nm{font-weight:700;font-size:15px;line-height:1.25}
.provinces{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px}
.prov{position:relative;aspect-ratio:1.25;border:1.5px solid var(--c-ink);border-radius:4px;overflow:hidden;background:var(--land)}
.prov::before{content:"";position:absolute;inset:0;background:var(--c);transform-origin:left;transform:scaleX(var(--f,0));transition:transform .4s var(--ease)}
.prov[data-s="1"]{--f:.34}.prov[data-s="2"]{--f:.67}.prov[data-s="3"]{--f:1}
.prov[data-s="1"]::before,.prov[data-s="2"]::before{opacity:.55}
.prov b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--c-ink)}
.prov[data-s="3"] b{color:var(--on-swatch,#fff)}
.prov.fresh::before{animation:fillin .4s var(--ease) both}
@keyframes fillin{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:11px;border:1.5px solid var(--ink);border-radius:3px;background:linear-gradient(90deg,var(--ink) var(--f),transparent var(--f))}

/* ---- bottom tab bar (course pages) ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--land);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;min-width:44px}
.tabbar a .ico{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--c-ink)}
.tabbar a[aria-current="page"] .ico{stroke-width:2.4}
.tabbar a:active{background:var(--land-2)}

/* sticky action bar above the tab bar (Next question, session steps) */
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:35;padding:10px 0;background:color-mix(in srgb,var(--sea) 94%,transparent);border-top:1px solid var(--line)}
.actionbar .wrap{display:flex;gap:10px}
.actionbar .btn{flex:1}
.actionbar .btn.icon{flex:0 0 52px;padding:0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .prov::before{transition:opacity .2s}
  .btn:active,.country:active{transform:none}
}
@media (prefers-reduced-transparency:reduce){.actionbar{background:var(--sea)}}

}
/* ---------- course page ---------- */
:root{--ex:#a3207f;--mark:#fbe7a1;--mark-ink:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ex:#ff9be8;--mark:#5a4a10;--mark-ink:#fff6cc}}
:root[data-theme="dark"]{--ex:#ff9be8;--mark:#5a4a10;--mark-ink:#fff6cc}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px)}
body.has-action{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 110px)}
main{padding-block:4px 8px}
main:focus{outline:none}
ex{color:var(--ex)}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* country header: flat course tint, large title, the one next action */
.country-head{background:var(--c-tint);border:1px solid var(--c-line);border-radius:var(--r);padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px}
.country-head h1{font-size:clamp(30px,8.4vw,42px);letter-spacing:-.03em}
.country-head .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:15px}
.country-head .meta b{color:var(--ink)}
.prow .st .code{color:var(--c-ink)}
.face.front .code{margin-top:6px}
.country-head .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.country-head .cta .btn{flex:1 1 auto}
.view-h{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.view-h h1{font-size:clamp(28px,7.6vw,36px);letter-spacing:-.03em}
.view-h p{color:var(--muted)}
.view-h:focus,h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,.q[tabindex="-1"]:focus{outline:none}

/* provinces list on course home / units */
.prow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-2);text-decoration:none;color:inherit;min-height:64px}
.rows > .prow:first-child{border-top:0}
.prow:active{background:var(--land-2)}
.prow .prov{width:46px;flex:0 0 auto}
.prow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .tx b{font-weight:700;line-height:1.3}
.prow .tx .sub{color:var(--muted);font-size:15px;line-height:1.35}
.prow .st{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:13px;color:var(--muted);font-weight:700}

/* reading */
.legendx{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legendx span{display:inline-flex;align-items:center;gap:6px}
.legendx i{width:9px;height:9px;border-radius:2px;display:inline-block}
.bigidea{background:var(--c-tint);border:1px solid var(--c-line);border-radius:var(--r);padding:18px}
.bigidea p{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.4;margin-top:6px;letter-spacing:-.01em}
.note{border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;background:var(--land);border:1px solid var(--line)}
.note .ic{flex:0 0 auto;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--land)}
.note h2{font-size:17px;margin-bottom:4px;letter-spacing:-.01em}
.note.why .ic{background:none;color:var(--c-ink);width:auto} .note.why h2{color:var(--c-ink)}
.note.tip .ic{background:var(--good)} .note.tip h2{color:var(--good)}
.note.trap{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))} .note.trap .ic{background:var(--bad)} .note.trap h2{color:var(--bad)}
.sec h2{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;font-size:19px}
.sec h2 .k{flex:0 0 auto;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--c-ink);font-family:var(--body)}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pts li{position:relative;padding-left:18px;min-width:0}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:1.5px;background:var(--c)}
.diagram{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.5;background:var(--land-2);border-radius:var(--r-s);padding:14px;overflow-x:auto;margin:0 0 12px;color:var(--ink)}
.enp{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--land-2);font-size:15.5px;line-height:1.55}
.arp{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--land-2);font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.8;text-align:right}
.arp{padding:0 14px}
.arp summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted)}
.arp summary::-webkit-details-marker{display:none}
.arp summary::after{content:"";width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin-top:-4px;transition:transform .2s var(--ease)}
.arp[open] summary::after{transform:rotate(135deg);margin-top:4px}
.arp > div{padding-bottom:12px}
.terms summary{cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:800;font-size:19px}
.terms summary::-webkit-details-marker{display:none}
.terms summary .ico{transition:transform .2s var(--ease);color:var(--muted)}
.terms[open] summary .ico{transform:rotate(90deg)}
.terms dl{margin:6px 0 0;display:flex;flex-direction:column}
.terms .t{padding:10px 0;border-top:1px solid var(--line-2)}
.terms dt{font-weight:700}
.terms dd{margin:2px 0 0;color:var(--muted)}
.terms dd.ar{color:var(--ink);font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic",system-ui,sans-serif;text-align:right;font-size:16px;line-height:1.7}
.chain{list-style:none;margin:14px 0 0;padding:12px 14px;border:1.5px dashed var(--c-line);border-radius:var(--r-s);display:flex;flex-direction:column;gap:6px}
.chain::before{content:"Neden → Sonuç";font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink)}
.chain li{position:relative;padding-left:22px}
.chain li::before{content:"→";position:absolute;left:0;color:var(--c-ink);font-weight:700}
.chain li:first-child::before{content:"•"}
.face .ar{font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic",system-ui,sans-serif;font-size:17px;line-height:1.7;color:var(--muted)}
.enp::before{content:"In English";display:block;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.readrow{display:flex;flex-direction:column;gap:10px}
.readbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:12px;border:1.5px dashed var(--c-ink);font-weight:700;width:100%;color:var(--c-ink)}
.readbtn[aria-pressed="true"]{border-style:solid;background:var(--c-ink);color:var(--on-c)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager a{min-height:64px;border-radius:12px;background:var(--land);border:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;text-decoration:none}
.pager a.nx{text-align:right;align-items:flex-end}
.pager small{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pager b{font-size:15px;line-height:1.3}

/* session stepper */
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stepper span{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.stepper span::before{content:"";height:5px;border-radius:2px;background:var(--line)}
.stepper span.on{color:var(--ink)} .stepper span.on::before{background:var(--c-ink)}
.stepper span.done::before{background:var(--c)}

/* scope chips: a scrollable segmented control with an edge fade hint */
.scopes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent)}
.scopes::-webkit-scrollbar{display:none}
.scopes button{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--land);font-weight:700;font-size:15px;white-space:nowrap}
.scopes button[aria-pressed="true"]{background:var(--ink);color:var(--land);border-color:var(--ink)}
.scopes button:last-child{margin-right:16px}

.meter{display:flex;flex-direction:column;gap:6px}
.meter .bar{height:6px;border-radius:2px;background:var(--line-2);overflow:hidden}
.meter .bar i{display:block;height:100%;width:100%;background:var(--c-ink);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .35s var(--ease)}
.meter p{font-size:14px;color:var(--muted)}

/* flash cards */
.stage{position:relative;touch-action:pan-y}
.fc{position:relative;display:grid;width:100%;min-height:clamp(300px,48vh,440px);text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;will-change:transform}
.face{grid-area:1/1;border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--land);border:1px solid var(--line);transition:opacity .22s var(--ease),filter .22s var(--ease),transform .22s var(--ease)}
.face .term{font-family:var(--display);font-weight:800;font-size:clamp(26px,6.6vw,38px);line-height:1.15;text-wrap:balance;letter-spacing:-.02em}
.face .tr{font-size:20px;line-height:1.45;font-weight:700;text-wrap:pretty}
.face .en{font-size:15.5px;color:var(--muted)}
.face .echo{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.face .hint{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.face.rear{background:var(--c-tint);border-color:var(--c-line)}
.fc .rear{opacity:0;filter:blur(4px);transform:scale(.98)}
.fc.flipped .front{opacity:0;filter:blur(4px);transform:scale(.98)}
.fc.flipped .rear{opacity:1;filter:none;transform:none}
.fc .stamp{position:absolute;top:16px;padding:4px 10px;border-radius:6px;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:0;border:2px solid currentColor;pointer-events:none}
.fc .stamp.l{left:16px;color:var(--bad)} .fc .stamp.r{right:16px;color:var(--good)}
.fc.in-l{animation:inl .26s var(--ease)} .fc.in-r{animation:inr .26s var(--ease)}
@keyframes inl{from{opacity:0;transform:translateX(-18px)}} @keyframes inr{from{opacity:0;transform:translateX(18px)}}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.again{background:var(--bad-soft);color:var(--bad)}
.btn.know{background:var(--good-soft);color:var(--good)}
.kbd{display:none;font-size:13px;color:var(--muted);text-align:center}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}

/* test */

<body>
<nav class="side" id="side" aria-label="Ders menüsü"></nav>
<header class="appbar" id="bar"><div class="wrap">
  <a class="iconbtn backlink" href="index.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Dersler</span></a>
  <span class="ttl" id="ttl" aria-hidden="true"></span>
</div></header>
<main class="wrap" id="app" tabindex="-1"></main>
<div class="actionbar" id="actionbar" hidden><div class="wrap" id="actions"></div></div>
<nav class="tabbar" aria-label="Ders bölümleri"><div class="wrap" id="tabs"></div></nav>
<div class="vh" id="live" aria-live="polite"></div>
<script>
/* AÖF shared core: storage, dates, progress model, spaced repetition, icons.
   Used by the hub and every course page (same origin, so they read each other's progress). */
const AOF = (() => {
  const PASS = 0.7; // test score that counts a unit as passed
  let syncer = null; // set by startSync; told about every progress write
  const BOXES = [0, 1, 2, 4, 8]; // Leitner box -> days until the card is due again

  function store(prefix) {
    return {
      get(k, d) { try { const v = localStorage.getItem(prefix + ":" + k); return v === null ? d : JSON.parse(v) } catch (e) { return d } },
      set(k, v) { try { localStorage.setItem(prefix + ":" + k, JSON.stringify(v)) } catch (e) {} if (syncer) syncer.dirty() }
    };
  }

  // ---- dates (local calendar days as YYYY-MM-DD) ----
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d) };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
  const today = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t };
  const daysBetween = (a, b) => Math.round((b - a) / 864e5);
  const AY = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
  const AYLAR = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const GUN = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
  const GUNLER = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

  // ---- scores ----
  // best values are stored as "7/10" strings (kept from the first version).
  const pct = s => { if (s == null) return null; const [a, b] = String(s).split("/").map(Number); return b ? a / b : null };
  const passed = s => { const p = pct(s); return p != null && p >= PASS };

  // ---- card ids: stable across sessions and content edits elsewhere in the deck ----
  function cardId(unit, front) {
    let h = 5381; const s = unit + "|" + front;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  /* Per-course progress. Keys (prefix = course code):
       done   {u1:true}           unit read ("Okudum")
       best   {1:"8/10", mix:..}  best test score per unit
       srs    {id:{b,d,u}}        Leitner box, next due date, unit
       log    {"2026-10-21":{cards:n,test:"8/10",list:1,visit:1}}  daily activity, drives automatic day completion */
  function course(code, examISO) {
    const st = store(code);
    const s = {
      done: st.get("done", {}), best: st.get("best", {}), srs: st.get("srs", {}), log: st.get("log", {}),
      qstat: st.get("qstat", {}), prova: st.get("prova", []),
      reload() { for (const k of ["done", "best", "srs", "log", "qstat"]) s[k] = st.get(k, {}); s.prova = st.get("prova", []) },
      save(k) { st.set(k, s[k]) },
      get: st.get, set: st.set,
      mark(kind, value) {
        const k = iso(today()); const day = s.log[k] || (s.log[k] = {});
        if (kind === "cards") day.cards = (day.cards || 0) + 1;
        else if (kind === "test") { if (!day.test || pct(value) > pct(day.test)) day.test = value }
        else day[kind] = 1;
        s.save("log");
      },
      // Leitner review: "Bildim" moves a card up a box, "Tekrar" back to box 1. Due dates never pass the exam.
      review(id, unit, knew) {
        const cur = s.srs[id] || { b: 0 };
        const b = knew ? Math.min(BOXES.length - 1, cur.b + 1) : 0;
        let due = addDays(today(), knew ? BOXES[b] : 0);
        if (examISO) { const ex = addDays(parse(examISO), -1); if (due > ex && today() <= ex) due = ex }
        s.srs[id] = { b, d: iso(due), u: unit, t: Date.now() };
        s.save("srs");
        s.mark("cards");
      },
      // every answered question (tests, sessions, rehearsals) feeds the weak-topic view
      answer(qid, ok) {
        const st = s.qstat[qid] || { n: 0, c: 0 };
        s.qstat[qid] = { n: st.n + 1, c: st.c + (ok ? 1 : 0), t: Date.now() };
        s.save("qstat");
      },
      isDue(id) { const c = s.srs[id]; return !!c && c.d <= iso(today()) },
      dueCount(unit) { const t = iso(today()); return Object.values(s.srs).filter(c => c.d <= t && (!unit || c.u === unit)).length },
      seenCount(unit) { return Object.values(s.srs).filter(c => c.u === unit).length },
      // A unit's three steps. cardTotal comes from the course data (or the hub's per-unit counts).
      unit(n, cardTotal) {
        const read = !!s.done["u" + n];
        const cards = cardTotal ? s.seenCount(n) >= cardTotal : read;
        const test = passed(s.best[n]);
        return { read, cards, test, complete: read && cards && test, steps: (read ? 1 : 0) + (cards ? 1 : 0) + (test ? 1 : 0) };
      }
    };
    return s;
  }

  // ---- icons: one 2px stroke family, drawn on a 24px grid ----
  const I = {
    home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
    units: '<path d="M4 6h16M4 12h16M4 18h11"/>',
    cards: '<rect x="3" y="7" width="13" height="13" rx="2.5"/><path d="M8 4h10.5A2.5 2.5 0 0 1 21 6.5V17"/>',
    test: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    bulb: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    back: '<path d="M15 18l-6-6 6-6"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    repeat: '<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/>',
    flip: '<path d="M4 7h13l-3-3M20 17H7l3 3"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
    flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
    play: '<path d="M7 5l12 7-12 7z"/>',
    pause: '<path d="M8 5v14M16 5v14"/>',
    sound: '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
    clock: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    zoom: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8v6M8 11h6"/>'
  };
  const ico = (n, size, label) => `<svg class="ico" viewBox="0 0 24 24"${size ? ` style="width:${size}px;height:${size}px"` : ""}${label ? ` role="img" aria-label="${label}"` : ' aria-hidden="true"'}>${I[n]}</svg>`;
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  const steps = u => `<span class="marks" role="img" aria-label="Oku ${u.read ? "tamam" : "yapılmadı"}, kartlar ${u.cards ? "tamam" : "yapılmadı"}, test ${u.test ? "geçti" : "yapılmadı"}"><i class="${u.read ? "on" : ""}"></i><i class="${u.cards ? "on" : ""}"></i><i class="${u.test ? "on" : ""}"></i></span>`;

  function mergeCourse(a, b) {
    a = a || {}; b = b || {};
    return {
      done: either(a.done, b.done),
      best: pick(a.best, b.best, (x, y) => pv(y) > pv(x) ? y : x),
      srs: pick(a.srs, b.srs, (x, y) => (y.t || 0) > (x.t || 0) ? y : x),
      log: pick(a.log, b.log, (x, y) => { const o = Object.assign({}, x, y); o.cards = Math.max(x.cards || 0, y.cards || 0) || undefined; o.test = pv(y.test) > pv(x.test) ? y.test : x.test; o.list = x.list || y.list; o.visit = x.visit || y.visit; for (const k in o) if (o[k] === undefined) delete o[k]; return o }),

    if (!r) return l;
    if ((r.epoch || 0) > (l.epoch || 0)) return r;
    if ((l.epoch || 0) > (r.epoch || 0)) return l;
    const courses = {};
    for (const c of new Set([...Object.keys(l.courses || {}), ...Object.keys(r.courses || {})])) courses[c] = mergeCourse((l.courses || {})[c], (r.courses || {})[c]);
    const lh = l.hub || {}, rh = r.hub || {}, newer = (rh.schedT || 0) > (lh.schedT || 0) ? rh : lh;
    return { epoch: l.epoch || 0, courses, hub: { done: either(lh.done, rh.done), schedule: newer.schedule || null, ack: newer.ack || null, schedT: newer.schedT || 0 } };
  }
  function startSync(cfg) {
    const listeners = [];
    if (!cfg || !cfg.url || !cfg.key) return { dirty() {}, now: async () => {}, onChange() {}, status: () => "off" };
    const T = cfg.term, LS = localStorage;
    const get = k => { try { const v = LS.getItem(k); return v == null ? null : JSON.parse(v) } catch (e) { return null } };
    const put = (k, v) => { try { v == null ? LS.removeItem(k) : LS.setItem(k, JSON.stringify(v)) } catch (e) {} };

    function localDoc() {
      const d = { epoch: get("aof:epoch") || 0, courses: {}, hub: { done: get(T + ":done") || {}, schedule: get(T + ":schedule"), ack: get(T + ":ack"), schedT: get(T + ":schedT") || 0 } };
      for (const k of keys()) { const m = k && k.match(SYNCED); if (!m || m[1] === T) continue; (d.courses[m[1]] || (d.courses[m[1]] = {}))[m[2]] = get(k) }
      return d;
    }
    function writeLocal(d) {
      if ((d.epoch || 0) !== (get("aof:epoch") || 0)) for (const k of keys()) { const m = k && k.match(SYNCED); if (m && m[1] !== T) put(k, null) }
      put("aof:epoch", d.epoch || 0);
      for (const c in d.courses || {}) for (const f in d.courses[c]) put(c + ":" + f, d.courses[c][f]);
      const h = d.hub || {}; put(T + ":done", h.done || {}); put(T + ":schedule", h.schedule || null); put(T + ":ack", h.ack || null); put(T + ":schedT", h.schedT || 0);
    }
    // The row is reachable only through two server functions and a secret row id (kept inside the encrypted bundle).
    const rpc = cfg.url + "/rest/v1/rpc/", headers = { apikey: cfg.key, "Content-Type": "application/json" };
    let busy = null, timer = null, again = false;
    async function run() {
      if (busy) { again = true; return busy }

      dirty() { clearTimeout(timer); timer = setTimeout(run, 1500) },
      now: () => run(),
      onChange(f) { listeners.push(f) },
      // a restart: progress on every device starts over from here
      newEpoch() { put("aof:epoch", Date.now()) },

    };
  }

     Done on screen only, so stored text (card and question ids) never changes. */
  const RN = /(?<![\p{L}\d])(M{0,3}(?:CM|CD|D?C{0,3})(?:XC|XL|L?X{0,3})(?:IX|IV|V?I{0,3}))\.(?!\s*\(\d)/gu;

      if (r.length === 1 && ("CDLM".includes(r) || !/^\s*(yy|yüzyıl|[A-ZÇĞİÖŞÜ])/u.test(after))) continue;
      out = out || document.createDocumentFragment();
      out.appendChild(document.createTextNode(t.slice(last, m.index + m[0].length)));
      const s = document.createElement("span"); s.className = "rn"; s.textContent = " (" + roman(r) + ".)"; out.appendChild(s);
      last = m.index + m[0].length;
    }
    if (!out) return;
    const rest = document.createTextNode(t.slice(last)); seen.add(rest); out.appendChild(rest);
    out.childNodes.forEach(c => c.nodeType === 3 && seen.add(c));
    node.parentNode.replaceChild(out, node);
  }
  function romanize(root) {
    if (!root || root.closest && root.closest("[data-no-rn],script,style,textarea,input")) return;
    if (root.nodeType === 3) return romanizeText(root);

    const list = []; while (w.nextNode()) list.push(w.currentNode); list.forEach(romanizeText);
  }
  function watchRoman(root) {
    romanize(root);
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => romanize(n.nodeType === 3 ? n : n)))).observe(root, { childList: true, subtree: true, characterData: false });
  }

  return { PASS, store, startSync, mergeDocs, romanize, watchRoman, iso, parse, addDays, today, daysBetween, AY, AYLAR, GUN, GUNLER, pct, passed, cardId, course, ico, esc, reduced, steps, scrollEdge };
})();

<div class="lock" id="lock" hidden>
  <form class="lock-card" id="lockform" novalidate>
    <svg class="lock-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <h1 id="locktitle">AÖF Çalışma</h1>
    <p class="muted">Bu uygulama kilitli. Parolanı bir kez gir; bu cihaz hatırlar ve sonra çevrimdışı da açılır.</p>
    <label class="lock-field"><span>Parola</span>
      <input type="password" id="lockpw" name="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    </label>
    <p class="lock-err" id="lockerr" role="alert"></p>
    <button class="btn primary block" id="lockbtn" type="submit">Aç</button>
  </form>
</div>
<style>
.lock{position:fixed;inset:0;z-index:100;background:var(--sea);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.lock-card{width:100%;max-width:400px;background:var(--land);border:1px solid var(--line);border-radius:var(--r);padding:24px 20px;display:flex;flex-direction:column;gap:12px}
.lock-card h1{font-size:28px}
.lock-ic{width:32px;height:32px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lock-field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.lock-field input{min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--land);font-size:18px}
.lock-field input:focus{outline:3px solid var(--focus);outline-offset:2px;border-color:var(--ink)}
.lock-err{min-height:1.4em;color:var(--bad);font-weight:700;font-size:15px}
body.locked > :not(.lock):not(script){visibility:hidden}
</style>
<script>
/* Password lock: the page's content and code arrive encrypted (window.AOF_LOCK).
   The derived key (never the password) is kept per device, so the lock asks only once. */
(() => {
  const L = window.AOF_LOCK, K = "aof:key:" + L.kid;
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => btoa(String.fromCharCode(...u));
  const hex = h => Uint8Array.from(h.match(/../g).map(x => parseInt(x, 16)));
  const lock = document.getElementById("lock"), form = document.getElementById("lockform");
  const err = document.getElementById("lockerr"), pw = document.getElementById("lockpw"), btn = document.getElementById("lockbtn");
  const importKey = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  async function open(key) {
    const buf = b64(L.data);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
    window.AOF_KEY = key;
    document.body.classList.remove("locked"); lock.hidden = true;
    const s = document.createElement("script"); s.textContent = new TextDecoder().decode(plain); document.body.appendChild(s);
  }
  function ask(message) {
    document.body.classList.add("locked"); lock.hidden = false; err.textContent = message || "";
    setTimeout(() => pw.focus(), 50);
  }
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!pw.value) { err.textContent = "Parolanı yaz."; return }
    btn.disabled = true; btn.textContent = "Açılıyor…"; err.textContent = "";
    try {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.value.trim()), "PBKDF2", false, ["deriveBits"]);
      const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex(L.salt), iterations: L.iter }, base, 256));
      await open(await importKey(raw));
      try { localStorage.setItem(K, toB64(raw)) } catch (e) {}
    } catch (e) {
      err.textContent = "Parola yanlış. Tekrar dene."; pw.select();
    }
    btn.disabled = false; btn.textContent = "Aç";
  });
  if (!window.crypto || !crypto.subtle) { ask("Bu tarayıcı kilidi açamıyor. Uygulamayı Safari veya Chrome ile aç."); btn.disabled = true; return }
  let saved = null; try { saved = localStorage.getItem(K) } catch (e) {}
  if (!saved) return ask();
  importKey(b64(saved)).then(open).catch(() => { try { localStorage.removeItem(K) } catch (e) {} ask("Parola değişmiş. Yeni parolanı gir.") });
})();
</script>
