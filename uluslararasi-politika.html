<style>
/* Atlas Plate: the term as a political map you colour in.
   Sea-grey ground, paper land panels, ink type, flat course tints, frontier red for exam marks.
   Rank comes from weight, case and rule, not size inflation. No gradients, no glow, no glass. */
:root{
  --sea:#dfe8ea; --land:#fbfaf6; --land-2:#eef2ef; --ink:#1d2430; --muted:#4f5b69; --line:#c3cfd3; --line-2:#dde4e6;
  --frontier:#c8102e; --good:#17703f; --bad:#b3261e; --good-soft:#e2f0e6; --bad-soft:#f8e5e3;
  --focus:#1d2430;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:14px; --r-s:10px;
  --bar-h:64px; --nav-h:64px;
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0e151a; --land:#172029; --land-2:#1e2933; --ink:#e7edf2; --muted:#a3b2bf; --line:#30404d; --line-2:#24313c;
  --frontier:#ff7083; --good:#62d394; --bad:#ff8a80; --good-soft:#163326; --bad-soft:#3a1d1d; --focus:#e7edf2; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0e151a; --land:#172029; --land-2:#1e2933; --ink:#e7edf2; --muted:#a3b2bf; --line:#30404d; --line-2:#24313c;
  --frontier:#ff7083; --good:#62d394; --bad:#ff8a80; --good-soft:#163326; --bad-soft:#3a1d1d; --focus:#e7edf2; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 12px);scroll-padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 88px)}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
::selection{background:color-mix(in srgb,var(--c,var(--ink)) 28%,transparent)}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
/* cartographic label: spaced caps, carried by weight and case */
.cap{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.code{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- app bar: solid land, hairline only once content scrolls under it ---- */
.appbar{position:sticky;top:0;z-index:30;background:var(--sea);padding-top:env(safe-area-inset-top,0px);transition:box-shadow .2s}
.appbar.edge{box-shadow:0 1px 0 var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:8px;min-height:var(--bar-h)}
.iconbtn{display:inline-flex;align-items:center;gap:4px;min-width:44px;min-height:44px;padding:0 10px 0 6px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:700;font-size:16px}
.iconbtn:active{background:var(--line-2)}
.appbar .ttl{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.appbar.edge .ttl{opacity:1;transform:none}

/* ---- panels: land on sea, one elevation (hairline) ---- */
.panel{background:var(--land);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:10px 0 2px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .12s var(--ease),background-color .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--c-ink,var(--ink));color:var(--on-c,var(--land))}
.btn.ghost{background:var(--land);border:1px solid var(--line);color:var(--ink)}
.btn.quiet{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 6px}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn .ico{width:18px;height:18px}

/* ---- step marks (Oku / Kartlar / Test) ---- */
.marks{display:inline-flex;gap:3px;flex:0 0 auto}
.marks i{width:14px;height:6px;border-radius:2px;border:1.5px solid var(--c-ink,var(--ink));opacity:.55}
.marks i.on{background:var(--c-ink,var(--ink));opacity:1}

/* ---- course swatch: flat country colour with its short code ---- */
.sw{width:40px;height:40px;border-radius:9px;background:var(--c-sw,var(--c));color:var(--on-swatch,#fff);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.02em;flex:0 0 auto}

/* ---- rows ---- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px;border-top:1px solid var(--line-2);text-decoration:none;color:inherit}
.rows > .row:first-child{border-top:0}
a.row:active,button.row:active{background:var(--land-2)}
button.row{width:100%;text-align:left}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .tx b{font-weight:700;line-height:1.3}
.row .tx span{color:var(--muted);font-size:15px;line-height:1.35}
.row .go{color:var(--muted)}

/* ---- the map scale bar: countdown to the exam, one tick per week ---- */
.scale{margin-top:4px}
.scale .track{position:relative;height:12px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.scale .track{background:var(--land)}
.scale .track::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:var(--ink)}
.scale .track span{position:relative;border-left:1.5px solid var(--ink)}
.scale .track span.past{border-left-color:var(--land)}
.scale .track span:first-child{border-left:0}
.scale{position:relative}
.scale .now{position:absolute;top:-5px;height:22px;width:3px;margin-left:-1.5px;background:var(--frontier);border-radius:1px}
.scale .ticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.scale .ticks span:last-child{text-align:right;color:var(--frontier)}
.flapnum{display:inline-block}
.flapnum.flip{animation:flap .5s var(--ease)}
@keyframes flap{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}

/* ---- the term plate: countries with provinces that fill in ---- */
.plate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.country{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);background:var(--land);border:1px solid var(--line);text-decoration:none;color:inherit;min-height:44px;transition:transform .12s var(--ease)}
.country:active{transform:scale(.98)}
.country .nm{font-weight:700;font-size:15px;line-height:1.25}
.provinces{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px}
.prov{position:relative;aspect-ratio:1.25;border:1.5px solid var(--c-ink);border-radius:4px;overflow:hidden;background:var(--land)}
.prov::before{content:"";position:absolute;inset:0;background:var(--c);transform-origin:left;transform:scaleX(var(--f,0));transition:transform .4s var(--ease)}
.prov[data-s="1"]{--f:.34}.prov[data-s="2"]{--f:.67}.prov[data-s="3"]{--f:1}
.prov[data-s="1"]::before,.prov[data-s="2"]::before{opacity:.55}
.prov b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--c-ink)}
.prov[data-s="3"] b{color:var(--on-swatch,#fff)}
.prov.fresh::before{animation:fillin .4s var(--ease) both}
@keyframes fillin{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:11px;border:1.5px solid var(--ink);border-radius:3px;background:linear-gradient(90deg,var(--ink) var(--f),transparent var(--f))}

/* ---- bottom tab bar (course pages) ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--land);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;min-width:44px}
.tabbar a .ico{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--c-ink)}
.tabbar a[aria-current="page"] .ico{stroke-width:2.4}
.tabbar a:active{background:var(--land-2)}

/* sticky action bar above the tab bar (Next question, session steps) */
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:35;padding:10px 0;background:color-mix(in srgb,var(--sea) 94%,transparent);border-top:1px solid var(--line)}
.actionbar .wrap{display:flex;gap:10px}
.actionbar .btn{flex:1}
.actionbar .btn.ghost:first-child:not(:last-child){flex:0 0 52px;padding:0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .prov::before{transition:opacity .2s}
  .btn:active,.country:active{transform:none}
}
@media (prefers-reduced-transparency:reduce){.actionbar{background:var(--sea)}}

}
/* ---------- course page ---------- */
:root{--ex:#a3207f;--mark:#fbe7a1;--mark-ink:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ex:#ff9be8;--mark:#5a4a10;--mark-ink:#fff6cc}}
:root[data-theme="dark"]{--ex:#ff9be8;--mark:#5a4a10;--mark-ink:#fff6cc}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px)}
body.has-action{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 110px)}
main{padding-block:4px 8px}
main:focus{outline:none}
ex{color:var(--ex)}
mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* country header: flat course tint, large title, the one next action */
.country-head{background:var(--c-tint);border:1px solid var(--c-line);border-radius:var(--r);padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px}
.country-head h1{font-size:clamp(30px,8.4vw,42px);letter-spacing:-.03em}
.country-head .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:15px}
.country-head .meta b{color:var(--ink)}
.prow .st .code{color:var(--c-ink)}
.face.front .code{margin-top:6px}
.country-head .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.country-head .cta .btn{flex:1 1 auto}
.view-h{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.view-h h1{font-size:clamp(28px,7.6vw,36px);letter-spacing:-.03em}
.view-h p{color:var(--muted)}
.view-h:focus,h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,.q[tabindex="-1"]:focus{outline:none}

/* provinces list on course home / units */
.prow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-2);text-decoration:none;color:inherit;min-height:64px}
.rows > .prow:first-child{border-top:0}
.prow:active{background:var(--land-2)}
.prow .prov{width:46px;flex:0 0 auto}
.prow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .tx b{font-weight:700;line-height:1.3}
.prow .tx .sub{color:var(--muted);font-size:15px;line-height:1.35}
.prow .st{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:13px;color:var(--muted);font-weight:700}

/* reading */
.legendx{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legendx span{display:inline-flex;align-items:center;gap:6px}
.legendx i{width:9px;height:9px;border-radius:2px;display:inline-block}
.bigidea{background:var(--c-tint);border:1px solid var(--c-line);border-radius:var(--r);padding:18px}
.bigidea p{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.4;margin-top:6px;letter-spacing:-.01em}
.note{border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;background:var(--land);border:1px solid var(--line)}
.note .ic{flex:0 0 auto;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--land)}
.note h2{font-size:17px;margin-bottom:4px;letter-spacing:-.01em}
.note.why .ic{background:none;color:var(--c-ink);width:auto} .note.why h2{color:var(--c-ink)}
.note.tip .ic{background:var(--good)} .note.tip h2{color:var(--good)}
.note.trap{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))} .note.trap .ic{background:var(--bad)} .note.trap h2{color:var(--bad)}
.sec h2{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;font-size:19px}
.sec h2 .k{flex:0 0 auto;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--c-ink);font-family:var(--body)}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pts li{position:relative;padding-left:18px;min-width:0}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:1.5px;background:var(--c)}
.diagram{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;line-height:1.5;background:var(--land-2);border-radius:var(--r-s);padding:14px;overflow-x:auto;margin:0 0 12px;color:var(--ink)}
.enp{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--land-2);font-size:15.5px;line-height:1.55}
.enp::before{content:"In English";display:block;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.readrow{display:flex;flex-direction:column;gap:10px}
.readbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:12px;border:1.5px dashed var(--c-ink);font-weight:700;width:100%;color:var(--c-ink)}
.readbtn[aria-pressed="true"]{border-style:solid;background:var(--c-ink);color:var(--on-c)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager a{min-height:64px;border-radius:12px;background:var(--land);border:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;text-decoration:none}
.pager a.nx{text-align:right;align-items:flex-end}
.pager small{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pager b{font-size:15px;line-height:1.3}

/* session stepper */
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stepper span{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.stepper span::before{content:"";height:5px;border-radius:2px;background:var(--line)}
.stepper span.on{color:var(--ink)} .stepper span.on::before{background:var(--c-ink)}
.stepper span.done::before{background:var(--c)}

/* scope chips: a scrollable segmented control with an edge fade hint */
.scopes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent)}
.scopes::-webkit-scrollbar{display:none}
.scopes button{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--land);font-weight:700;font-size:15px;white-space:nowrap}
.scopes button[aria-pressed="true"]{background:var(--ink);color:var(--land);border-color:var(--ink)}
.scopes button:last-child{margin-right:16px}

.meter{display:flex;flex-direction:column;gap:6px}
.meter .bar{height:6px;border-radius:2px;background:var(--line-2);overflow:hidden}
.meter .bar i{display:block;height:100%;width:100%;background:var(--c-ink);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .35s var(--ease)}
.meter p{font-size:14px;color:var(--muted)}

/* flash cards */
.stage{position:relative;touch-action:pan-y}
.fc{position:relative;display:grid;width:100%;min-height:clamp(300px,48vh,440px);text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;will-change:transform}
.face{grid-area:1/1;border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--land);border:1px solid var(--line);transition:opacity .22s var(--ease),filter .22s var(--ease),transform .22s var(--ease)}
.face .term{font-family:var(--display);font-weight:800;font-size:clamp(26px,6.6vw,38px);line-height:1.15;text-wrap:balance;letter-spacing:-.02em}
.face .tr{font-size:20px;line-height:1.45;font-weight:700;text-wrap:pretty}
.face .en{font-size:15.5px;color:var(--muted)}
.face .echo{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.face .hint{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.face.rear{background:var(--c-tint);border-color:var(--c-line)}
.fc .rear{opacity:0;filter:blur(4px);transform:scale(.98)}
.fc.flipped .front{opacity:0;filter:blur(4px);transform:scale(.98)}
.fc.flipped .rear{opacity:1;filter:none;transform:none}
.fc .stamp{position:absolute;top:16px;padding:4px 10px;border-radius:6px;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:0;border:2px solid currentColor;pointer-events:none}
.fc .stamp.l{left:16px;color:var(--bad)} .fc .stamp.r{right:16px;color:var(--good)}
.fc.in-l{animation:inl .26s var(--ease)} .fc.in-r{animation:inr .26s var(--ease)}
@keyframes inl{from{opacity:0;transform:translateX(-18px)}} @keyframes inr{from{opacity:0;transform:translateX(18px)}}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.again{background:var(--bad-soft);color:var(--bad)}
.btn.know{background:var(--good-soft);color:var(--good)}
.kbd{display:none;font-size:13px;color:var(--muted);text-align:center}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}

/* test */
.q{font-size:19px;font-weight:700;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--land);min-height:56px;width:100%;transition:border-color .15s,background-color .15s}
.opt:active{background:var(--land-2)}
.opt .L{flex:0 0 auto;width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .L{background:var(--good);border-color:var(--good);color:var(--land)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--land)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--land)}
.fb b{display:block;margin-bottom:2px}
.fb.ok{border-color:color-mix(in srgb,var(--good) 50%,var(--line))} .fb.ok b{color:var(--good)}
.fb.no{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))} .fb.no b{color:var(--bad)}
.fb .right-ans{margin-bottom:4px} .fb .right-ans strong{color:var(--good)}
.score{display:flex;align-items:baseline;gap:10px}
.score b{font-family:var(--display);font-weight:800;font-size:56px;letter-spacing:-.03em;line-height:1}
.score.pass b{color:var(--good)} .score.fail b{color:var(--bad)}
.misses{display:flex;flex-direction:column}
.misses a{display:block;padding:12px 0;border-top:1px solid var(--line-2);text-decoration:none}
.misses a span{display:block;color:var(--muted);font-size:15px;margin-top:2px}

/* session finish: the province fills */
.finish{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:26px 18px}
.finish .prov{width:132px;border-width:2.5px;border-radius:8px}
.finish .prov b{font-size:22px;font-family:var(--display);font-weight:800}

/* list */
.search{display:flex;align-items:center;gap:10px;background:var(--land);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:50px}

<script>
const COURSE={"code": "ULİ201U", "name": "Uluslararası Politika I", "unitWord": "Ünite", "lede": "Ünite 1–4: uluslararası politika nedir, aktörleri, realizm ve alternatif kuramlar.", "about": "Bu ders devletlerin neden öyle davrandığıyla ilgilidir. Her kuram farklı bir cevap verir. Realizm, patronu olmayan bir dünyada her şeyin <b>güç ve hayatta kalma<\/b> meselesi olduğunu söyler. Liberalizm, <b>işbirliği, kurumlar ve demokrasinin<\/b> bunu yumuşatabileceğini söyler. Marksizm, işin aslının <b>ekonomik sömürü<\/b> olduğunu söyler. İnşacılık, her şeyin devletlerin etkileşimle kurduğu <b>kimliklere<\/b> bağlı olduğunu söyler. Feminizm, bütün alanın dünyaya <b>erkeklerin gözüyle<\/b> baktığını söyler. Her kuramın devletleri neyin yönlendirdiğini düşündüğünü tek cümleyle söyleyebilirsen soruların çoğu kendiliğinden çözülür. Bu senin ana bölüm dersin, iyi anlamaya değer.", "listShort": "Kim?", "listName": "Kim ne dedi?", "listCols": ["Kim / ne", "Ana fikir"], "listIntro": "AÖF sık sık “bunu hangi düşünür veya kuram söyler?” diye sorar. Her isim için tek satır.", "list": [["Thucydides", "Peloponnes Savaşı (Atina–Sparta) analizi; realizmin ilk kaynağı", "Ü1, Ü3"], ["Machiavelli", "Prens; güç, güç dengesi, ittifak, ulusal güvenlik", "Ü3"], ["Hobbes", "Leviathan; kötümser insan doğası; yöneticinin görevi güvenlik", "Ü3"], ["Morgenthau", "Klasik realizm; Politics Among Nations (1948); çıkar = güç", "Ü3"], ["E. H. Carr", "Klasik realist; Yirmi Yıl Krizi 1919–1939 (1939)", "Ü1, Ü3"], ["Spykman, Kennan", "Klasik realistler", "Ü1"], ["Kenneth Waltz", "Neorealizm (yapısal realizm); Theory of International Politics (1979)", "Ü3"], ["Stephen Walt", "Savunmacı realizm; tehdit dengesi: devletler gücü değil tehdidi dengeler", "Ü3"], ["John Mearsheimer", "Saldırgan realizm; daha fazla güç = hayatta kalmanın en iyi yolu", "Ü3"], ["Woodrow Wilson", "İdealizm; 14 İlke (8 Ocak 1918); kolektif güvenlik; Milletler Cemiyeti", "Ü1, Ü4"], ["Kant", "Demokratik barış fikrinin kaynağı; liberal düşünür", "Ü4"], ["Doyle, Rummel, Russett", "Demokratik Barış Teorisi", "Ü4"], ["Adam Smith, Grotius, Bentham", "Liberal teorinin öncüleri", "Ü4"], ["Lenin", "Emperyalizm: kapitalizmin en son aşaması", "Ü4"], ["Wallerstein", "Dünya Sistemleri Teorisi: merkez, yarı-çevre, çevre", "Ü4"], ["Robert Cox", "Eleştirel teoriyi Uİ’ye taşıdı (1980’ler); Gramsci’nin hegemonya kavramı", "Ü4"], ["Gramsci, Horkheimer, Fromm", "Marksist / Frankfurt Okulu düşünürleri", "Ü4"], ["Alexander Wendt", "Sosyal inşacılık (Marksist değil, realist değil)", "Ü1, Ü4"], ["Singer", "Analiz düzeyi", "Ü1"], ["Nehru, Nasır, Tito, Sukarno", "Bağlantısızlar Hareketi liderleri (Jivkov değil)", "Ü1"], ["1919, Aberystwyth", "İlk Uİ kürsüsü (Galler), Woodrow Wilson adını taşır", "Ü1"], ["4 büyük tartışma", "1930’lar Realizm–İdealizm · 1960’lar Gelenekselcilik–Davranışçılık · 1980’ler Neorealizm–Neoliberalizm · 1990’lar Rasyonalist–Reflektivist", "Ü1"], ["BM üye sayısı", "193", "Ü2"]], "units": [{"title": "Uluslararası Politikanın Temel Kavramları ve Metodolojisi", "sub": "Tanımlar, tarih, temel kavramlar ve disiplinin gelişimi", "big": "<mark>Uluslararası politika<\/mark>, uluslararası aktörler (en başta devletler) arasındaki <b>politik<\/b> ilişkileri inceleyen, uluslararası ilişkilerin alt disiplinidir.", "bigEn": "International politics is the sub-discipline of international relations that studies the political relations between international actors, above all states.", "why": "Disiplinin tarihini, her biri dünyadaki olaylarla tetiklenen dört tartışma olarak hatırla. Birinci Dünya Savaşı’ndan sonra insanlar savaşı bitirmek istedi → idealizm; İkinci Dünya Savaşı onların saf olduğunu gösterdi → <b>realizm–idealizm (1930’lar)<\/b>. Sonra sosyal bilimler fizik gibi “bilimsel” olmak istedi → <b>gelenekselcilik–davranışçılık (1960’lar)<\/b>. 1980’lerde iki kampın yeni sürümleri tartıştı → <b>neorealizm–neoliberalizm<\/b>. 1990’larda bazıları bütün “bilim” modelini reddedip kimliğe ve anlama odaklandı → <b>rasyonalistler–reflektivistler<\/b>.", "whyEn": "Remember the discipline’s history as four debates, each triggered by world events. After WWI people wanted to end war → idealism; WWII showed it was naive → realism vs. idealism (1930s). Then social science wanted to be “scientific” like physics → traditionalism vs. behavioralism (1960s). In the 1980s newer versions of both camps argued → neorealism vs. neoliberalism. In the 1990s some rejected the whole “science” model and focused on identity and meaning → rationalists vs. reflectivists.", "sections": [{"h": "Nedir?", "pts": ["Uluslararası ilişkiler sınır ötesi her şeyi kapsar: politika, kültür, spor, yardım, ekonomi, hukuk. <b>Uluslararası politika<\/b> bunun <b>politik<\/b> boyutunu inceleyen alt disiplindir.", "<mark>Analiz düzeyi<\/mark> (Singer): parçalara (bireyler, devletler) mı yoksa bütüne (sistem) mi odaklanılacağını seçmek.", "<ex>Örnek: Türkiye’nin bir maçta başka bir ülkeyle karşılaşması uluslararası ilişkilerin konusudur; ama iki ülkenin o maç yüzünden büyükelçilerini geri çağırması uluslararası politikanın konusudur.<\/ex>"], "en": "International relations covers everything across borders: politics, culture, sport, aid, economy and law. International politics is the sub-discipline that studies the political dimension. The level of analysis (Singer) is the choice between focusing on the parts (individuals, states) or the whole (the system)."}, {"h": "Tarih", "pts": ["Kökleri <b>Thucydides<\/b>’in Peloponnes Savaşı anlatısına uzanır. Machiavelli, Hobbes, Locke ve Kant da konuya değindi.", "Modern ulus devlet sistemi dönüm noktası olan <b>Westphalia (1648)<\/b> ile başlar.", "18.–19. yüzyıllar: Avrupa <b>güç dengesi<\/b> sistemi; liberalizm Avrupa Uyumu’nu sarstı. <b>İtalya<\/b> ulus devletleşme sürecini İspanya, Fransa, İngiltere ve Belçika’dan daha geç tamamladı.", "<b>Diplomasi<\/b>: ona katkıda bulunan düşünürler arasında Machiavelli, Guicciardini, Grotius, Wicquefort vardır (Kant <b>değil<\/b>). Diplomatik usulleri ilk belirleyen <b>Viyana Kongresi<\/b>’dir.", "Wilson’ın <b>14 İlkesi<\/b> (8 Ocak 1918): serbest ticaret, self-determinasyon, silahların sınırlandırılması, açık antlaşmalar. Ardından Milletler Cemiyeti geldi (10 Ocak 1920, İsviçre).", "Soğuk Savaş: <mark>gevşek çift kutuplu sistem<\/mark>: iki süper güç ve etraflarındaki bloklar, ayrıca <b>Bağlantısızlar Hareketi<\/b> (Nehru, Nasır, Tito, Sukarno).", "Soğuk Savaş’tan sonra: ABD en güçlü devlettir ama bölgesel güçler de önemlidir.", "<mark>Hegemonya<\/mark>: en güçlü devletin bütün sistem üzerinde siyasi hâkimiyet kurma, onu sürdürme ve koruma isteği."], "en": "The roots go back to Thucydides’ account of the Peloponnesian War; Machiavelli, Hobbes, Locke and Kant also touched on it. The modern nation-state system begins with Westphalia (1648). In the 18th–19th centuries Europe had a balance-of-power system, and liberalism shook the Concert of Europe; Italy became a nation-state later than Spain, France, England or Belgium. Thinkers who shaped diplomacy include Machiavelli, Guicciardini, Grotius and Wicquefort (not Kant), and the Congress of Vienna first set diplomatic procedures. Wilson’s 14 Points (8 January 1918) called for free trade, self-determination, arms limits and open treaties; the League of Nations followed in 1920. The Cold War was a loose bipolar system with two blocs plus the Non-Aligned Movement (Nehru, Nasser, Tito, Sukarno). Since then the US is strongest, but regional powers matter. Hegemony is the strongest state’s wish to set up, keep and protect its dominance over the whole system."}, {"h": "Temel kavramlar", "pts": ["<mark>Egemenlik<\/mark>: devletin ülkesini yönetme hakkı. <b>İç egemenlik<\/b>: ülke içinde kuvvet kullanmaya yetkili tek organ olmak. <b>Dış egemenlik<\/b>: devletin uluslararası sistemdeki bağımsızlığı.", "<mark>Ulus devlet<\/mark>: belirli bir ülkede yerleşik bir halkın egemen bir güç tarafından yönetildiği siyasi kurum.", "<mark>Uluslararası hukuk<\/mark>: kamu hukukunun bir dalı; aktörler arasındaki hukuki ilişkileri inceler.", "<ex>Örnek: Türkiye’de sadece devletin polisi ve ordusu meşru olarak silah kullanabilir (iç egemenlik); Türkiye kendi dış politikasını başka bir ülkeye sormadan belirler (dış egemenlik).<\/ex>"], "en": "Sovereignty is the state’s right to govern its territory. Internal sovereignty means being the only body allowed to use force at home; external sovereignty means the state’s independence in the international system. A nation-state is a political institution where a settled people on a defined territory is governed by a sovereign power. International law is a branch of public law that studies the legal relations between the actors."}, {"h": "Disiplinin gelişimi: dört büyük tartışma", "diagram": "1930’lar  Klasik Realizm       – İdealizm\n1960’lar  Gelenekselcilik      – Davranışçılık\n1980’ler  Neorealizm           – Neoliberalizm\n1990’lar  Rasyonalist teoriler – Reflektivist teoriler", "pts": ["İlk Uİ kürsüsü: <b>1919, Aberystwyth<\/b> (Galler), Woodrow Wilson adını taşır. İkinci Dünya Savaşı’na kadar alan siyaset bilimi ve hukuka yakın kaldı.", "<mark>Klasik realizm<\/mark>: güç ve çıkar temel kavramlardır (Morgenthau, Carr, Spykman, Kennan). <b>Wendt klasik realist DEĞİLDİR<\/b>.", "<mark>İdealizm / neoliberalizm<\/mark>: ekonominin rolüne dikkat çeker ve siyasetin barış için çabalaması gerektiğini söyler.", "<mark>Davranışçılık<\/mark>: realizmi ve idealizmi bilimsel olmamakla eleştirdi; sosyal bilimlerde doğa bilimlerinin yöntemlerini istedi.", "<mark>Reflektivist<\/mark> kuramlar bunu reddeder: sosyolojik analize, kimlik inşasına, algılara ve araştırmacının yorumuna odaklanır.", "“Eleştirel teori – post-yapısalcılık” dört tartışmadan biri <b>değildir<\/b>."], "en": "The first IR chair was founded in 1919 at Aberystwyth, Wales, named after Woodrow Wilson; until WWII the field stayed close to political science and law. Classical realism (Morgenthau, Carr, Spykman, Kennan; not Wendt) centers on power and interest. Idealism and neoliberalism stress the economy and say politics should strive for peace. Behavioralism criticized both for not being scientific and wanted natural-science methods; reflectivist theories reject that and focus on sociology, identity, perception and interpretation. “Critical theory vs. post-structuralism” is not one of the four debates."}], "tip": "Dört tartışma, yaklaşık her 20–30 yılda bir: <b>R-İ, G-D, NR-NL, Ras-Ref<\/b>. Her birini “eski – yeni” olarak oku.", "tipEn": "Four debates, one every 20–30 years or so: R-İ, G-D, NR-NL, Ras-Ref. Read each as “old vs. new.”", "trap": "Uluslararası politika Uİ’nin tamamını değil, <b>politik<\/b> boyutunu inceler. Diplomasi düşünürleri arasında Kant <b>yoktur<\/b>. Bağlantısızların liderleri arasında Jivkov (Bulgaristan’ın komünist lideri) <b>yoktur<\/b>. Soğuk Savaş <b>gevşek<\/b> çift kutupluydu.", "trapEn": "International politics studies the political dimension, not all of IR. Diplomacy’s thinkers don’t include Kant. The Non-Aligned leaders don’t include Jivkov. The Cold War was loose bipolar."}, {"title": "Uluslararası Politikadaki Aktörler", "sub": "Kimler aktör sayılır: devletler, örgütler, şirketler, hareketler, bireyler", "big": "<mark>Aktör<\/mark>, <b>özerk<\/b> hareket edebilen ve diğer aktörleri <b>etkileyebilen<\/b> birimdir. Asıl aktör <mark>devlettir<\/mark>, ama devlet dışı aktörler de önemlidir.", "bigEn": "An actor is a unit that can act autonomously and affect other actors. The main actor is the state, but non-state actors matter too.", "why": "Her şeyi iki test belirler: <b>(1) başka bir aktörün iznine gerek kalmadan kendi başına hareket edebiliyor mu<\/b>, <b>(2) başkalarının yaptığını değiştirebiliyor mu?<\/b> Bir hükümeti bir kanunu değiştirmeye zorlayan çokuluslu şirket iki testi de geçer. Zayıf, çökmüş ve devlet benzeri yapılar devletliğin hangi parçasının eksik olduğuna göre ayrılır: güç (zayıf), işleyen kurumlar (çökmüş) veya tanınma (devlet benzeri).", "whyEn": "Two tests decide everything: (1) can it act on its own without another actor’s permission, and (2) can it change what others do? A multinational that pushes a government to change a law passes both. Weak, collapsed and quasi-states differ by which part of statehood is missing: power (weak), working institutions (collapsed) or recognition (quasi).", "sections": [{"h": "Aktörü aktör yapan nedir?", "pts": ["İki ölçüt: <b>özerk eylem yapabilme<\/b> (başkalarının iznine gerek duymadan kendi çıkarına göre hareket etmek) ve <b>diğer aktörleri etkileyebilme<\/b>.", "Aktörler: <b>devletler<\/b> ve <b>devlet dışı aktörler<\/b> (uluslararası örgütler, çokuluslu şirketler, baskı grupları, ulusal kurtuluş hareketleri, terör örgütleri, bireyler).", "<b>Klasik realizm<\/b> devleti <b>tek<\/b> gerçek aktör olarak görür."], "en": "An actor must act autonomously (on its own interests without others’ permission) and be able to affect other actors. Actors are states and non-state actors: international organizations, multinational companies, pressure groups, national liberation movements, terrorist organizations and individuals. Classical realism sees the state as the only real actor."}, {"h": "Devlet", "pts": ["Tanım: belirli bir ülkede yerleşik bir nüfusun egemen bir güç tarafından yönetildiği siyasi kurum.", "İkinci Dünya Savaşı sonrası sistemde devletin temel özellikleri: <b>egemenlik, eşitlik, ülke bütünlüğü<\/b>.", "<b>Dış egemenlik<\/b> = uluslararası sistemdeki bağımsızlık.", "<mark>Zayıf devlet<\/mark>: hukuken eşit ama güç bakımından zayıf (küçük ekonomi, ordu, nüfus, toprak); örneğin Marshall Adaları.", "<mark>Çökmüş devlet<\/mark>: suç oranı yüksek, vatandaşlar devlete güvenini yitirmiş, can ve mal güvenliğinden korkuyor, ekonomi devlet kontrolü dışında, yolsuzluk yüksek (Afganistan, Yemen, Haiti gibi).", "<mark>Devlet benzeri<\/mark>: kriterleri karşılar ve bağımsızlık ilan etmiştir ama <b>tanınmaz<\/b> ve BM üyesi değildir (<b>Güney Osetya, Filistin, Tayvan, Kosova<\/b> gibi).", "<ex>Örnek: Lüksemburg çok küçüktür ama polisi, mahkemeleri ve ekonomisi işler; zayıf olabilir ama çökmüş değildir. Çökmüş devlette ise market alışverişinde bile can güvenliği yoktur.<\/ex>"], "en": "A state is a political institution where a settled population on a defined territory is governed by a sovereign power. After WWII its basic features are sovereignty, equality and territorial integrity; external sovereignty means independence in the system. A weak state is legally equal but weak in power (small economy, army, population, territory), like the Marshall Islands. A collapsed state has high crime and corruption, citizens who no longer trust it or feel safe, and an economy outside its control (e.g. Afghanistan, Yemen, Haiti). A quasi-state meets the criteria and declared independence but is not recognized and not in the UN (e.g. South Ossetia, Palestine, Taiwan, Kosovo)."}, {"h": "Millet ve milliyetçilik", "pts": ["<mark>Millet<\/mark>: aynı ülkede yaşayan, ortak gelenekleri, özlemleri ve çıkarları olan, grubun yaşamasını sürdürmekten sorumlu insanlar.", "<mark>Milliyetçilik<\/mark>: bir milletin devletini koruma veya bir devlete sahip olma bilinci. Ulus devletin kurucu ideolojisi.", "Üç dalga: Avrupa’da <b>19. yüzyıl<\/b>; <b>Birinci Dünya Savaşı<\/b>’ndan sonra (Wilson ilkeleri) çok uluslu imparatorlukların dağılması; <b>İkinci Dünya Savaşı<\/b>’ndan sonra sömürgelikten kurtuluş → bugün <b>193<\/b> BM üyesi."], "en": "A nation is people in the same country with shared traditions, aspirations and interests, responsible for keeping the group alive. Nationalism is the consciousness of preserving or gaining a nation’s own state, the founding ideology of the nation-state. It came in three waves: 19th-century Europe; after WWI, when Wilson’s principles broke up the multinational empires; and after WWII, with decolonization. Today the UN has 193 members."}, {"h": "Uluslararası örgütler", "pts": ["Birkaç devletin ya da farklı devletlerden bireylerin ve sivil toplum kuruluşlarının oluşturduğu ticari olmayan yapılar.", "Özellikleri: bir anlaşmayla kurulurlar, belirli amaç ve ilkeleri vardır, genellikle üyelerini egemen ve eşit sayarlar. Savaş ilan etme veya barış antlaşması imzalama yetkileri <b>yoktur<\/b>.", "<b>Coğrafyaya<\/b> (bölgesel veya küresel) ve <b>işleve<\/b> (askeri, ekonomik, çevre, insan hakları) göre sınıflanırlar.", "Üyeliğe göre: <mark>hükümetlerarası<\/mark> (NATO, BM gibi) ve <mark>hükümetler-dışı<\/mark> (Uluslararası Af Örgütü, Sınır Tanımayan Doktorlar, Kızılhaç, Olimpiyat Komitesi gibi).", "BM’nin ana organları: Genel Kurul, Güvenlik Konseyi, Ekonomik ve Sosyal Konsey, Genel Sekreterlik… <b>UNICEF bir fon/ajanstır, ana organ değildir<\/b>.", "<ex>Örnek: Kızılay’a sen de gönüllü olarak üye olabilirsin; NATO’ya ise sadece devletler üye olur. Fark hükümetler-dışı ile hükümetlerarası arasındaki farktır.<\/ex>"], "en": "International organizations are non-commercial bodies formed by several states, or by individuals and NGOs from different states. They are founded by an agreement, have set aims and principles, and usually treat members as sovereign and equal; they cannot declare war or sign peace treaties. They are classified by geography (regional or global) and function (military, economic, environment, human rights). By membership they are intergovernmental (NATO, the UN) or non-governmental (Amnesty International, Doctors Without Borders, the Red Cross, the Olympic Committee). UNICEF is a UN fund, not a main organ."}, {"h": "Diğer devlet dışı aktörler", "pts": ["<mark>Çokuluslu şirketler<\/mark>: büyük ekonomik güç; ev sahibi devletleri kanun değiştirmeye, hatta bazen rejim değiştirmeye zorlar; kalkınmaya da katkı sağlar. İki tür: <b>uluslararası<\/b> (Anglo-İran Petrol Şirketi gibi) ve <b>uluslaraşırı<\/b> (tek merkezli ama birçok devletten ortakları olan, birçok ülkede faaliyet gösteren).", "<mark>Baskı grupları<\/mark>: kendi çıkarları için hükümetleri zorlayan gruplar (sendikalar, dinî gruplar, <b>lobiler<\/b>: kanun koyucuları etkilemek için örgütlenmiş gruplar).", "<mark>Ulusal kurtuluş hareketleri<\/mark>: savaşa, işgale veya sömürge yönetimine karşı silahlı direniş; amaçları meşru müdafaa veya kendi kaderini tayindir; BM’den hukuki statü alabilirler. Örnekler: <b>FKÖ, UÇK, Hindistan Ulusal Kongresi<\/b>.", "<mark>Terör örgütleri<\/mark>: siyasi amaçla insanları korkutmak için şiddet kullanan yasa dışı gruplar; çoğu zaman insanlığa karşı suç işlerler.", "<b>Bireyler<\/b> (liderler, kurucular, bakanlar) yetenek, girişim ve öngörüleriyle politikayı şekillendirebilir."], "en": "Multinational companies have huge economic power, can push host states to change laws or even regimes, and also contribute to development; they are international (like the Anglo-Iranian Oil Company) or transnational (one center, partners from many states, operating in many countries). Pressure groups push governments for their interests: unions, religious groups and lobbies organized to influence lawmakers. National liberation movements are armed resistance against war, occupation or colonial rule, aiming at self-defense or self-determination, and can get legal status from the UN (e.g. the PLO, the KLA, the Indian National Congress). Terrorist organizations are illegal groups using violence to frighten people for political aims. Individuals such as leaders, founders and ministers can shape policy through talent, initiative and foresight."}], "tip": "Aktör testi = <b>Özerk + Etkili<\/b>. Zayıf / Çökmüş / Devlet benzeri: <b>güç yok / düzen yok / tanınma yok<\/b>.", "tipEn": "Actor test = autonomous + influential. Weak / collapsed / quasi: no power / no order / no recognition.", "trap": "Tayvan, Kosova, Filistin = <b>devlet benzeri<\/b>dir; zayıf veya çökmüş değil. NATO hükümetlerarasıdır, sivil toplum kuruluşu değil. Çokuluslu şirketler <b>uluslararası – uluslaraşırı<\/b> diye ayrılır; hükümetlerarası – hükümetler-dışı diye değil.", "trapEn": "Taiwan, Kosovo and Palestine are quasi-states, not weak or collapsed. NATO is intergovernmental, not an NGO. Multinationals split into international vs. transnational, not intergovernmental vs. NGO."}, {"title": "Güç ve Güç Politikaları: Realizm", "sub": "Güç, unsurları, güç dengesi ve realizmin kolları", "big": "<mark>Realizm<\/mark>: uluslararası politika, üstlerinde otorite olmayan <b>anarşik<\/b> bir sistemde <b>devletler<\/b> arasındaki bir <b>güç mücadelesidir<\/b>.", "bigEn": "Realism: international politics is a struggle for power among states in an anarchic system with no authority above them.", "why": "Realizmdeki her şey tek bir gerçekten çıkar: dünya hükümeti yoktur. Seni kimse kurtarmayacak → kendi gücüne güvenmek zorundasın (kendi başının çaresine bakma) → başkaları hakkında en kötüsünü varsayarsın → kimsenin senden güçlü olmasına izin veremezsin → güç dengesi. Savunma adımların bile komşularını korkutur, onlar da silahlanır → <b>güvenlik ikilemi<\/b>. Realizmin kolları sadece güç arayışının <b>nereden<\/b> geldiği (insan doğası mı, sistemin yapısı mı) ve <b>ne kadar<\/b> gücün yeterli olduğu konusunda ayrılır.", "whyEn": "Everything in realism follows from one fact: there is no world government. Nobody will save you → you must rely on your own power (self-help) → you assume the worst about others → you can’t let anyone get stronger → balance of power. Even defensive steps scare neighbors, who arm too → the security dilemma. The branches of realism disagree only about where the drive for power comes from (human nature or the system’s structure) and how much power is enough.", "sections": [{"h": "Realist düşüncenin kökleri", "pts": ["<b>Thucydides<\/b>: Peloponnes Savaşı (Atina–Sparta), ilk kaynak. Ayrıca Sun Tzu.", "<b>Machiavelli<\/b> (Prens): İtalyan kent devletleri arasında güç, güç dengesi, ittifaklar, ulusal güvenlik.", "<b>Hobbes<\/b> (Leviathan): insan doğasına kötümser bakış; yöneticinin asıl görevi güvenliktir.", "<b>E. H. Carr<\/b>, Yirmi Yıl Krizi 1919–1939 (1939): statükocu ve revizyonist güçler arasındaki çatışma.", "<b>Rousseau<\/b> kitabın sorularında realizme katkı yapanlar arasında sayılmaz."], "en": "Realism’s roots: Thucydides on the Peloponnesian War (Athens vs. Sparta), the first source, and also Sun Tzu; Machiavelli’s The Prince on power, balance, alliances and national security among Italian city-states; Hobbes’ Leviathan, with its pessimistic view of human nature and security as the ruler’s main duty; and E. H. Carr’s The Twenty Years’ Crisis (1939) on the clash between status-quo and revisionist powers. Rousseau is not listed among realism’s contributors in the book’s questions."}, {"h": "Güç ve unsurları", "pts": ["<mark>Güç<\/mark>: başkalarının düşünce ve eylemlerini kontrol edebilme ya da bir aktöre aksi hâlde yapmayacağı bir şeyi yaptırabilme kabiliyeti. Bir etkileme sürecidir.", "<b>Güç kaynakları<\/b> (uzun dönemli): GSMH, nüfus, toprak, coğrafi konum, doğal kaynaklar.", "<b>Güç kapasiteleri<\/b> (kısa dönemli): askeri güç, askeri-endüstriyel yapı, bürokrasinin kalitesi.", "<b>Fiziki<\/b> unsurlar: ekonomi, coğrafya, kaynaklar, nüfus, ordu. <b>Fiziki olmayan<\/b> unsurlar: ulusal karakter, <b>ulusal moral<\/b>, hükümetin kalitesi, diplomasi.", "Realistler için en önemli unsur <b>askeri güçtür<\/b>. Uluslararası örgütlere üyelik bir güç unsuru <b>değildir<\/b>.", "<ex>Örnek: Bir futbol takımının stadyumu ve bütçesi güç kaynağıdır; sahaya çıkan formda kadro güç kapasitesidir; taraftarın coşkusu ise fiziki olmayan bir unsurdur.<\/ex>"], "en": "Power is the ability to control others’ thoughts and actions, or to make an actor do what it otherwise wouldn’t; it is a process of influence. Power resources are long-term: GDP, population, territory, geographic position and natural resources. Power capabilities are short-term: military power, the military-industrial base and the quality of the bureaucracy. Tangible elements are the economy, geography, resources, population and the military; intangible ones are national character, national morale, quality of government and diplomacy. For realists the most important element is military power; membership in international organizations is not an element of power."}, {"h": "Güç dengesi", "pts": ["Amaç: barışı ve istikrarı korumak için her devletin gücünü diğerleriyle dengede tutmak.", "Neden: anarşide hiçbir devlet diğerlerinin niyetinden emin olamaz, bu yüzden en kötüsünü varsayar ve başkalarının güçlenmesine izin vermemelidir.", "Nasıl: kendi gücünü artırarak ya da başkalarıyla <b>birleşerek<\/b>. Araçlar: silahlanma, askeri ittifaklar, böl ve yönet, toprak paylaşımı."], "en": "Balance of power aims to keep each state’s power level with the others’ to preserve peace and stability. Under anarchy no state can be sure of others’ intentions, so each assumes the worst and must not let others grow stronger. States balance by increasing their own power or combining with others, using armament, military alliances, divide-and-rule and territorial division."}, {"h": "Realizmin temel varsayımları", "pts": ["Uluslararası politika bir <b>güç mücadelesidir<\/b>; bir devletin ilk amacı ne olursa olsun son amacı güçtür.", "Sistem <mark>anarşidir<\/mark>: otorite yataydır; egemen ve eşit devletlerin <b>üstünde daha yüksek bir otorite yoktur<\/b>. Anarşi kaos değil, <b>dünya hükümetinin olmaması<\/b> demektir.", "Asıl aktörler <b>devletlerdir<\/b>; <b>rasyonel ve yekpare<\/b>dirler. Devlet dışı aktörlerin önemi azdır.", "<mark>Güvenlik ikilemi<\/mark>: bir devletin savunma adımları başka bir devlete tehdit gibi görünür, o da silahlanır; sonunda herkes daha az güvende olur.", "<ex>Örnek: Bir mahallede herkes kendini korumak için kapısına kilit, sonra demir, sonra kamera takarsa, komşular birbirinden daha çok şüphelenmeye başlar. Kimse daha güvende hissetmez.<\/ex>"], "en": "Realism assumes that international politics is a struggle for power, and whatever a state’s first aim, its final aim is power. The system is anarchic: authority is horizontal and there is no higher authority above sovereign, equal states; anarchy means no world government, not chaos. States are the main actors and are rational and unitary; non-state actors matter little. The security dilemma: one state’s defensive steps look like a threat to another, which arms too, so everyone ends up less safe."}, {"h": "Realizmin kolları", "diagram": "Klasik Realizm   Morgenthau (1948)   sebep: insan doğası\nNeorealizm       Waltz (1979)        sebep: sistemin yapısı\nNeoklasik        —                   sebep: sistem + iç faktörler\nSavunmacı        Walt                yeterli güç; tehditleri dengele\nSaldırgan        Mearsheimer         mümkün olan en çok güç; hatta hegemonya", "pts": ["<mark>Klasik realizm<\/mark> (<b>Morgenthau<\/b>, <i>Politics Among Nations<\/i>, 1948): güç olarak tanımlanan çıkar; güç arayışının kökü <b>insan doğasında<\/b>.", "<mark>Neorealizm<\/mark> (<b>Waltz<\/b>, <i>Theory of International Politics<\/i>, 1979), <b>yapısal / sistemik realizm<\/b> da denir: devlet davranışının sebebi insan doğası değil, <b>sistemin yapısıdır<\/b>.", "<mark>Neoklasik realizm<\/mark>: davranışı hem <b>sistemik<\/b> hem <b>iç<\/b> faktörler şekillendirir.", "<mark>Savunmacı realizm<\/mark>: sürekli daha çok güç peşinde koşmak irrasyoneldir, çünkü dengelemeyi tetikler; <b>ılımlı<\/b> miktarda güç aranmalıdır; savunma avantajlıdır. <b>Walt<\/b>: devletler sadece gücü değil, <b>tehdidi<\/b> dengeler.", "<mark>Saldırgan realizm<\/mark> (<b>Mearsheimer<\/b>): her fırsatta güç elde et, hatta hegemonya; saldırı kazandırır."], "en": "Classical realism (Morgenthau, Politics Among Nations, 1948) defines interest as power and roots the drive in human nature. Neorealism (Waltz, Theory of International Politics, 1979), also called structural or systemic realism, says the cause of state behavior is the system’s structure, not human nature. Neoclassical realism says both systemic and domestic factors shape behavior. Defensive realism says chasing ever more power is irrational because it triggers balancing, so seek a moderate amount; defense has the advantage, and Walt adds that states balance threats, not just power. Offensive realism (Mearsheimer) says grab power at every chance, even hegemony."}], "tip": "Klasik ile neo tek satırda: <b>Morgenthau insanı suçlar, Waltz sistemi suçlar.<\/b> Savunmacı ile saldırgan: <b>“yeterli” – “daha fazla”.<\/b>", "tipEn": "Classical vs. neo in one line: Morgenthau blames people, Waltz blames the system. Defensive vs. offensive: “enough” vs. “more.”", "trap": "“Devlet davranışının sebebi sistemin yapısıdır” demek <b>neorealizmi<\/b> tanımlar, klasik realizmi değil. Anarşi ≠ kaos. <b>Ulusal moral<\/b> fiziki olmayan bir unsurdur. Savunmacı realistlere göre <b>savunma<\/b> avantajlıdır.", "trapEn": "“The system’s structure causes state behavior” describes neorealism, not classical realism. Anarchy is not chaos. National morale is an intangible element. Defensive realists think defense has the advantage."}, {"title": "Uluslararası Politikada Alternatif Yaklaşımlar", "sub": "Liberalizm, Marksizm, inşacılık ve feminizm", "big": "Realizme her alternatif bir temel varsayımı değiştirir: <mark>liberalizm<\/mark> işbirliğinin mümkün olduğunu; <mark>Marksizm<\/mark> her şeyi ekonominin yönlendirdiğini; <mark>inşacılık<\/mark> kimliklerin çıkarları şekillendirdiğini; <mark>feminizm<\/mark> alanın kadınları görmezden geldiğini söyler.", "bigEn": "Each alternative to realism changes one key assumption: liberalism says cooperation is possible; Marxism says economics drives everything; constructivism says identities shape interests; feminism says the field ignores women.", "why": "Her kuramı realizmle tek bir soru üzerinden karşılaştır: devletleri ne yönlendirir? Realizm → anarşide güç. Liberalizm → paylaşılabilen çıkarlar; bu yüzden kurumlar, hukuk ve demokrasi işbirliğini kârlı yapabilir; herkes kazanabilir (mutlak kazanç). Marksizm → zengin merkezin yoksul çevreyi sömürdüğü kapitalist ekonomi. İnşacılık → etkileşimle kurulan kimlikler: kim olduğunu bilmeden ne istediğini bilemezsin. Feminizm → kategorilerin kendisi (devlet, güç, egemenlik) erkek bakışını yansıtır.", "whyEn": "Compare each theory to realism on one question: what drives states? Realism: power under anarchy. Liberalism: interests that can be shared, so institutions, law and democracy make cooperation pay and everyone can gain (absolute gains). Marxism: the capitalist economy, where the rich core exploits the poor periphery. Constructivism: identities built through interaction; you can’t know what you want until you know who you are. Feminism: the categories themselves (state, power, sovereignty) reflect a male view.", "sections": [{"h": "Liberalizm", "pts": ["Ancak Birinci Dünya Savaşı’ndan sonra bir Uİ kuramı oldu. Öncüleri arasında <b>Adam Smith, Grotius, Kant, Bentham<\/b> vardır (Morgenthau <b>değil<\/b>).", "Varsayımlar: aktörler sadece devletler değil, <b>bireyler ve örgütler<\/b> de; insan doğasına <b>iyimser<\/b> bakış; <b>işbirliği mümkündür<\/b> ve herkes kazanabilir; sistem sadece güçten ibaret değildir; değişim normlar, örgütler ve hukuk yoluyla da gelir; devletler yekpare değildir.", "Liberallere göre rasyonellik: insanlar toplumun <b>uzun vadeli<\/b> çıkarları için kısa vadeli çıkarlarından vazgeçebilir.", "<ex>Örnek: Türkiye ile Almanya arasındaki ticaret ikisini de zenginleştirir; birinin kazancı diğerinin kaybı değildir. Liberaller dünyaya böyle bakar.<\/ex>"], "en": "Liberalism became an IR theory only after WWI; its pioneers include Adam Smith, Grotius, Kant and Bentham (not Morgenthau). It assumes that actors include individuals and organizations, not just states; that human nature can be viewed optimistically; that cooperation is possible and everyone can gain; that the system isn’t only about power; that change also comes through norms, organizations and law; and that states are not unitary. Rationality, for liberals, means people can give up short-term interests for society’s long-term interests."}, {"h": "Liberalizmin kolları", "pts": ["<mark>İdealizm<\/mark> (Wilson): savaşlar anlamsızdır; baskıcı rejimler ve uluslararası mekanizmaların yokluğu savaşa yol açar. Çaresi: <b>kolektif güvenlik<\/b>, uluslararası örgütler, hukuk, diplomasi, arabuluculuk. Güç odaklı bir yaklaşım değildir.", "<mark>Kolektif güvenlik<\/mark>: büyük devletlerin sisteme yönelik herhangi bir saldırıya karşı birlikte direnmeyi kabul etmesi.", "<mark>Demokratik Barış Teorisi<\/mark> (Doyle, Rummel, Russett; Kant’tan esinlenir): demokrasiler <b>birbirleriyle savaşmaz<\/b>. Demokrasi olmayanlarla savaşabilirler.", "<mark>Neoliberal kurumsalcılık<\/mark> (1980’ler): bazı realist varsayımları kabul eder (anarşi; rasyonel ve yekpare devletler) ama kurumların çatışmayı azalttığını söyler. Devletler <b>göreceli kazanç<\/b> yerine <b>mutlak kazançla<\/b> (herkesin kazanması) ilgilenir."], "en": "Idealism (Wilson) says wars are pointless and are caused by repressive regimes and the lack of international mechanisms; its remedy is collective security, international organizations, law, diplomacy and mediation, not power. Collective security means the major states agree together to resist any attack on the system. Democratic peace theory (Doyle, Rummel, Russett, inspired by Kant) says democracies don’t fight each other, though they can fight non-democracies. Neoliberal institutionalism (1980s) accepts some realist assumptions (anarchy, rational unitary states) but says institutions reduce conflict, and that states care about absolute gains (everyone gains), not relative gains."}, {"h": "Marksist kuramlar", "pts": ["Uluslararası <b>ekonomik yapıya<\/b> odaklanır. Karl Marx’a (1818–1883) dayanır.", "<mark>Lenin<\/mark>’in emperyalizm kuramı: <b>emperyalizm kapitalizmin en son aşamasıdır<\/b>; güçler ucuz hammadde, işgücü ve pazar için zayıf ülkeleri sömürgeleştirir.", "<mark>Bağımlılık Teorisi<\/mark>: Üçüncü Dünya, sermaye ve teknoloji için zengin ülkelere <b>bağımlı<\/b> olduğu için yoksuldur.", "<mark>Dünya Sistemleri Teorisi<\/mark> (<b>Wallerstein<\/b>): 16. yüzyıl Avrupası’nda doğan kapitalist dünya ekonomisinin bir <b>merkezi<\/b> (zengin), <b>çevresi<\/b> (yoksul) ve <b>yarı-çevresi<\/b> vardır; merkez çevreyi sömürür.", "<ex>Örnek: Bir ülke kakao çekirdeğini ucuza satar, başka bir ülke onu çikolata yapıp pahalıya satar. Wallerstein’a göre ilki çevre, ikincisi merkezdir ve aradaki fark sistemin özüdür.<\/ex>", "<mark>Eleştirel Teori<\/mark>: <b>Frankfurt Okulu<\/b>’ndan gelir (1920’ler); 1980’lerde <b>Robert Cox<\/b> onu, <b>Gramsci<\/b>’nin hegemonya kavramını kullanarak Uİ’ye taşıdı.", "Marksistler kapitalizmi zenginlik için gerekli <b>görmez<\/b>; onu eşitsizliğin kaynağı olarak görür."], "en": "Marxist theories focus on the international economic structure and build on Karl Marx (1818–1883). Lenin: imperialism is the highest stage of capitalism, as powers colonize weak countries for cheap raw materials, labor and markets. Dependency theory: the Third World is poor because it depends on rich countries for capital and technology. World-systems theory (Wallerstein): the capitalist world economy, born in 16th-century Europe, has a rich core, a poor periphery and a semi-periphery, and the core exploits the periphery. Critical theory comes from the Frankfurt School (1920s) and was brought into IR by Robert Cox in the 1980s using Gramsci’s idea of hegemony. Marxists don’t see capitalism as necessary for wealth; they see it as the source of inequality."}, {"h": "İnşacılık", "pts": ["<mark>Sosyal inşacılık<\/mark> (<b>Alexander Wendt<\/b>): sistemin yapısı sadece maddi kapasitelerden değil, <b>sosyal<\/b> unsurlardan (normlar, ilişkiler) oluşur.", "Devletlerin kimlikleri yapı tarafından <b>dayatılmaz<\/b>; <b>etkileşimden<\/b> doğar. İyi etkileşim → kolektif kimlik; kötü etkileşim → bencil kimlik.", "<b>Önce kimlik, sonra çıkar<\/b>: kim olduğunu bilmeden çıkarlarını bilemezsin.", "<ex>Örnek: Wendt’in kendi ünlü örneği (kitapta yok): İngiltere’nin 500 nükleer silahı ABD için 5 Kuzey Kore nükleer silahından daha az tehdit edicidir. Fark silahların sayısında değil, iki ülkenin birbirini nasıl gördüğündedir.<\/ex>"], "en": "Social constructivism (Alexander Wendt) says the system’s structure is social (norms and relations), not just material capacities. States’ identities are not imposed by the structure; they come from interaction: good interaction builds a collective identity, bad interaction a selfish one. Identity comes first, then interests: you can’t know your interests without knowing who you are."}, {"h": "Feminizm", "pts": ["Ana akım varsayımlar sadece erkekler için doğrudur; realist kavramlar (devlet, güç, anarşi, çıkar, egemenlik) erkeklerin bakışını yansıtır.", "Cinsiyet ayrımcılığı erkeklerin en üstte olduğu hiyerarşiler yarattı ve kadınların katkılarını görmezden geldi.", "Kadınların dışlanmasının asıl sebebi siyasetin <b>geleneksel olarak erkek işi sayılmasıdır<\/b>. Kadınlar siyaseti etkiler, ama çoğunlukla <b>gayriresmî, devlet dışı<\/b> kanallardan."], "en": "Feminists argue that mainstream assumptions hold true only for men, and realist concepts (state, power, anarchy, interest, sovereignty) reflect men’s way of seeing. Gender discrimination created hierarchies with men on top and ignored women’s contributions. Women are excluded mainly because politics has traditionally been seen as men’s work; they do influence politics, mostly through informal, non-state channels."}], "tip": "Her kurama bir kelime: <b>Realizm = güç<\/b>, <b>Liberalizm = işbirliği<\/b>, <b>Marksizm = ekonomi<\/b>, <b>İnşacılık = kimlik<\/b>, <b>Feminizm = toplumsal cinsiyet<\/b>.", "tipEn": "One word per theory: realism = power, liberalism = cooperation, Marxism = economy, constructivism = identity, feminism = gender.", "trap": "“İnsan doğası kötü ve bencildir” <b>realist<\/b> bir varsayımdır, asla liberal değil. Demokratik barış = demokrasiler <b>birbirleriyle<\/b> savaşmaz; “hiç savaşmaz” değil. Neoliberaller <b>mutlak<\/b> kazançla ilgilenir; göreceli kazanç realistlerin kaygısıdır. Wendt inşacıdır, Marksist değil.", "trapEn": "“Human nature is evil and selfish” is realist, never liberal. Democratic peace means democracies don’t fight each other, not that they never fight. Neoliberals care about absolute gains; relative gains are the realist worry. Wendt is a constructivist, not a Marxist."}], "cards": [[1, "Uluslararası politika", "Uluslararası aktörler arasındaki politik ilişkileri inceleyen alt disiplin.", "International politics."], [1, "İç egemenlik", "Devletin ülkesinde yegâne kuvvet kullanma yetkisine sahip olması.", "Internal sovereignty."], [1, "Dış egemenlik", "Devletin uluslararası sistemdeki bağımsızlığı.", "External sovereignty."], [1, "Hegemonya", "En güçlü devletin sistem üzerinde kendi hâkimiyetini kurma ve koruma arzusu.", "Hegemony."], [1, "Gevşek çift kutuplu sistem", "Soğuk Savaş: iki süper güç ve etrafında kutuplaşmış devletler.", "Loose bipolarity."], [1, "Bağlantısızlar Hareketi", "Nehru, Nasır, Tito, Sukarno; iki bloka da katılmayanlar.", "Non-Aligned Movement."], [1, "Davranışçılık", "Sosyal bilimlerde doğa bilimlerinin yöntemlerini savunur.", "Behavioralism."], [1, "Reflektivist teoriler", "Bilimsel model yerine kimlik, algı ve yorumu öne çıkarır.", "Reflectivism."], [1, "İlk Uİ kürsüsü", "1919, Aberystwyth (Galler), Wilson adına.", "First IR chair."], [1, "Diplomatik usulleri belirleyen ilk kongre", "Viyana Kongresi.", "Congress of Vienna."], [2, "Aktör olmanın iki ölçütü", "Özerk eylem yapabilme ve diğerlerini etkileyebilme.", "Two actor criteria."], [2, "Devletin temel özellikleri (II. DS sonrası)", "Egemenlik, eşitlik, ülke bütünlüğü.", "State features."], [2, "Zayıf devlet", "Hukuken eşit ama güç unsurlarında dezavantajlı devlet.", "Weak state."], [2, "Çökmüş devlet", "Suç ve yolsuzluk yüksek, devlete güven yok, ekonomi denetim dışı.", "Failed state."], [2, "Devlet benzeri", "Kriterleri karşılayan ama tanınmayan, BM üyesi olmayan yapı (Tayvan, Kosova).", "Quasi-state."], [2, "Milliyetçilik", "Ulus devletin kurucu ideolojisi.", "Nationalism."], [2, "Hükümetler-dışı örgütler", "Af Örgütü, Sınır Tanımayan Doktorlar, Kızılhaç, Olimpiyat Komitesi.", "NGOs."], [2, "Çokuluslu şirket türleri", "Uluslararası ve uluslaraşırı.", "Types of multinationals."], [2, "Ulusal kurtuluş hareketi örnekleri", "FKÖ, UÇK, Hindistan Ulusal Kongresi.", "Liberation movements."], [2, "Lobi", "Kanun koyucuları etkilemek için örgütlenmiş grup.", "Lobby."], [3, "Güç (realist tanım)", "Bir aktörün diğerine aksi hâlde yapmayacağı şeyi yaptırabilme kabiliyeti.", "Power."], [3, "Güç kaynakları", "Uzun dönemli: GSMH, nüfus, toprak, coğrafi konum, doğal kaynaklar.", "Power resources."], [3, "Güç kapasiteleri", "Kısa dönemli: askeri güç, askeri-endüstriyel yapı, bürokrasi kalitesi.", "Power capabilities."], [3, "Fiziki olmayan güç öğeleri", "Ulusal özellikler, ulusal moral, hükümetin kalitesi.", "Intangible power."], [3, "Realistlere göre en önemli güç öğesi", "Askeri güç.", "Military power."], [3, "Anarşi (realizmde)", "Devletlerin üzerinde üst otoritenin olmaması (kaos değil).", "No world government."], [3, "Güvenlik ikilemi", "Bir devletin savunma tedbirlerinin diğerince tehdit algılanması ve herkesin güvensizleşmesi.", "Security dilemma."], [3, "Klasik realizm", "Morgenthau, 1948; güç arayışının kaynağı insan doğası.", "Classical realism."], [3, "Neorealizm", "Waltz, 1979; davranışın kaynağı sistemin yapısı.", "Structural realism."], [3, "Neoklasik realizm", "Hem sistemik hem iç faktörler etkiler.", "Neoclassical realism."], [3, "Savunmacı realizm", "Ilımlı güç; savunma avantajlı; Walt: tehdit dengesi.", "Defensive realism."], [3, "Saldırgan realizm", "Mearsheimer; her fırsatta güç, hatta hegemonya.", "Offensive realism."], [4, "Liberalizmin insan doğası görüşü", "İyimser.", "Optimistic."], [4, "Kolektif güvenlik", "Büyük devletlerin sisteme saldırıya karşı birlikte durma mekanizması.", "Collective security."], [4, "Demokratik barış teorisi", "Demokrasiler birbirleriyle savaşmaz (Doyle, Rummel, Russett).", "Democratic peace."], [4, "Neoliberal kurumsalcılık", "Kurumlar çatışmayı azaltır; mutlak kazanç önemlidir.", "Neoliberal institutionalism."], [4, "Lenin’in emperyalizm tezi", "Emperyalizm kapitalizmin en son aşamasıdır.", "Imperialism."], [4, "Bağımlılık teorisi", "III. Dünya ülkelerinin geri kalmışlığı zengin ülkelere bağımlılıktan.", "Dependency theory."], [4, "Dünya sistemleri teorisi", "Wallerstein; merkez, yarı-çevre, çevre.", "World-systems."], [4, "Eleştirel teori", "Frankfurt Okulu; Cox Uİ’ye taşıdı; Gramsci’nin hegemonyası.", "Critical theory."], [4, "Sosyal inşacılık", "Wendt; yapı sosyaldir; kimlik çıkarı belirler.", "Constructivism."], [4, "Feminizme göre dışlanmanın nedeni", "Politikanın geleneksel olarak erkek işi sayılması.", "Why women are excluded."]], "qs": [{"u": 1, "q": "Uluslararası politika, uluslararası ilişkilerin hangi boyutunu inceler?", "o": ["Ekonomik", "Politik", "Sportif", "Kültürel", "Tarihi"], "a": 1, "e": "Politik boyutu.", "en": "The political dimension."}, {"u": 1, "q": "Ulus devletin ortaya çıkışı için milat kabul edilen antlaşma hangisidir?", "o": ["Versay", "Paris", "Viyana", "Westphalia", "Trianon"], "a": 3, "e": "Westphalia, 1648.", "en": "Westphalia, 1648."}, {"u": 1, "q": "Aşağıdakilerden hangisi diplomasi biliminin gelişmesine katkıda bulunan düşünürlerden biri değildir?", "o": ["Machiavelli", "Guicciardini", "Grotius", "Wicquefort", "Kant"], "a": 4, "e": "Kant diplomasinin gelişimiyle değil, liberal barış fikirleriyle ilişkilidir.", "en": "Kant is linked to liberal peace ideas, not diplomacy’s development."}, {"u": 1, "q": "Diplomatik usullerin belirlendiği ilk uluslararası kongre hangisidir?", "o": ["Viyana Kongresi", "Paris Barış Kongresi", "Berlin Kongresi", "Aix-la-Chapelle", "Troppau"], "a": 0, "e": "Viyana Kongresi.", "en": "The Congress of Vienna."}, {"u": 1, "q": "Aşağıdakilerden hangisi klasik realist düşünürler arasında yer almaz?", "o": ["Morgenthau", "E. H. Carr", "Spykman", "Kennan", "Alexander Wendt"], "a": 4, "e": "Wendt bir inşacıdır.", "en": "Wendt is a constructivist."}, {"u": 1, "q": "En güçlü devletin tüm sistem üzerinde hâkimiyet kurma ve koruma arzusuna ne denir?", "o": ["Analiz düzeyi", "Hegemonya", "Gevşek çift kutupluluk", "Güç dengesi", "Sıkı çift kutupluluk"], "a": 1, "e": "Hegemonya.", "en": "Hegemony."}, {"u": 1, "q": "Klasik realizm ve idealizmi bilimsel yöntem kullanmamakla eleştiren yaklaşım hangisidir?", "o": ["Eleştirel teori", "Sosyal inşacılık", "Davranışçılık", "Post-yapısalcılık", "Liberal kurumsalcılık"], "a": 2, "e": "Davranışçılık doğa bilimlerinin yöntemlerini istedi.", "en": "Behavioralism wanted natural-science methods."}, {"u": 1, "q": "Aşağıdakilerden hangisi disiplinin gelişmesini sağlayan büyük tartışmalardan biri değildir?", "o": ["Klasik Realizm–İdealizm", "Gelenekselcilik–Davranışçılık", "Neorealizm–Neoliberalizm", "Eleştirel teori–Post-yapısalcılık", "Rasyonalist–Reflektivist"], "a": 3, "e": "Dört tartışma arasında bu çift yoktur.", "en": "The four debates don’t include this pair."}, {"u": 1, "q": "Aşağıdakilerden hangisi Bağlantısızlar Hareketi’nin liderlerinden biri değildir?", "o": ["Jivkov", "Nasır", "Tito", "Sukarno", "Nehru"], "a": 0, "e": "Jivkov, Sovyet bloku içindeki komünist Bulgaristan’ın lideriydi.", "en": "Jivkov led communist Bulgaria inside the Soviet bloc."}, {"u": 1, "q": "Devletin uluslararası sistemdeki bağımsızlığını ifade eden kavram hangisidir?", "o": ["İç egemenlik", "Dış egemenlik", "Ülke bütünlüğü", "Eşitlik", "Saldırmazlık"], "a": 1, "e": "Dış egemenlik.", "en": "External sovereignty."}, {"u": 1, "q": "Soğuk Savaş dönemindeki uluslararası sistem nasıl tanımlanır?", "o": ["Tek kutuplu", "Gevşek çift kutuplu", "Çok kutuplu", "Güç dengesi sistemi", "Hegemonik"], "a": 1, "e": "Gevşek çift kutuplu: iki blok ve bağlantısız devletler.", "en": "Loose bipolar: two blocs plus non-aligned states."}, {"u": 2, "q": "Hangi teoride devlet uluslararası politikanın yegâne a ": "Göreceli kazanç realistlerin kaygısıdır.", "en": "Relative gains are the realist concern."}, {"u": 4, "q": "Hangisi Marksist yaklaşımın varsayımı değildir?", "o": ["Temel faktörler ekonomiktir", "III. Dünya zengin ülkelere bağımlıdır", "Kapitalizm zenginlik için gerekli bir sistemdir", "Kapitalizm eşitsizliğin kaynağıdır", "Ulusaşırı kapitalist güçler hegemonyayı sürdürmek için birleşmiştir"], "a": 2, "e": "Marksistler kapitalizmi sorunun kendisi olarak görür.", "en": "Marxists see capitalism as the problem."}, {"u": 4, "q": "İnşacılara göre devlet çıkarının temelinde ne vardır?", "o": ["Ekonomi", "Siyaset", "Uluslararası örgütler", "Uluslararası hukuk", "Devletlerin kimliği"], "a": 4, "e": "Önce kimlik gelir, sonra çıkar.", "en": "Identity comes first, then interests."}, {"u": 4, "q": "Hangisi Marksist bir düşünür değildir?", "o": ["Alexander Wendt", "Lenin", "Gramsci", "Horkheimer", "Fromm"], "a": 0, "e": "Wendt bir inşacıdır.", "en": "Wendt is a constructivist."}, {"u": 4, "q": "Feministlere göre kadınların uluslararası politikadan dışlanmasının temel nedeni nedir?", "o": ["Kadınların ilgisizliği", "Kadın liderlerin azlığı", "Kadın akademisyenlerin azlığı", "Politikanın geleneksel olarak erkek işi sayılması", "Kadınların bu meslekleri seçmemesi"], "a": 3, "e": "Siyasetin erkek işi olduğu geleneği.", "en": "The tradition that politics is men’s work."}, {"u": 4, "q": "Lenin’e göre emperyalizm nedir?", "o": ["Feodalizmin son aşaması", "Kapitalizmin en son aşaması", "Sosyalizmin ilk aşaması", "Liberalizmin sonucu", "Milliyetçiliğin ürünü"], "a": 1, "e": "Kapitalizmin en son aşaması.", "en": "The highest stage of capitalism."}], "aboutEn": "This course is about why states behave the way they do, and each theory answers differently. Realism: it’s about power and survival in a world with no boss. Liberalism: cooperation, institutions and democracy can tame that. Marxism: it’s really about economic exploitation. Constructivism: it depends on identities states build t <script>
/* AÖF shared core: storage, dates, progress model, spaced repetition, icons.
   Used by the hub and every course page (same origin, so they read each other's progress). */
const AOF = (() => {
  const PASS = 0.7; // test score that counts a unit as passed
  const BOXES = [0, 1, 2, 4, 8]; // Leitner box -> days until the card is due again

  function store(prefix) {
    return {
      get(k, d) { try { const v = localStorage.getItem(prefix + ":" + k); return v === null ? d : JSON.parse(v) } catch (e) { return d } },
      set(k, v) { try { localStorage.setItem(prefix + ":" + k, JSON.stringify(v)) } catch (e) {} }
    };
  }

  // ---- dates (local calendar days as YYYY-MM-DD) ----
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d) };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
  const today = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t };
  const daysBetween = (a, b) => Math.round((b - a) / 864e5);
  const AY = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
  const AYLAR = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const GUN = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
  const GUNLER = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

  // ---- scores ----
  // best values are stored as "7/10" strings (kept from the first version).
  const pct = s => { if (s == null) return null; const [a, b] = String(s).split("/").map(Number); return b ? a / b : null };
  const passed = s => { const p = pct(s); return p != null && p >= PASS };

  // ---- card ids: stable across sessions and content edits elsewhere in the deck ----
  function cardId(unit, front) {
    let h = 5381; const s = unit + "|" + front;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  /* Per-course progress. Keys (prefix = course code):
       done   {u1:true}           unit read ("Okudum")
       best   {1:"8/10", mix:..}  best test score per unit
       srs    {id:{b,d,u}}        Leitner box, next due date, unit
       log    {"2026-10-21":{cards:n,test:"8/10",list:1,visit:1}}  daily activity, drives automatic day completion */
  function course(code, examISO) {
    const st = store(code);
    const s = {
      done: st.get("done", {}), best: st.get("best", {}), srs: st.get("srs", {}), log: st.get("log", {}),
      save(k) { st.set(k, s[k]) },
      get: st.get, set: st.set,
      mark(kind, value) {
        const k = iso(today()); const day = s.log[k] || (s.log[k] = {});
        if (kind === "cards") day.cards = (day.cards || 0) + 1;
        else if (kind === "test") { if (!day.test || pct(value) > pct(day.test)) day.test = value }
        else day[kind] = 1;
        s.save("log");
      },
      // Leitner review: "Bildim" moves a card up a box, "Tekrar" back to box 1. Due dates never pass the exam.
      review(id, unit, knew) {
        const cur = s.srs[id] || { b: 0 };
        const b = knew ? Math.min(BOXES.length - 1, cur.b + 1) : 0;
        let due = addDays(today(), knew ? BOXES[b] : 0);
        if (examISO) { const ex = addDays(parse(examISO), -1); if (due > ex && today() <= ex) due = ex }
        s.srs[id] = { b, d: iso(due), u: unit };
        s.save("srs");
        s.mark("cards");
      },
      isDue(id) { const c = s.srs[id]; return !!c && c.d <= iso(today()) },
      dueCount(unit) { const t = iso(today()); return Object.values(s.srs).filter(c => c.d <= t && (!unit || c.u === unit)).length },
      seenCount(unit) { return Object.values(s.srs).filter(c => c.u === unit).length },
      // A unit's three steps. cardTotal comes from the course data (or the hub's per-unit counts).
      unit(n, cardTotal) {
        const read = !!s.done["u" + n];
        const cards = cardTotal ? s.seenCount(n) >= cardTotal : read;
        const test = passed(s.best[n]);
        return { read, cards, test, complete: read && cards && test, steps: (read ? 1 : 0) + (cards ? 1 : 0) + (test ? 1 : 0) };
      }
    };
    return s;
  }

  // ---- icons: one 2px stroke family, drawn on a 24px grid ----
  const I = {
    home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
    units: '<path d="M4 6h16M4 12h16M4 18h11"/>',
    cards: '<rect x="3" y="7" width="13" height="13" rx="2.5"/><path d="M8 4h10.5A2.5 2.5 0 0 1 21 6.5V17"/>',
    test: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    bulb: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    back: '<path d="M15 18l-6-6 6-6"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    repeat: '<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/>',
    flip: '<path d="M4 7h13l-3-3M20 17H7l3 3"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
    flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
    play: '<path d="M7 5l12 7-12 7z"/>'
  };
  const ico = (n, size, label) => `<svg class="ico" viewBox="0 0 24 24"${size ? ` style="width:${size}px;height:${size}px"` : ""}${label ? ` role="img" aria-label="${label}"` : ' aria-hidden="true"'}>${I[n]}</svg>`;
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Three step marks (Oku / Kartlar / Test) used on the hub, course home and plan.
  const steps = u => `<span class="marks" role="img" aria-label="Oku ${u.read ? "tamam" : "yapılmadı"}, kartlar ${u.cards ? "tamam" : "yapılmadı"}, test ${u.test ? "geçti" : "yapılmadı"}"><i class="${u.read ? "on" : ""}"></i><i class="${u.cards ? "on" : ""}"></i><i class="${u.test ? "on" : ""}"></i></span>`;

  // Keep the sticky header's hairline only while content scrolls under it (scroll-edge effect).
  function scrollEdge(el) {
    const f = () => el.classList.toggle("edge", scrollY > 4);
    addEventListener("scroll", f, { passive: true }); f();
  }

  return { PASS, store, iso, parse, addDays, today, daysBetween, AY, AYLAR, GUN, GUNLER, pct, passed, cardId, course, ico, esc, reduced, steps, scrollEdge };
})();

</script>

// ---------- routing: each view is a history entry, so the back gesture walks views ----------
const TABS=[["home","Ana sayfa","home"],["units",UWS,"units"],["cards","Kartlar","cards"],["test","Test","test"],["list",C.listShort||"Liste","list"]];
function parseRoute(h){
  h=(h||"").replace(/^#/,"");

  if(["home","units","cards","test","list","review"].includes(h))return {v:h};

// ---------- flash cards with spaced repetition and swipe ----------
let deck=[], flipped=false, tally={k:0,a:0}, deckKey="";
const cardScopeOpts=()=>[["due","Tekrar"],["0","Tümü"]].concat(UNITS.map((u,i)=>[String(i+1),SHORT(i+1)]));
function buildDeck(opt){
  let pool;
  if(opt.mode==="due")pool=CARDS.filter(c=>S.isDue(ID(c)));
  else if(opt.mode==="session")pool=cardsOf(opt.n).filter(c=>!S.srs[ID(c)]||S.isDue(ID(c)));
  else{const sc=String(S.get("cardScope",0));pool=sc==="due"?CARDS.filter(c=>S.isDue(ID(c))):CARDS.filter(c=>sc==="0"||c[0]===+sc)}

}
function cards(opt){

  if(key!==deckKey||!deck.total&&!deck.finished){buildDeck(opt);deckKey=key}
  const title=opt.mode==="due"?"Bugünkü tekrar":opt.mode==="session"?`${UNITS[opt.n-1].title}`:"Kartlar";
  const sc=String(S.get("cardScope",0));

}
function meter(){const t=deck.total||0,d=t-deck.length;return `<div class="meter"><div class="bar"><i style="--p:${t?d/t:0}"></i></div><p>${t} kartın ${d} tanesi bitti · ${tally.k} bildim · ${tally.a} tekrar</p></div>`}
function drawCard(opt,dir){
  const z=document.getElementById("cardzone"); const c=deck[0];
  if(!c){
    deck.finished=true; stopKeys();

    const next=opt.mode==="session"?`#s${opt.n}t`:"#test";

      <p class="muted">${empty?"Yeni kartlar, bildiğin kartlar ve tekrar günü gelenler burada toplanır.":`${tally.k} bildim · ${tally.a} tekrar. Bilmediklerin sonraki günlerde yeniden gelecek.`}</p>
      <div class="pair" style="width:100%">${opt.mode==="session"?`<a class="btn ghost" href="#home">Çık</a>`:`<button class="btn ghost" id="re">Yeniden karıştır</button>`}<a class="btn primary" href="${next}">${ico("test",18)}Teste geç</a></div></section>`;

  }
