<style>
/* Layout: a study app. Sticky top bar, content in rounded cards, bottom tab bar (Ana sayfa · Üniteler · Kartlar · Test · Liste). Course hue drives the hero, chips and buttons. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --raised:#ffffff; --ink:#141922; --muted:#5d6574; --line:#e2e5ec;
  --c:#2459c9; --c-ink:#ffffff; --good:#1f8a52; --bad:#c2412d; --why:#4255b8;
  --soft:color-mix(in srgb,var(--c) 10%,var(--surface)); --soft2:color-mix(in srgb,var(--c) 18%,var(--surface));
  --good-soft:color-mix(in srgb,var(--good) 12%,var(--surface)); --bad-soft:color-mix(in srgb,var(--bad) 11%,var(--surface)); --why-soft:color-mix(in srgb,var(--why) 10%,var(--surface));
  --mark:color-mix(in srgb,#ffd84d 55%,var(--surface)); --mark-ink:var(--ink); --ex:#b4239a; --en-bg:color-mix(in srgb,var(--ink) 4%,var(--surface));
  --shadow:0 1px 2px rgba(20,25,34,.06),0 6px 20px rgba(20,25,34,.06);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#171b23; --raised:#1d222c; --ink:#eef1f6; --muted:#9aa3b2; --line:#2a303b;
  --c:#86adff; --c-ink:#0e1117; --good:#5fd394; --bad:#ff8a74; --why:#9fb0ff;
  --mark:color-mix(in srgb,#ffd84d 28%,var(--surface)); --mark-ink:#fff6cc; --ex:#ff8ae6; --en-bg:color-mix(in srgb,#fff 5%,var(--surface)); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#171b23; --raised:#1d222c; --ink:#eef1f6; --muted:#9aa3b2; --line:#2a303b;
  --c:#86adff; --c-ink:#0e1117; --good:#5fd394; --bad:#ff8a74; --why:#9fb0ff;
  --mark:color-mix(in srgb,#ffd84d 28%,var(--surface)); --mark-ink:#fff6cc; --ex:#ff8ae6; --en-bg:color-mix(in srgb,#fff 5%,var(--surface)); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{max-width:880px}}
.ico{width:22px;height:22px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.back{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:var(--bg);text-decoration:none;flex:0 0 auto}
.tb-t{min-width:0;flex:1;line-height:1.2}
.tb-t small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tb-t b{display:block;font-family:var(--display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:0 0 auto}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}

{"title":"Tarihsel Gelişim ve Kuram","sub":"Uluslararası hukuk nedir, tarihi ve onu açıklayan ana kuramlar","big":"<mark>Uluslararası hukuk</mark> = <b>uluslararası hukuk kişileri</b> arasındaki ilişkileri düzenleyen kurallar. Başlıca kişiler devletlerdir; uluslararası örgütler ve bir ölçüde bireyler de sayılır.","bigEn":"International law is the set of rules governing relations between international legal persons. States are the main ones, but international organizations and, to some extent, individuals count too.","why":"Büyük kuramsal kavga <b>hakların nereden geldiği</b> üzerinedir. Doğal hukuk (Grotius): <b>akıldan</b>; yani devletler anlaşmasa bile var olurlar. Pozitivizm (Bynkershoek): devletlerin antlaşmalarda ve uzun uygulamada görülen <b>iradesinden</b>. Vattel ortayı buldu: haklar doğal hukuktan gelir ama ancak devletler kabul edince geçerli olur. Austin daha da ileri gitti: onu zorla uygulatacak bir egemen olmadığı için uluslararası hukuk hiç hukuk değildir. Her kuram “devlet neden uymalı?” sorusunu farklı cevaplar. Onları ayırmak için bilmen gereken tek şey bu.","whyEn":"The big theoretical fight is about where rights come from. Natural law (Grotius): from reason, so they would exist even if states didn’t agree. Positivism (Bynkershoek): from states’ will, shown in treaties and long practice. Vattel split the difference: rights come from natural law but count only once states accept them. Austin went further: with no sovereign to enforce it, international law isn’t law at all. Each theory answers “why should a state obey?” differently; that is all you need to tell them apart.","sections":[{"h":"Tanım ve hukuk kişileri","pts":["Uluslararası hukuk: <mark>uluslararası hukuk kişileri</mark> arasındaki ilişkileri düzenleyen ilke ve kurallar.","Uzun süre sadece <b>devletler</b> kişiydi. Bugün <b>uluslararası örgütler</b> de kişidir ve bazı uygulamalarda <b>bireyler</b> de kişi sayılır.","Ağırlık yine devletlerdedir, çünkü örgütler ve bireyler ancak devletler sayesinde hareket edebilir.","Kökeni: Roma’nın <mark>ius gentium</mark>’u (“kavimler hukuku”, vatandaş olmayanlar için). İngilizce “international law” terimini ilk kez 18. yüzyılda <b>Bentham</b> kullandı. Öncesinde: “milletler hukuku” (Almanca: Völkerrecht).","<ex>Örnek: Türkiye ile Yunanistan arasında bir hava sahası sorunu çıktığında ikisinin de üstünde onları yargılayacak bir “dünya mahkemesi” kendiliğinden devreye girmez. Bu, uluslararası hukukun iç hukuktan en büyük farkıdır.</ex>"],"en":"International law is the principles and rules governing relations between international legal persons. For a long time only states were persons; today international organizations are too, and some practice treats individuals as persons. States still carry the weight, because organizations and individuals act only thanks to states. Its roots are in Roman ius gentium, the “law of peoples” for non-citizens. Bentham first used the English term “international law” in the 18th century; before that it was called the “law of nations.”"},{"h":"Uluslararası hukuk gerçekten hukuk mu?","pts":["<mark>Austin</mark>: hukuk bir egemenin emridir; devletlerin üstünde egemen yoktur, bu yüzden uluslararası hukuk sadece “<b>pozitif ahlak</b>”tır.","<mark>Hart</mark> Austin’in kuramını geliştirdi: bir hukuk sistemi = <b>birincil kurallar</b> (kişilere yönelik “Yap!” / “Yapma!”) + <b>ikincil kurallar</b> (kurallar hakkındaki kurallar: <b>tanıma</b>, <b>değiştirme</b>, <b>muhakeme</b>). Uluslararası hukuk biçimde olmasa da içerikte hukuka benzer.","<b>İskandinav hukuki realizmi</b>: bağlayıcılık, hak ve ödev gibi kavramları hayalî, metafizik fikirler sayarak reddeder. <b>Amerikan hukuki realizmi</b>: kuralların rolünden şüphe eder; mahkemelerin gerçekte ne yaptığına bakar."],"en":"Austin: law is the command of a sovereign, and there is no sovereign above states, so international law is only “positive morality.” Hart developed this: a legal system is primary rules (“Do!”/“Don’t!” aimed at people) plus secondary rules about rules (recognition, change, adjudication); international law resembles law in content if not in form. Scandinavian legal realism rejects ideas like binding force, rights and duties as imaginary. American legal realism doubts the role of rules and looks at what courts actually do."},{"h":"Klasik dönem (1648 → Birinci Dünya Savaşı)","pts":["Modern uluslararası hukuk Avrupa’daki ulus devletlerle başlar. Dönüm noktası <b>1648 Westphalia</b>’dır: Kilise güç kaybetti; farklı mezheplerden devletler birlikte yaşamak zorunda kaldı.","Birinci Dünya Savaşı’na kadar <mark>Avrupa Kamu Hukuku</mark> denen düzenli bir yapı gelişti. 1815 Viyana Kongresi büyük güçler arasında barışı yeniden kurdu.","Avrupa dışındaki devletler “yeterince medeni değil” sayıldı ve hukuki talepleri sınırlı tutuldu; ilişkiler güce göre ya <b>sömürgecilik</b> ya da işbirliği demekti.","İnsancıl hukuk ve örgütler yönünde ilk adımlar: <b>1864 Cenevre Konvansiyonu</b> (Kızıl Haç), <b>1899 ve 1907 Lahey Barış Konferansları</b>."],"en":"Modern international law begins with Europe’s nation-states; 1648 Westphalia is the turning point, as the Church lost power and states of different faiths had to coexist. Until WWI a regular order called European Public Law developed, and the 1815 Congress of Vienna restored peace among the great powers. Non-European states were treated as “not civilized enough,” and relations with them meant colonization or cooperation depending on power. First steps toward humanitarian law and organizations: the 1864 Geneva Convention (Red Cross) and the 1899 and 1907 Hague Peace Conferences."},{"h":"Modern dönem (Birinci Dünya Savaşı → bugün)","pts":["Birinci Dünya Savaşı modern dönemin başlangıcıdır: ABD ve Rusya güç olarak katılır, sonra sömürgelikten kurtulan devletler gelir → sistem Avrupa merkezli olmaktan çıkar.","<mark>Milletler Cemiyeti</mark> (ilk genel kurul 1920, 41 devlet): uluslararası düzeni güvenceye almak için ilk büyük adım. İkinci Dünya Savaşı’nı önleyemedi.","Yerini <mark>Birleşmiş Milletler</mark> aldı. Öncülünün devamıdır ve uluslararası hukukun yapılması ve uygulanmasında kilit roldedir; ondan sonra çok taraflı antlaşmalar çoğaldı."],"en":"WWI starts the modern period: the US and Russia join as powers, later decolonized states join too, and the system stops being Europe-centered. The League of Nations (first assembly in 1920 with 41 states) was the first big step to secure international order but failed to prevent WWII. The United Nations replaced it as its successor; it is key to making and applying international law, and multilateral treaties multiplied after it."},{"h":"Kuramlar: doğal hukuk ve pozitivizm","pts":["<mark>Vitoria</mark> (İspanyol ilahiyatçı, Aquinas geleneği): yerlileri insan saymayan fatihlere karşı çıktı; <b>haklı savaş</b> kuramı içinde yerlilerin de siyasi varlığı olduğunu savundu.","<b>Suárez</b> ve <b>Gentili</b>: Vitoria’yı Grotius’a bağlayan doğal hukukçular.","<mark>Grotius</mark>: <b>uluslararası hukukun kurucusu</b>; akılcı doğal hukuk (Tanrı olmasa bile var olurdu). Eserleri: <b>De Iure Belli ac Pacis</b> (Savaş ve Barış Hukuku) ve <b>Mare Liberum</b> (Açık Deniz): denizler herkesindir; her millet seyahat ve ticaret yapabilir. Portekiz’e karşı Hollanda için yazıldı.","<mark>Pozitivizm</mark>: haklar akıldan değil, <b>devletlerin irade ve uygulamasından</b> gelir. Öncüsü: <b>Bynkershoek</b>.","<mark>Vattel</mark>: ikisini uzlaştırdı; haklar doğal hukuktan gelir ama devletlerce kabul edilmelidir.","<ex>Örnek: Doğal hukukçuya göre işkence yasağı insan aklından gelir; hiçbir devlet imzalamasa da geçerlidir. Pozitivist ise “devletler bunu antlaşmalarla kabul ettiği için bağlayıcıdır” der.</ex>"],"en":"Vitoria, a Spanish theologian in the Aquinas tradition, opposed conquistadors who denied the natives’ humanity and argued, within just-war theory, that natives had political existence too. Suárez and Gentili link him to Grotius. Grotius is the founder of international law: rational natural law that would exist even without God; his works are On the Law of War and Peace and Mare Liberum (the seas belong to all, written for Holland against Portugal). Positivism, pioneered by Bynkershoek, says rights come from states’ will and practice, not reason. Vattel reconciled the two: rights come from natural law but must be accepted by states."},{"h":"Modern kuramlar","pts":["<mark>Kelsen</mark>: hukuk normlar hiyerarşisidir; uluslararası hukuk ve iç hukuk <b>tek bir bütündür</b>. Temeli <b>pacta sunt servanda</b>’dır (ahde vefa: anlaşmalara uyulmalıdır).","<mark>Realist</mark> yaklaşımlar: uluslararası hukuk bir uluslararası siyaset meselesidir.","<mark>Marksist</mark> yaklaşım: uluslararası ilişkiler ekonomik bir mücadeledir; hukuk bunun aracıdır ve emperyalist, sömürgeci devletlere hizmet eder.","<mark>Feminist</mark> yaklaşımlar: uluslararası hukukun <b>eril bir dili</b> vardır; eşit haklar, kadınlara özel koruma ve erkek tahakkümünün sona ermesini isterler. Gelenek adına kadının ikincil statüsünün korunmasını <b>asla</b> kabul etmezler."],"en":"Kelsen: law is a hierarchy of norms, and international and national law form one whole whose foundation is pacta sunt servanda (agreements must be kept). Realist approaches treat international law as a matter of international politics. The Marxist approach sees international relations as economic struggle and law as its tool, serving imperialist and colonial states. Feminist approaches say international law speaks a male language and demand equal rights, special protection for women and an end to male domination; they would never accept keeping women’s secondary status for tradition’s sake."}],"tip":"Düşünürler zaman sırasıyla, her biri tek kelime: <b>Vitoria</b> (yerliler) → <b>Grotius</b> (akıl, açık deniz) → <b>Bynkershoek</b> (irade) → <b>Vattel</b> (ikisi birden) → <b>Bentham</b> (isim) → <b>Austin</b> (hukuk değil) → <b>Kelsen</b> (tek sistem) → <b>Hart</b> (kurallar hakkında kurallar).","tipEn":"Thinkers in time order, one word each: Vitoria (natives) → Grotius (reason, free seas) → Bynkershoek (will) → Vattel (both) → Bentham (the name) → Austin (not law) → Kelsen (one system) → Hart (rules about rules).","trap":"<b>Hart’ın birincil kuralları</b> “Yap!/Yapma!” kurallarıdır; ikincil kurallar başka kurallarla ilgilidir. Kelsen’in temeli <b>ahde vefa</b>dır, egemen eşitlik değil. BM’nin öncülü Milletler Cemiyeti’dir, Kızıl Haç değil.","trapEn":"Hart’s primary rules are the “Do!/Don’t!” rules; secondary rules are about other rules. Kelsen’s foundation is pacta sunt servanda, not sovereign equality. The UN’s predecessor is the League of Nations, not the Red Cross."},
{"title":"Uluslararası Hukukun Kaynakları","sub":"Uluslararası hukuk kuralları nereden gelir ve nasıl sıralanır","big":"<b>Asli kaynaklar</b> <mark>antlaşmalar</mark> ve <mark>örf ve adet</mark>tir; boşluk doldurucu olarak <mark>hukukun genel ilkeleri</mark> vardır. <b>Yargı kararları</b> ve <b>öğreti</b> yardımcı kaynaktır.","bigEn":"The primary sources are treaties and custom, with general principles of law as a gap-filler. Court decisions and scholarly writing are auxiliary.","why":"Dünya parlamentosu olmadığı için kurallar sadece iki yolla yapılabilir: devletler onları <b>yazıp imzalar</b> (antlaşmalar) ya da <b>uzun süre, uymak zorunda olduklarına inanarak aynı şekilde davranır</b> (örf ve adet). İkisi de devlet rızasına dayanır, bu yüzden eşit ağırlıktadır. Hâlâ boşluk varsa hâkimler her hukuk sisteminde bulunan ilkelerden yararlanır (genel ilkeler). Mahkeme kararları ve bilim insanları kural yapmaz; hâkimlerin kuralı <b>bulmasına</b> yardım eder. Bu yüzden “yardımcı”dırlar.","whyEn":"With no world parliament, rules can be made only two ways: states write them down and sign (treaties), or states behave the same way for a long time believing they must (custom). Both rest on consent, so they rank equally. If there is still a gap, judges borrow principles found in every legal system (general principles). Court rulings and scholars don’t make rules; they help judges find them, which is why they are auxiliary.","sections":[{"h":"Liste: UAD Statüsü m.38","diagram":"ASLİ KAYNAKLAR\n  a. Uluslararası antlaşmalar\n  b. Uluslararası örf ve adet (teamül)\n  c. Hukukun genel ilkeleri   ← tamamlayıcı (boşluk doldurur)\nYARDIMCI KAYNAKLAR\n  d. Yargı kararları\n     Öğreti (doktrin: uzman yazarlar)\n+ m.38(2): Hakkaniyet ve nısfet — sadece taraflar kabul ederse","pts":["<b>Uluslararası Adalet Divanı (UAD)</b> Statüsü’nün 38(1). maddesi Divan’ın neleri uygulayacağını sayar."],"en":"Article 38(1) of the Statute of the International Court of Justice lists what the Court applies: treaties, custom and general principles as primary sources (general principles fill gaps), and court decisions and scholarly writing as auxiliary means. Article 38(2) adds deciding ex aequo et bono, only if the parties agree."},{"h":"Antlaşmalar ve örf-adet","pts":["<mark>Uluslararası antlaşmalar</mark>: uluslararası hukuk kişileri arasında hak ve yükümlülük doğuran yazılı anlaşmalar; iki taraflı veya çok taraflı olabilir.","<mark>Uluslararası örf ve adet</mark> (<b>teamül</b> de denir): iki koşul ister. <b>Maddi koşul</b>: devletler bu şekilde <b>sürekli ve genel</b> davranır. <b>Psikolojik koşul</b>: bunu uymak zorunda oldukları bir <b>kural</b> olduğuna inandıkları için yaparlar.","<ex>Örnek: Bir ülkenin büyükelçisini tutuklamamak yüzyıllar boyunca, yazılı bir kural olmadan da uygulandı; çünkü devletler bunun bir zorunluluk olduğuna inanıyordu. İşte örf ve adet böyle oluşur.</ex>","Örf ve adet <b>bölgesel</b>, hatta iki taraflı da olabilir (örneğin ortak bir denize kıyısı olan devletlerin uzun uygulaması).","Antlaşmalar ile örf ve adet <b>eşit</b> bağlayıcılıktadır. Uygulamada ikisi aynı konuyu düzenliyorsa önce antlaşma uygulanır. Yani antlaşma “her anlamda üstün” <b>değildir</b>.","<mark>Jus cogens</mark> (1969 Viyana Sözleşmesi m.53): bütün uluslararası toplumca kabul edilen <b>emredici normlar</b>; hiçbir şekilde sapılamaz; ancak aynı nitelikte sonraki bir normla değişebilir."],"en":"Treaties are written agreements between international legal persons that create rights and duties; they can be bilateral or multilateral. Custom (teamül) needs two conditions: a material one (states act this way constantly and generally) and a psychological one (they do it because they believe it is a rule they must follow). Custom can also be regional or even bilateral. Treaties and custom have equal binding force; in practice, when both cover the same issue, the treaty is applied first, but a treaty is not superior in every sense. Jus cogens (Vienna Convention art. 53) are peremptory norms accepted by the whole international community, from which no deviation is allowed; only a later norm of the same kind can change them."},{"h":"Genel ilkeler ve yardımcı kaynaklar","pts":["<mark>Hukukun genel ilkeleri</mark>: “uygar milletlerce” kabul edilen ilkeler; bir <b>boşluk</b> olduğunda kullanılır. Asli sayılır ama <b>tamamlayıcıdır</b>.","<mark>Yargı kararları</mark> ve <mark>öğreti</mark> (uzman yazarların eserleri): mahkemelerin kuralları belirlemesine yardım eder. Aralarında net bir hiyerarşi yoktur ama yargı kararları biraz daha üstte görülür.","<mark>Hakkaniyet</mark>, adalet fikrine geri döner; mahkemelerin yararlanabileceği genel bir ilkedir."],"en":"General principles of law, accepted by “civilized nations,” are used when there is a gap; they count as primary but complementary. Court decisions and scholarly writing help courts identify the rules; there is no clear hierarchy between them, though court decisions are seen as slightly higher. Equity refers back to the idea of justice and is a general principle courts can draw on."},{"h":"Hakkaniyet ve nısfet (ex aequo et bono)","pts":["m.38(2): Divan, mevcut hukuku katı biçimde uygulamak yerine somut olayda adil olana göre karar verebilir.","Daha esnek kararlar vermeyi mümkün kılar.","<b>Sadece taraflar kabul ederse</b>. Divan bunu kendiliğinden (re’sen) <b>yapamaz</b>."],"en":"Under Article 38(2) the Court may decide by what is fair in the specific case instead of strictly applying existing law, which allows more flexible decisions. It can do this only if the parties agree, never on its own initiative."},{"h":"Devletlerin tek taraflı işlemleri","pts":["Tek taraflı beyanlar, onu yapan devlet için hak ve yükümlülük doğurabilir.","<mark>Tanıma</mark>: bir durumun var olduğunu ve meşru olduğunu beyan etmek.","<mark>Vazgeçme</mark>: bir hakkı kendi iradesiyle, <b>kimseye devretmeden</b> terk etmek.","<mark>Tebliğ</mark>: hukuken önemli bir durumu diğer devletlere resmen bildirmek.","<mark>Kınama (protesto)</mark>: bir durumu veya iddiayı meşru <b>kabul etmediğini</b> beyan etmek.","<mark>Tek taraflı söz verme</mark>: kabul beklemeden, koşulsuz olarak belli bir şekilde davranacağını taahhüt etmek."],"en":"One-sided declarations can create rights and duties for the state that makes them. Recognition declares that a situation exists and is legitimate. Renunciation abandons a right voluntarily without transferring it to anyone. Notification officially informs other states of a legally relevant situation. Protest declares that you do not accept a situation or claim as legitimate. A unilateral promise commits to act a certain way, unconditionally, without waiting for acceptance."}],"tip":"Kaynakları tek soruyla ayır: <b>“Kuralı yapıyor mu, yoksa bulmaya mı yardım ediyor?”</b> Yapıyorsa → asli (antlaşma, örf-adet, genel ilkeler). Bulmaya yardım ediyorsa → yardımcı (yargı kararları, öğreti).","tipEn":"Sort sources with one question: “Does it make the rule, or help find it?” Makes it → primary (treaty, custom, general principles). Helps find it → auxiliary (court decisions, scholars).","trap":"Örf ve adet <b>asli</b>dir, asla yardımcı değildir. Tamamlayıcı kaynak <b>genel ilkelerdir</b>. Ex aequo et bono için <b>tarafların rızası</b> gerekir. Vazgeçme = hakkı kimseye vermeden bırakmak.","trapEn":"Custom is a primary source, never auxiliary. The gap-filler is general principles. Ex aequo et bono needs the parties’ consent. Renunciation means giving up a right without handing it to anyone."},
{"title":"Uluslararası Antlaşmalar","sub":"Antlaşma nasıl yapılır, devletler nasıl bağlanır, ne zaman geçersizdir ve nasıl sona erer","big":"Bir antlaşma şu adımlardan geçer: <mark>metnin hazırlanması</mark> → <mark>metnin tevsiki</mark> → her devletin <mark>bağlanma iradesini</mark> göstermesi → <mark>yürürlüğe girme</mark> → ileride <mark>sona erme</mark>.","bigEn":"A treaty goes through steps: the text is prepared → authenticated → each state shows its consent to be bound → it enters into force → it may later end.","why":"“Metne katılıyorum” ile “devletim bağlandı”yı ayır. Bir diplomatın metni parafe etmesi veya imzalaması çoğu zaman sadece metni dondurur. Devleti bağlamak için genellikle ülkenin kendi süreci gerekir (meclisin uygun bulması, sonra onay). Bağlansa bile antlaşma ancak <b>yürürlüğe girince</b> hüküm doğurur, örneğin belli sayıda devlet onayladıktan sonra. Geçersizlik ile sona ermeyi de ayır: geçersizlik <b>doğuşta</b> bir şeyin yanlış olmasıdır (yetkisizlik, zorlama, hata, jus cogense aykırılık). Sona erme ise geçerli bir antlaşmanın <b>sonradan durmasıdır</b> (ihlal, imkânsızlık, koşulların değişmesi, çekilme).","whyEn":"Separate “I agree with the text” from “my state is bound.” A diplomat initialing or signing usually only freezes the wording; binding the state often needs the country’s own procedure (parliament’s approval, then ratification). Even when bound, a treaty takes effect only on entry into force, e.g. after a set number of ratifications. Invalidity vs. ending: invalid means something was wrong at birth (no authority, coercion, error, conflict with jus cogens); ending means a valid treaty stops later (breach, impossibility, changed circumstances, withdrawal).","sections":[{"h":"Antlaşma nedir?","pts":["Antlaşma yapma ehliyeti olan kişiler arasında, uluslararası hukuka tabi, hak ve yükümlülük doğuran, değiştiren veya sona erdiren <b>yazılı</b> irade uyuşması. <b>Asli</b> bir kaynaktır.","Kurallar: <mark>1969 Viyana Antlaşmalar Hukuku Sözleşmesi</mark>; çoğu bugün örf ve adet hukuku hâline gelmiştir. <b>Türkiye taraf değildir</b>. (1986 sözleşmesi uluslararası örgütlerle yapılan antlaşmaları düzenler.)"],"en":"A treaty is a written agreement of wills between persons with treaty-making capacity, governed by international law, that creates, changes or ends rights and duties; it is a primary source. The rules are in the 1969 Vienna Convention on the Law of Treaties, most of which is now customary law; Turkey is not a party. A 1986 convention covers treaties with international organizations."},{"h":"Hazırlık ve tevsik","pts":["Metin hazırlamanın sabit bir yöntemi yoktur; taraflar serbesttir.","<mark>Tevsik</mark>: üzerinde anlaşılan metni resmileştirmek; antlaşmadaki yöntemle ya da <b>imza, ad referandum imza veya parafe</b> ile.","<b>Yetki belgesi olmadan</b> devleti temsil edenler: <b>devlet başkanı, hükümet başkanı, dışişleri bakanı</b>; ayrıca bulundukları devletle yapılacak antlaşmalar için diplomatik misyon şefleri. Örneğin bir adalet bakanının yetki belgesine ihtiyacı vardır.","<ex>Örnek: Türkiye’nin Berlin büyükelçisi Almanya ile ikili bir antlaşma metnini yetki belgesi olmadan kabul edebilir; ama Türkiye ile Japonya arasındaki bir antlaşma için bunu yapamaz.</ex>"],"en":"There is no fixed method for drafting a text; the parties are free. Authentication (tevsik) makes the agreed text official, by the method in the treaty or by signature, signature ad referendum or initialing. The head of state, head of government and foreign minister represent a state without full powers, as do heads of diplomatic missions for treaties with their host state; a justice minister, for example, needs full powers."},{"h":"Bağlanma iradesi","pts":["<b>Basit usul</b>: <mark>imza</mark> veya belge değişimi doğrudan bağlar.","<b>Karmaşık usul</b>: <mark>onay</mark>: devlet iç hukuktaki süreci tamamladıktan sonra imzalanan metnin kendisini bağladığını teyit eder. Ayrıca <b>katılma</b>, <b>kabul</b>, <b>uygun bulma</b>.","<mark>Yürürlüğe girme</mark>: antlaşmada belirtilen tarihte veya koşullarda, ya da rızanın bildirilmesiyle. Antlaşma hukuki sonuçlarını imzadan değil <b>yürürlüğe girmeden</b> itibaren doğurur.","<mark>Çekince</mark>: sınırlar içinde, bir devlet bazı hükümlerin kendisine uygulanmamasını sağlayabilir."],"en":"In the simple procedure, signature or an exchange of documents binds the state directly. In the complex procedure, ratification follows the state’s internal process and confirms that the signed text binds it; accession, acceptance and approval are other forms. A treaty takes effect from entry into force, on the date or conditions it sets, not from signature. Within limits, a reservation lets a state exclude certain provisions from applying to it."},{"h":"Türk hukukunda antlaşmalar","pts":["<b>AY m.90</b>: usulüne göre yürürlüğe konulmuş antlaşmalar <b>kanun hükmündedir</b>. Süreç: TBMM onaylamayı uygun bulan bir kanun çıkarır → <b>Cumhurbaşkanı onaylar</b> (AY m.104) → yayımlanır.","Bazı antlaşmalar TBMM kanunu gerektirmeyen istisnalardır.","Antlaşmalar hakkında Anayasa’ya aykırılık iddiasıyla <b>Anayasa Mahkemesine gidilemez</b>.","<b>Temel hak ve özgürlüklere</b> ilişkin bir antlaşma bir kanunla çatışırsa <b>antlaşma</b> esas alınır."],"en":"Under art. 90 of the Turkish Constitution, duly ratified treaties have the force of law. The process: parliament passes a law approving ratification, the President ratifies (art. 104), and the treaty is published. Some treaties are exceptions that don’t need a law. Treaties cannot be challenged before the Constitutional Court. If a treaty on fundamental rights and freedoms conflicts with a law, the treaty prevails."},{"h":"Geçersizlik: doğuştaki kusurlar","pts":["<b>Yetkisiz</b> kişilerce yapılması.","Devletin iradesinin <b>sakat</b> olması: <b>hata</b>, hile, rüşvet, <b>temsilcinin veya devletin zorlanması</b>.","<b>Jus cogens</b> ile çatışması.","<b>Önemli ihlal</b> bir geçersizlik nedeni DEĞİLDİR; sona erme nedenidir."],"en":"A treaty is invalid if it was made by people without authority, if the state’s will was defective (error, fraud, corruption, coercion of the representative or the state), or if it conflicts with jus cogens. Material breach is not an invalidity ground; it is a ground for ending."},{"h":"Sona erme: geçerli bir antlaşmanın durması","pts":["Antlaşmanın kendi hükümleri: bir bitiş tarihi veya koşulu, ya da <b>fesih</b> veya <b>çekilme</b> hakkı.","Diğerlerinin rızası olmadan bile: karşı tarafın <b>önemli ihlali</b>; ifanın <b>imkânsızlaşması</b>; <b>koşulların temelden değişmesi</b> (<mark>rebus sic stantibus</mark>; sadece o koşullar esaslıysa, öngörülemediyse ve değişme yükümlülükleri kökten değiştiriyorsa); <b>yeni bir jus cogens</b> norm.","<ex>Örnek: İki devlet ortak bir adadaki bir madeni işletmek için antlaşma yapar, sonra ada depremle denize gömülürse antlaşmanın konusu imkânsızlaşır ve antlaşma sona erer.</ex>","<b>Objektif hukuki durum</b> yaratan antlaşmalar (bir bölgeye statü vermek gibi) <b>üçüncü devletlere</b> etkileriyle ilgilidir."],"en":"A treaty ends under its own terms (an end date or condition, or a right of denunciation or withdrawal). Even without the other parties’ consent it can end through material breach by the other side, impossibility of performance, a fundamental change of circumstances (rebus sic stantibus, only if the circumstances were essential, unforeseeable and the change radically alters obligations), or a new jus cogens norm. Treaties creating an objective legal situation, such as a territory’s status, concern their effect on third states."}],"tip":"<b>Yanlış doğdu = geçersiz</b> (yetkisizlik, zorlama, hata, jus cogens). <b>Sonradan öldü = sona erme</b> (ihlal, imkânsızlık, rebus sic stantibus, çekilme). Yetki belgesine hiç ihtiyacı olmayan üç kişi: <b>“3 baş”</b>: devlet, hükümet, dışişleri.","tipEn":"Born wrong = invalid (no authority, coercion, error, jus cogens). Died later = termination (breach, impossibility, changed circumstances, withdrawal). The three who never need full powers: the heads of state and government and the foreign minister.","trap":"Antlaşmalar <b>asli</b> kaynaktır. İmza <b>basit</b> usuldür; onay karmaşık usuldür. Antlaşma <b>yürürlüğe girmeden</b> itibaren bağlar. Türkiye’de <b>Cumhurbaşkanı</b> onaylar. “Yetkili kişilerce yapılmaması” geçersizliktir, sona erme değil.","trapEn":"Treaties are a primary source. Signature is the simple procedure, ratification the complex one. A treaty binds from entry into force. In Turkey the President ratifies. “Not made by authorized persons” is invalidity, not termination."},
{"title":"Uluslararası Hukukta Kişilik","sub":"Devleti devlet yapan şey, tanıma, devlet türleri ve halefiyet","big":"Bir <mark>devlet</mark> üç şeye ihtiyaç duyar: <b>ülke</b>, <b>insan topluluğu</b> ve <b>etkin ve bağımsız bir yönetim</b>. Diğer devletlerin <mark>tanıması</mark> ayrı bir işlemdir; unsurlardan biri değildir.","bigEn":"A state needs three things: a territory, a population and an effective, independent government. Recognition by other states is a separate act, not one of the elements.","why":"Sor: bu sahadaki bir gerçek mi, yoksa diğer devletlerin o gerçek hakkındaki görüşü mü? Ülke, insanlar ve etkin kontrol gerçeklerdir; bu yüzden unsurdurlar. Tanıma ise diğer devletlerin bu gerçekler hakkındaki <b>beyanıdır</b>; bugün hem açıklayıcı hem kurucu görülür, ama tanınmamış bir devlet de uluslararası hukukla bağlıdır. Mantık sınırları da açıklar: etkin kontrol <b>başka bir devletin ordusuyla</b> kurulduysa onu tanımak hukuka aykırı kuvveti ödüllendirmek olur; bu yüzden devletler tanımamalıdır (Stimson Doktrini).","whyEn":"Ask: is this a fact on the ground, or other states’ opinion of that fact? Territory, people and effective control are facts, so they are the elements. Recognition is other states’ declaration about those facts; today it is seen as both declaratory and constitutive, but an unrecognized state is still bound by international law. Logic also explains the limits: if control was gained with another state’s army, recognizing it would reward illegal force, so states must not (the Stimson Doctrine).","sections":[{"h":"Uluslararası hukuk kişiliği","pts":["Kişilik devlete şunları sağlar: <b>hak sahibi olma</b>, <b>borçlanma</b>, diğer hukuk kişileriyle ilişki kurma ve diğer devletlere <b>dava açma</b> ehliyeti. Diğer devletlerin iç işlerine müdahale hakkı <b>sağlamaz</b>.","Uluslararası örgütlerin de kurucu antlaşmalarının belirlediği bir kişiliği vardır: antlaşma yapma, talepte bulunma, temsil ve bağışıklıklar, uluslararası sorumluluk."],"en":"Personality gives a state the capacity to hold rights, incur debts, deal with other legal persons and sue other states. It does not give a right to intervene in other states’ internal affairs. International organizations also have personality, defined by their founding treaty: making treaties, bringing claims, representation and immunities, and international responsibility."},{"h":"Devletin unsurları","pts":["<b>1933 Montevideo Sözleşmesi</b>’ne göre (bugün örf-adet sayılabilir): <b>ülke</b>, <b>insan topluluğu</b> (kendini yönetebilen bir nüfus), etkin kontrol uygulayan <b>egemen siyasi otorite</b>.","Siyasi otorite <b>bağımsız ve etkin</b> olmalıdır.","<b>Tanınmış olmak bir unsur DEĞİLDİR.</b>","<ex>Örnek: Bir şirketin kurulması için sermaye, ortaklar ve yönetim kurulu gerekir; müşterilerin onu “tanıması” gerekmez. Devlet de böyledir: unsurları varsa tanınmasa da vardır.</ex>"],"en":"Under the 1933 Montevideo Convention (now arguably custom), a state has a territory, a population able to govern itself, and a sovereign political authority exercising effective control. That authority must be independent and effective. Being recognized is not an element."},{"h":"Tanıma","pts":["Kuramlar: salt <b>kurucu</b> (kişilik ancak tanımadan sonra doğar) ve hâkim görüş: tanıma hem <b>açıklayıcı hem kurucudur</b>. Tanınmamış bir devlet de uluslararası hukuka tabidir.","Sonuçları: ilişki kurma, elçi gönderme, antlaşma yapma, iç mahkemelerde yargı bağışıklığı. <b>De jure tanıma geri alınamaz.</b>","<b>Hükümetlerin</b> etkinliğe dayalı <mark>de facto</mark> ve <mark>de jure</mark> tanınması: rakip bir hükümet kontrolü ele geçirmiş ama kalıcılığı şüpheliyse devletler önce onu <b>de facto</b> tanıyabilir; bu <b>geri alınabilir</b>. Resmî diplomatik ilişki sadece de jure hükümetle yürütülür. Aynı anda bir de jure ve bir de facto hükümet olabilir.","Tanınmamış bir hükümetin yine de geçerli olan işlemleri: <b>doğum, evlilik, boşanma kayıtları ve konsolosluk işlemleri</b>.","Tanınmaması gerekenler: <b>başka bir devletin silahlı kuvvetleriyle</b> kurulan kontrol; hukuka aykırı kuvvetle kazanılan ülke (<b>Stimson Doktrini, 1931</b>, Japonya’nın Çin’i işgalinden sonra; daha sonra 1970 BM Dostane İlişkiler Bildirisi’nde)."],"en":"Theories: purely constitutive (personality exists only after recognition) versus the prevailing view that recognition is both declaratory and constitutive; an unrecognized state is still subject to international law. Recognition lets states establish relations, send ambassadors, make treaties and enjoy immunity in national courts; de jure recognition can’t be withdrawn. Governments can be recognized de facto or de jure, based on effectiveness: if a rival government has control but its permanence is doubtful, states may first recognize it de facto, which can be withdrawn; official diplomatic relations are only with the de jure government, and both kinds can exist at once. Birth, marriage and divorce records and consular acts of an unrecognized government stay valid. Control gained with another state’s armed forces, or territory taken by unlawful force, must not be recognized (Stimson Doctrine, 1931, later in the 1970 UN Friendly Relations Declaration)."},{"h":"Devlet türleri","pts":["<b>Basit</b> (üniter) ve <b>bileşik</b> devletler: <mark>şahsi birlik</mark> (üyeler kişiliğini korur; örneğin İngiliz hükümdarı altındaki Commonwealth), <mark>gerçek birlik</mark>, <mark>konfederasyon</mark>, <mark>federasyon</mark>.","<mark>Konfederasyon</mark>: bağımsız devletler ortak amaçlar (güvenlik, dış ilişkiler) için antlaşmayla birleşir; üyeler kişiliklerini <b>korur</b>; konfederasyonun kişiliği yoktur; “diyet” denen ortak bir meclis vardır. Örnekler: ABD 1781–88, İsviçre 1847’ye kadar.","<mark>Federasyon</mark>: yetkiler anayasayla federal devlet ve üye devletler arasında bölünür; federal anayasa üye devlet kanunlarının üstündedir; federal kanunlar doğrudan uygulanır. Üye devletler bazı durumlarda antlaşma yapabilir; bu yüzden “asla yapamazlar” yanlıştır.","<ex>Örnek: Almanya bir federasyondur; Bavyera’nın kendi meclisi vardır ama Almanya adına savaş ilan edemez. AB ise bir devlet değildir; üye ülkeler kendi kişiliklerini korur.</ex>","İlişkilerine göre: <b>bağımsız</b>, <b>bağımlı</b>, <b>tarafsız</b> (taraf tutmaz ve savaşanların topraklarını kullanmasına izin vermez)."],"en":"States are unitary or composite: personal union (members keep personality, e.g. the Commonwealth under the British monarch), real union, confederation and federation. In a confederation independent states join by treaty for common aims such as security and foreign affairs; the members keep their personality and the confederation has none, with a common assembly called the diet (examples: the US 1781–88, Switzerland until 1847). In a federation the constitution splits powers between the federal and member states, the federal constitution stands above member laws and federal laws apply directly; members may sometimes make treaties. By relations, states are independent, dependent or neutral (not taking sides or letting belligerents use their territory)."},{"h":"Kendi kaderini tayin ve halefiyet","pts":["Tanınmış bir devlet içindeki azınlık bir halk, kendi kaderini tayin hakkına dayanarak ayrılma talebinde esas olarak <b>kendisini temsil eden demokratik bir yönetim yoksa</b> bulunabilir. Devletlerin ülke bütünlüğü de korunur.","<mark>Mevcut sınırların korunması</mark>: SSCB (1991 Minsk, Alma-Ata) ve Yugoslavya (1992 Badinter Komisyonu) dağılırken uygulandı.","<mark>Halefiyet</mark>: eski devletin antlaşmalarına, mallarına ve borçlarına ne olacağı.","Ayrılma veya parçalanmada: <mark>antlaşmaların sürekliliği</mark>: yeni devlet <b>öncekinin antlaşmalarıyla bağlı kalır</b> (örneğin SSCB için Rusya; Çek ve Slovak cumhuriyetleri)."],"en":"A minority people inside a recognized state may claim secession through self-determination mainly when there is no democratic government representing them; states’ territorial integrity is also protected. The principle of keeping existing borders was applied when the USSR (1991 Minsk and Alma-Ata) and Yugoslavia (1992 Badinter Commission) broke up. Succession (halefiyet) is what happens to the old state’s treaties, property and debts. In secession or break-up, treaty continuity means the new state stays bound by the predecessor’s treaties (e.g. Russia for the USSR, the Czech and Slovak republics)."}],"tip":"Üç unsur = <b>Ülke, İnsan, Otorite</b> (Ü-İ-O). Tanıma, insanların yanlışlıkla eklediği dördüncü şeydir.","tipEn":"Three elements = territory, people, authority (Ü-İ-O). Recognition is the fourth thing people wrongly add.","trap":"<b>De jure</b> tanıma geri alınamaz; <b>de facto</b> alınabilir. Kişilik asla müdahale hakkı içermez. Konfederasyonda kişiliği <b>üyeler</b> korur, konfederasyonun kendisi değil.","trapEn":"De jure recognition can’t be withdrawn; de facto can. Personality never includes a right to intervene. In a confederation the members keep their personality, not the confederation."}
],
cards:[
 [1,"Uluslararası hukuk","Uluslararası hukuk kişileri arasındaki ilişkileri düzenleyen ilke ve kurallar.","Definition."],
 [1,"Ius gentium","Roma’da kavimler hukuku; uluslararası hukukun kökeni.","Law of peoples."],
 [1,"Grotius","Uluslararası hukukun kurucusu; akılcı doğal hukuk; Mare Liberum.","Father of international law."],
 [1,"Mare Liberum","Denizler herkesindir; tüm milletler seyahat ve ticaret yapabilir.","Free seas."],
 [1,"Vitoria","Yerlilerin de siyasi varlığı olduğunu savunan İspanyol ilahiyatçı.","Defended the natives."],
 [1,"Pozitivizm (uluslararası hukukta)","Haklar akıldan değil devletlerin iradesinden ve uygulamadan gelir; öncüsü Bynkershoek.","Positivism."],
 [1,"Austin","Uluslararası hukuk hukuk değil, pozitif ahlaktır.","Not real law."],
 [1,"Hart’ın birincil kuralları","Bireylere yönelik “Yap!” “Yapma!” kuralları.","Primary rules."],
 [1,"Kelsen","İç hukuk ve uluslararası hukuk tek bütün; temeli ahde vefa.","Monism."],
 [1,"Marksist yaklaşım","Uluslararası ilişkiler ekonomik mücadele; hukuk bunun aracı.","Marxist view."],
 [1,"Feminist yaklaşım","Hukukun eril dilini eleştirir; eşitlik ve özel koruma ister.","Feminist view."],
 [1,"İskandinav hukuki realizmi","Bağlayıcılık, hak, ödev gibi kavramları hayal ürünü sayarak reddeder.","Scandinavian realism."],
 [2,"Asli kaynaklar","Uluslararası antlaşmalar, uluslararası örf ve adet (+ hukukun genel ilkeleri).","Primary sources."],
 [2,"Yardımcı kaynaklar","Yargı kararları ve öğreti.","Auxiliary sources."],
 [2,"Tamamlayıcı kaynak","Hukukun genel ilkeleri (boşluk varsa).","Gap-filler."],
 [2,"Örf ve adetin iki koşulu","Maddi (sürekli ve genel uygulama) + psikolojik (kural olduğu inancı).","Two conditions of custom."],
 [2,"Jus cogens","Hiçbir şekilde sapılamayan, ancak aynı nitelikte bir normla değişebilen emredici kural (VAHS m.53).","Peremptory norm."],
 [2,"Hakkaniyet ve nısfet","UAD Statüsü 38(2); tarafların kabulüyle esnek karar.","Ex aequo et bono."],
 [2,"Tanıma (tek taraflı işlem)","Bir durumun varlığını ve meşruiyetini kabul beyanı.","Recognition."],
 [2,"Vazgeçme","Bir hakkı kimseye devretmeden terk etmek.","Renunciation."],
 [2,"Kınama (protesto)","Bir durumun meşruiyetini kabul etmeme beyanı.","Protest."],
 [3,"Uluslararası antlaşma","Yetkili kişiler arasında hak ve yükümlülük doğuran yazılı irade uyuşması.","Treaty."],
 [3,"1969 Viyana Sözleşmesi","Antlaşmalar hukukunu düzenler; Türkiye taraf değil.","VCLT."],
 [3,"Tevsik","Antlaşma metninin resmileştirilmesi (imza, ad referandum imza, parafe).","Authentication."],
 [3,"Yetki belgesi gerekmeyenler","Devlet başkanı, hükümet başkanı, dışişleri bakanı.","No full powers needed."],
 [3,"Basit bağlanma usulü","İmza veya belge değişimi.","Simple procedure."],
 [3,"Onay","İç hukuk sürecinden sonra metnin devleti bağladığının kabulü.","Ratification."],
 [3,"Çekince","Devletin bazı hükümlerin kendisine uygulanmamasını istemesi.","Reservation."],
 [3,"Geçersizlik nedenleri","Yetkisiz kişi, hata, hile, temsilciyi veya devleti tehdit, jus cogense aykırılık.","Invalidity."],
 [3,"Sona erme nedenleri","Fesih, çekilme, önemli ihlal, imkânsızlık, koşulların değişmesi, yeni jus cogens.","Termination."],
 [3,"Rebus sic stantibus","Koşulların temelden değişmesi nedeniyle antlaşmadan çekilme.","Changed circumstances."],
 [3,"AY m.90","Antlaşmalar kanun hükmünde; AYM’ye götürülemez; temel haklarda antlaşma esas.","Turkish Constitution."],
 [4,"Devletin unsurları","Ülke, insan topluluğu, bağımsız ve etkin siyasi otorite.","Elements of a state."],
 [4,"Kişiliğin sağlamadığı","Diğer devletlerin iç işlerine müdahale ehliyeti.","No right to intervene."],
 [4,"De facto tanıma","Hükümetin geçici tanınması; geri alınabilir.","Provisional recognition."],
 [4,"De jure tanıma","Kesin tanıma; geri alınamaz; resmi diplomatik ilişki.","Full recognition."],
 [4,"Tanınmamış hükümetin geçerli işlemleri","Doğum, evlilik, boşanma kayıtları ve konsolosluk işlemleri.","Valid acts."],
 [4,"Stimson Doktrini","Kuvvetle elde edilen ülke ve devletlerin tanınmaması (1931).","Non-recognition."],
 [4,"Konfederasyon","Bağımsız devletlerin antlaşmayla birliği; üyeler kişiliğini korur.","Confederation."],
 [4,"Antlaşmaların sürekliliği","Yeni devlet öncekinin antlaşmalarıyla bağlı kalır.","Treaty continuity."]

}
function unitList(){
  app.innerHTML=`<div class="stack"><div><div class="label">${C.name}</div><h2 style="margin-top:4px">${U==="Unit"?"Units":U+"ler"}</h2></div><div class="tiles">${UNITS.map(tile).join("")}</div>
  <button class="tile" data-go="list" style="align-items:center"><span class="no">${ico("list",22)}</span><span class="tx"><b>${C.listName||"Ezber listesi"}</b><span>${C.listIntro}</span></span></button></div>`;
}
function unit(i){
  const u=UNITS[i-1], d=done["u"+i];
  app.innerHTML=`<div class="stack">
   <div class="unithead"><div class="label" style="color:var(--c)">${U} ${i} / ${N}</div><h2>${u.title}</h2><p class="muted">${SUB(u)}</p>${LEGEND}</div>
   <div class="steps"><button class="step on"><span class="n">1</span>Oku</button><button class="step" id="s2"><span class="n">2</span>Kartlar</button><button class="step" id="s3"><span class="n">3</span>Test</button></div>
   <section class="bigidea"><div class="label" style="color:var(--c)">Ana fikir</div><p>${u.big}</p>${EN(u.bigEn)}</section>
   ${u.why?`<section class="note why"><span class="ic">${ico("bulb")}</span><div><h3>Neden böyle?</h3><p>${u.why}</p>${EN(u.whyEn)}</div></section>`:""}
   ${u.sections.map((s,j)=>`<section class="card sec"><h3><span class="k">${j+1}</span>${s.h}</h3>${s.diagram?`<pre class="diagram">${esc(s.diagram)}</pre>`:""}${s.pts?`<ul class="pts">${s.pts.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}${EN(s.en)}</section>`).join("")}
   <section class="note tip"><span class="ic">${ico("star")}</span><div><h3>Akılda tutma ipucu</h3><p>${u.tip}</p>${EN(u.tipEn)}</div></section>
   <section class="note trap"><span class="ic">${ico("alert")}</span><div><h3>Sınav tuzağı</h3><p>${u.trap}</p>${EN(u.trapEn)}</div></section>
   <button class="readbtn ${d?"done":""}" id="readbtn">${ico("check")} ${d?"Okundu ✓ (geri almak için dokun)":"Okudum"}</button>
   <div class="cardbtns"><button class="btn ghost" id="b2">${ico("cards",18)} Kartları çevir</button><button class="btn primary" id="b3">${ico("test",18)} Teste başla</button></div>
   <div class="pager">${i>1?`<button data-go="u${i-1}"><small>← Önceki</small><b>${UNITS[i-2].title}</b></button>`:"<span></span>"}${i<N?`<button class="nx" data-go="u${i+1}"><small>Sonraki →</small><b>${UNITS[i].title}</b></button>`:`<button class="nx" data-go="test"><small>Sonraki →</small><b>Karışık test</b></button>`}</div>
  </div>`;
  document.getElementById("readbtn").onclick=()=>{done["u"+i]=!done["u"+i];store.set("done",done);unit(i);app.querySelectorAll("[data-go]").forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go)})};
  const toC=()=>{cardScope=i;store.set("cardScope",i);deck=[];go("cards")}, toT=()=>{testScope=i;startTest();go("test")};
  document.getElementById("s2").onclick=toC;document.getElementById("b2").onclick=toC;document.getElementById("s3").onclick=toT;document.getElementById("b3").onclick=toT;
}
function seg(cur,attr,opts){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button ${attr}="${v}" aria-pressed="${cur===v}">${l}</button>`).join("")}</div>`}
const short=k=>(U==="Bölüm"?"B":U==="Unit"?"U":"Ü")+k;

let cardScope=store.get("cardScope",0), deck=[], flipped=false, known=0, total=0;
function buildDeck(){deck=CARDS.filter(c=>!cardScope||c[0]===cardScope).slice().sort(()=>Math.random()-.5);deck._scope=cardScope;total=deck.length;known=0;flipped=false}
function cards(){
  if((!deck.length&&!deck._finished)||deck._scope!==cardScope) buildDeck();
  const c=deck[0];
  app.innerHTML=`<div class="stack">
   <div><div class="label">${C.name}</div><h2 style="margin-top:4px">Kartlar</h2></div>
   ${seg(cardScope,"data-s",[[0,"Tümü"]].concat(UNITS.map((u,i)=>[i+1,short(i+1)])))}
   <div><div class="bar"><i style="width:${total?known/total*100:0}%"></i></div><p class="muted" style="font-size:14px;margin-top:6px">${total} kartın ${known} tanesi biliniyor</p></div>
   ${c?`<div class="stage"><div class="fc ${flipped?"flipped":""}" id="fc" role="button" tabindex="0" aria-label="Kartı çevir">
      <div class="face front"><span class="chip c">${U} ${c[0]}</span><div class="term">${c[1]}</div><div class="hint">${ico("tap",16)} Önce sesli söyle, sonra dokun</div></div>
      <div class="face rear"><div class="tr">${c[2]}</div><div class="en" lang="en">${c[3]}</div></div></div></div>
     <div class="cardbtns"><button class="btn again" id="again">Tekrar</button><button class="btn know" id="got">${ico("check",18)} Bildim</button></div>`
    :`<div class="card result">${ring(1,total,"kart",120,10,"var(--line)","var(--good)")}<h3>Deste bitti</h3><p class="muted">Yarın tekrar gel ve bir daha yap. Kalıcı olmasını sağlayan bu.</p><button class="btn primary" id="re">Yeniden karıştır</button></div>`}
  </div>`;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{cardScope=+b.dataset.s;store.set("cardScope",cardScope);buildDeck();cards()});
  const fc=document.getElementById("fc"); if(fc){fc.onclick=()=>{flipped=!flipped;fc.classList.toggle("flipped",flipped)};fc.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();fc.onclick()}}}
  const ag=document.getElementById("again"); if(ag) ag.onclick=()=>{const x=deck.shift();deck.splice(Math.min(3,deck.length),0,x);flipped=false;cards()};
  const gt=document.getElementById("got"); if(gt) gt.onclick=()=>{deck.shift();known++;flipped=false;if(!deck.length)deck._finished=true;cards()};
  const re=document.getElementById("re"); if(re) re.onclick=()=>{buildDeck();cards()};
}

let testScope=store.get("testScope",1), tq=[], ti=0, tscore=0, answered=null, misses=[];
function startTest(){store.set("testScope",testScope);let p=QS.filter(q=>!testScope||q.u===testScope).slice().sort(()=>Math.random()-.5);if(!testScope)p=p.slice(0,20);tq=p.map(q=>{const ix=[0,1,2,3,4].sort(()=>Math.random()-.5);return Object.assign({},q,{o:ix.map(i=>q.o[i]),a:ix.indexOf(q.a)})});ti=0;tscore=0;answered=null;misses=[]}
function test(){
  if(!tq.length) startTest();
  const head=`<div><div class="label">${C.name}</div><h2 style="margin-top:4px">Test</h2></div>${seg(testScope,"data-t",UNITS.map((u,i)=>[i+1,U+" "+(i+1)]).concat([[0,"Karışık 20"]]))}`;
  if(ti>=tq.length){
    const key=testScope||"mix", res=`${tscore}/${tq.length}`, pct=tscore/tq.length;
    if(best[key]==null||parseInt(best[key])/parseInt(best[key].split("/")[1])<pct){best[key]=res;store.set("best",best)}
    app.innerHTML=`<div class="stack">${head}<div class="card result">${ring(pct,res,"doğru",140,10,"var(--line)",pct>=.7?"var(--good)":"var(--bad)")}
      <h3>${pct>=.7?"Harika. Devam etmeye hazırsın.":"Az kaldı. Yanlışlarını tekrar oku, yarın yeniden dene."}</h3>
      ${misses.length?`<div class="miss"><div class="label">Bunları tekrar et</div>${misses.map(m=>`<div><b>${m.q}</b><br><span class="muted">Cevap: ${m.o[m.a]} · ${U} ${m.u}</span></div>`).join("")}</div>`:""}
      <button class="btn primary block" id="retry">Tekrar dene</button></div></div>`;
    bindT();document.getElementById("retry").onclick=()=>{startTest();test()};return;
  }
  const q=tq[ti], L="ABCDE";
  app.innerHTML=`<div class="stack">${head}
   <div><div class="bar"><i style="width:${ti/tq.length*100}%"></i></div><p class="muted" style="font-size:14px;margin-top:6px">Soru ${ti+1} / ${tq.length} · ${U} ${q.u} · ${tscore} doğru</p></div>
   <section class="card stack" style="gap:16px"><p class="q">${q.q}</p>
   <div class="opts">${q.o.map((o,k)=>{let cls="";if(answered!==null){if(k===q.a)cls=" right";else if(k===answered)cls=" wrong"}
     return `<button class="opt${cls}" data-k="${k}" ${answered!==null?"disabled":""}><span class="L">${L[k]}</span><span>${o}</span></button>`}).join("")}</div>
   ${answered!==null?`<div class="fb ${answered===q.a?"ok":"no"}"><b>${answered===q.a?"Doğru!":"Cevap: "+L[q.a]+") "+q.o[q.a]}</b>${q.e}${EN(q.en)}</div>
   <button class="btn primary block" id="next">${ti+1<tq.length?"Sonraki soru":"Sonucu gör"} ${ico("arrow",18)}</button>`:""}
   </section></div>`;
  bindT();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{answered=+b.dataset.k;if(answered===q.a)tscore++;else misses.push(q);test()});
  const n=document.getElementById("next"); if(n){n.onclick=()=>{ti++;answered=null;test();window.scrollTo({top:0})};n.scrollIntoView({block:"nearest",behavior:"smooth"})}
}
function bindT(){app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{testScope=+b.dataset.t;startTest();test()})}

function list(){
  app.innerHTML=`<div class="stack"><div><div class="label">${C.name}</div><h2 style="margin-top:4px">${C.listName||"Ezber listesi"}</h2><p class="muted" style="margin-top:6px">${C.listIntro}</p></div>
   <label class="search">${ico("list",20)}<input id="q" type="search" placeholder="Ara: isim, tarih, terim" autocomplete="off"></label>
   <div class="rows two" id="rows"></div></div>`;
  const draw=f=>{const s=f.toLocaleLowerCase("tr");document.getElementById("rows").innerHTML=C.list.filter(r=>!s||(r[0]+" "+r[1]).toLocaleLowerCase("tr").includes(s)).map(r=>`<div class="row"><div class="tx"><b>${r[0]}</b><span>${r[1]}</span></div><span class="chip c">${r[2]}</span></div>`).join("")||`<p class="muted">Sonuç yok.</p>`};
  draw("");document.getElementById("q").oninput=e=>draw(e.target.value);
}
window.addEventListener("hashchange",()=>render(current()));
render(current());
</script>
